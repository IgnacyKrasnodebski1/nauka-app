<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Podsumowanie tygodnia</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#A855F7;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body style="margin:0">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #A855F7; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: -80px; right: -100px; width: 300px; height: 300px; border-radius: 50%; background: #B97BFF;"></div>
  <div class="a-float d3" style="position: absolute; bottom: 60px; left: -120px; width: 280px; height: 280px; border-radius: 50%; background: #9442EC;"></div>
  <div style="position: relative; z-index: 1; padding: 50px 16px 0; display: flex; gap: 5px;">
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A0A2A;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #1A0A2A;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #7E3BD0; overflow: hidden;"><div class="a-grow" style="width: 60%; height: 100%; background: #1A0A2A;"></div></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #7E3BD0;"></div>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #7E3BD0;"></div>
  </div>
  <div style="position: relative; z-index: 1; padding: 14px 18px 0; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 13px; font-weight: 800; color: #1A0A2A;">Twój tydzień</span>
    <a href="Profile.html" aria-label="Zamknij podsumowanie" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A0A2A" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
  </div>
  <div style="position: relative; z-index: 1; padding: 30px 22px 0; display: flex; flex-direction: column; gap: 10px; flex-grow: 1;">
    <div class="a-up" style="font-size: 16px; font-weight: 800; color: #2A0F48;">W tym tygodniu uczyłeś się</div>
    <div class="a-pop d1" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 76px; font-weight: 800; letter-spacing: -3px; line-height: 0.95; color: #1A0A2A;">2 h 14 min</div>
    <div class="a-up d2" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: #1A0A2A; margin-top: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l6-6 4 4 6-7"/></svg>
      <span style="font-size: 13px; font-weight: 800; color: #B4FF3A;">o 38% więcej niż tydzień temu</span>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 34px;"><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d1" style="width: 100%; height: 40%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Pn</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d2" style="width: 100%; height: 62%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Wt</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d3" style="width: 100%; height: 30%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Śr</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d4" style="width: 100%; height: 100%; border-radius: 9px; background: #1A0A2A;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Cz</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d5" style="width: 100%; height: 55%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Pt</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d6" style="width: 100%; height: 18%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Sb</span></div><div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 7px;"><div style="width: 100%; height: 110px; display: flex; align-items: flex-end;"><div class="a-up d6" style="width: 100%; height: 70%; border-radius: 9px; background: #6B2AA8;"></div></div><span style="font-size: 11.5px; font-weight: 800; color: #3A1560;">Nd</span></div></div>
    <div class="a-up d6" style="font-size: 15px; font-weight: 800; color: #2A0F48; margin-top: 16px;">Najmocniejszy dzień: czwartek — 41 minut.</div>
  </div>
  <div style="position: relative; z-index: 1; padding: 0 22px 30px; display: flex; gap: 10px;">
    <button type="button" style="flex-grow: 1; cursor: pointer; font-family: inherit; height: 56px; border-radius: 18px; background: #1A0A2A; border: none; box-shadow: 0 5px 0 #0A0414; color: #F4F2FF; font-size: 14.5px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F4F2FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M5 16v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></svg>UDOSTĘPNIJ</button>
  </div>

</div>

</body>
</html>
