<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Quiz — pytanie</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: -90px; left: -80px; width: 280px; height: 280px; border-radius: 50%; background: #2A1240;"></div>

  <div style="position: relative; z-index: 1; padding: 52px 18px 0; display: flex; align-items: center; gap: 12px;">
    <a href="Path.html" aria-label="Zamknij quiz" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #241F45; overflow: hidden;">
      <div class="a-grow" style="width: 40%; height: 100%; border-radius: 999px; background: #B4FF3A;"></div>
    </div>
    <a href="NoHearts.html" style="display: flex; align-items: center; gap: 5px; flex: none;">
      <svg class="a-beat" width="18" height="18" viewBox="0 0 24 24" fill="#FF4767" aria-hidden="true"><path d="M12 20.5S4 15.6 4 10.4A4.4 4.4 0 0 1 12 7.9a4.4 4.4 0 0 1 8 2.5c0 5.2-8 10.1-8 10.1z"/></svg>
      <span style="font-size: 15px; font-weight: 800; color: #FF8FA3;">4</span>
    </a>
  </div>

  <div style="position: relative; z-index: 1; padding: 22px 18px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1; min-height: 0;">

    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="padding: 6px 12px; border-radius: 999px; background: #2A2110; color: #FFC043; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Combo x3</span>
      <span style="padding: 6px 12px; border-radius: 999px; background: #1B1836; border: 2px solid #2C2850; color: #9B95C9; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Pytanie 2 z 5</span>
    </div>

    <div class="a-up" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; color: #F4F2FF;">Trzy sfery zrównoważonego rozwoju to:</div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      
        <button type="button" class="a-up d1" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;padding:14px 16px;border-radius:20px;min-height:60px;background:#1B1836;border:2px solid #2C2850;box-shadow:0 4px 0 #14122A;">
          <span style="flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#241F45;color:#9B95C9;">A</span>
          <span style="font-size:14.5px;font-weight:700;line-height:1.35;color:#D6D2F0;">polityczna, militarna, kulturowa</span>
        </button>
        <button type="button" class="a-up d2" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;padding:14px 16px;border-radius:20px;min-height:60px;background:#1F2A12;border:2px solid #B4FF3A;box-shadow:0 4px 0 #B4FF3A;">
          <span style="flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#B4FF3A;color:#14210A;">B</span>
          <span style="font-size:14.5px;font-weight:700;line-height:1.35;color:#E8FFC7;">ekonomiczna, społeczna, ekologiczna</span>
        </button>
        <button type="button" class="a-up d3" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;padding:14px 16px;border-radius:20px;min-height:60px;background:#1B1836;border:2px solid #2C2850;box-shadow:0 4px 0 #14122A;">
          <span style="flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#241F45;color:#9B95C9;">C</span>
          <span style="font-size:14.5px;font-weight:700;line-height:1.35;color:#D6D2F0;">lokalna, krajowa, globalna</span>
        </button>
        <button type="button" class="a-up d4" style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:inherit;padding:14px 16px;border-radius:20px;min-height:60px;background:#1B1836;border:2px solid #2C2850;box-shadow:0 4px 0 #14122A;">
          <span style="flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:#241F45;color:#9B95C9;">D</span>
          <span style="font-size:14.5px;font-weight:700;line-height:1.35;color:#D6D2F0;">prawna, fiskalna, monetarna</span>
        </button>

    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 0 18px 26px;">
    
    
      <button type="button" disabled style="width: 100%; height: 58px; border: none; border-radius: 18px; background: #201C3E; color: #5C568F; font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">SPRAWDŹ</button>
    
  </div>

</div>

</body>
</html>
