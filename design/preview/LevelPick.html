<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Etap nauki</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body style="margin:0">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">
<div class="a-float" style="position: absolute; top: -100px; right: -90px; width: 280px; height: 280px; border-radius: 50%; background: #1E2A10;"></div>
  <div style="position: relative; z-index: 1; padding: 54px 20px 0; display: flex; gap: 6px;">
    <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #B4FF3A;"></div>
    <div class="a-blink" style="flex-grow: 1; height: 7px; border-radius: 4px; background: #B4FF3A;"></div>
    <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #241F45;"></div>
    <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #241F45;"></div>
  </div>

  <div style="position: relative; z-index: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 13px; flex-grow: 1; min-height: 0;">
    
    <div class="a-up">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1;">Na jakim etapie jesteś?</div>
      <div style="font-size: 13.5px; font-weight: 600; color: #9B95C9; margin-top: 7px; line-height: 1.45;">Dopasujemy poziom trudności, język wyjaśnień i gotowe przedmioty.</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <button type="button" class="a-up d1" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 22px; padding: 14px 15px;">
        <div style="width: 48px; height: 48px; border-radius: 16px; background: #FFC043; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#241800" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></div>
        <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 15.5px; font-weight: 800; color: #F4F2FF;">Szkoła podstawowa</div><div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">klasy 4–8</div></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>
      <button type="button" class="a-pop" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1F2A12; border: 2px solid #B4FF3A; box-shadow: 0 4px 0 #7FC400; border-radius: 22px; padding: 14px 15px;">
        <div style="width: 48px; height: 48px; border-radius: 16px; background: #B4FF3A; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#14210A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg></div>
        <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 15.5px; font-weight: 800; color: #E8FFC7;">Liceum lub technikum</div><div style="font-size: 12.5px; font-weight: 600; color: #A8C98A; margin-top: 2px;">klasy 1–5</div></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; background: #B4FF3A; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14210A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg></div>
      </button>
      <button type="button" class="a-up d3" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 22px; padding: 14px 15px;">
        <div style="width: 48px; height: 48px; border-radius: 16px; background: #FF2E93; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#200410" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg></div>
        <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 15.5px; font-weight: 800; color: #F4F2FF;">Studia</div><div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">licencjat, magisterka</div></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>
      <button type="button" class="a-up d4" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 22px; padding: 14px 15px;">
        <div style="width: 48px; height: 48px; border-radius: 16px; background: #22D3EE; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#04232B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg></div>
        <div style="flex-grow: 1; min-width: 0;"><div style="font-size: 15.5px; font-weight: 800; color: #F4F2FF;">Coś innego</div><div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">języki, kursy, certyfikaty</div></div>
        <div style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>
    </div>
    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8; margin-top: 4px;">Do czego się przygotowujesz?</div>
    <div style="display: flex; flex-wrap: wrap; gap: 9px;">
      <span class="a-up d3" style="padding: 10px 14px; border-radius: 14px; background: #1B1836; border: 2px solid #2C2850; color: #D6D2F0; font-size: 13px; font-weight: 800;">Kartkówki i sprawdziany</span>
      <span class="a-up d4" style="padding: 10px 14px; border-radius: 14px; background: #1B1836; border: 2px solid #2C2850; color: #D6D2F0; font-size: 13px; font-weight: 800;">Matura podstawowa</span>
      <span class="a-pop" style="padding: 10px 14px; border-radius: 14px; background: #B4FF3A; color: #14210A; font-size: 13px; font-weight: 800;">Matura rozszerzona</span>
      <span class="a-up d5" style="padding: 10px 14px; border-radius: 14px; background: #1B1836; border: 2px solid #2C2850; color: #D6D2F0; font-size: 13px; font-weight: 800;">Olimpiada</span>
    </div>

  </div>
  <div style="position: relative; z-index: 1; padding: 14px 18px 26px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Onboarding.html" class="a-glow" style="height: 58px; border-radius: 18px; background: #B4FF3A; box-shadow: 0 5px 0 #7FC400; display: flex; align-items: center; justify-content: center; color: #14210A; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">DALEJ</a>
  </div>
</div>

</body>
</html>
