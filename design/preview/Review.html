<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Powtórka dnia</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: -100px; left: -90px; width: 270px; height: 270px; border-radius: 50%; background: #10233A;"></div>

  <div style="position: relative; z-index: 1; padding: 54px 18px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="Main.html" aria-label="Wróć" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.4px;">Powtórka</div>
    </div>

    <div style="background: #0E2430; border: 2px solid #1A4C5E; border-radius: 26px; padding: 20px; box-shadow: 0 6px 0 #071720; display: flex; align-items: center; gap: 18px;">
      <div style="flex-grow: 1;">
        <div class="a-pop" style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1.6px; line-height: 1; color: #22D3EE;">23</div>
        <div style="font-size: 14px; font-weight: 800; color: #C9E8F2; margin-top: 6px;">pojęcia na dziś</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #7FAEBC; margin-top: 4px; line-height: 1.4;">Zaplanowane tak, żeby wróciły tuż przed zapomnieniem.</div>
      </div>
      <svg class="a-spin" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12V7M4 12h5"/></svg>
    </div>

    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8;">Z czego</div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 13px; background: #1B1836; border: 2px solid #2C2850; border-radius: 20px; padding: 13px 15px; box-shadow: 0 4px 0 #14122A;">
        <div style="width: 40px; height: 40px; border-radius: 14px; background: #FF2E93; display: flex; align-items: center; justify-content: center; flex: none;"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 800; color: #200410;">M</span></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 14px; font-weight: 800;">Makro</div>
          <div style="font-size: 12px; font-weight: 600; color: #9B95C9; margin-top: 2px;">Doktryny · ESG</div>
        </div>
        <span style="font-size: 16px; font-weight: 800; color: #FF7FBE;">14</span>
      </div>
      <div style="display: flex; align-items: center; gap: 13px; background: #1B1836; border: 2px solid #2C2850; border-radius: 20px; padding: 13px 15px; box-shadow: 0 4px 0 #14122A;">
        <div style="width: 40px; height: 40px; border-radius: 14px; background: #FFA023; display: flex; align-items: center; justify-content: center; flex: none;"><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 19px; font-weight: 800; color: #201202;">&#8383;</span></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 14px; font-weight: 800;">Krypto</div>
          <div style="font-size: 12px; font-weight: 600; color: #9B95C9; margin-top: 2px;">Konsensus · MiCA</div>
        </div>
        <span style="font-size: 16px; font-weight: 800; color: #FFB27A;">9</span>
      </div>
    </div>

    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8;">Stan pamięci</div>

    <div style="background: #1B1836; border: 2px solid #2C2850; border-radius: 22px; padding: 16px; box-shadow: 0 4px 0 #14122A; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="flex: none; width: 78px; font-size: 12.5px; font-weight: 700; color: #FF8FA3;">Świeże</span>
        <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #241F45; overflow: hidden;"><div class="a-grow d1" style="width: 28%; height: 100%; border-radius: 999px; background: #FF4767;"></div></div>
        <span style="flex: none; width: 26px; text-align: right; font-size: 12px; font-weight: 800; color: #9B95C9;">24</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="flex: none; width: 78px; font-size: 12.5px; font-weight: 700; color: #FFD98A;">W trakcie</span>
        <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #241F45; overflow: hidden;"><div class="a-grow d2" style="width: 46%; height: 100%; border-radius: 999px; background: #FFC043;"></div></div>
        <span style="flex: none; width: 26px; text-align: right; font-size: 12px; font-weight: 800; color: #9B95C9;">39</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="flex: none; width: 78px; font-size: 12.5px; font-weight: 700; color: #C6F58A;">Utrwalone</span>
        <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #241F45; overflow: hidden;"><div class="a-grow d3" style="width: 26%; height: 100%; border-radius: 999px; background: #B4FF3A;"></div></div>
        <span style="flex: none; width: 26px; text-align: right; font-size: 12px; font-weight: 800; color: #9B95C9;">21</span>
      </div>
    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 14px 18px 26px;">
    <a class="a-glow" href="Flashcards.html" style="height: 60px; border-radius: 20px; background: #22D3EE; box-shadow: 0 5px 0 #108CA1; display: flex; align-items: center; justify-content: center; color: #04232B; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">ZACZNIJ POWTÓRKĘ</a>
  </div>

</div>

</body>
</html>
