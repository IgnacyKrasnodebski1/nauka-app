<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Popraw pytanie</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: 120px; left: -100px; width: 250px; height: 250px; border-radius: 50%; background: #2A1240;"></div>

  <div style="position: relative; z-index: 1; padding: 54px 18px 0; display: flex; align-items: center; gap: 12px;">
    <a href="SubjectReady.html" aria-label="Wróć" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.4px;">Popraw pytanie</div>
      <div style="font-size: 12px; font-weight: 600; color: #9B95C9; margin-top: 2px;">Makro · Podstawy · pytanie 2 z 4</div>
    </div>
  </div>

  <div style="position: relative; z-index: 1; padding: 16px 18px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0;">

    <div class="a-up" style="display: flex; align-items: center; gap: 10px; background: #2A2110; border: 2px solid #574319; border-radius: 18px; padding: 12px 14px;">
      <svg class="a-blink" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFC043" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16v.5"/></svg>
      <span style="font-size: 12.5px; font-weight: 700; color: #FFD98A; line-height: 1.4;">Wygenerowane z materiałów. Sprawdź, zanim się tego nauczysz.</span>
    </div>

    <div class="a-up d1">
      <label for="q-text" style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8;">Treść pytania</label>
      <textarea id="q-text" rows="2" style="width: 100%; margin-top: 8px; background: #1B1836; border: 2px solid #2C2850; border-radius: 16px; padding: 13px 14px; color: #F4F2FF; font-family: inherit; font-size: 14.5px; font-weight: 700; line-height: 1.4; box-sizing: border-box; resize: none;">Ile rodzajów instrumentów ma polityka społeczna?</textarea>
    </div>

    <div class="a-up d2">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8;">Odpowiedzi — zaznacz poprawną</div>
      <div style="display: flex; flex-direction: column; gap: 9px; margin-top: 10px;">

        <div style="display: flex; align-items: center; gap: 11px; background: #1B1836; border: 2px solid #2C2850; border-radius: 16px; padding: 11px 13px;">
          <input type="radio" name="poprawna" id="odp-a" style="width: 22px; height: 22px; accent-color: #B4FF3A; flex: none;">
          <label for="odp-a" style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">3: prawne, kadrowe, militarne</label>
        </div>

        <div style="display: flex; align-items: center; gap: 11px; background: #1F2A12; border: 2px solid #B4FF3A; border-radius: 16px; padding: 11px 13px; box-shadow: 0 4px 0 #16200B;">
          <input type="radio" name="poprawna" id="odp-b" checked style="width: 22px; height: 22px; accent-color: #B4FF3A; flex: none;">
          <label for="odp-b" style="flex-grow: 1; font-size: 13.5px; font-weight: 800; color: #E8FFC7;">4: ekonomiczne, prawne, informacyjne, kadrowe</label>
        </div>

        <div style="display: flex; align-items: center; gap: 11px; background: #1B1836; border: 2px solid #2C2850; border-radius: 16px; padding: 11px 13px;">
          <input type="radio" name="poprawna" id="odp-c" style="width: 22px; height: 22px; accent-color: #B4FF3A; flex: none;">
          <label for="odp-c" style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">2: podatki i zasiłki</label>
        </div>

        <div style="display: flex; align-items: center; gap: 11px; background: #1B1836; border: 2px solid #2C2850; border-radius: 16px; padding: 11px 13px;">
          <input type="radio" name="poprawna" id="odp-d" style="width: 22px; height: 22px; accent-color: #B4FF3A; flex: none;">
          <label for="odp-d" style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">5: w tym cyfrowe</label>
        </div>

      </div>
    </div>

    <div class="a-up d3">
      <label for="q-exp" style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8;">Wyjaśnienie</label>
      <textarea id="q-exp" rows="2" style="width: 100%; margin-top: 8px; background: #1B1836; border: 2px solid #2C2850; border-radius: 16px; padding: 13px 14px; color: #D6D2F0; font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.45; box-sizing: border-box; resize: none;">Cztery: KASA, PRAWO, GADANIE, LUDZIE.</textarea>
    </div>

    <div class="a-up d4" style="display: flex; gap: 10px;">
      <button type="button" style="flex-grow: 1; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 16px; background: #1B1836; border: 2px solid #2C2850; color: #9B95C9; font-size: 13px; font-weight: 800;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12V7M4 12h5"/></svg>
        Wygeneruj od nowa
      </button>
      <button type="button" aria-label="Usuń pytanie" style="flex: none; width: 48px; height: 48px; cursor: pointer; border-radius: 16px; background: #2A1017; border: 2px solid #5C1F2E; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8FA3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
      </button>
    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 14px 18px 26px;">
    <a href="SubjectReady.html" class="a-glow" style="height: 58px; border-radius: 18px; background: #B4FF3A; box-shadow: 0 5px 0 #7FC400; display: flex; align-items: center; justify-content: center; color: #14210A; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">ZAPISZ ZMIANY</a>
  </div>

</div>

</body>
</html>
