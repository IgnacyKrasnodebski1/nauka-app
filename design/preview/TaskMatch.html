<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Zadanie — połącz w pary</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="position: relative; z-index: 1; padding: 52px 18px 0; display: flex; align-items: center; gap: 12px;">
    <a href="Path.html" aria-label="Zamknij zadanie" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #241F45; overflow: hidden;"><div class="a-grow" style="width: 25%; height: 100%; border-radius: 999px; background: #B4FF3A;"></div></div>
    <div style="display: flex; align-items: center; gap: 5px; flex: none;">
      <svg class="a-beat" width="18" height="18" viewBox="0 0 24 24" fill="#FF4767" aria-hidden="true"><path d="M12 20.5S4 15.6 4 10.4A4.4 4.4 0 0 1 12 7.9a4.4 4.4 0 0 1 8 2.5c0 5.2-8 10.1-8 10.1z"/></svg>
      <span style="font-size: 15px; font-weight: 800; color: #FF8FA3;">5</span>
    </div>
  </div>

  <div style="position: relative; z-index: 1; padding: 22px 18px 0; display: flex; flex-direction: column; gap: 18px; flex-grow: 1; min-height: 0;">

    <div>
      <span style="padding: 6px 12px; border-radius: 999px; background: #0E2430; color: #22D3EE; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Połącz w pary</span>
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15; margin-top: 12px;">Doktryna i jej sedno</div>
      <div style="font-size: 13px; font-weight: 600; color: #9B95C9; margin-top: 5px;">Zostały 3 pary z 4.</div>
    </div>

    <div style="display: flex; gap: 12px;">

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 11px;">
        <button class="a-pulse" type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #0E2430; border: 2px solid #22D3EE; box-shadow: 0 4px 0 #1A4C5E; border-radius: 18px; padding: 13px; font-size: 13.5px; font-weight: 800; color: #C9E8F2; line-height: 1.3;">Ordoliberalizm</button>
        <button type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 18px; padding: 13px; font-size: 13.5px; font-weight: 800; color: #D6D2F0; line-height: 1.3;">Społeczna gospodarka rynkowa</button>
        <button type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 18px; padding: 13px; font-size: 13.5px; font-weight: 800; color: #D6D2F0; line-height: 1.3;">Państwo opiekuńcze</button>
        <div class="a-pop d2" style="min-height: 76px; background: #1F2A12; border: 2px solid #4E6B24; border-radius: 18px; padding: 13px; font-size: 13.5px; font-weight: 800; color: #7FA352; line-height: 1.3; display: flex; align-items: center; gap: 8px; opacity: 0.7;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
          Subsydiarność
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 11px;">
        <button type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 18px; padding: 13px; font-size: 13px; font-weight: 700; color: #D6D2F0; line-height: 1.35;">szeroka redystrybucja i transfery</button>
        <button type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 18px; padding: 13px; font-size: 13px; font-weight: 700; color: #D6D2F0; line-height: 1.35;">państwo ustala reguły gry</button>
        <div class="a-pop d3" style="min-height: 76px; background: #1F2A12; border: 2px solid #4E6B24; border-radius: 18px; padding: 13px; font-size: 13px; font-weight: 700; color: #7FA352; line-height: 1.35; display: flex; align-items: center; gap: 8px; opacity: 0.7;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
          najpierw jednostka i rodzina
        </div>
        <button type="button" style="min-height: 76px; cursor: pointer; font-family: inherit; text-align: left; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 18px; padding: 13px; font-size: 13px; font-weight: 700; color: #D6D2F0; line-height: 1.35;">dobrobyt przez konkurencję</button>
      </div>

    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 0 18px 26px; display: flex; align-items: center; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 6px; flex: none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E67A8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="a-blink" style="font-size: 13px; font-weight: 800; color: #9B95C9;">0:42</span>
    </div>
    <a href="TaskFill.html" style="flex-grow: 1; height: 58px; border-radius: 18px; background: #201C3E; display: flex; align-items: center; justify-content: center; color: #5C568F; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">POŁĄCZ WSZYSTKIE PARY</a>
  </div>

</div>

</body>
</html>
