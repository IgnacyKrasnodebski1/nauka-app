<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Talia skończona</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: 70px; left: 50%; margin-left: -150px; width: 300px; height: 300px; border-radius: 50%; background: #0E2430;"></div>

  <div class="a-fall" style="position: absolute; top: 110px; left: 50px; width: 11px; height: 11px; border-radius: 4px; background: #22D3EE;"></div>
  <div class="a-fall d3" style="position: absolute; top: 160px; right: 44px; width: 9px; height: 9px; border-radius: 50%; background: #B4FF3A;"></div>
  <div class="a-fall d5" style="position: absolute; top: 90px; right: 110px; width: 10px; height: 10px; border-radius: 3px; background: #FFC043;"></div>

  <div style="position: relative; z-index: 1; padding: 70px 22px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; flex-grow: 1;">

      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; color: #22D3EE; line-height: 1;">75%</span>
      <span style="font-size: 10.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #7FAEBC; margin-top: 3px;">umiem</span>
    </div>

    <div class="a-up d2" style="text-align: center;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 31px; font-weight: 800; letter-spacing: -1.1px; line-height: 1.05;">Talia skończona</div>
      <div style="font-size: 14px; font-weight: 700; color: #9B95C9; margin-top: 7px;">Makro · Doktryny · 24 pojęcia</div>
    </div>

    <div class="a-up d3" style="width: 100%; display: flex; gap: 11px;">
      <div style="flex-grow: 1; background: #1F2A12; border: 2px solid #4E6B24; border-radius: 22px; padding: 15px 10px; text-align: center; box-shadow: 0 4px 0 #16200B;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 800; color: #B4FF3A;">18</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #A8C98A; margin-top: 3px;">umiem</div>
      </div>
      <div style="flex-grow: 1; background: #2A1017; border: 2px solid #5C1F2E; border-radius: 22px; padding: 15px 10px; text-align: center; box-shadow: 0 4px 0 #14060A;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 800; color: #FF8FA3;">6</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #C98FA0; margin-top: 3px;">do powtórki</div>
      </div>
      <div style="flex-grow: 1; background: #2A2110; border: 2px solid #574319; border-radius: 22px; padding: 15px 10px; text-align: center; box-shadow: 0 4px 0 #1A1409;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 28px; font-weight: 800; color: #FFC043;">+40</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #D6B48A; margin-top: 3px;">XP</div>
      </div>
    </div>

    <div class="a-up d4" style="width: 100%; background: #1B1836; border: 2px solid #2C2850; border-radius: 24px; padding: 8px 15px; box-shadow: 0 5px 0 #14122A;">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8; padding: 11px 0 5px;">Te wracają jutro</div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 0;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #FF4767; flex: none;"></div>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">Ordoliberalizm</span>
        <span style="font-size: 11.5px; font-weight: 700; color: #6E67A8;">3. raz</span>
      </div>
      <div style="height: 2px; background: #241F45;"></div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 0;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #FF4767; flex: none;"></div>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">Subsydiarność</span>
        <span style="font-size: 11.5px; font-weight: 700; color: #6E67A8;">2. raz</span>
      </div>
      <div style="height: 2px; background: #241F45;"></div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 0;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #FFC043; flex: none;"></div>
        <span style="flex-grow: 1; font-size: 13.5px; font-weight: 700; color: #D6D2F0;">Moral hazard</span>
        <span style="font-size: 11.5px; font-weight: 700; color: #6E67A8;">1. raz</span>
      </div>
      <div style="height: 2px; background: #241F45;"></div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 0 12px;">
        <span style="font-size: 12.5px; font-weight: 700; color: #6E67A8;">i 3 kolejne</span>
      </div>
    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 0 22px 26px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Flashcards.html" class="a-glow" style="height: 60px; border-radius: 20px; background: #22D3EE; box-shadow: 0 5px 0 #108CA1; display: flex; align-items: center; justify-content: center; color: #04232B; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">POWTÓRZ TE 6</a>
    <a href="Main.html" style="height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #9B95C9; font-size: 14px; font-weight: 800; letter-spacing: 1px;">NA DZIŚ WYSTARCZY</a>
  </div>

</div>

</body>
</html>
