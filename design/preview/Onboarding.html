<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Cel dzienny</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body style="margin:0">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: -90px; left: -80px; width: 280px; height: 280px; border-radius: 50%; background: #1E2A10;"></div>

  <div style="position: relative; z-index: 1; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">

    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #B4FF3A;"></div>
      <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #B4FF3A;"></div>
      <div class="a-blink" style="flex-grow: 1; height: 7px; border-radius: 4px; background: #B4FF3A;"></div>
      <div style="flex-grow: 1; height: 7px; border-radius: 4px; background: #241F45;"></div>
    </div>

    <div class="a-up">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1.1;">Ile czasu dziennie?</div>
      <div style="font-size: 13.5px; font-weight: 600; color: #9B95C9; margin-top: 8px; line-height: 1.45;">Cel możesz zmienić w każdej chwili. Lepiej zacząć niżej i utrzymać serię.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">

      <button type="button" class="a-up d1" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 20px; padding: 15px 16px;">
        <div style="width: 10px; height: 34px; border-radius: 5px; background: #3E3870; flex: none;"></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px; font-weight: 800; color: #F4F2FF;">Spokojnie</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">5 minut · 50 XP</div>
        </div>
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>

      <button type="button" class="a-up d2" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1F2A12; border: 2px solid #B4FF3A; box-shadow: 0 4px 0 #B4FF3A; border-radius: 20px; padding: 15px 16px;">
        <div style="width: 10px; height: 34px; border-radius: 5px; background: #B4FF3A; flex: none;"></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px; font-weight: 800; color: #E8FFC7;">Normalnie</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #A8C98A; margin-top: 2px;">10 minut · 100 XP</div>
        </div>
        <div style="width: 24px; height: 24px; border-radius: 50%; background: #B4FF3A; flex: none; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#14210A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
        </div>
      </button>

      <button type="button" class="a-up d3" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 20px; padding: 15px 16px;">
        <div style="width: 10px; height: 34px; border-radius: 5px; background: #3E3870; flex: none;"></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px; font-weight: 800; color: #F4F2FF;">Solidnie</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">15 minut · 150 XP</div>
        </div>
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>

      <button type="button" class="a-up d4" style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer; font-family: inherit; background: #1B1836; border: 2px solid #2C2850; box-shadow: 0 4px 0 #14122A; border-radius: 20px; padding: 15px 16px;">
        <div style="width: 10px; height: 34px; border-radius: 5px; background: #3E3870; flex: none;"></div>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px; font-weight: 800; color: #F4F2FF;">Sesja przed sesją</div>
          <div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">25 minut · 250 XP</div>
        </div>
        <div style="width: 24px; height: 24px; border-radius: 50%; border: 2px solid #3E3870; flex: none;"></div>
      </button>

    </div>

    <div class="a-up d5" style="background: #1B1836; border: 2px solid #2C2850; border-radius: 22px; padding: 16px; box-shadow: 0 4px 0 #14122A; display: flex; align-items: center; gap: 13px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #241F45; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-size: 14px; font-weight: 800;">Przypomnienie</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #9B95C9; margin-top: 2px;">codziennie o 19:30</div>
      </div>
      <div style="width: 48px; height: 28px; border-radius: 999px; background: #B4FF3A; padding: 3px; box-sizing: border-box; display: flex; justify-content: flex-end; flex: none;"><div style="width: 22px; height: 22px; border-radius: 50%; background: #14210A;"></div></div>
    </div>

    <div class="a-up d6" style="display: flex; align-items: center; gap: 11px; background: #2A1C10; border: 2px solid #5C3812; border-radius: 20px; padding: 14px 16px;">
      <svg class="a-beat" width="26" height="26" viewBox="0 0 24 24" fill="#FF7A1A" aria-hidden="true"><path d="M12 2c2.6 3.6 1.1 5.7 0 6.8C10.4 7.2 9 5.6 9 3.5 6.4 5.6 5 8.6 5 12a7 7 0 0 0 14 0c0-3.1-1.6-6.6-7-10z"/></svg>
      <div style="font-size: 13px; font-weight: 700; color: #FFE3C0; line-height: 1.4;">Seria rośnie każdego dnia, w którym dobijesz cel.</div>
    </div>

  </div>

  <div style="position: relative; z-index: 1; padding: 14px 20px 26px;">
    <a href="QuickAdd.html" class="a-glow" style="height: 60px; border-radius: 20px; background: #B4FF3A; box-shadow: 0 5px 0 #7FC400; display: flex; align-items: center; justify-content: center; color: #14210A; font-size: 15px; font-weight: 800; letter-spacing: 1.2px;">USTAW CEL</a>
  </div>

</div>

</body>
</html>
