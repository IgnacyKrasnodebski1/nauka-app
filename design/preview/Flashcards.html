<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Fiszki</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body style="margin:0">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; bottom: -80px; left: -60px; width: 300px; height: 300px; border-radius: 50%; background: #10233A;"></div>

  <div style="position: relative; z-index: 1; padding: 52px 18px 0; display: flex; align-items: center; gap: 12px;">
    <a href="Path.html" aria-label="Wróć do ścieżki" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1;">
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.4px;">Fiszki · Makro</div>
      <div style="font-size: 12px; font-weight: 700; color: #9B95C9; margin-top: 2px;">7 z 24 · zostało 17</div>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; background: #1B1836; border: 2px solid #2C2850; border-radius: 999px; padding: 8px 12px; flex: none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
      <span style="font-size: 13.5px; font-weight: 800; color: #B4FF3A;">6</span>
    </div>
  </div>

  <div style="position: relative; z-index: 1; padding: 14px 18px 0;">
    <div style="height: 10px; border-radius: 999px; background: #241F45; overflow: hidden;">
      <div class="a-grow" style="width: 29%; height: 100%; border-radius: 999px; background: #B4FF3A;"></div>
    </div>
  </div>

  <div style="position: relative; z-index: 1; flex-grow: 1; min-height: 0; padding: 26px 18px 0;">

    <div style="position: absolute; top: 38px; left: 40px; right: 40px; height: 380px; border-radius: 30px; background: #16142C; border: 2px solid #221E42;"></div>
    <div style="position: absolute; top: 32px; left: 30px; right: 30px; height: 386px; border-radius: 30px; background: #1B1836; border: 2px solid #2C2850;"></div>

    <div class="a-sway" style="position: relative; height: 392px; border-radius: 30px; background: #241536; border: 2px solid #46216B; box-shadow: 0 8px 0 #170E24; padding: 26px 24px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="padding: 6px 12px; border-radius: 999px; background: #3A1C54; color: #D6B4F5; font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;">Termin</span>
        <span style="font-size: 12px; font-weight: 800; color: #9B7FC0;">7 / 24</span>
      </div>

      <div style="text-align: center;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.1; color: #F4F2FF;">Racjonalność ograniczona</div>
        <div style="font-size: 13.5px; font-weight: 600; color: #B79AD4; margin-top: 14px;">bounded rationality</div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B7FC0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a8 8 0 0 1 16 0M20 16a8 8 0 0 1-16 0"/><path d="M4 8V4M20 16v4"/></svg>
        <span style="font-size: 13px; font-weight: 700; color: #9B7FC0;">dotknij, żeby odwrócić</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 0 6px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg class="a-bob" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B84" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span style="font-size: 12px; font-weight: 800; color: #FF6B84;">w lewo = powtórz</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="font-size: 12px; font-weight: 800; color: #B4FF3A;">w prawo = umiem</span>
        <svg class="a-bob d2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>

  <div style="position: relative; z-index: 1; padding: 0 18px 26px; display: flex; gap: 12px;">
    <button type="button" style="flex-grow: 1; height: 62px; border-radius: 20px; background: #2A1017; border: 2px solid #5C1F2E; box-shadow: 0 5px 0 #14060A; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: inherit; color: #FF8FA3; font-size: 14px; font-weight: 800; letter-spacing: 1px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8FA3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 1 2.5 5.8M4 12V7M4 12h5"/></svg>
      POWTÓRZ
    </button>
    <a href="FlashcardsDone.html" style="flex-grow: 1; height: 62px; border-radius: 20px; background: #B4FF3A; box-shadow: 0 5px 0 #7FC400; display: flex; align-items: center; justify-content: center; gap: 8px; color: #14210A; font-size: 14px; font-weight: 800; letter-spacing: 1px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#14210A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
      UMIEM
    </a>
  </div>

</div>

</body>
</html>
