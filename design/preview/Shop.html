<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Plecak</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0E0C1C;color:#F4F2FF}
a{color:#B4FF3A;text-decoration:none}
a:hover{color:#CBFF6E}
</style>
<style>
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(0.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0deg);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcDrain{from{width:88%}to{width:4%}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}
.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-drain{animation:dcDrain 14s linear infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</head>
<body style="margin:0">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0C1C; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div class="a-float" style="position: absolute; top: -100px; left: -90px; width: 270px; height: 270px; border-radius: 50%; background: #0E2430;"></div>

  <div style="position: relative; z-index: 1; padding: 54px 18px 0; display: flex; align-items: center; gap: 12px;">
    <a href="Main.html" aria-label="Wróć" style="width: 40px; height: 40px; border-radius: 50%; background: #1B1836; border: 2px solid #2C2850; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9B95C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.4px;">Plecak</div>
    <div class="a-pop" style="display: flex; align-items: center; gap: 6px; background: #0E2430; border: 2px solid #1A4C5E; border-radius: 999px; padding: 8px 14px 8px 11px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#22D3EE" aria-hidden="true"><path d="M12 2l7 6-7 14-7-14z"/></svg>
      <span style="font-size: 15px; font-weight: 800; color: #7EE8FA;">1 240</span>
    </div>
  </div>

  <div style="position: relative; z-index: 1; padding: 20px 18px 0; display: flex; flex-direction: column; gap: 13px; flex-grow: 1; min-height: 0;">

    <div class="a-up d1" style="display: flex; align-items: center; gap: 14px; background: #2A1017; border: 2px solid #5C1F2E; border-radius: 24px; padding: 15px; box-shadow: 0 5px 0 #14060A;">
      <div class="a-beat" style="width: 52px; height: 52px; border-radius: 17px; background: #FF4767; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#2A0008" aria-hidden="true"><path d="M12 20.5S4 15.6 4 10.4A4.4 4.4 0 0 1 12 7.9a4.4 4.4 0 0 1 8 2.5c0 5.2-8 10.1-8 10.1z"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 800; color: #FFD4DC;">Uzupełnij życia</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #C98FA0; margin-top: 3px;">masz 2 z 5 — wróć do nauki od razu</div>
      </div>
      <button type="button" style="flex: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; background: #FF4767; border: none; box-shadow: 0 4px 0 #A8203A; border-radius: 14px; padding: 11px 14px; color: #2A0008; font-size: 13px; font-weight: 800;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#2A0008" aria-hidden="true"><path d="M12 2l7 6-7 14-7-14z"/></svg>
        350
      </button>
    </div>

    <div class="a-up d2" style="display: flex; align-items: center; gap: 14px; background: #0E2430; border: 2px solid #1A4C5E; border-radius: 24px; padding: 15px; box-shadow: 0 5px 0 #071720;">
      <div class="a-sway" style="width: 52px; height: 52px; border-radius: 17px; background: #22D3EE; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#04232B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 800; color: #C9E8F2;">Zamrażarka serii</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #7FAEBC; margin-top: 3px;">masz 2 — ratuje serię w wolny dzień</div>
      </div>
      <button type="button" style="flex: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; background: #22D3EE; border: none; box-shadow: 0 4px 0 #108CA1; border-radius: 14px; padding: 11px 14px; color: #04232B; font-size: 13px; font-weight: 800;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#04232B" aria-hidden="true"><path d="M12 2l7 6-7 14-7-14z"/></svg>
        200
      </button>
    </div>

    <div class="a-up d3" style="display: flex; align-items: center; gap: 14px; background: #2A2110; border: 2px solid #574319; border-radius: 24px; padding: 15px; box-shadow: 0 5px 0 #1A1409;">
      <div class="a-pulse" style="width: 52px; height: 52px; border-radius: 17px; background: #FFC043; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#241800" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 800; color: #FFE3C0;">Podwójne XP</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #D6B48A; margin-top: 3px;">15 minut · przydaje się przed sesją</div>
      </div>
      <button type="button" style="flex: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; background: #FFC043; border: none; box-shadow: 0 4px 0 #B3820E; border-radius: 14px; padding: 11px 14px; color: #241800; font-size: 13px; font-weight: 800;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#241800" aria-hidden="true"><path d="M12 2l7 6-7 14-7-14z"/></svg>
        150
      </button>
    </div>

    <div class="a-up d4" style="display: flex; align-items: center; gap: 14px; background: #241536; border: 2px solid #46216B; border-radius: 24px; padding: 15px; box-shadow: 0 5px 0 #170E24;">
      <div style="width: 52px; height: 52px; border-radius: 17px; background: #A855F7; display: flex; align-items: center; justify-content: center; flex: none;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1A0A2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M3.5 12h17"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 15px; font-weight: 800; color: #F4F2FF;">Motyw aplikacji</div>
        <div style="font-size: 12.5px; font-weight: 600; color: #C0A8D8; margin-top: 3px;">6 zestawów kolorów do odblokowania</div>
      </div>
      <button type="button" style="flex: none; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; background: #A855F7; border: none; box-shadow: 0 4px 0 #6B2AA8; border-radius: 14px; padding: 11px 14px; color: #1A0A2A; font-size: 13px; font-weight: 800;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#1A0A2A" aria-hidden="true"><path d="M12 2l7 6-7 14-7-14z"/></svg>
        500
      </button>
    </div>

    <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: #6E67A8; margin-top: 4px;">Skąd brać gemy</div>

    <div class="a-up d5" style="background: #1B1836; border: 2px solid #2C2850; border-radius: 22px; padding: 8px 15px; box-shadow: 0 4px 0 #14122A;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4FF3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4.5 4.5L19 7"/></svg>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700; color: #D6D2F0;">Misja dzienna</span>
        <span style="font-size: 13px; font-weight: 800; color: #7EE8FA;">+25</span>
      </div>
      <div style="height: 2px; background: #241F45;"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF7A1A" aria-hidden="true"><path d="M12 2c2.6 3.6 1.1 5.7 0 6.8C10.4 7.2 9 5.6 9 3.5 6.4 5.6 5 8.6 5 12a7 7 0 0 0 14 0c0-3.1-1.6-6.6-7-10z"/></svg>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700; color: #D6D2F0;">Każde 7 dni serii</span>
        <span style="font-size: 13px; font-weight: 800; color: #7EE8FA;">+100</span>
      </div>
      <div style="height: 2px; background: #241F45;"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M12 14v4M9 20h6"/></svg>
        <span style="flex-grow: 1; font-size: 13px; font-weight: 700; color: #D6D2F0;">Podium w lidze</span>
        <span style="font-size: 13px; font-weight: 800; color: #7EE8FA;">+250</span>
      </div>
    </div>

  </div>

</div>

</body>
</html>
