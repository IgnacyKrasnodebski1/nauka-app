# Minimal Supabase CLI config — `supabase link --project-ref <ref>` then `supabase db push` and `supabase db seed` (or run seed.sql in SQL editor).
project_id = "nauka"

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false
sql_paths = []

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "nauka://auth/callback", "exp://localhost:8081"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
