/* rozmieszczenie lisa w ekranach */
.sfox{position:absolute;right:16px;bottom:100%;margin-bottom:-8px;pointer-events:none;z-index:1}
.todayhead{position:relative;padding-right:76px;margin-top:10px}
.todayfox{position:absolute;right:2px;top:2px}
/* w nagłówku Dziś niski podskok — wyższy uciąłby brzeg przewijanej listy */
.todayfox .fx.act-hop .fx-all,.todayfox .fx.act-tap .fx-all{animation:fxHopS .8s cubic-bezier(.3,.7,.4,1)}
@keyframes fxHopS{0%{transform:translateY(0) scale(1.1,.88)}30%{transform:translateY(-10px) scale(.95,1.06)}50%{transform:translateY(-12px) scale(1)}80%{transform:translateY(0) scale(1.1,.88)}100%{transform:translateY(0) scale(1)}}
.lcfox{display:flex;justify-content:center;margin:2px 0 -4px}
.nhfox{display:flex;justify-content:center;margin:-4px 0 -6px}
.streakfox{display:flex;justify-content:center;margin-bottom:-6px}
.cbfox{display:flex;justify-content:center;margin:6px 0 4px}
.emptyfox{display:flex;justify-content:center;margin:14px 0 6px}

/* ============================================================ ŚWIĘTOWANIE — koniec poziomu i seria
   Tło bez dekoracji; gwiazdki wpadają po kolei z iskrami, liczniki nabijają się (countUp). */
.lc{overflow-x:hidden}
.lc>*:not(.lcfox){position:relative;z-index:2}
.lcfox{position:relative;z-index:1;margin:0 0 4px}
.lcfox .fx{position:relative;z-index:1}
/* gwiazdki: łuk, twardy cień, wpadają z obrotem, potem unoszą się i błyszczą; zapas pod nimi, żeby skaczący lis ich nie dotykał */
.lcstars{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:center;gap:4px;margin-bottom:34px}
.lcstar{position:relative;width:58px;height:62px}
.lcstar.s1{width:80px;height:85px}
.lcstar.s0{translate:0 18px;rotate:-14deg}.lcstar.s2{translate:0 18px;rotate:14deg}
.lcstar svg{display:block;width:100%;height:100%;overflow:visible;animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.lcstar .bd{fill:var(--surface-2);stroke:var(--surface-2);stroke-width:5;stroke-linejoin:round}
.lcstar .sh{fill:var(--shadow);stroke:var(--shadow);stroke-width:5;stroke-linejoin:round}
.lcstar.on .bd{fill:var(--gold);stroke:var(--gold)}
.lcstar.on .sh{fill:var(--gold-dark);stroke:var(--gold-dark)}
.lcstar .shine{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;opacity:.85;animation:shine 2.6s ease-in-out infinite;animation-delay:calc(var(--d) + .8s)}
.lcstar.on{animation:starFloat 3s ease-in-out infinite;animation-delay:calc(var(--d) + .7s)}
.lcstar i{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--gold);opacity:0;animation:starPt .7s ease-out both;animation-delay:calc(var(--d) + .3s)}
.lcstar i:nth-child(2){--x:-34px;--y:-26px}.lcstar i:nth-child(3){--x:34px;--y:-26px;background:var(--acid)}.lcstar i:nth-child(4){--x:0px;--y:-44px;background:#fff}
.lcstar i:nth-child(5){--x:-40px;--y:14px;background:var(--acid)}.lcstar i:nth-child(6){--x:40px;--y:14px}.lcstar i:nth-child(7){--x:0px;--y:38px;background:#fff}
@keyframes starIn{0%{transform:scale(0) rotate(-70deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes starFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shine{0%,70%,100%{opacity:0}80%,90%{opacity:.9}}
@keyframes starPt{0%{transform:translate(0,0) scale(1.2);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.cbump{display:inline-block;animation:cbump .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes cbump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.lct.lcpop{animation:titleIn .6s cubic-bezier(.2,1.5,.4,1) .65s both}
.lessonbody.done:not(.scel) .lc{padding-top:78px} /* miejsce na toasty (plan dnia, misja) nad gwiazdkami */
@keyframes titleIn{0%{transform:scale(.5) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
/* ekran serii */
.scel .lc{padding-top:70px;gap:6px}
.scfox{margin-bottom:10px}
.scnum{font-family:var(--font-display);font-size:92px;font-weight:800;line-height:1;letter-spacing:-3px;color:var(--amber);text-shadow:0 5px 0 var(--amber-dark)}
.sct{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--txt);color:color-mix(in srgb,var(--amber) 25%,var(--txt))}
.week.scweek{margin-top:22px;width:100%}
.lesson .pill.amber:not(.text):not([disabled]){background:var(--amber);color:var(--on-amber);box-shadow:0 var(--drop-btn) 0 var(--amber-dark)}
.lesson .pill.amber:not(.text):not([disabled]):active{box-shadow:0 0 0 var(--amber-dark)}
.scp{font-size:14.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.45;margin-top:12px;max-width:300px}

/* ============================================================ ŚCIEŻKA — droga zamiast kresek, lis przy bieżącym poziomie (drawTrail w engine.js) */
.path{position:relative}
.path .pathnode{position:relative;z-index:1}
.trail{position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tr-sh{stroke:var(--shadow);stroke-width:22px;transform:translateY(5px)}
.tr-base{stroke:var(--surface-2);stroke-width:22px}
.tr-dash{stroke:var(--line-2);stroke-width:3px;stroke-dasharray:2 13}
.tr-done{stroke:var(--accent);stroke-width:22px;opacity:.9}
.tr-dash.done{stroke:var(--accent-dark);opacity:.8}
.path{gap:30px}
.pathnode.cur{padding-top:52px}
.pathfox{position:absolute;top:52px;left:50%;margin-left:calc(var(--fx,118px) - 43px);z-index:2}

/* ============================================================ EMOTKI KAMIENI MILOWYCH (klasa emo-* na svg.fx) */
/* emotki kamieni milowych — klasa emo-* na svg.fx (bez obrotu całego lisa) */
.fx-bandt,.fx-scarfe,.fx-medal,.fx-crown,.fx-cape,.fx-glint{transform-box:fill-box}
.fx-bandt{transform-origin:0% 50%;animation:emoFlutter 1.2s ease-in-out infinite}
.fx-scarfe{transform-origin:40% 0%;animation:emoScarf 2.6s ease-in-out infinite}
.fx-cape{transform-origin:50% 0%;animation:emoCape 3s ease-in-out infinite}
.fx-glint{animation:shine 2.4s ease-in-out infinite}
@keyframes emoFlutter{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes emoScarf{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
@keyframes emoCape{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(-4deg) scaleX(1.04)}}
/* emotka zastępuje skoki nastroju (np. happy) — każda sama decyduje o ruchu całego lisa */
.fx[class*="emo-"] .fx-all,.fx[class*="emo-"] .fx-ground{animation:none}
.fx[class*="emo-"] .fx-flame{transform-origin:50% 100%;transform-box:fill-box;animation:fxFlame .3s ease-in-out infinite alternate}.fx[class*="emo-"] .fx-flame.in{animation-duration:.22s}
/* 3 dni — „Yes!”: podskoki + pięść */
.fx.emo-pump .fx-all{animation:emoHop .62s ease-in-out infinite}
.fx.emo-pump .fx-armr{animation:emoPump .62s ease-in-out infinite}
.fx.emo-pump .fx-arml{animation:none;transform:rotate(6deg)}
.fx.emo-pump .fx-head{animation:emoNod .62s ease-in-out infinite}
@keyframes emoHop{0%,100%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-14px) scale(.97,1.04)}}
@keyframes emoPump{0%,100%{transform:rotate(-120deg)}45%{transform:rotate(-172deg)}}
@keyframes emoNod{0%,100%{transform:rotate(0)}45%{transform:rotate(-6deg) translateY(-2px)}}
/* 7 dni — taniec */
.fx.emo-dance .fx-sway{animation:emoSway .5s ease-in-out infinite alternate}
.fx.emo-dance .fx-arml{animation:emoDanceL .5s ease-in-out infinite alternate}
.fx.emo-dance .fx-armr{animation:emoDanceR .5s ease-in-out infinite alternate}
.fx.emo-dance .fx-head{animation:emoHeadD .5s ease-in-out infinite alternate}
.fx.emo-dance .fx-tail{animation-duration:.5s}
.fx.emo-dance .fx-all{animation:emoStep 1s ease-in-out infinite}
@keyframes emoSway{0%{transform:translateX(-7px) rotate(-6deg)}100%{transform:translateX(7px) rotate(6deg)}}
@keyframes emoDanceL{0%{transform:rotate(155deg)}100%{transform:rotate(15deg)}}
@keyframes emoDanceR{0%{transform:rotate(-15deg)}100%{transform:rotate(-155deg)}}
@keyframes emoHeadD{0%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
@keyframes emoStep{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-6px)}}
/* 14 dni — pokaz siły */
.fx.emo-flex .fx-arml{animation:none;transform:rotate(128deg)}
.fx.emo-flex .fx-armr{animation:none;transform:rotate(-128deg)}
.fx.emo-flex .fx-sway{animation:emoFlex .9s cubic-bezier(.3,1.6,.5,1) infinite}
.fx.emo-flex .fx-head{animation:emoProud .9s ease-in-out infinite}
.fx.emo-flex .fx-bandt{animation-duration:.35s}
@keyframes emoFlex{0%,60%,100%{transform:scale(1,1)}20%{transform:scale(1.1,.92)}40%{transform:scale(.97,1.05)}}
@keyframes emoProud{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-5deg) translateY(-3px)}}
/* 30 dni — wiatr: pochylenie, łopoczący szalik, uszy po sobie */
.fx.emo-wind .fx-sway{animation:emoLean 2.2s ease-in-out infinite}
.fx.emo-wind .fx-scarfe{transform-origin:40% 0%;animation:emoWindScarf .28s ease-in-out infinite alternate}
.fx.emo-wind .fx-earl{animation:none;transform:rotate(-24deg)}
.fx.emo-wind .fx-earr{animation:none;transform:rotate(18deg)}
.fx.emo-wind .fx-tail{animation:emoTailWind .3s ease-in-out infinite alternate}
.fx.emo-wind .fx-arml{animation:none;transform:rotate(22deg)}
.fx.emo-wind .fx-armr{animation:emoShield 2.2s ease-in-out infinite}
@keyframes emoLean{0%,100%{transform:rotate(-7deg) skewX(3deg)}50%{transform:rotate(-10deg) skewX(5deg)}}
@keyframes emoWindScarf{0%{transform:rotate(-70deg) scaleY(1.05)}100%{transform:rotate(-52deg) scaleY(.95)}}
@keyframes emoTailWind{0%{transform:rotate(28deg)}100%{transform:rotate(36deg)}}
@keyframes emoShield{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-140deg)}}
/* 50 dni — medal: łapa do piersi, medal się kołysze, podbródek w górę */
.fx.emo-medal .fx-armr{animation:emoPresent 2.4s ease-in-out infinite}
.fx.emo-medal .fx-arml{animation:none;transform:rotate(6deg)}
.fx.emo-medal .fx-medal{transform-origin:50% 0%;animation:emoSwing 1.2s ease-in-out infinite}
.fx.emo-medal .fx-head{animation:emoChin 2.4s ease-in-out infinite}
.fx.emo-medal .fx-all{animation:emoHopS 2.4s ease-in-out infinite}
@keyframes emoPresent{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(58deg)}}
@keyframes emoSwing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes emoChin{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(-7deg) translateY(-3px)}}
@keyframes emoHopS{0%,100%{transform:translateY(0)}10%{transform:translateY(-8px)}20%{transform:translateY(0)}}
/* 100 dni — królewskie machanie i ukłon */
.fx.emo-royal .fx-armr{animation:emoRoyalWave 1.6s ease-in-out infinite}
.fx.emo-royal .fx-arml{animation:none;transform:rotate(8deg)}
.fx.emo-royal .fx-head{animation:emoBow 3.2s ease-in-out infinite}
.fx.emo-royal .fx-crown{transform-origin:50% 100%;animation:emoCrown 1.6s ease-in-out infinite}
.fx.emo-royal .fx-sway{animation:emoBowBody 3.2s ease-in-out infinite}
@keyframes emoRoyalWave{0%,100%{transform:rotate(-150deg)}25%{transform:rotate(-128deg)}50%{transform:rotate(-150deg)}75%{transform:rotate(-128deg)}}
@keyframes emoBow{0%,60%,100%{transform:rotate(6deg)}75%,85%{transform:rotate(14deg) translateY(6px)}}
@keyframes emoBowBody{0%,60%,100%{transform:scale(1,1)}75%,85%{transform:scale(1.03,.95)}}
@keyframes emoCrown{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
/* 365 dni — superbohater: łapy na biodrach, peleryna łopocze */
.fx.emo-hero .fx-arml{animation:none;transform:rotate(-38deg)}
.fx.emo-hero .fx-armr{animation:none;transform:rotate(38deg)}
.fx.emo-hero .fx-sway{animation:emoHero 2s ease-in-out infinite}
.fx.emo-hero .fx-head{animation:emoHeroHead 2s ease-in-out infinite}
.fx.emo-hero .fx-cape{animation:emoCapeHero .45s ease-in-out infinite alternate}
@keyframes emoHero{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(.98,1.06) translateY(-4px)}}
@keyframes emoHeroHead{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-8deg) translateY(-2px)}}
@keyframes emoCapeHero{0%{transform:skewX(4deg) scaleX(1.02)}100%{transform:skewX(-10deg) scaleX(1.1)}}

/* ============================================================ BOSS — Szop Zapominalski */
/* Szop — nastroje (części z fox.css: fx-all, fx-sway, fx-head, fx-ear*, fx-tail, fx-arm*, fx-eyes) */
.rc .rc-brows,.rc .rc-note,.rc .rc-page,.rc .rc-bang,.rc .rc-vein,.rc .rc-orb,.rc .rc-spin,.rc .rc-dropped,.rc .rc-tongue{transform-box:fill-box}
.fx.rc .fx-tail{transform-origin:10% 90%;animation:rcTail 1.8s ease-in-out infinite}
@keyframes rcTail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
/* czeka: pochyla się groźnie, brwi skaczą, macha zeszytem */
.fx.rc.idle .fx-sway{animation:rcLurk 2.6s ease-in-out infinite}
.fx.rc.idle .rc-brows{transform-origin:50% 50%;animation:rcBrows 2.6s ease-in-out infinite}
.fx.rc.idle .fx-armr{animation:rcWaveNote 1.3s ease-in-out infinite}
@keyframes rcLurk{0%,100%{transform:rotate(-3deg) translateX(-2px)}50%{transform:rotate(4deg) translateX(3px) scale(1.02,.98)}}
@keyframes rcBrows{0%,40%,60%,100%{transform:translateY(0)}45%,55%{transform:translateY(-4px)}}
@keyframes rcWaveNote{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-120deg)}}
/* trafiony: odrzut, zaciśnięte oczy, kartki wylatują, „bum” */
.fx.rc.hit .fx-all{animation:rcFlinch 1.1s ease-out infinite}
.fx.rc.hit .fx-head{animation:rcHeadHit 1.1s ease-out infinite}
.fx.rc.hit .fx-armr{animation:none;transform:rotate(-40deg)}
.fx.rc.hit .fx-arml{animation:none;transform:rotate(30deg)}
.fx.rc.hit .rc-page{animation:rcPage 1.1s ease-out infinite}
.fx.rc.hit .rc-page.p2{animation-delay:.08s;--px:-30px;--pr:-40deg}.fx.rc.hit .rc-page.p3{animation-delay:.16s;--px:24px;--pr:50deg}
.fx.rc.hit .rc-bang{transform-origin:50% 50%;animation:rcBang 1.1s ease-out infinite}
@keyframes rcFlinch{0%{transform:translateX(0) scale(1)}12%{transform:translateX(14px) scale(1.08,.9)}35%{transform:translateX(-4px) scale(.97,1.03)}55%,100%{transform:translateX(0) scale(1)}}
@keyframes rcHeadHit{0%,60%,100%{transform:rotate(0)}12%{transform:rotate(14deg)}30%{transform:rotate(-6deg)}}
@keyframes rcPage{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(var(--px,-10px),-70px) rotate(var(--pr,-20deg));opacity:0}}
@keyframes rcBang{0%{transform:scale(0) rotate(0);opacity:1}25%{transform:scale(1.3) rotate(20deg);opacity:1}60%,100%{transform:scale(0) rotate(40deg);opacity:0}}
/* śmieje się (pomyłka gracza): podskoki ze śmiechu, łapa na brzuchu */
.fx.rc.laugh .fx-all{animation:rcLaugh .42s ease-in-out infinite}
.fx.rc.laugh .fx-head{animation:rcLaughHead .42s ease-in-out infinite}
.fx.rc.laugh .fx-arml{animation:none;transform:rotate(-58deg)}
.fx.rc.laugh .fx-armr{animation:rcWaveNote .42s ease-in-out infinite}
@keyframes rcLaugh{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-7px) scale(.98,1.02)}}
@keyframes rcLaughHead{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
/* wściekły (mało życia): drży, żyłka pulsuje */
.fx.rc.angry .fx-all{animation:rcTremble .12s linear infinite}
.fx.rc.angry .rc-vein{transform-origin:50% 50%;animation:rcVein .5s ease-in-out infinite}
.fx.rc.angry .fx-earl{animation:none;transform:rotate(-14deg)}.fx.rc.angry .fx-earr{animation:none;transform:rotate(14deg)}
.fx.rc.angry .fx-armr{animation:rcWaveNote .6s ease-in-out infinite}
.fx.rc.angry .fx-drop{animation:fxDrop 1.2s ease-in infinite}
@keyframes rcTremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes rcVein{0%,100%{transform:translate(98px,34px) scale(2.2)}50%{transform:translate(98px,34px) scale(2.8)}}
/* pokonany: siada, oczy w spiralach, gwiazdki krążą, zeszyt na ziemi */
.fx.rc.dizzy .fx-sway{animation:rcSlump 2.4s ease-in-out infinite}
.fx.rc.dizzy .fx-head{animation:rcWobble 2.4s ease-in-out infinite}
.fx.rc.dizzy .fx-earl{animation:none;transform:rotate(-30deg)}.fx.rc.dizzy .fx-earr{animation:none;transform:rotate(30deg)}
.fx.rc.dizzy .fx-arml{animation:none;transform:rotate(18deg)}.fx.rc.dizzy .fx-armr{animation:none;transform:rotate(-18deg)}
.fx.rc.dizzy .fx-tail{animation:none;transform:rotate(26deg)}
.fx.rc.dizzy .rc-spin{transform-origin:50% 50%;animation:rcSpin 1s linear infinite}.fx.rc.dizzy .rc-spin.r2{animation-direction:reverse}
.fx.rc.dizzy .rc-orb{animation:rcOrb 2.4s ease-in-out infinite}
@keyframes rcSlump{0%,100%{transform:translateY(6px) scale(1.06,.9)}50%{transform:translateY(7px) scale(1.07,.89)}}
@keyframes rcWobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes rcSpin{to{transform:rotate(360deg)}}
@keyframes rcOrb{0%,100%{transform:translate(0,0)}25%{transform:translate(12px,4px)}50%{transform:translate(0,8px)}75%{transform:translate(-12px,4px)}}
/* wygrał (gracz przegrał): taniec z zeszytem nad głową */
.fx.rc.win .fx-sway{animation:emoSway .45s ease-in-out infinite alternate}
.fx.rc.win .fx-all{animation:rcLaugh .9s ease-in-out infinite}
.fx.rc.win .fx-armr{animation:none;transform:rotate(-168deg)}
.fx.rc.win .fx-arml{animation:emoDanceL .45s ease-in-out infinite alternate}
.fx.rc.win .fx-head{animation:emoHeadD .45s ease-in-out infinite alternate}

/* ============================================================ KAMIENIE MILOWE — ekran serii w wersji „kamień milowy”, pasek do następnego progu */
.scnum.fl-gold{color:var(--gold);text-shadow:0 5px 0 var(--gold-dark)}
.scnum.fl-blue{color:#4C9BFF;text-shadow:0 5px 0 #1D4FB8}
.scnum.fl-violet{color:#B77BFF;text-shadow:0 5px 0 #6D28D9}
.scnum.fl-magenta{color:#FF4FA8;text-shadow:0 5px 0 #A3155F}
.scel.ms .lc{padding-top:52px}
.mschip{background:var(--gold);color:var(--on-amber);font-weight:800;font-size:11.5px;letter-spacing:1.4px;padding:8px 14px;border-radius:99px;box-shadow:0 4px 0 var(--gold-dark);margin-bottom:6px}
.msitem{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:8px 14px;margin-top:14px;box-shadow:0 4px 0 var(--shadow)}
.msitem .ico{width:46px;height:50px;flex:none}.msitem .grow{flex:1;min-width:0}
.msitem .t{font-weight:800;font-size:14.5px}.msitem .s{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.msrw{display:flex;gap:8px;width:100%;margin-top:10px}
.msrw .rc{flex:1;border-radius:18px;padding:10px 4px;text-align:center;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--shadow)}
.msrw .rc b{display:block;font-family:var(--font-display);font-weight:800;font-size:22px}
.msrw .rc span{font-size:11px;font-weight:800;color:var(--txt-2)}
.msrw .rc.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line)}.msrw .rc.cyan b{color:var(--cyan)}
.msrw .rc.ice{background:var(--tint-cyan);border-color:var(--tint-cyan-line)}.msrw .rc.ice b{color:#8FE9FF}
.msrw .rc.gold{background:var(--tint-gold);border-color:var(--tint-gold-line)}.msrw .rc.gold b{color:var(--gold)}
.msnext{width:100%;margin-top:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:11px 14px;box-shadow:0 4px 0 var(--shadow);text-align:left}
.msnext .t{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--txt-2)}.msnext .t b{color:var(--txt)}
.msnext .bar{height:10px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}.msnext .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.msnext .s{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px}
/* szop w walce i na ścieżce */
.bossav .fx.rc{margin:0 auto}
.node-boss .fx.rc{margin-top:2px}


/* ============================================================ CHMURA — logowanie, dodawanie materiału, generowanie, przedmiot gotowy (cloud-ui.js) */
.cfsplash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.cfsplash .s{font-size:13.5px;font-weight:700;color:var(--muted)}
.cfauth{display:flex;flex-direction:column;gap:16px;padding:26px 20px 40px;min-height:100%}
.cfauth-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:8px}
.cfauth-top .logo{font-size:34px}
.cfauth-lead{font-size:14.5px;font-weight:700;color:var(--muted);line-height:1.45;max-width:300px}
.cftabs{display:flex;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:5px}
.cftab{flex:1;min-height:44px;border-radius:13px;border:none;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:14px;font-weight:800;cursor:pointer}
.cftab.on{background:var(--acid);color:var(--on-acid);box-shadow:0 3px 0 var(--acid-dark)}
.cfform{display:flex;flex-direction:column;gap:8px}
.cfform .pill{margin-top:10px;min-height:58px}
.cfin{width:100%;min-height:52px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 14px;color:var(--txt);font-family:var(--font-body);font-size:16px;font-weight:600;outline:none}
.cfin:focus{border-color:var(--acid)}
.cfcheck{display:flex;gap:10px;align-items:center;min-height:44px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.45;margin-top:4px;cursor:pointer}
.cfcheck input{width:22px;height:22px;flex:none;accent-color:var(--acid);margin-top:1px}
.cfcheck a{color:var(--acid)}
.cferr{min-height:18px;font-size:13px;font-weight:700;color:var(--red-soft);line-height:1.4}
.cferr:empty{min-height:0}
.linkbtn{background:none;border:0;min-height:44px;padding:0;margin:0;display:inline-flex;align-items:center;font:inherit;font-size:12.5px;font-weight:700;color:var(--cyan,#22D3EE);text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start}
.cfnotice{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--surface-2,#1b1b1b);font-size:13.5px;font-weight:700;line-height:1.45;color:var(--txt-2)}
.cfpriv-list{gap:10px;margin-bottom:14px}.cfpriv-list li{line-height:1.45}.cfpriv-list b{color:var(--txt)}
.sheet.cfpriv,.sheet.cfconsent{max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}.sheet.cfpriv>*,.sheet.cfconsent>*{flex:none} /* małe iPhone'y: przycisk na dole nie ucieka poza ekran */
.setrow.danger .t,.setrow.danger .ic{color:var(--red-soft)}
.cfdel-list{margin:0 0 4px 20px;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--txt-2)}
.cfconsent-fox{display:flex;justify-content:center}
.cfadd-body,.cfgen-body,.cfready-body{display:flex;flex-direction:column;gap:12px}
.cfthumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cfthumb{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;color:var(--muted);font-size:11px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.cfthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cfthumb.text{cursor:pointer;font-family:var(--font-body);align-items:flex-start;justify-content:flex-start;text-align:left;color:var(--txt-2)}
.cfthumb-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
.cfmore{display:flex;gap:8px;flex-wrap:wrap}
.cfmore .chip{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.cfwhere{display:flex;flex-direction:column;gap:10px}
/* stopka przypięta jak .egfoot: cloud-ui.js dokłada ją do .screen (obok .scroll), więc nie przewija się z treścią; .scroll ma zapas na jej wysokość */
.cfadd-foot{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:12px 18px 16px;background:var(--bg);border-top:2px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.cfadd-foot .pill{min-height:58px}
.scroll.cfadd,.scroll.cfgen{padding-bottom:120px}
.scroll.cfready{padding-bottom:190px} /* dwa przyciski w stopce */
.cfgen-body{align-items:center;text-align:center;padding-top:64px} /* miejsce na żarówkę i „!” nad głową lisa */
.cfgen-t{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.8px}
.cfgen-s{font-size:14px;font-weight:700;color:var(--muted);min-height:20px}
.cfgen-bar{width:100%;height:12px}
.cfgen-bar i{transition:width .8s ease}
.cfsteps{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:6px}
.cfstep{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted-2)}
.cfstep i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.cfstep.done{color:var(--txt-2)}.cfstep.done .ic{color:var(--acid)}
.cfstep.cur{color:var(--txt)}.cfstep.cur i{border-color:var(--acid);animation:dcPulse 1.2s ease-in-out infinite}
.cfgen-note{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.45;max-width:300px}
.cfready-body{align-items:stretch}
.cfready-body .lcfox{align-self:center;margin-top:60px}
.cfready-body .cfgen-t{text-align:center}
.cfcolors{display:flex;gap:10px}
.cfcolor{width:40px;height:40px;border-radius:14px;border:3px solid transparent;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.cfcolor.on{border-color:var(--txt)}
#cfr-lv .num{width:28px;height:28px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.empty .emptyfox{margin-top:20px}

/* ============================================================ ŻYCIE LISA (foxLive w engine.js): svg.fx.alive dostaje klasy na chwilę —
   act-* ruch, ex-* oczy, mo-* usta, mk-* znak nad głową, br-* brwi, bl rumieńce, bk mrugnięcie, tw-l/tw-r ucho, st-sleepy/st-doze nuda, cover hasło.
   Wzrok: zmienne --gx/--gy (źrenice) i --hr/--hx (głowa) ustawiane z JS. Bez JS (lis statyczny) zostają stare pętle. */
.fx-hgaze,.fx-lids,.fx-nose,.fx-glasses,.fx-x,.fxm,.fxm *,.fx-spin{transform-box:fill-box}
.fx{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

.fx-lids{transform-origin:50% 0%;transform:scaleY(0)}
.fx-x,.fxm{opacity:0;transition:opacity .08s}
.fx-nose{transform-origin:50% 40%}
.fx.alive .fx-eyes{animation:none}
.fx.alive:not(.act-look) .fx-look{animation:none;transform:translate(var(--gx,0px),var(--gy,0px));transition:transform .16s cubic-bezier(.3,.7,.4,1)}
.fx.alive:where(.idle,.think) .fx-earl,.fx.alive:where(.idle,.think) .fx-earr{animation:none;transition:transform .3s} /* :where = niższa waga, więc drgnięcia uszu (tw-*) i akcje wygrywają kolejnością */
.fx.alive.follow:not([class*="act-"]):not(.st-sleepy):not(.st-doze) .fx-head{animation:none}
/* mrugnięcie powiekami (lis senny ma je w połowie) */
.fx.bk .fx-lids{animation:fxLid .19s ease-in-out}
.fx.st-sleepy .fx-lids{transform:scaleY(.52)}
.fx.st-sleepy.bk .fx-lids{animation-name:fxLidS}
@keyframes fxLid{0%,100%{transform:scaleY(0)}50%{transform:scaleY(1)}}
@keyframes fxLidS{0%,100%{transform:scaleY(.52)}50%{transform:scaleY(1)}}
/* miny */
.fx.ex-happy .fxe-happy,.fx.ex-closed .fxe-closed,.fx.ex-wide .fxe-wide,.fx.ex-dizzy .fxe-dizzy,.fx.ex-wink .fxe-wink,.fx.st-doze .fxe-closed{opacity:1}
.fx[class*=" ex-"] .fx-e0,.fx.st-doze .fx-e0,.fx[class*=" ex-"] .fx-lids,.fx.st-doze .fx-lids{opacity:0}
.fx.mo-o .fxo-o,.fx.mo-yawn .fxo-yawn,.fx.mo-grin .fxo-grin,.fx.mo-blep .fxo-blep,.fx.mo-wavy .fxo-wavy{opacity:1}
.fx[class*=" mo-"] .fx-m0{opacity:0}

@keyframes fxMkPop{0%{opacity:0;transform:translateY(8px) scale(.3)}22%{opacity:1;transform:translateY(-2px) scale(1.15)}34%{transform:translateY(0) scale(1)}82%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px) scale(.9)}}

/* ============================================================ NAUKA W CZACIE (startChat w engine.js) — zamiast karty roladki:
   dymki lisa po kawałku, pojęcia do stukania (definicja + licznik), szybkie odpowiedzi w stopce, mini-sprawdzian z luką. */
.lessonbody.chatbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:0;overscroll-behavior:contain}
.chattop{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 0 10px;background:var(--bg);border-bottom:2px solid var(--line-2)}
.chatfox{flex:none;width:56px;height:60px;display:flex;align-items:flex-end;justify-content:center}
.chatname{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.2px}
.chatsub{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatterms{flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:13px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);color:var(--gold);font-size:13.5px;font-weight:800}
.chatterms.pop{animation:cPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes cPop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.chat{display:flex;flex-direction:column;gap:10px;padding:14px 0 28px}
.chint{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:16px;background:var(--surface-2);font-size:13.5px;font-weight:600;line-height:1.45;color:var(--muted)}
.chint .ic{flex:none;color:var(--gold);margin-top:2px}
.cdiv{align-self:center;display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:6px 13px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:800;color:var(--txt-2);max-width:92%;text-align:center}
.cdiv span{color:var(--accent);flex:none}
.cbub{max-width:88%;padding:12px 15px;border-radius:20px;font-size:17px;line-height:1.5;font-weight:500;overflow-wrap:anywhere}
.cbub.fox{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px;color:var(--txt)}
.cbub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15.5px;border-bottom-right-radius:6px}
.cbub .lbl{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.cbub.real{background:var(--tint-cyan);border:2px solid var(--tint-cyan-line)}.cbub.real .lbl{color:var(--cyan)}
.cbub.mnemo{background:var(--tint-gold);border:2px solid var(--tint-gold-line)}.cbub.mnemo .lbl{color:var(--gold)}
.cbub.cdef{background:var(--surface-2);border:2px solid var(--tint-gold-line);font-size:15.5px;margin-left:14px;max-width:84%}.cbub.cdef .lbl{color:var(--gold);text-transform:none;letter-spacing:0;font-size:13px}
.cbub.ccheck{border:2px solid var(--line-2)}.cbub.ccheck .lbl{color:var(--accent)}
.cbub.typing{display:flex;gap:5px;align-items:center;padding:15px 16px}
.cbub.typing i,.chatwait i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:cType 1s ease-in-out infinite}
.cbub.typing i:nth-child(2),.chatwait i:nth-child(2){animation-delay:.15s}.cbub.typing i:nth-child(3),.chatwait i:nth-child(3){animation-delay:.3s}
@keyframes cType{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.cterm{color:var(--accent);font-weight:800;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:4px;cursor:pointer;border-radius:6px;-webkit-tap-highlight-color:transparent}
.cterm.got{text-decoration:none;background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)} /* tło w kolorze przedmiotu */
.cterm.demo{cursor:default}
.blank{display:inline-block;min-width:74px;padding:0 6px;margin:0 2px;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:800;text-align:center}
.blank.ok{border-color:var(--acid);color:var(--acid);background:var(--tint-acid);border-radius:6px 6px 0 0}
.blank.bad{border-color:var(--gold);color:var(--gold)}
.cxp{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:9px;background:var(--tint-acid);color:var(--acid);font-size:13px;font-weight:800;vertical-align:middle}
.chatfoot{min-height:76px;display:flex;flex-direction:column;justify-content:center;border-top:2px solid var(--line-2);background:var(--bg)}
.chatwait{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;font-weight:700;align-self:flex-start;padding:0 4px}
.chatwait span{margin-left:6px}
.creplies{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.creply{min-height:46px;padding:10px 15px;border-radius:16px;background:var(--surface);border:2px solid var(--line-2);box-shadow:0 4px 0 var(--line-2);font:700 15px var(--font-body);color:var(--txt);cursor:pointer}
.creply:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line-2)}
.creply.main{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 4px 0 var(--accent-dark);font-weight:800}
.creply.ok{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--tint-acid-line);color:var(--txt)}
.creply.bad{background:var(--surface-2);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark);color:var(--txt)}
.creply:disabled{cursor:default}
/* „prawda czy fałsz” w quizie, gdy poprawna odpowiedź odstaje długością */
.qtfcand{margin:16px 0 14px;padding:16px 17px;border-radius:20px;background:var(--surface);border:2px solid var(--line-2);font-size:17px;line-height:1.45;font-weight:600}
.qtfcand .lbl,.qtfright .lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qtfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qtfbtns .qopt{justify-content:center}
.qtfright{margin-top:14px;padding:13px 15px;border-radius:18px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);font-size:15.5px;line-height:1.45;font-weight:600}
.qtfright .lbl{color:var(--acid)}

/* poprawki po przeglądzie lisa */
.fx.oops.mk-sweat .fx-drop{visibility:hidden} /* jedna kropla, nie dwie */
.fx[class*=" ex-"] .fx-b0,.fx[class*=" br-"] .fx-b0{opacity:0} /* brwi nastroju ustępują brwiom miny */
.fx.act-hop:is(.happy,.fire) .fx-all{animation:fxHop .9s cubic-bezier(.3,.7,.4,1)}
.fx.act-hop:is(.happy,.fire) .fx-ground{animation:fxGround .9s cubic-bezier(.3,.7,.4,1)}
.fx.act-wave:is(.happy,.fire) .fx-armr{animation:fxWave 1.7s ease-in-out}
.fx.act-wave:is(.happy,.fire) .fx-head{animation:fxTiltR 1.7s ease-in-out}

/* nauka w czacie — części, kafelki słówek, nagłówki, chipsy */
.cdose{display:flex;flex-direction:column;gap:10px}
.cdhead{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;margin:8px 0 2px;padding:14px 16px;border-radius:20px;text-align:left;cursor:default;
  background:color-mix(in srgb,var(--accent) 13%,var(--surface));border:2px solid color-mix(in srgb,var(--accent) 35%,var(--line-2));color:var(--txt);font:inherit;position:relative}
.cdhead .cdn{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.cdhead .cdt{font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.2;letter-spacing:-.3px}
.cdhead .cdk{display:none;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);align-items:center;justify-content:center}
.cdose.done:not(.open)>:not(.cdhead){display:none} /* zwinięta część: tylko nagłówek; stuknięcie rozwija */
.cdose.done .cdhead{cursor:pointer;padding:10px 50px 10px 14px;margin:2px 0;background:var(--surface-2);border-color:var(--line-2)}
.cdose.done .cdhead .cdt{font-size:15.5px}
.cdose.done .cdhead .cdk{display:flex}
.csub{margin:6px 2px 0;font-size:12.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent)}
.cvocab{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.cvi{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t k" "m k";align-items:center;column-gap:10px;width:100%;padding:12px 14px;border-radius:18px;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--line-2);box-shadow:0 3px 0 var(--line-2);font:inherit;color:var(--txt);-webkit-tap-highlight-color:transparent}
.cvi:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.cvi .cvt{grid-area:t;font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.25;color:var(--accent)}
.cvi .cvt b,.cvi .cvt strong{font-weight:inherit}
.cvi .cvm{grid-area:m;margin-top:2px;font-size:15px;font-weight:500;line-height:1.4;color:var(--txt-2)}
.cvi .cvk{grid-area:k;width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;color:transparent}
.cvi.got{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2));box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 40%,var(--line-2))}
.cvi.got .cvk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cvx{padding:10px 14px;font-size:15.5px;line-height:1.45;color:var(--txt-2)}
.cchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.cchip{padding:6px 11px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-2);font-size:15.5px;font-weight:700;line-height:1.3}
.cchip b,.cchip strong{font-weight:inherit}
.cbub .lbl{color:var(--accent)}

/* ============================================================ WIZUALIZACJE W CZACIE (chatViz / vizHtml w engine.js)
   Osobny dymek po tekście dawki: oś czasu, porównanie, cykl, kroki / przyczyna-skutek, podział, wykres słupkowy, liczby.
   Tylko tokeny, bez gradientów i kół w tle; strzałki i pętla cyklu z CSS. Węższe dymki (360 px ekranu) przez container query.
   Ruch: wejście elementów kaskadą (--i), słupki rosną, pętla się dorysowuje — „Ogranicz animacje” i prefers-reduced-motion wyłączają to globalnie. */
.cbub.cviz{align-self:stretch;max-width:100%;padding:13px 14px 15px;border:2px solid var(--line-2);font-size:15px;line-height:1.4;container-type:inline-size}
.cbub.cviz .lbl{margin-bottom:7px}
.vz-cap{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.25;letter-spacing:-.2px;color:var(--txt);margin:0 0 12px}
@keyframes vzIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes vzGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vzDraw{from{clip-path:inset(100% -12px -12px -12px)}to{clip-path:inset(-12px -12px -12px -12px)}} /* zapas na grot strzałki poza ramką */
.cviz [style*="--i"]{animation:vzIn .4s ease-out both;animation-delay:calc(var(--i) * 80ms + .15s)}

/* oś czasu: szyna z kwadratowymi znacznikami, data nad opisem (daty bywają długie — „1 września 1939”) */
.vz-tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vz-tl li{position:relative;padding:0 0 14px 24px}
.vz-tl li:last-child{padding-bottom:0}
.vz-tl li::before{content:'';position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:4px;background:var(--accent)}
.vz-tl li::after{content:'';position:absolute;left:5px;top:20px;bottom:2px;width:2px;border-radius:2px;background:var(--line)}
.vz-tl li:last-child::after{display:none}
.vz-when{display:block;font-family:var(--font-display);font-weight:800;font-size:15.5px;line-height:1.3;color:var(--accent)}
.vz-tl span{display:block;margin-top:1px;font-size:15px;line-height:1.4;color:var(--txt-2)}

/* porównanie: dwie kolumny pod nagłówkami A / B, cecha nad parą */
.vz-cmp{display:flex;flex-direction:column;gap:9px}
.vz-cmph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vz-cmph b{display:flex;align-items:center;justify-content:center;padding:7px 9px;border-radius:12px;font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.vz-cmph .vz-ca{background:var(--accent-tint,var(--surface-2));color:var(--txt);border:2px solid var(--accent)}
.vz-cmph .vz-cb{background:var(--surface-2);color:var(--txt);border:2px solid var(--muted-2)}
.vz-cmpr{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding-top:9px;border-top:2px solid var(--line-2)}
.vz-k{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.vz-cmpr .vz-ca,.vz-cmpr .vz-cb{padding-left:9px;border-left:3px solid var(--accent);font-size:14.5px;line-height:1.4;color:var(--txt-2);overflow-wrap:anywhere}
.vz-cmpr .vz-cb{border-left-color:var(--muted-2)}

/* kroki: proces (numery), cykl (numery + pętla), przyczyna → skutek (etykiety, ostatni wyróżniony) */
.vz-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.vz-step{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-size:15px;font-weight:600;line-height:1.35;color:var(--txt)}
.vz-step>span{min-width:0;overflow-wrap:anywhere}
.vz-step i{flex:none;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on-accent);font:800 13px/1 var(--font-body);font-style:normal}
.vz-step:not(:last-child)::before{content:'';position:absolute;left:50%;bottom:-17px;width:2.5px;height:13px;border-radius:2px;background:var(--muted-2);transform:translateX(-50%)}
.vz-step:not(:last-child)::after{content:'';position:absolute;left:50%;bottom:-17px;width:7px;height:7px;border-right:2.5px solid var(--muted-2);border-bottom:2.5px solid var(--muted-2);transform:translateX(-50%) rotate(45deg)}
.vz-steps.cause .vz-step{flex-direction:column;align-items:flex-start;gap:2px}
.vz-step em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.vz-steps.cause .vz-step:not(:last-child)::before{background:var(--accent)}
.vz-steps.cause .vz-step:not(:last-child)::after{border-color:var(--accent)}
.vz-step.end{background:var(--accent-tint,var(--surface-2));border-color:var(--accent)}
.vz-step.end em{color:var(--accent)}
.vz-cyc{position:relative;padding-right:34px}
.vz-loop{position:absolute;right:6px;top:22px;bottom:52px;width:22px;border:2.5px solid var(--accent);border-left:0;border-radius:0 14px 14px 0;animation:vzDraw .6s ease-out .7s both}
.vz-loop::before{content:'';position:absolute;left:-6px;top:-6.5px;border-style:solid;border-width:5.5px 7px 5.5px 0;border-color:transparent var(--accent) transparent transparent}
.vz-again{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin:10px -28px 0 0;font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--accent)}

/* podział: korzeń, łącznik, grupy w dwóch kolumnach (w wąskim dymku jedna) */
.vz-tree{display:flex;flex-direction:column}
.vz-root{align-self:center;max-width:100%;padding:9px 16px;border-radius:14px;background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-dark);font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
.vz-grps{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.vz-grps::before{content:'';position:absolute;left:50%;top:-21px;width:2.5px;height:11px;background:var(--line);transform:translateX(-50%)}
.vz-grps::after{content:'';position:absolute;left:25%;right:25%;top:-11px;height:2.5px;border-radius:2px;background:var(--line)}
.vz-grp{position:relative;min-width:0;padding:9px 11px 10px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line)}
.vz-grp:nth-child(-n+2)::before{content:'';position:absolute;left:50%;top:-12px;width:2.5px;height:10px;background:var(--line);transform:translateX(-50%)}
.vz-grp:last-child:nth-child(odd){grid-column:1/-1}
.vz-grp:last-child:nth-child(odd)::before{display:none}
.vz-gn{margin-bottom:5px;font-size:14.5px;font-weight:800;line-height:1.3;color:var(--accent);overflow-wrap:anywhere}
.vz-grp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.vz-grp li{position:relative;padding-left:12px;font-size:13.5px;line-height:1.35;color:var(--txt-2);overflow-wrap:anywhere}
.vz-grp li::before{content:'';position:absolute;left:0;top:.55em;width:5px;height:5px;border-radius:2px;background:var(--muted-2)}

/* wykres słupkowy: etykieta i wartość nad torem, najwyższy słupek w pełnym kolorze */
.vz-bars{display:flex;flex-direction:column;gap:12px}
.vz-bl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px;font-size:14px;line-height:1.3}
.vz-bl span{min-width:0;color:var(--txt-2);font-weight:600;overflow-wrap:anywhere}
.vz-bl b{flex:none;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--txt);white-space:nowrap}
.vz-bt{height:12px;border-radius:6px;background:var(--line-2);overflow:hidden}
.vz-bt i{display:block;height:100%;border-radius:6px;background:color-mix(in srgb,var(--accent) 55%,var(--surface));transform-origin:left center;animation:vzGrow .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0) * 90ms + .25s)}
.vz-bar.top .vz-bt i{background:var(--accent)}
.vz-bar.top .vz-bl b{color:var(--accent)}

/* liczby: kafle z dużą wartością */
.vz-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vz-nums.wide{grid-template-columns:1fr}
.vz-num{display:flex;flex-direction:column;gap:4px;min-width:0;padding:12px 13px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line)}
.vz-nums:not(.wide) .vz-num:last-child:nth-child(odd){grid-column:1/-1}
.vz-num b{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.5px;color:var(--accent);overflow-wrap:anywhere}
.vz-num span{font-size:13.5px;line-height:1.35;color:var(--txt-2);overflow-wrap:anywhere}

@container (max-width:280px){
  .vz-grps,.vz-nums{grid-template-columns:1fr}
  .vz-grps::after,.vz-grp::before{display:none}
  .vz-grps::before{top:-22px;height:20px}
  .vz-cmph b{font-size:14px}
  .vz-cmpr .vz-ca,.vz-cmpr .vz-cb{font-size:14px}
}
@supports not (color: color-mix(in srgb, red, blue)){.vz-bt i{background:var(--muted-2)}}

</style>

class CloudError extends Error{constructor(status,code,msg,data){super(msg||code||('HTTP '+status));this.status=status;this.code=code||'';this.data=data;}}

async function http(url,o){

  catch(e){throw new CloudError(0,'network','Brak połączenia z internetem');}
  finally{if(tm)clearTimeout(tm);}

  try{data=txt?JSON.parse(txt):null;}catch(e){data=txt;}
  return {status:res.status,data};
}

    finally{refreshing=null;}

/* ---------- PostgREST + Storage ---------- */
async function rest(path,o){
  o=o||{};const h={apikey:CFG.anonKey,'Content-Type':'application/json',Authorization:'Bearer '+await token()};
  if(o.prefer)h.Prefer=o.prefer;

  if(r.status>=400)throw errOf(r);return r.data;
}
const jwtFail=r=>r.status===401||((r.status===400||r.status===403)&&/jwt|exp|token/i.test(JSON.stringify(r.data||'')));
async function storage(path,o){
  o=o||{};const send=async tok=>{const h={apikey:CFG.anonKey,Authorization:'Bearer '+tok};Object.assign(h,o.headers||{});return http(CFG.supabaseUrl+'/storage/v1/'+path,{method:o.method||'GET',headers:h,body:o.body,raw:o.raw,timeout:o.raw!==undefined?180000:20000});};
  let r=await send(await token());if(jwtFail(r))r=await send(await refresh(true));
  if(r.status>=400)throw errOf(r);return r.data;
}

/* ---------- duże pliki: wysyłka wznawialna (TUS 1.0.0 w Supabase Storage) ----------
   Kawałki po dokładnie 6 MB (wymóg Supabase), ostatni mniejszy. Nieudany kawałek: do 3 ponowień z przerwą, przed każdym HEAD mówi,
   ile serwer już ma (odpowiedź mogła zginąć po zapisaniu kawałka) — stamtąd dalej. Obiekt w buckecie powstaje dopiero po ostatnim kawałku. */
const TUS_CHUNK=6*1048576,TUS_WAIT=[1000,3000,7000];
async function rawHttp(url,o){ // jak http(), ale z nagłówkami odpowiedzi (Location, Upload-Offset); treść czytana tylko przy błędzie
  const ac=typeof AbortController==='function'?new AbortController():null;const tm=ac&&setTimeout(()=>ac.abort(),o.timeout||20000);let res;
  try{res=await fetch(url,{method:o.method,headers:o.headers,body:o.body,signal:ac?ac.signal:undefined});}
  catch(e){if(tm)clearTimeout(tm);throw new CloudError(0,'network','Brak połączenia z internetem');}
  let data=null;
  try{if(res.status>=400){const t=await res.text();try{data=t?JSON.parse(t):null;}catch(e){data=t;}}}catch(e){}finally{if(tm)clearTimeout(tm);}
  return {status:res.status,data,head:k=>{try{return res.headers.get(k);}catch(e){return null;}}};
}
const b64utf8=s=>btoa(unescape(encodeURIComponent(String(s)))); // base64 z UTF-8 (wartości Upload-Metadata)
function tusUrl(loc){ // adres wysyłki zawsze w domenie Supabase z konfiguracji — token nie trafia nigdzie indziej (też gdy serwer poda http:// albo inny host)
  const base=new URL(CFG.supabaseUrl);let u;try{u=new URL(String(loc||''),base.origin+'/storage/v1/upload/resumable');}catch(e){return null;}
  if(!loc||(u.host!==base.host&&!/^\/storage\/v1\/upload\/resumable\/./.test(u.pathname)))return null;
  return base.origin+u.pathname+u.search;
}
const retryable=s=>s===0||s===408||s===409||s===423||s===429||s>=500; // 409: serwer ma inny offset — HEAD i dalej
async function tusUpload(path,blob,mime,onProgress){
  const size=blob.size,prog=n=>{if(onProgress)try{onProgress(n,size);}catch(e){}};
  const send=async(url,o)=>{const go=async tok=>rawHttp(url,{...o,headers:Object.assign({apikey:CFG.anonKey,Authorization:'Bearer '+tok,'Tus-Resumable':'1.0.0'},o.headers)});
    let r=await go(await token());if(jwtFail(r))r=await go(await refresh(true));return r;}; // 401 → odśwież token raz
  const meta={bucketName:'materials',objectName:path,contentType:mime,cacheControl:'3600'};
  const c=await send(CFG.supabaseUrl+'/storage/v1/upload/resumable',{method:'POST',headers:{'Upload-Length':String(size),'Upload-Metadata':Object.keys(meta).map(k=>k+' '+b64utf8(meta[k])).join(','),'x-upsert':'false'}});
  if(c.status<200||c.status>=300)throw errOf(c); // 413: plik większy niż limit bucketu
  const url=tusUrl(c.head('Location'));if(!url)throw new CloudError(0,'upload_failed','Serwer nie podał adresu wysyłki');
  let off=0,fails=0;prog(0);
  while(off<size){
    const end=Math.min(size,off+TUS_CHUNK);let r=null,err=null;
    try{r=await send(url,{method:'PATCH',headers:{'Upload-Offset':String(off),'Content-Type':'application/offset+octet-stream'},body:blob.slice(off,end),timeout:180000});}
    catch(e){if(e.code!=='network')throw e;err=e;}
    if(r&&r.status>=200&&r.status<300){const h=r.head('Upload-Offset'),n=h==null?end:+h; // bez nagłówka: 204 znaczy, że kawałek przyjęty
      if(n>off&&n<=size){off=n;fails=0;prog(off);continue;}}
    else if(r&&!retryable(r.status))throw errOf(r); // odmowa (rozmiar, typ, uprawnienia) — ponawianie nic nie da
    if(++fails>3)throw err||(r&&r.status>=300?errOf(r):new CloudError(0,'upload_failed','Wysyłka pliku się nie powiodła'));
    await sleep(TUS_WAIT[fails-1]);
    try{const h=await send(url,{method:'HEAD'});
      if(h.status===404||h.status===410)throw new CloudError(h.status,'upload_failed','Wysyłka wygasła');
      const v=h.head('Upload-Offset'),n=+v;if(h.status<300&&v!=null&&v!==''&&n>=0&&n<=size){off=n;prog(off);}}
    catch(e){if(e.code!=='network')throw e;} // HEAD bez sieci: następna próba PATCH; zły offset → 409 → znów HEAD
  }
}
async function storageListAll(prefix){const out=[];for(let off=0;off<10000;off+=100){const page=await storage('object/list/materials',{method:'POST',headers:{'Content-Type':'application/json'},body:{prefix,limit:100,offset:off}});if(!Array.isArray(page)||!page.length)break;page.forEach(f=>{if(f&&f.name)out.push(prefix+'/'+f.name);});if(page.length<100)break;}return out;}

/* ---------- API na Vercelu: natywnie (bez CORS), w przeglądarce przez lokalne proxy; 401 → odśwież token i ponów raz (serwer sprawdza sesję przed limitem) ---------- */
async function api(path,o){
  o=o||{};const url=apiBase()+path;
  const H=isNative()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  const send=async tok=>{const headers={Authorization:'Bearer '+tok,'Content-Type':'application/json'};
    if(!H)return http(url,{method:o.method||'GET',headers,body:o.body,timeout:310000});
    let r;try{r=await H.request({url,method:o.method||'GET',headers,data:o.body,readTimeout:310000});} // tylko readTimeout: connectTimeout zabiłby 2-minutowe generowanie
    catch(e){throw new CloudError(0,'network','Brak połączenia z serwerem');}
    let d=r.data;if(typeof d==='string'){try{d=JSON.parse(d);}catch(e){}}
    return {status:r.status,data:d};};
  let r=await send(await token());if(r.status===401)r=await send(await refresh(true));
  return r;
}
function uuid(){const b=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.random()*256|0);b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);}

/* ---------- IndexedDB per konto (cache przedmiotów, baza synchronizacji); zawieszona baza nie blokuje startu ---------- */
let idbP=null;
function idb(){if(!idbP)idbP=new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('idb timeout')),2500);try{if(!window.indexedDB)throw new Error('no idb');const r=indexedDB.open('cramfox',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{clearTimeout(t);res(r.result);};r.onerror=()=>{clearTimeout(t);rej(r.error);};}catch(e){clearTimeout(t);rej(e);}}).catch(e=>{idbP=null;throw e;});return idbP;}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){idbP=null;return jget('cf_'+k,null);}}
async function idbPut(k,v,lsFallback){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
  catch(e){idbP=null;if(lsFallback){const s=JSON.stringify(v);if(s.length<1500000)lset('cf_'+k,s);}}} // większy cache nie trafia do localStorage — zapchałby miejsce na postępy
async function idbDel(k){try{LS.removeItem('cf_'+k);const db=await idb();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res;});}catch(e){idbP=null;}}

/* ---------- sanitizer: tylko bezpieczne tagi, jedyny atrybut to class zbox/gradetbl; teksty escapowane także z cudzysłowem ---------- */
const OK_TAGS=new Set(['b','i','em','strong','u','s','br','p','ul','ol','li','div','span','h3','h4','table','thead','tbody','tr','th','td','code','sup','sub','small','mark','blockquote','hr']);
const DROP_TAGS=new Set(['script','style','iframe','object','embed','svg','math','img','video','audio','source','link','meta','base','form','input','button','textarea','select','option','template','noscript','frame','frameset','canvas','picture','track','applet']);
const VOID=new Set(['br','hr']);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function ser(node){let out='';node.childNodes.forEach(n=>{
  if(n.nodeType===3){out+=esc(n.nodeValue);return;}
  if(n.nodeType!==1)return;
  const t=n.localName;if(DROP_TAGS.has(t))return;
  if(!OK_TAGS.has(t)){out+=ser(n);return;} // nieznany tag: zostaje sam tekst
  const cls=(n.getAttribute('class')||'').split(/\s+/).filter(c=>c==='zbox'||c==='gradetbl').join(' ');
  out+='<'+t+(cls?' class="'+cls+'"':'')+'>'+(VOID.has(t)?'':ser(n)+'</'+t+'>');});return out;}
const TAG_RE=new RegExp('<(?!/?(?:'+[...OK_TAGS].join('|')+')(?:\\s+class\\s*=\\s*"[^"<>]*")?\\s*/?>)','gi'); // „<” niebędące dozwolonym znacznikiem (np. x1<x2) to tekst, nie początek tagu
function clean(s){if(s==null)return '';s=String(s);if(!/[<>&"']/.test(s))return s;const tp=document.createElement('template');tp.innerHTML=s.replace(TAG_RE,'&lt;');return ser(tp.content);} // pola HTML
const plain=s=>esc(s==null?'':s); // pola tekstowe: bez interpretacji HTML — "a<b" zostaje "a<b", a nie znacznikiem
function deepEsc(v){if(typeof v==='string')return esc(v);if(Array.isArray(v))return v.map(deepEsc);if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=deepEsc(v[k]);return o;}return v;}
const noEmoji=s=>String(s).replace(/[\p{Extended_Pictographic}️‍]/gu,'').replace(/\s+/g,' ').trim();

/* ---------- mapper: przedmiot z bazy + jego tematy → przedmiot silnika ---------- */
const PALETTE=[['#B4FF3A','#7FC400','#14210A'],['#FF2E93','#B01460','#200410'],['#22D3EE','#108CA1','#04232B'],['#FFC043','#B3820E','#241800'],['#FFA023','#B36A08','#201202'],['#A855F7','#6B2AA8','#1A0A2A']];
const STAGE_TO_DB={podstawowka:'podstawowa',liceum:'liceum',studia:'studia',inne:'inne'};
const STAGE_FROM_DB={podstawowa:'podstawowka',liceum:'liceum',studia:'studia',inne:'inne'};
const hash=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);};
function paletteFor(sub){const a=String(sub.accent||'').toUpperCase();const i=PALETTE.findIndex(p=>p[0]===a);return PALETTE[i>=0?i:hash(sub.id)%PALETTE.length];}
const TASK_OK=new Set(['match','fill','order','sort','tf','timeline','finderror','thesis','chain','scenario','swipe','typeterm','chart','mathsteps']); // hotspot: obraz z AI to ryzyko XSS — zostaje w tablicy (indeksy!), ale do pominięcia
const arr=v=>Array.isArray(v)?v:[];
function shortOf(name){name=String(name||'');if(name.length<=14)return name;const w=name.split(/\s+/)[0];return w.length<=14?w:w.slice(0,13)+'…';}
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function gamesAsTasks(games){ // starsze tematy mają `games` zamiast `tasks` — ta sama konwersja co w backendzie (packages/shared/src/tasks.ts)
  const out=[];arr(games).forEach(g=>{if(!g||typeof g!=='object')return;
    if(g.type==='match'&&arr(g.pairs).length>=2)out.push({type:'match',title:g.title,pairs:g.pairs.map(p=>[obj(p).l,obj(p).r])});
    else if(g.type==='cloze'){const items=arr(g.items).filter(i=>i&&String(i.s||'').includes('___'));
      for(let k=0;k<items.length;k+=4){const ch=items.slice(k,k+4),blanks=ch.map(i=>i.answer);
        const bank=[...new Set(ch.flatMap(i=>arr(i.options)).filter(o=>!blanks.some(b=>fold(b)===fold(o))))];
        out.push({type:'fill',title:g.title,text:ch.map((i,x)=>String(i.s).replace('___','{'+x+'}')).join('\n'),blanks,bank,e:ch.map(i=>i.e).filter(Boolean).join(' ')||undefined});}}
    else if(g.type==='truefalse'&&arr(g.items).length)out.push({type:'tf',title:g.title,statements:g.items.map(i=>({s:obj(i).s,v:obj(i).v,e:obj(i).e}))});
    else if(g.type==='order'&&arr(g.steps).length>=2)out.push({type:'order',title:g.title||g.prompt,items:[...g.steps]});});
  return out;
}
/* ---------- wizualizacje w czacie: feed[].viz (opcjonalne) ----------
   Unia po polu type: timeline / compare / cycle / flow / tree / bars / numbers, każda gałąź może mieć caption (do 120 znaków).

const numPl=x=>String(Math.round(x*100)/100).replace('.',',');
function vizText(v){ // zwykły tekst (już escapowany) z wizualizacji — dla trybów, które czytają tylko tekst dawki (wyjaśnij inaczej, znaczenie pojęcia, sprawdzian z luką)

   Własny zapis, którego odpowiedź zginęła (sieć), rozpoznajemy po client_ts — nie liczymy go drugi raz.

async function push(){

  if(pushing)return pushing;
  pushing=(async()=>{try{
    const mark=LS.getItem(DIRTYK),st=localState(),rev=+LS.getItem(REVK)||0,ts=Date.now()*1000+(dseq%1000),body={progress:st.progress,meta:st.meta,client_ts:ts};
    jset(SENTK,{ts,st});
    let rows;
    try{rows=rev?await rest('app_state?user_id=eq.'+UID+'&rev=eq.'+rev,{method:'PATCH',prefer:'return=representation',body})
      :await rest('app_state?on_conflict=user_id',{method:'POST',prefer:'resolution=ignore-duplicates,return=representation',body:{user_id:UID,...body}});}
    catch(e){if(missing(e))syncOff=true;throw e;}

    LS.removeItem(SENTK);lset(REVK,row.rev);setBase(st);

/* scalanie trójstronne: gdzie zmieniła się tylko jedna strona — ta wygrywa; gdzie obie — liczniki sumują zmiany, reszta wg typu */
const same=(a,b)=>a===b||JSON.stringify(a)===JSON.stringify(b);
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const ADD=new Set(['xp','gems','examsPassed','levels','cards','reviews','missions','planDays','bosses']); // liczniki (też dzienne w history i w stats): zdobyte i wydane na obu urządzeniach się sumują; reszta liczb (rekordy, terminy SRS, zamrożenia) — maksimum
const ZERO={}; // znacznik: obie strony utworzyły ten obiekt niezależnie (nowy dzień w history/daily) — liczniki liczymy od zera
const byId=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&(typeof x.id==='string'||typeof x.id==='number')); // też pusta lista (wszystko usunięte po jednej stronie)
function m3(b,l,c,k){

    if(l.concat(c).every(x=>x===null||typeof x!=='object')){ // zbiór: zostaje to, co jest po obu stronach, albo nowe po jednej; usunięte po jednej stronie znika

const dplus=(d,n)=>{const p=String(d).split('-').map(Number);const x=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(x.getUTCDate()).padStart(2,'0');};
const DAY=/^\d{4}-\d{2}-\d{2}$/;
function streakDays(m,frozen){ // dni aktywne serii (bez dni pokrytych zamrożeniem)

  let d=m.lastDay,left=+m.streak;for(let i=0;left>0&&i<2000;i++){if(!frozen.has(d)){out.add(d);left--;}d=dplus(d,-1);}return out;

function mergeStreak(lm,cm,out){ // seria z obu urządzeń: suma dni aktywnych; liczymy wstecz od ostatniego dnia, zamrożone dni przechodzą bez liczenia

  for(let i=0;i<4000;i++){if(days.has(d))n++;else if(!frozen.has(d))break;d=dplus(d,-1);}

function merge3(b,l,c){

    if(ld.date&&ld.date===cd.date&&ld.date!==obj(bp.daily).date)bp.daily=ZERO; // nowy dzień na obu urządzeniach: dzienny plan liczymy od zera, nie od wczoraj

async function pull(canApply,apply){ // zwraca true, gdy lokalny stan się zmienił (i apply() już przeładował silnik)

  if(pushing)await pushing.catch(()=>{}); // własny zapis w locie: najpierw jego wynik, inaczej wzięlibyśmy go za cudzy
  canApply=canApply||hooks.canApply;if(apply===undefined)apply=hooks.apply;
  let rows;try{rows=await rest('app_state?select=progress,meta,rev,client_ts&user_id=eq.'+UID);}
  catch(e){if(missing(e)){syncOff=true;emit('sync',{off:true});return false;}throw e;}
  loadBase();
  const row=Array.isArray(rows)&&rows[0]||null,rev=+LS.getItem(REVK)||0,sent=jget(SENTK,null);
  if(!row){pulled=true;pending=null;if(rev)LS.removeItem(REVK);if(hasLocalState()){markDirty();push().catch(()=>{});}return false;}
  if(sent&&+row.client_ts===+sent.ts){LS.removeItem(SENTK);lset(REVK,row.rev);setBase(sent.st);pulled=true;pending=null;if(LS.getItem(DIRTYK))push().catch(()=>{});return false;} // to nasz zapis (odpowiedź zginęła)
  if(+row.rev===rev){pulled=true;pending=null;if(LS.getItem(DIRTYK))push().catch(()=>{});return false;}
  if(!hasLocalState()){ // świeże urządzenie: stan z chmury wprost
    const st={progress:obj(row.progress),meta:obj(row.meta)};jset(PK,st.progress);jset(MK,st.meta);lset(REVK,row.rev);setBase(st);
    pulled=true;pending=null;if(apply)try{apply();}catch(e){}return true;}
  return applyRow(row,canApply,apply);

function applyRow(row,canApply,apply){ // synchronicznie: sprawdzenie, zapis i przeładowanie silnika w jednym kroku — silnik nie zdąży nadpisać scalonego stanu

  const cl={progress:obj(row.progress),meta:obj(row.meta)};

  if(apply)try{apply();}catch(e){}

const mimeOf=f=>{const t=String(f&&f.type||'').toLowerCase(),e=EXT_MIME[extOf(f)]; // pusty albo ogólny typ (Pliki na iOS potrafią podać octet-stream/zip dla .pptx) → po rozszerzeniu
  return (!t||((t==='application/octet-stream'||t==='application/zip'||t==='application/x-zip-compressed')&&e))?(e||''):t;};
async function downscale(file){ // maks. 1568 px, JPEG — mniejszy upload, bez EXIF (GPS), HEIC → JPEG, przezroczystość na białym tle
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,1568/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*k));c.height=Math.max(1,Math.round(img.naturalHeight*k));
    const ctx=c.getContext('2d');if(!ctx)return null;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);

async function prepareFiles(files){ // przed utworzeniem przedmiotu: format i rozmiar znane, zanim cokolwiek zapiszemy
  const out=[];for(const f of files){let mime=mimeOf(f),blob=f;

    if(!OK_MIME.test(mime))throw new CloudError(400,'bad_type','Ten format nie jest obsługiwany',{name:f.name||'',heic:/hei[cf]/.test(mime)});
    if(/^image\//.test(mime)&&blob.size>5*1048576)throw new CloudError(400,'file_too_big','Zdjęcie jest za duże',{maxMb:5}); // limit AI na obraz
    out.push({blob,mime,name:String(f.name||'').slice(0,120),size:blob.size||0});}
  return out;
}
async function createSubject(o){const pal=PALETTE[o.color|0]||PALETTE[0];const rows=await rest('subjects',{method:'POST',prefer:'return=representation',body:{owner_id:UID,name:String(o.name||'Nowy przedmiot').slice(0,60),emoji:'📘',stage:STAGE_TO_DB[o.stage]||'inne',accent:pal[0],accent2:pal[0],position:DATA.subjects.length}});
  const s=rows[0];DATA.subjects.push(s);await saveCache();return s;}

function upFail(e){ // błąd wysyłki → kod dla UI; limit generacji jeszcze nietknięty
  if(e.code==='network'||e.code==='file_too_big'||e.status===401||/^(no_session|upload_failed)$/.test(e.code))return e;
  if(e.status===413||/maximum (allowed )?size|too large|entity_too_large/i.test(String(e.message||'')+' '+String(e.code||'')))return new CloudError(413,'file_too_big','Plik jest za duży',{});

}
async function uploadMaterial(p,onProgress){ // p z prepareFiles; onProgress(wysłane bajty, wszystkie) — duże pliki kawałkami, małe jednym żądaniem

    else{await storageUpload(path,p.blob,p.mime);if(onProgress)try{onProgress(size,size);}catch(e){}}}

  catch(e){storageRemove([path]).catch(()=>{});throw upFail(e);} // wiersz materiału nie powstał — generowanie nie ruszyło, limit nietknięty
}
async function discard(o){ // sprzątanie po nieudanej próbie (generowanie na pewno nie ruszyło albo skończyło się błędem): pliki, wiersze materiałów, pusty nowy przedmiot

  const d=obj(r.data);

async function recoverJob(){ // po powrocie apki / starcie: czy przerwana generacja jednak się udała; chwilowy brak sieci nie przerywa sprawdzania
  const j=job();if(!j)return null;
  if(!j.subjectId||!(Date.now()-(+j.startedAt||0)<86400000)){LS.removeItem(JOBK);return null;} // stary albo uszkodzony dziennik nie blokuje dodawania
  if(j.topicId){let t;try{t=await addTopic(j.topicId);}catch(e){if(e.status>=400&&e.status<500&&e.status!==401)LS.removeItem(JOBK);throw e;}LS.removeItem(JOBK);emit('job',{state:'done',topic:t});return t;}
  const since=j.prevAt?'&created_at=gt.'+encodeURIComponent(j.prevAt):j.prevOk?'':'&created_at=gte.'+encodeURIComponent(new Date(j.startedAt-120000).toISOString()); // bez zegara urządzenia, gdy wiemy, że wcześniej nic nie było
  const ids='&material_ids=eq.'+encodeURIComponent('{'+arr(j.materialIds).join(',')+'}');
  for(;;){
    const age=(Date.now()-j.startedAt)/1000;let g=null;
    try{const rows=await rest('generations?select=id,status,topic_id,error,created_at&subject_id=eq.'+j.subjectId+ids+since+'&order=created_at.desc&limit=1');g=rows&&rows[0]||null;}
    catch(e){if(e.code!=='network'||age>330)throw e;emit('job',{state:'offline',age});await sleep(8000);continue;}
    if(g&&g.status==='done'&&g.topic_id){jset(JOBK,{...j,topicId:g.topic_id});const t=await addTopic(g.topic_id);LS.removeItem(JOBK);emit('job',{state:'done',topic:t});return t;}
    if(g&&g.status==='failed'){LS.removeItem(JOBK);emit('job',{state:'failed',error:g.error});throw new CloudError(500,'generation_failed','',{});}
    if(!g&&age>90){LS.removeItem(JOBK);emit('job',{state:'lost'});throw new CloudError(0,'not_started','Generowanie nie ruszyło',{});} // POST nie dotarł do serwera — limit bez zmian
    if(age>330){LS.removeItem(JOBK);emit('job',{state:'lost'});throw new CloudError(504,'lost','Generowanie nie dokończyło się');}
    emit('job',{state:'running',age});await sleep(8000);
  }
}

const LEVEL_NAME={podstawowka:'Podstawówka',liceum:'Liceum / technikum',studia:'Studia',inne:'Inne'}; // podstawowka: tylko dla starych zapisów (w wyborze jej nie ma, 16+)
const GOAL_NAME={sprawdziany:'kartkówki i sprawdziany','matura-p':'matura podstawowa','matura-r':'matura rozszerzona',olimpiada:'olimpiada',sesja:'sesja i kolokwia',wlasny:'własny cel'};
/* META z konta jest niezaufany: etap i cel tylko z kluczy słowników, liczby jako liczby, daty jako yyyy-mm-dd (inaczej wpis wypada) */
function fixMeta(m){
  if(m.level==='podstawowka')m.level='inne'; // od 3.0 apka jest 16+ — stary etap „podstawówka” traktujemy jak „coś innego”
  if(m.level!=null&&!own(LEVEL_NAME,m.level))delete m.level;if(m.goal!=null&&!own(GOAL_NAME,m.goal))delete m.goal;
  ['streak','best','bestWas','freezes'].forEach(k=>{if(m[k]!=null){if(num(m[k]))m[k]=Math.max(0,Math.floor(m[k]));else delete m[k];}});
  ['lastDay','streakCeleb','comebackShown','weeklyShown'].forEach(k=>{if(m[k]!=null&&!isDate(m[k]))delete m[k];});
  if(m.frozenDays!=null)m.frozenDays=Array.isArray(m.frozenDays)?m.frozenDays.filter(isDate).slice(-14):[];
  if(m.ms!=null&&(typeof m.ms!=='object'||Array.isArray(m.ms)))delete m.ms;
  if(m.reduceMotion!=null)m.reduceMotion=!!m.reduceMotion;
  return m;
}
function loadMeta(){try{const m=JSON.parse(STORE.getItem(MKEY)||'{}');return m&&typeof m==='object'&&!Array.isArray(m)?fixMeta(m):{};}catch(e){return {};}}
let META=loadMeta();
function saveMeta(){try{STORE.setItem(MKEY,JSON.stringify(META));}catch(e){}hook('saved');}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return dstr(new Date());}
function dayDiff(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}
/* aktualna „żywa” seria do wyświetlenia (0 jeśli wygasła) */
function streakDisplay(){ if(!META.lastDay)return 0; const d=dayDiff(META.lastDay,todayStr()); return (d===0||d===1)?(META.streak|0):0; }
/* odnotuj aktywność dziś; zwraca true gdy seria została dziś przedłużona/zaczęta */
function touchStreak(){
  const t=todayStr();
  if(META.lastDay===t)return false; // już policzone dzisiaj
  if(META.lastDay){const d=dayDiff(META.lastDay,t); META.streak=(d===1)?(META.streak||0)+1:1;}
  else META.streak=1;
  META.bestWas=META.best||0; META.lastDay=t; META.best=Math.max(META.bestWas,META.streak); saveMeta();
  msAward(); // kamienie milowe: gemy/zamrożenia raz na próg
  missionEvent('day',1);checkBadges(); // krok 8
  return true;
}

/* ---------- krok 9: wersja, dziennik dni (podsumowanie tygodnia), cel dzienny, poprawki pytań ----------
   PROGRESS.history["yyyy-mm-dd"]={xp,levels,cards,reviews,combo,missions} — dopisują addXP / finishLesson / srsTouch / albumCheck / claimMission.
   PROGRESS.goal = cel dzienny XP (50/100/200), kopiowany do PROGRESS.daily.goal przy układaniu dnia. PROGRESS.overrides["sid:lid:qi"]={q,a,c,e}. */
const VERSION='3.0';
function history(){if(!PROGRESS.history||typeof PROGRESS.history!=='object')PROGRESS.history={};return PROGRESS.history;}
function histDay(ds){const H=history();const d=ds||todayStr();if(!H[d]){H[d]={xp:0,levels:0,cards:0,reviews:0,combo:0,missions:0};const ks=Object.keys(H).sort();if(ks.length>120)ks.slice(0,ks.length-120).forEach(k=>{delete H[k];});}return H[d];}
function histAdd(k,n){const h=histDay();h[k]=(h[k]|0)+(n==null?1:n);saveProgress();}
function histMax(k,n){const h=histDay();if(n>(h[k]|0)){h[k]=n;saveProgress();}}
const GOALS_XP=[[50,'Spokojnie','5 minut'],[100,'Normalnie','10 minut'],[200,'Solidnie','20 minut']];
function goalXP(){const g=PROGRESS.goal|0;return g>0?g:100;}
function setGoal(g){PROGRESS.goal=g;if(PROGRESS.daily)PROGRESS.daily.goal=g;saveProgress();}
function overrides(){if(!PROGRESS.overrides||typeof PROGRESS.overrides!=='object')PROGRESS.overrides={};return PROGRESS.overrides;}
function ovKey(sid,lid,qi){return sid+':'+lid+':'+qi;}
/* pytanie z poziomu z nałożoną poprawką użytkownika (EditContent) — jedno źródło dla lekcji, quizu, egzaminu, bossa, powtórki i cramu */
function qOf(s,lv,qi,pm){const q=(lv.quiz||[])[qi];if(!q)return q;const o=overrides()[ovKey(s.id,lv.id,qi)];
  // poprawka to surowy tekst (także z synchronizacji — niezaufana): zawsze escapowana przy nakładaniu, c sprawdzone względem liczby odpowiedzi
  return mixQ(ovOk(o)?{...q,q:esc(o.q),a:o.a.map(esc),c:o.c,e:esc(o.e||''),edited:true}:q,pm);}
/* odpowiedzi w losowej kolejności (w danych poprawna to zwykle B); pm = permutacja — podana zachowuje układ z ekranu (np. po poprawce) */
function mixQ(q,pm){const a=q.a;if(!Array.isArray(a)||!(q.c>=0&&q.c<a.length))return q;
  if(!Array.isArray(pm)||pm.length!==a.length){pm=a.map((_,i)=>i);for(let i=pm.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pm[i],pm[j]]=[pm[j],pm[i]];}}
  return {...q,a:pm.map(i=>a[i]),c:pm.indexOf(q.c),pm};}

}

function dateHeader(){const d=new Date();return DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()];}
function pl(n,one,few,many){n=Math.abs(n);if(n===1)return one;const m10=n%10,m100=n%100;return (m10>=2&&m10<=4&&(m100<12||m100>14))?few:many;}
function fmtNum(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}

function hasProgress(s){const st=PROGRESS[s.id];return !!st&&(((st.xp||0)>0)||Object.values(st.levels||{}).some(l=>l&&l.done));}

/* --- plan dnia: PROGRESS.daily = {date, goal, xp, tasks:[{id, done, need?, prog?}]} (DESIGN.md §4.3, ten sam klucz) --- */
const REWARD={lesson:15,review:20,quiz:25,exam:40,weak:20};
function daily(){
  const t=todayStr();let d=PROGRESS.daily;
  if(!d||d.date!==t||!Array.isArray(d.tasks)){syncTests();d=PROGRESS.daily={date:t,goal:goalXP(),xp:0,tasks:buildDailyTasks()};saveProgress();} // krok 7: nowy dzień = przeliczenie planów do sprawdzianu; krok 9: cel z PROGRESS.goal
  else if(SUBJECTS.length){ // plan z innego pliku (build/<id>.html) albo zastępczy (bez postępów), a użytkownik zaczął inny przedmiot → zadania bieżących przedmiotów
    const here=d.tasks.map(x=>SUBJECTS.find(s=>s.id===x.id.split(':')[0])).filter(Boolean);
    if(!here.length||(!here.some(hasProgress)&&SUBJECTS.some(hasProgress))){const add=buildDailyTasks().filter(x=>!d.tasks.some(y=>y.id===x.id));
      if(add.length){d.tasks=d.tasks.filter(x=>{const s=SUBJECTS.find(z=>z.id===x.id.split(':')[0]);return x.done||!s||hasProgress(s);}).concat(add);saveProgress();}}
  }
  return d;
}
function buildDailyTasks(){
  let subs=SUBJECTS.filter(hasProgress);
  if(!subs.length){const mine=SUBJECTS.filter(s=>subjLevel(s)===META.level);subs=(mine.length?mine:SUBJECTS).slice(0,1);} // bez postępów: pierwszy przedmiot z etapu użytkownika
  subs=[...subs].sort((a,b)=>((PROGRESS[b.id]||{}).xp||0)-((PROGRESS[a.id]||{}).xp||0)).slice(0,2); // plan z 2 przedmiotów o największym XP
  const tasks=[];
  subs.forEach((s,i)=>{
    const st=subjState(s.id);
    const open=s.levels.find((l,i)=>levelUnlocked(s,i)&&!(st.levels[l.id]||{}).done);
    if(open)tasks.push({id:s.id+':lesson:'+open.id,done:false});
    const n=Math.min(12,allCards(s).length);
    if(n)tasks.push({id:s.id+':review',done:false,need:n,prog:0});
    const doneLv=[...s.levels].reverse().find(l=>(st.levels[l.id]||{}).done)||s.levels[0];
    if(doneLv&&(doneLv.quiz||[]).length)tasks.push({id:s.id+':quiz:'+doneLv.id,done:false});
    if(!i&&allQuiz(s).length>=5)tasks.push({id:s.id+':exam',done:false}); // egzamin tylko dla głównego przedmiotu
    if(hasDeck(s.id))tasks.push({id:s.id+':weak',done:false}); // krok 7: talia błędów z ostatniego egzaminu
  });
  return tasks;
}
/* opis zadania z jego id (etykiety liczone z danych, więc w storage siedzi tylko id + done) */
function taskInfo(t){
  const parts=t.id.split(':');const sid=parts[0],kind=parts[1],lvId=parts[2];
  const s=SUBJECTS.find(x=>x.id===sid);if(!s)return null;
  const lv=lvId?s.levels.find(l=>l.id===lvId):null;
  const short=s.short||s.name;const base={t,s,kind,reward:REWARD[kind]||0};
  const openAt=(tab,setup)=>()=>openSubject(sid,tab,setup);
  if(kind==='lesson'){if(!lv)return null;const nf=(lv.feed||[]).length,nq=(lv.quiz||[]).length,nt=(lv.tasks||[]).filter(t=>t&&TASKS[t.type]).length;
    return {...base,icon:'book',title:'Roladka — '+noEmoji(lv.title),sub:`${nf} ${pl(nf,'dawka','dawki','dawek')} · ${nq} ${pl(nq,'pytanie','pytania','pytań')}${nt?` · ${nt} ${pl(nt,'zadanie','zadania','zadań')}`:''} · +15`,go:openAt('path')};}
  if(kind==='review'){const n=t.need||12,p=t.prog||0;const due=srsDue().filter(x=>x.s.id===sid).length;
    return {...base,icon:'refresh',title:`Powtórka — ${n} ${pl(n,'fiszka','fiszki','fiszek')}`,sub:p?`${p} z ${n} przejrzane · +20`:`${short} · ${due?due+' do powtórki dziś':Math.max(1,Math.round(n/4))+' min'} · +20`,
      go:()=>{const mine=srsDue().filter(x=>x.s.id===sid);if(mine.length)startReview(mine);else openAt('fiszki')();}};} // powtórka albo fiszki tego przedmiotu
  if(kind==='quiz'){if(!lv)return null;const n=(lv.quiz||[]).length,m=Math.max(1,Math.round(n*0.5));
    return {...base,icon:'question',title:'Quiz — '+noEmoji(lv.title),sub:`${n} ${pl(n,'pytanie','pytania','pytań')} · ${short} · ${m} min · +25`,
      go:openAt('quiz',()=>{qState={subj:sid,lvl:lv.id,list:null,idx:0,score:0,answered:false};})};}
  if(kind==='exam'){const N=Math.min(20,allQuiz(s).length);
    return {...base,icon:'file',title:'Egzamin próbny',sub:`${N} ${pl(N,'pytanie','pytania','pytań')} · opcjonalnie · +40`,go:openAt('egzamin')};}
  if(kind==='weak'){const n=deckKeys(sid).filter(k=>srsResolve(k)).length;if(!n&&!t.done)return null; // krok 7: talia błędów z egzaminu
    return {...base,icon:'alert',title:'Powtórz błędy z egzaminu',sub:`${n} ${pl(n,'pytanie','pytania','pytań')} · ${short} · +20`,go:()=>startExamDeck(sid)};}
  return null;
}
/* zaliczenie zadania: lesson (z id poziomu), quiz / exam / review (po przedmiocie); nagroda idzie przez addXP */
function completeDaily(sid,kind,lvId){
  const d=daily();const pre=sid+':'+kind;
  const t=d.tasks.find(x=>!x.done&&(lvId?x.id===pre+':'+lvId:(x.id===pre||x.id.indexOf(pre+':')===0)));
  if(!t)return false;
  t.done=true;saveProgress();
  const r=REWARD[kind]||0;if(r)addXP(sid,r);
  setTimeout(()=>toast('Plan dnia: +'+r+' XP','bolt'),3200);
  planCheck(d); // krok 8: cały plan zrobiony → +5 gemów, misja „plan”
  return true;
}
function tickDaily(sid,kind,n){
  const d=daily();const t=d.tasks.find(x=>!x.done&&x.id===sid+':'+kind);if(!t)return;
  t.prog=(t.prog||0)+(n||1);
  if(t.prog>=(t.need||1))completeDaily(sid,kind);else saveProgress();
}

/* kostki aktywności: 8 kolumn (tygodnie, od najstarszego) × 7 dni (pn–nd); „on” = dzień w bieżącej serii z nauka_meta_v1, przyszłość wyszarzona */
function heatmap(){
  const t=todayStr();const now=new Date();const dow=(now.getDay()+6)%7;
  const n=streakDisplay(),last=META.lastDay;
  const box=el('div','heat a-up d2');box.setAttribute('aria-label','Aktywność w ostatnich 8 tygodniach');
  for(let w=0;w<8;w++){
    const col=el('div','col');
    for(let d=0;d<7;d++){
      const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow-(7-w)*7+d);const ds=dstr(dt);const toToday=dayDiff(ds,t);
      let cls='';if(toToday<0)cls='future';else if(n>0&&last){const off=dayDiff(ds,last);if(off>=0&&off<n)cls='on';}
      if(toToday===0)cls+=' today';
      col.appendChild(el('i',cls.trim()));
    }
    box.appendChild(col);
  }
  return box;
}
