.qatest .ic{color:var(--red-soft);flex:none}
.qatest span{flex:1;min-width:0}
.qatest .chev{color:var(--muted);color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.bandtest{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;min-height:40px;padding:6px 12px;border-radius:14px;background:var(--tint-red);border:2px solid var(--tint-red-line);color:var(--txt);color:color-mix(in srgb,var(--red) 20%,var(--txt));font-family:var(--font-body);font-size:12.5px;font-weight:800;cursor:pointer;text-align:left}
.bandtest .ic{color:var(--red-soft);flex:none}
.bandtest small{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:var(--muted);color:color-mix(in srgb,var(--red) 40%,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandtest .chev{color:var(--muted);color:color-mix(in srgb,var(--red) 40%,var(--muted))}

/* ============================================================
   KROK 8 — GAMIFIKACJA (DESIGN.md §4.5, §6 pkt 8): gemy i Plecak (Shop.html), Misje (Missions.html), zamrożenia serii (Streak.html),
   ComeBack.html, Album pojęć (Album.html), Boss rozdziału (Boss.html), Duch (Ghost.html), odznaki (Profile.html), NoHearts za gemy.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez klasy .a-*.
   ============================================================ */
/* pigułka gemów: w pasku Dziś (→ Plecak) i w pasie przedmiotu */
.streak.gems{color:var(--cyan);color:color-mix(in srgb,var(--cyan) 55%,var(--txt));cursor:pointer;transition:transform .08s}
.streak.gems:active{transform:translateY(2px)}
.band .streak.gems{padding:7px 10px 7px 8px;font-size:13px;min-height:40px}
.pills .streak{padding:7px 10px 7px 9px;font-size:13.5px}
.ic-violet{color:var(--violet)}.ic-pink{color:var(--pink)}.ic-palette{color:var(--violet)}
.ic .eye{fill:var(--bg)}.ic .mouth{fill:none;stroke:var(--bg);stroke-width:1.6;stroke-linecap:round}
.toast .ic.a-pop{animation-duration:.5s}
.minitiles .minitile{padding:10px 9px;gap:6px;font-size:12px;white-space:nowrap}
.minitile.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:var(--txt);color:color-mix(in srgb,var(--cyan) 35%,var(--txt))}
.combo.boost{background:var(--tint-gold);color:var(--gold);border:2px solid var(--tint-gold-line)}
/* motyw (Plecak): kolor rozmytego koła na ekranie Dziś */
.blob.th-cyan{background:var(--bg);background:color-mix(in srgb,var(--cyan) 18%,var(--bg))}
.blob.th-pink{background:var(--bg);background:color-mix(in srgb,var(--pink) 20%,var(--bg))}
.blob.th-gold{background:var(--bg);background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.blob.th-amber{background:var(--bg);background:color-mix(in srgb,var(--amber) 18%,var(--bg))}
.blob.gold{top:-110px;right:-80px;width:260px;height:260px;background:var(--tint-gold)}
.shop,.missions,.album,.comeback{padding-bottom:30px}
.shop>*,.missions>*,.album>*{flex:none} /* dzieci kolumny flex nie kurczą się (chipy z overflow-x, notka) */

/* Plecak (Shop.html): wiersze w tintach z kaflem ikony i przyciskiem ceny 3D */
.shop{display:flex;flex-direction:column;gap:13px;padding-top:14px}
.shoprow{display:flex;align-items:center;gap:14px;border-radius:24px;padding:15px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--shadow)}
.shoprow .ico{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--txt)}
.shoprow .grow{flex:1;min-width:0}
.shoprow .t{font-size:15px;font-weight:800}
.shoprow .s{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.shoprow .buy{flex:none;display:inline-flex;align-items:center;gap:5px;border:none;border-radius:14px;padding:11px 14px;min-height:44px;font-family:var(--font-body);font-size:13px;font-weight:800;cursor:pointer;transition:transform .08s,box-shadow .08s;background:var(--acid);color:var(--on-acid);box-shadow:0 4px 0 var(--acid-dark)}
.shoprow .buy:active{transform:translateY(4px);box-shadow:none}
.shoprow .buy.short{background:var(--surface-2);color:var(--muted-2);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.shoprow .buy.owned{background:var(--line-2);color:var(--muted);box-shadow:none;cursor:default}
.shoprow.red{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 5px 0 var(--tint-red);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.shoprow.red .ico{background:var(--red);color:var(--on-red)}.shoprow.red .t{color:var(--txt);color:color-mix(in srgb,var(--red) 20%,var(--txt))}.shoprow.red .s{color:var(--muted);color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.shoprow.red .buy:not(.short):not(.owned){background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-dark)}
.shoprow.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);box-shadow:0 5px 0 var(--tint-cyan);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg))}
.shoprow.cyan .ico{background:var(--cyan);color:var(--on-cyan)}.shoprow.cyan .t{color:var(--txt);color:color-mix(in srgb,var(--cyan) 25%,var(--txt))}.shoprow.cyan .s{color:var(--muted);color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.shoprow.cyan .buy:not(.short):not(.owned){background:var(--cyan);color:var(--on-cyan);box-shadow:0 4px 0 var(--cyan-dark)}
.shoprow.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);box-shadow:0 5px 0 var(--tint-gold);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}
.shoprow.gold .ico{background:var(--gold);color:var(--on-gold)}.shoprow.gold .t{color:var(--txt);color:color-mix(in srgb,var(--gold) 25%,var(--txt))}.shoprow.gold .s{color:var(--muted);color:color-mix(in srgb,var(--gold) 45%,var(--muted))}
.shoprow.gold .buy:not(.short):not(.owned){background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-dark)}
.shoprow.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);box-shadow:0 5px 0 var(--tint-pink);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg))}
.shoprow.violet .ico{background:var(--violet);color:var(--on-violet)}.shoprow.violet .s{color:var(--violet-soft)}
.shoprow.violet .buy:not(.short):not(.owned){background:var(--violet);color:var(--on-violet);box-shadow:0 4px 0 var(--violet-dark)}
.themechips{display:flex;gap:7px;flex-wrap:wrap;margin-top:-3px}
.themechip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;font-family:var(--font-body);cursor:pointer}
.themechip i{width:14px;height:14px;border-radius:5px;background:var(--sw,var(--violet))}
.themechip.on{border-color:var(--sw,var(--violet));color:var(--txt)}
.setrow .v.cyan{color:var(--cyan);color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}

/* Misje (Missions.html) */
.missions{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.msh{min-height:auto}
.msleft{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.msleft .ic{color:var(--muted)}
.msrows{display:flex;flex-direction:column;gap:11px}
.msrow{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--shadow)}
.msrow .mstop{display:flex;align-items:center;gap:13px}
.msrow .ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--muted)}
.msrow .grow{flex:1;min-width:0}
.msrow .t{font-size:14px;font-weight:800}
.msrow .s{font-size:12px;font-weight:700;color:var(--muted);margin-top:3px}
.msrow .rw{display:flex;align-items:center;gap:4px;flex:none;font-size:13px;font-weight:800;color:var(--cyan);color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}
.msrow .rw .ic{color:var(--cyan)}
.msrow .bar{margin-top:12px}
.msrow.acid .ico{background:var(--tint-acid);color:var(--acid)}.msrow.acid .bar i{background:var(--acid)}
.msrow.pink .ico{background:var(--tint-pink);color:var(--pink)}.msrow.pink .bar i{background:var(--pink)}
.msrow.cyan .ico{background:var(--tint-cyan);color:var(--cyan)}.msrow.cyan .bar i{background:var(--cyan)}
.msrow.gold .ico{background:var(--tint-gold);color:var(--gold)}.msrow.gold .bar i{background:var(--gold)}
.msrow.amber .ico{background:var(--tint-amber);color:var(--flame)}.msrow.amber .bar i{background:var(--amber)}
.msrow.ready{border-color:var(--acid)}
.msrow .claim{flex:none;min-height:44px;padding:0 16px;border:none;border-radius:14px;background:var(--acid);color:var(--on-acid);font-family:var(--font-body);font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 0 var(--acid-dark);cursor:pointer;transition:transform .08s,box-shadow .08s}
.msrow .claim:active{transform:translateY(4px);box-shadow:none}
.msrow.weekly{background:var(--tint-gold);border-color:var(--tint-gold-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 var(--tint-gold);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}
.msrow.weekly .ico{width:54px;height:54px;border-radius:17px;background:var(--gold);color:var(--on-gold)}
.msrow.weekly .t{font-size:15px;color:var(--txt);color:color-mix(in srgb,var(--gold) 25%,var(--txt))}
.msrow.weekly .s{font-size:12.5px;color:var(--muted);color:color-mix(in srgb,var(--gold) 45%,var(--muted))}
.msrow.weekly .bar{height:12px;background:var(--tint-gold);background:color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}.msrow.weekly .bar i{background:var(--gold)}
.msrow.done{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 var(--tint-acid);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.msrow.done .ico{background:var(--acid);color:var(--on-acid)}
.msrow.done .t{color:var(--txt);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.msrow.done .s{color:var(--acid-soft)}
.msnote{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px dashed var(--line-dash);border-radius:20px;padding:13px 15px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.msnote .ic{color:var(--muted-2);flex:none}
.msfoot{padding:6px 0 8px}

/* Seria: karta zamrożeń (Streak.html), dzień uratowany zamrożeniem w kropkach tygodnia */
.freezecard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--tint-cyan);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg));margin-top:14px;color:var(--txt);font-family:var(--font-body);cursor:pointer;transition:transform .08s;position:relative;z-index:1}
.freezecard:active{transform:translateY(3px)}
.freezecard .ico{width:44px;height:44px;border-radius:14px;background:var(--cyan);color:var(--on-cyan);display:flex;align-items:center;justify-content:center;flex:none}
.freezecard .grow{flex:1;min-width:0}
.freezecard .t{font-size:14.5px;font-weight:800}
.freezecard .s{font-size:12.5px;font-weight:600;color:var(--muted);color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:2px}
.freezecard .chev{color:var(--muted);color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.day.frozen .dot{background:var(--cyan);color:var(--on-cyan)}

/* ComeBack.html: ciepły powrót po ≥ 3 dniach */
.comeback{display:flex;flex-direction:column;gap:16px;padding:30px 22px 26px;min-height:100%}
.comeback>*{flex:none}
.cbart{display:flex;justify-content:center}
.cbico{width:104px;height:104px;border-radius:34px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted-2)}
.cbtxt{text-align:center}
.cbtxt h1{font-size:30px;letter-spacing:-1.1px;line-height:1.08}
.cbtxt p{font-size:14px;font-weight:600;color:var(--muted);margin-top:9px;line-height:1.5}
.cbstreak{display:flex;align-items:center;gap:14px;background:var(--tint-amber);border:2px solid var(--tint-amber-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 var(--tint-amber);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-amber) 60%,var(--bg))}
.cbstreak>.ic{color:var(--tint-amber-line);flex:none}
.cbstreak .grow{flex:1;min-width:0}
.cbstreak .t{font-size:14.5px;font-weight:800;color:var(--txt);color:color-mix(in srgb,var(--amber) 25%,var(--txt))}
.cbstreak .nums{display:flex;align-items:center;gap:9px;margin-top:4px;font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1}
.cbstreak .old{color:var(--muted-2);text-decoration:line-through}
.cbstreak .nums .ic{color:var(--muted-2)}
.cbstreak .new{color:var(--amber)}
.cbdue{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:17px;box-shadow:0 5px 0 var(--shadow)}
.cbdue .hd{display:flex;align-items:center;justify-content:space-between}
.cbdue .hd b{font-size:12px;font-weight:800;color:var(--red-soft)}
.cbdue .sp{margin-top:8px}
.cbdue .row{display:flex;align-items:center;gap:12px;margin-top:11px}
.cbdue .lb{flex:none;width:84px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbdue .bar{flex:1;height:12px}
.cbdue .n{flex:none;width:40px;text-align:right;font-size:12px;font-weight:800;color:var(--muted)}
.cbdue .row.r1 .bar i{background:var(--red)}.cbdue .row.r2 .bar i{background:var(--gold)}.cbdue .row.r3 .bar i{background:var(--acid)}
.cbwarm{display:flex;align-items:center;gap:13px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 var(--tint-acid);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.cbwarm .ico{width:46px;height:46px;border-radius:15px;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;flex:none}
.cbwarm .grow{flex:1;min-width:0}
.cbwarm .t{font-size:15px;font-weight:800;color:var(--txt);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.cbwarm .s{font-size:12.5px;font-weight:600;color:var(--acid-soft);margin-top:3px;line-height:1.4}
.cbfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}

/* Album pojęć (Album.html): chipy przedmiotów, siatka 3 kolumn, rzadkość kolorem, zablokowane jako sylwetki */
.album{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.albhead{display:flex;flex-direction:column;gap:8px}
.albhead .bar{height:12px}.albhead .bar i{background:var(--acid)}
.albpct{font-size:12px;font-weight:800;color:var(--acid)}
.albchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.albchips::-webkit-scrollbar{display:none}
.albchip{flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;font-family:var(--font-body);cursor:pointer;white-space:nowrap}
.albchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.albgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.alb{position:relative;aspect-ratio:3/4;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:2px solid var(--line-dash);box-shadow:0 4px 0 var(--shadow);text-align:left;font-family:var(--font-body);color:var(--muted);cursor:pointer;transition:transform .08s;min-height:44px;overflow:hidden}
.alb:active{transform:translateY(3px)}
.alb .sw{width:26px;height:26px;border-radius:9px;background:var(--line-dash);flex:none}
.alb .t{font-size:12px;font-weight:800;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.alb .d{display:none;font-size:10.5px;font-weight:600;line-height:1.3;color:var(--txt-2);overflow:hidden}
.alb.flip .t,.alb.flip .sw{display:none}
.alb.flip .d{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical}
.alb.rare{background:var(--tint-cyan);border-color:var(--cyan);color:var(--cyan);color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}.alb.rare .sw{background:var(--cyan)}
.alb.epic{background:var(--tint-gold);border-color:var(--gold);color:var(--gold);color:color-mix(in srgb,var(--gold) 60%,var(--txt))}.alb.epic .sw{background:var(--gold)}
.alb.lock{background:var(--surface-2);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;color:var(--muted-3);cursor:default}
.alb .new{position:absolute;top:6px;right:6px;padding:3px 8px;border-radius:var(--r-chip);background:var(--pink);color:var(--on-pink);font-size:9.5px;font-weight:800;letter-spacing:1px}
.alblegend{display:flex;gap:14px;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.alblegend span{display:flex;align-items:center;gap:6px}
.alblegend i{width:10px;height:10px;border-radius:3px;background:var(--line-dash)}
.alblegend i.rare{background:var(--cyan)}.alblegend i.epic{background:var(--gold)}
.albnote{text-align:center}

/* Boss rozdziału (Boss.html): węzeł na ścieżce, potwór w kolorze przedmiotu, pasek życia, cios / pudło */
.boss .b1{fill:var(--accent);stroke:var(--accent-dark);stroke-width:6}
.boss .b2{fill:var(--accent-dark)}
.boss .b3{fill:none;stroke:var(--on-accent);stroke-width:6;stroke-linecap:round}
.boss .b4{fill:var(--txt)}
.boss .b6{fill:var(--on-accent)}
.boss .b5{fill:none;stroke:var(--on-accent);stroke-width:5;stroke-linecap:round}
.node-boss{width:84px;height:84px;border-radius:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--drop-node) 0 var(--shadow);position:relative}
.node-boss .boss{display:block}
.node-boss.locked .boss .b1{fill:var(--line-2);stroke:var(--line)}
.node-boss.locked .boss .b2{fill:var(--surface-2)}
.node-boss.locked .boss .b4{fill:var(--muted-3)}
.node-boss.locked .boss .b3,.node-boss.locked .boss .b5{stroke:var(--surface)}
.node-boss.locked .boss .b6{fill:var(--surface)}
.node-boss.open{background:var(--accent-tint);border-color:var(--accent);box-shadow:0 var(--drop-node) 0 var(--accent-dark)}
.node-boss.beaten{background:var(--accent-tint);border-color:var(--accent-tint-line)}
.node-boss .won,.lcbig.boss .won{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--acid-dark)}
.node-boss:active{transform:translateY(3px)}
.pathnode:has(.node-boss.open) .nodelabel{color:var(--acid)}
.bossrun .bosshead{padding:14px 18px 0}
.bosslbl{flex:1;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--violet-soft)}
.bosshero{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 18px 0}
.bossav{position:relative}
.bossav .boss{display:block}
.bosshit{position:absolute;top:-4px;right:-30px;padding:5px 11px;border-radius:var(--r-chip);background:var(--red);box-shadow:0 4px 0 var(--red-dark);color:var(--on-red);font-size:15px;font-weight:800}
.bossname{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px}
.bosshp{width:100%;display:flex;align-items:center;gap:10px}
.bosshp .bar{flex:1;height:16px;border:2px solid var(--line-dash);background:var(--line-2)}
.bosshp .bar i{background:var(--red);transition:width .35s}
.bosshp span{font-size:13px;font-weight:800;color:var(--red-soft);white-space:nowrap}
.bossq{display:flex;align-items:center;justify-content:space-between;margin-bottom:-8px}
.bossq .eyebrow{font-size:11px}
.bosstime{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--amber-soft)}
.bosstime.warn{color:var(--red-soft)}
.bossrun .lessonbody{padding-top:10px}
.bossrun .quiz .qq{font-size:20px}
.bossrun .qopt{min-height:54px;padding:11px 14px}
.bossrun .lessonfoot{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.bossnote{font-size:12px;font-weight:700;color:var(--muted-2);text-align:center}
.bossexp{position:relative;z-index:2;margin-top:10px;background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45;color:var(--txt);color:color-mix(in srgb,var(--red) 20%,var(--txt));flex:none}
.bossexp b{color:var(--red-soft)}
.lcbig.boss{background:var(--accent-tint);border:3px solid var(--accent);box-shadow:0 8px 0 var(--accent-dark);position:relative}
.lcbig.boss.lost{border-color:var(--red);box-shadow:0 8px 0 var(--red-dark)}
.lcrewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lcreward{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);font-size:12.5px;font-weight:800;color:var(--txt-2)}
.lcreward.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:var(--gold);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.lcreward.gold .ic{color:var(--gold)}
.lcreward.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:var(--cyan);color:color-mix(in srgb,var(--cyan) 55%,var(--txt))}.lcreward.cyan .ic{color:var(--cyan)}
.lcreward.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);color:var(--violet-soft)}.lcreward.violet .ic{color:var(--violet)}

/* Duch (Ghost.html): karta wyścigu nad pytaniem, wiersz na ekranie wyniku */
.ghostcard{position:relative;z-index:1;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:9px;margin-bottom:12px;flex:none}
.ghrow{display:flex;align-items:center;gap:10px}
.ghrow .av{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acid);color:var(--on-acid);font-size:12px;font-weight:800}
.ghrow.ghost{opacity:.78}
.ghrow.ghost .av{background:var(--violet);color:var(--on-violet)}
.ghrow .grow{flex:1;min-width:0}
.ghrow .lab{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800}
.ghrow .lab span{color:var(--muted)}
.ghrow .bar{height:9px;margin-top:5px}
.ghrow .bar i{background:var(--acid);transition:width .4s}
.ghrow.ghost .bar{background:var(--surface-2);border:1px dashed var(--line-dash)}
.ghrow.ghost .bar i{background:var(--violet)}
.ghnote{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.35}
.ghnote .ic{color:var(--violet);flex:none}
.ghnote.lead{color:var(--acid-soft)}.ghnote.lead .ic{color:var(--acid)}
.lcghost{width:100%;display:flex;align-items:center;gap:13px;background:var(--tint-pink);border:2px solid var(--tint-pink-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--tint-pink);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg));text-align:left}
.lcghost .ico{width:44px;height:44px;border-radius:14px;background:var(--violet);color:var(--on-violet);display:flex;align-items:center;justify-content:center;flex:none}
.lcghost.win{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 var(--tint-acid);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.lcghost.win .ico{background:var(--acid);color:var(--on-acid)}
.lcghost .grow{flex:1;min-width:0}
.lcghost .t{font-size:15px;font-weight:800}
.lcghost .s{font-size:12.5px;font-weight:600;color:var(--violet-soft);margin-top:2px;line-height:1.35}
.lcghost.win .s{color:var(--acid-soft)}

/* Odznaki (Profile.html): siatka 3 kolumn, odblokowane w tintach, zablokowane kreskowane */
.badgegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badgegrid .badge{padding:12px 6px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px}
.badgegrid .badge .ic{margin:0}
.badge.acid{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--acid);color:color-mix(in srgb,var(--acid) 55%,var(--txt))}.badge.acid .ic{color:var(--acid)}
.badge.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:var(--cyan);color:color-mix(in srgb,var(--cyan) 55%,var(--txt))}.badge.cyan .ic{color:var(--cyan)}
.badge.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);color:var(--violet-soft)}.badge.violet .ic{color:var(--violet)}
.badge.pink{background:var(--tint-pink);border-color:var(--tint-pink-line);color:var(--pink);color:color-mix(in srgb,var(--pink) 55%,var(--txt))}.badge.pink .ic{color:var(--pink)}

/* Koniec żyć: „Uzupełnij wszystkie” za gemy (NoHearts.html) */
.nhcard.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);box-shadow:0 5px 0 var(--tint-cyan);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg))}
.nhcard.cyan .ico{background:var(--cyan);color:var(--on-cyan)}
.nhcard.cyan .t{color:var(--txt);color:color-mix(in srgb,var(--cyan) 25%,var(--txt))}
.nhcard.cyan .s{color:var(--muted);color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.nhcard.cyan>svg:last-child{color:var(--muted);color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.nhcard.short{opacity:.72}
.node-chest.opened{opacity:.6;color:var(--muted)}
.bossrun .qchips{display:none} /* w walce liczy się „Cios N” i zegar, chipy sesji są zbędne */

/* ============================================================
   KROK 9 — DOMKNIĘCIE (wersja 2.0): LevelPick.html, Onboarding.html, Catalog.html, Settings.html, ErrorState.html (+ pasek offline),
   SubjectInfo.html, WeeklyStory.html, Cram.html, EditContent.html, SourceView.html, ekran „wymaga wersji online” (ShareClass/League/Friends/
   Scanner/Detected/Generating/Explain). Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez klasy .a-*.
   ============================================================ */
/* wspólne: mały przycisk tekstowy, „Źródło” jako przycisk, cel dzienny na Dziś, udostępnianie w pasie przedmiotu */
.pill.text.sm{min-height:44px;font-size:12.5px;letter-spacing:.4px;text-transform:none;color:var(--muted)}
.pill.ghost.sm{min-height:46px;font-size:13px;letter-spacing:.4px;text-transform:none}
.pill.gold,.lesson .pill.gold:not([disabled]){background:var(--gold);color:var(--on-gold);box-shadow:0 var(--drop-btn) 0 var(--gold-dark)}
.pill.gold:active,.lesson .pill.gold:not([disabled]):active{box-shadow:0 0 0 var(--gold-dark)}
button.rsrc{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;background:none;border:none;padding:8px 0 0;cursor:pointer;font-family:var(--font-body);color:var(--muted-2);font-size:12px;font-weight:600;line-height:1.35;min-height:32px}
button.rsrc .ic{flex:none;margin-top:2px}
button.rsrc span{flex:1;min-width:0}
button.rsrc b{color:var(--muted);font-weight:800}
button.rsrc .chev{color:var(--muted-3)}
.sbox button.rsrc{color:inherit;opacity:.85}
.sbox button.rsrc b{color:inherit}
.egedit{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:36px;padding:0 12px;margin-top:4px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-2);color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:800;cursor:pointer}
.egedit:active{transform:translateY(2px)}
.goalrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:0;min-height:24px;cursor:pointer;font-family:var(--font-body);text-align:left;margin-top:-4px}
.goalrow .bar{flex:1;height:8px}
.goalrow .bar i{background:var(--gold)}
.goalrow span{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.subtab.share{margin-left:auto;color:var(--cyan);border-color:var(--tint-cyan-line);background:var(--tint-cyan)}
.eglast.cram{cursor:pointer;transition:transform .08s;background:var(--tint-pink);border-color:var(--tint-pink-line);box-shadow:0 4px 0 var(--tint-pink);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg))}
.eglast.cram:active{transform:translateY(2px)}
.eglast .ico.violet{background:var(--violet);color:var(--on-violet)}
.eglast.cram .s{color:var(--violet-soft)}

/* pasek offline nad aplikacją (poza #app) */
.netbar{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:560px;z-index:120;display:none;align-items:center;gap:8px;padding:9px 16px;background:var(--tint-amber);border-bottom:2px solid var(--tint-amber-line);color:var(--amber-soft);font-size:12px;font-weight:800;line-height:1.3}
.netbar.on{display:flex}
.netbar .ic{color:var(--amber);flex:none}
/* „postępy się nie zapisują” (STORE w pamięci): ten sam pasek z krzyżykiem; gdy offline, pokazuje się tylko pasek sieci */
.storebar{padding-right:6px}
.storebar .grow{flex:1;min-width:0}
.storebar .sbx{flex:none;width:36px;height:36px;margin:-6px 0;border:none;border-radius:50%;background:none;color:var(--amber-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.netbar.on~.storebar{display:none}

/* pierwsze uruchomienie (LevelPick / Onboarding): kropki kroków, karty opcji z kaflem ikony i kółkiem wyboru, chipy celu */
.ob{display:flex;flex-direction:column;gap:14px;padding:18px 20px 0;min-height:100%}
.ob>*{flex:none}
.obdots{display:flex;gap:8px}
.obdots i{flex:1;height:8px;border-radius:999px;background:var(--line-2)}
.obdots i.on{background:var(--acid-dark)}
.obdots i.cur{background:var(--acid)}
.obhead h1{font-size:34px;letter-spacing:-1.3px;line-height:1.02}
.obhead p{font-size:14.5px;font-weight:700;color:var(--muted);margin-top:10px;line-height:1.45}
.obopts{display:flex;flex-direction:column;gap:12px}
.obopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;min-height:76px;box-shadow:0 5px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.obopt:active{transform:translateY(5px);box-shadow:0 0 0 var(--shadow)}
.obopt .ico{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--txt)}
.obopt.amber .ico{background:var(--amber);color:var(--on-amber)}
.obopt.acid .ico{background:var(--acid);color:var(--on-acid)}
.obopt.pink .ico{background:var(--pink);color:var(--on-pink)}
.obopt.cyan .ico{background:var(--cyan);color:var(--on-cyan)}
.obopt .grow{flex:1;min-width:0}
.obopt .t{font-size:16.5px;font-weight:800}
.obopt .s{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.obopt .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-dash);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-acid)}
.obopt.on{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 5px 0 var(--acid-dark)}
.obopt.on .t{color:var(--acid)}
.obopt.on .s{color:var(--acid-soft)}
.obopt.on .ck{background:var(--acid);border-color:var(--acid)}
.obbar{width:10px;height:32px;border-radius:5px;background:var(--line-dash);flex:none;margin:0 6px 0 2px}
.obopt.on .obbar{background:var(--acid)}
.obeye{margin-top:6px}
.obchips{display:flex;flex-wrap:wrap;gap:9px}
.obchip{min-height:46px;padding:0 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);color:var(--txt-2);font-family:var(--font-body);font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.obchip:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.obchip.on{background:var(--acid);border-color:var(--acid);color:var(--on-acid);box-shadow:0 4px 0 var(--acid-dark)}
/* stopka przyklejona do dołu — przy dłuższej liście (np. Liceum: 5 celów) DALEJ zostaje widoczne, treść przewija się pod nią */
.obfoot{position:sticky;bottom:0;z-index:2;margin:auto -20px 0;display:flex;flex-direction:column;gap:8px;padding:12px 20px 16px;background:var(--bg)}
/* zaznaczenie karty: krótkie „kliknięcie” zamiast dcPop (0.2→1.16 — karta znikała i rosła) */
@keyframes dcSel{0%{transform:scale(.97)}55%{transform:scale(1.015)}100%{transform:scale(1)}}
.a-sel{animation:dcSel .28s ease-out both}
.obfoot .pill{min-height:60px;border-radius:20px}
.obrem{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--shadow)}
.obrem .ico{width:48px;height:48px;border-radius:16px;background:var(--tint-cyan);color:var(--cyan);display:flex;align-items:center;justify-content:center;flex:none}
.obrem .grow{flex:1;min-width:0}
.obrem .t{font-size:15.5px;font-weight:800}
.obrem .s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px;line-height:1.35}
.obrem .s b{color:var(--txt-2)}
.obnote{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:2px dashed var(--line-dash);border-radius:22px;padding:14px 16px;font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.4}

/* katalog (Catalog.html): pole szukania, chipy etapów, karta „masz notatki?”, karty przedmiotów 2 kolumny */

/* ustawienia: pole godziny, ukryty input pliku, notka, wiersz czerwony, lista „co nowego” */
.settime{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;color:var(--txt);font-family:var(--font-body);font-size:13.5px;font-weight:800;padding:0 8px;min-height:40px;color-scheme:dark;flex:none;width:112px}
.hiddenfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.setrow{position:relative}
.setrow.note{color:var(--muted-2)}
.setrow.note .s{line-height:1.4}
.setrow .t.red{color:var(--red-soft)}
.changelog{display:flex;flex-direction:column;gap:2px;padding:2px 0 10px}
.chrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:2px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.chrow b{flex:none;width:62px;color:var(--acid);font-weight:800}
.settings .backbtn{position:relative;z-index:2}

/* Info przedmiotu (SubjectInfo.html): kafle z ikoną, siatka ocen z podświetlonym wierszem, wiersze-linki, stopka */
.info{display:flex;flex-direction:column;gap:12px;padding:12px 18px 130px}
.info>*{flex:none}
.infhead h2{font-size:22px;letter-spacing:-.6px;margin-top:4px;line-height:1.15}
.infhead p{font-size:13px;font-weight:600;color:var(--muted);margin-top:6px;line-height:1.4}
.inftile{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:0 5px 0 var(--shadow)}
.infh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2)}
.infh span{display:inline-flex;align-items:center;gap:8px}
.infh .ic{color:var(--accent);flex:none}
.infh b{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:none;color:var(--muted)}
.infh b.acid{color:var(--acid)}
.infb{margin-top:10px;font-size:14.5px;font-weight:600;line-height:1.5;color:var(--txt-2)}
.infb p{margin:0}.infb p+p{margin-top:8px}
.infb b{color:var(--txt)}
.infb ul{margin:6px 0 0 18px}
.infb table{width:100%;border-collapse:collapse;font-size:14px}
.infb td{padding:6px 4px;border-bottom:2px solid var(--line-2)}
.infb td:last-child{text-align:right;font-weight:800;color:var(--gold)}
.inftile.hot{background:var(--tint-pink);border-color:var(--pink);box-shadow:0 5px 0 var(--tint-pink);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg))}
.inftile.hot .infh{color:var(--pink);color:color-mix(in srgb,var(--pink) 60%,var(--txt))}
.inftile.hot .infh .ic{color:var(--pink)}
.inftile.hot .infb{font-size:16px;font-weight:700;color:var(--txt)}
.inftile.hot .infb b{color:var(--pink)}
.inftile.pink .infh .ic{color:var(--pink)}
.inftile.cyan .infh .ic{color:var(--cyan)}
.inftile.gold .infh .ic{color:var(--gold)}
.inftile.violet .infh .ic{color:var(--violet)}
.infscale{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px;box-shadow:0 5px 0 var(--shadow)}
.infscale .infh .ic{color:var(--gold)}
.infrows{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.infrow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 -8px;border-radius:14px;font-size:14px;font-weight:700;color:var(--muted);border:2px solid transparent}
.infrow .r{flex:1;min-width:0}
.infrow .g{font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--txt-2)}
.infrow.fail .g{color:var(--red-soft)}
.infrow .here{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acid)}
.infrow.on{background:var(--tint-acid);border-color:var(--acid);color:var(--txt);color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.infrow.on .g{color:var(--acid)}
.infrow.fail.on{background:var(--tint-red);border-color:var(--red);color:var(--txt);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.infrow.fail.on .here{color:var(--red-soft)}
.inflink{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:13px 16px;min-height:44px;box-shadow:0 4px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s}
.inflink:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.inflink .ico{width:44px;height:44px;border-radius:14px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.inflink .ico.red{background:var(--tint-red);color:var(--red-soft)}
.inflink .ico.cyan{background:var(--tint-cyan);color:var(--cyan)}
.inflink .grow{flex:1;min-width:0}
.inflink .t{font-size:14.5px;font-weight:800}
.inflink .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.35}
.inflink .chev{color:var(--muted-3)}
.inffoot{padding-top:6px}
.inffoot .pill{min-height:60px;border-radius:20px}

/* Twój tydzień (WeeklyStory.html): pełny fiolet, ciemny tekst, słupki dni, kafle liczb */
.screen.weekly{background:var(--violet);color:var(--on-violet)}
.wkblob{position:absolute;top:-120px;right:-90px;width:320px;height:320px;border-radius:50%;pointer-events:none;background:var(--violet);background:color-mix(in srgb,var(--violet) 72%,var(--txt))}
.wkblob.two{top:auto;right:auto;bottom:80px;left:-120px;width:300px;height:300px;background:var(--violet);background:color-mix(in srgb,var(--violet) 88%,var(--on-violet))}
.wk{display:flex;flex-direction:column;gap:16px;padding:18px 20px 30px;min-height:100%}
.wk>*{flex:none}
.wksegs{display:flex;gap:6px}
.wksegs i{flex:1;height:5px;border-radius:3px;background:var(--violet);background:color-mix(in srgb,var(--violet) 70%,var(--txt));overflow:hidden;display:block}
.wksegs i.on{background:var(--on-violet)}
.wksegs i b{display:block;height:100%;width:60%;background:var(--on-violet)}
.wkhead{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800}
.wkclose{width:44px;height:44px;border-radius:50%;border:none;background:var(--violet);background:color-mix(in srgb,var(--violet) 80%,var(--on-violet));color:var(--on-violet);display:flex;align-items:center;justify-content:center;cursor:pointer}
.wkbody{display:flex;flex-direction:column;gap:12px;padding:6px 4px 0}
.wkl{font-size:20px;font-weight:800;letter-spacing:-.4px}
.wkn{font-family:var(--font-display);font-size:64px;font-weight:800;letter-spacing:-3px;line-height:.95}
.wkchip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--on-violet);color:var(--txt);border-radius:var(--r-chip);padding:10px 16px;font-size:13.5px;font-weight:800}
.wkbars{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:14px}
.wkcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.wkbar{flex:1;width:100%;display:flex;align-items:flex-end}
.wkbar i{display:block;width:100%;border-radius:12px;background:var(--violet);background:color-mix(in srgb,var(--violet) 70%,var(--on-violet));min-height:6px}
.wkcol.best .wkbar i{background:var(--on-violet)}
.wkcol.future .wkbar i{opacity:.35}
.wkcol span{font-size:12.5px;font-weight:800;color:var(--on-violet);color:color-mix(in srgb,var(--on-violet) 75%,var(--violet))}
.wkcol.today span{color:var(--on-violet);text-decoration:underline;text-underline-offset:3px}
.wkbest{font-size:14.5px;font-weight:800;color:var(--on-violet);color:color-mix(in srgb,var(--on-violet) 85%,var(--violet));line-height:1.4}
.wkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.wkstat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--violet);background:color-mix(in srgb,var(--violet) 78%,var(--bg));border-radius:18px;padding:12px 11px;color:var(--on-violet);min-height:44px}
.wkstat .ic{color:var(--on-violet);opacity:.8}
.wkstat b{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1;margin-top:2px}
.wkstat span{font-size:10.5px;font-weight:800;line-height:1.25;color:var(--on-violet);color:color-mix(in srgb,var(--on-violet) 80%,var(--violet))}
.wkfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.pill.dark{background:var(--on-violet);color:var(--txt);box-shadow:0 var(--drop-btn) 0 var(--bg);min-height:60px;border-radius:20px}
.pill.dark:active{box-shadow:0 0 0 var(--bg)}
.pill.text.dark{background:transparent;box-shadow:none;min-height:0;color:var(--on-violet)}

/* noc przed egzaminem (Cram.html): gwiazdki mrugają, księżyc, bloki numerowane w tintach, sesja z zegarem bloku, ekran „Idź spać” */
.cram{display:flex;flex-direction:column;gap:12px;padding-top:8px;position:relative}
.cram>*{flex:none}
.cramstar{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--violet-soft);pointer-events:none}
.cramstar:nth-of-type(1){top:24px;left:22px}.cramstar:nth-of-type(2){top:60px;right:40px}.cramstar:nth-of-type(3){top:150px;left:60px;width:4px;height:4px}
.cramstar:nth-of-type(4){top:110px;right:110px;width:4px;height:4px}.cramstar:nth-of-type(5){top:200px;right:30px}
.cramhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 0 4px}
.ic-moon{color:var(--violet);color:color-mix(in srgb,var(--violet) 55%,var(--txt))}
.cramhero .eyebrow{color:var(--violet-soft);letter-spacing:1.6px}
.cramtime{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--txt-2)}
.crams{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4;max-width:300px}
.cramrows{display:flex;flex-direction:column;gap:10px}
.cramrow{display:flex;align-items:center;gap:14px;border-radius:22px;padding:14px 16px;border:2px solid var(--line);background:var(--surface);min-height:70px}
.cramrow .num{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--txt)}
.cramrow .grow{flex:1;min-width:0}
.cramrow .t{font-size:15px;font-weight:800}
.cramrow .s{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.35}
.cramrow .min{flex:none;font-size:13px;font-weight:800;color:var(--muted)}
.cramrow.red{background:var(--tint-red);border-color:var(--tint-red-line)}.cramrow.red .num{background:var(--red);color:var(--on-red)}.cramrow.red .min{color:var(--red-soft)}
.cramrow.gold{background:var(--tint-gold);border-color:var(--tint-gold-line)}.cramrow.gold .num{background:var(--gold);color:var(--on-gold)}.cramrow.gold .min{color:var(--gold)}
.cramrow.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line)}.cramrow.cyan .num{background:var(--cyan);color:var(--on-cyan)}.cramrow.cyan .min{color:var(--cyan)}
.cramrow.violet{background:var(--tint-pink);border-color:var(--tint-pink-line)}.cramrow.violet .num{background:var(--violet);color:var(--on-violet)}.cramrow.violet .min{color:var(--violet-soft)}
.cramnote{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.45;padding:2px 4px}
.cramnote .ic{color:var(--muted-2);flex:none;margin-top:2px}
.cramfoot{padding-top:8px}
.cramfoot .pill{min-height:60px;border-radius:20px}
.cramrun .cramhead{align-items:center}
.cramlbl{flex:1;min-width:0}
.cramlbl .eyebrow{font-size:10.5px;color:var(--violet-soft)}
.cramlbl .t{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cramclock{border-color:var(--tint-pink-line);background:var(--tint-pink);color:var(--violet-soft)}
.cramclock .ic{color:var(--violet)}
.cramclock.warn{background:var(--tint-red);border-color:var(--red);color:var(--red-soft)}
.cramclock.warn .ic{color:var(--red)}
.egdrain.cram{margin:10px 18px 0}
.egdrain.cram i{background:var(--violet)}
.cramseg{padding:10px 18px 0;flex:none}
.cramskip{margin-top:6px}
.lessonfoot .cramskip{width:100%}
.lcbig.moon{background:var(--tint-pink);border:3px solid var(--violet);color:var(--violet);color:color-mix(in srgb,var(--violet) 55%,var(--txt));box-shadow:0 8px 0 var(--violet-dark)}
.cramdone .blob,.cramrun .blob{background:var(--bg);background:color-mix(in srgb,var(--violet) 14%,var(--bg))}

/* popraw pytanie (EditContent.html): arkusz z polami, opcje z „radiem” i polem tekstu */
/* potwierdzenie w stylu aplikacji (ask() w engine.js zamiast confirm()/alert()) */
.sheet.ask{border-radius:32px 32px 0 0;border-top-color:var(--violet);padding:14px 18px calc(24px + env(safe-area-inset-bottom));gap:12px}
.sheet.ask.danger{border-top-color:var(--red)}
.sheet.ask .sp{font-size:14px;color:var(--txt-2)}
.sheet.ask .sbtns{margin-top:4px}
.sheet.edit{border-top-color:var(--acid);border-radius:32px 32px 0 0;padding:14px 18px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;max-height:92vh;max-height:92dvh;gap:10px}
.sheet.edit>*{flex:none}
.ssub{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px}
.edlbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);margin-top:4px}
.edta{width:100%;resize:vertical;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--txt);font-family:var(--font-body);font-size:15px;font-weight:700;line-height:1.4;outline:none;min-height:56px}
.edta:focus{border-color:var(--acid)}
.edopts{display:flex;flex-direction:column;gap:8px}
.edopt{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 10px 6px 8px;min-height:54px}
.edopt.on{background:var(--tint-acid);border-color:var(--acid)}
.edradio{width:40px;height:40px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.edradio i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line-dash);background:var(--surface-2)}
.edopt.on .edradio i{border-color:var(--acid);background:var(--acid);box-shadow:inset 0 0 0 5px var(--on-acid)}
.edopt .k{flex:none;width:22px;font-size:13px;font-weight:800;color:var(--muted)}
.edopt.on .k{color:var(--acid)}
.edin{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt);font-family:var(--font-body);font-size:14px;font-weight:700;min-height:40px}
.sheet.edit .pill{margin-top:4px}

/* źródło pytania (SourceView.html): złota krawędź, „kartka” z kreskami i podświetloną linią, cytat */
.sheet.source{border-top-color:var(--gold);border-radius:32px 32px 0 0;max-height:88vh;max-height:88dvh;overflow-y:auto}
.sheet.source>*{flex:none}
.srcpage{position:relative;background:var(--bg);background:color-mix(in srgb,var(--bg) 70%,var(--tint-gold));border-radius:24px;padding:18px 26px 40px}
.srcpage .pg{background:var(--txt);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:11px;min-height:220px}
.srcpage .pg i{display:block;height:7px;border-radius:4px;background:var(--txt);background:color-mix(in srgb,var(--txt) 78%,var(--muted-3))}
.srcpage .pg i.h{width:50%;height:11px;background:var(--txt);background:color-mix(in srgb,var(--txt) 50%,var(--muted-3));margin-bottom:4px}
.srcpage .pg i.hl{background:var(--gold);box-shadow:0 0 0 5px var(--txt);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 45%,var(--txt))}
.srcnote{position:absolute;left:14px;right:14px;bottom:10px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--gold);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.srcquote{background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-radius:22px;padding:16px 18px}
.srcquote .eyebrow{color:var(--gold)}
.srcquote .qt{font-size:15.5px;font-weight:700;line-height:1.5;color:var(--txt);margin-top:8px}

/* „wymaga wersji online”: nagłówek z kaflem ikony, opis, ramka, kroki, alternatywy offline */
.coming{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.coming>*{flex:none}
.cmhero{display:flex;align-items:center;gap:16px;padding:6px 0}
.cmhero .ico{width:68px;height:68px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--txt);box-shadow:0 6px 0 var(--shadow)}
.cmhero.acid .ico{background:var(--acid);color:var(--on-acid);box-shadow:0 6px 0 var(--acid-dark)}
.cmhero.cyan .ico{background:var(--cyan);color:var(--on-cyan);box-shadow:0 6px 0 var(--cyan-dark)}
.cmhero.gold .ico{background:var(--gold);color:var(--on-gold);box-shadow:0 6px 0 var(--gold-dark)}
.cmhero.pink .ico{background:var(--pink);color:var(--on-pink);box-shadow:0 6px 0 var(--pink-dark)}
.cmhero .grow{flex:1;min-width:0}
.cmhero h2{font-size:26px;letter-spacing:-.8px;line-height:1.05;margin-top:3px}
.cmblurb{font-size:14.5px;font-weight:600;color:var(--txt-2);line-height:1.5}
.infobox.online{background:var(--tint-amber);border-color:var(--tint-amber-line);color:var(--amber-soft)}
.infobox.online .ic{color:var(--amber)}
.cmsteps{display:flex;flex-direction:column;gap:9px}
.cmstep{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;min-height:60px;color:var(--txt);font-family:var(--font-body)}
button.cmstep{cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
button.cmstep:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.cmstep .num{width:34px;height:34px;border-radius:11px;background:var(--line-2);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-display);font-size:15px;font-weight:800;color:var(--acid)}
.cmstep .grow{flex:1;min-width:0}
.cmstep .t{font-size:14px;font-weight:800}
.cmstep .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.cmstep .chev{color:var(--muted-3)}
.cmfoot{padding-top:8px}
.cmfoot .pill{min-height:60px;border-radius:20px}
.sheet.coming{border-top-color:var(--amber);border-radius:32px 32px 0 0;max-height:88vh;max-height:88dvh;overflow-y:auto;gap:12px}
.sheet.coming>*{flex:none}
.sheet.coming .cmhero .ico{width:54px;height:54px;border-radius:18px}
.sheet.coming .cmhero h2{font-size:22px}

/* ekran błędu (ErrorState.html): kafel z wykrzyknikiem, lista plików/powodów, „co możesz zrobić”, stopka */
.errv{display:flex;flex-direction:column;gap:16px;padding:8px 20px 30px;min-height:100%}
.errv>*{flex:none}
.errart{display:flex;justify-content:center;padding:14px 0 4px}
.errico{position:relative;width:96px;height:96px;border-radius:30px;background:var(--tint-red);border:2px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center}
.errico b{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--red-dark)}
.errtxt{text-align:center}
.errtxt h1{font-size:27px;letter-spacing:-.9px;line-height:1.1}
.errtxt p{font-size:14px;font-weight:600;color:var(--muted);margin:10px auto 0;line-height:1.5;max-width:320px}
.errlist{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:4px 15px;box-shadow:0 4px 0 var(--shadow)}
.errrow{display:flex;align-items:center;gap:12px;padding:11px 0;min-height:48px}
.errrow+.errrow{border-top:2px solid var(--line-2)}
.errrow .ic{color:var(--muted-2);flex:none}
.errrow.bad .ic{color:var(--red-soft)}
.errrow.ok .ic{color:var(--acid)}
.errrow .grow{flex:1;min-width:0}
.errrow .t{font-size:13.5px;font-weight:800;overflow-wrap:anywhere}
.errrow .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.35}
.errrow.bad .s{color:var(--red-soft)}
.errcan{background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.errcan .eyebrow{color:var(--acid-soft)}
.errcan .r{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;font-weight:700;line-height:1.4;color:var(--txt);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.errcan .r .ic{color:var(--acid);flex:none;margin-top:1px}
.errfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.errfoot .pill{min-height:58px;border-radius:20px}

/* iOS: wycięcie ekranu (notch / Dynamic Island) i pasek gestów — działa dzięki viewport-fit=cover.
   Góra: całe #app zjeżdża pod pasek statusu (nakładki inset:0 zostają pod nim).
   Dół: padding tylko dla treści w przepływie — nakładki (.nav, .sheet, .lesson) liczą env() same. */
body{padding-top:env(safe-area-inset-top)}
#app{height:calc(100vh - env(safe-area-inset-top));height:calc(100dvh - env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}
.netbar{top:env(safe-area-inset-top)}

/* ============================================================ MASKOTKA — lis Cramfox (fox() w engine.js). Części .fx-* animowane osobno;
   nastrój = klasa na <svg> (idle/happy/oops/fire/sleep), losowe akcje act-* dodaje foxLive(). Ogranicz animacje wyłącza wszystko (html.reduce-motion *). */
.fx{overflow:visible;display:block;-webkit-tap-highlight-color:transparent}
.fx-all,.fx-sway,.fx-head,.fx-eyes,.fx-look,.fx-earl,.fx-earr,.fx-tail,.fx-arml,.fx-armr,.fx-spark,.fx-drop,.fx-flame,.fx-z,.fx-ground,.fx-snore{transform-box:fill-box}
.fx-all{transform-origin:50% 100%}
.fx-sway{transform-origin:50% 100%;animation:fxSway var(--sw,3.4s) ease-in-out infinite}
.fx-head{transform-origin:50% 90%;animation:fxHead 5s ease-in-out infinite}
.fx-eyes{transform-origin:50% 50%;animation:fxBlink 3.8s infinite}
.fx-look{animation:fxLook 6s ease-in-out infinite}
.fx-earl{transform-origin:75% 95%;animation:fxEarL 3.2s infinite}
.fx-earr{transform-origin:25% 95%;animation:fxEarR 4.1s infinite}
.fx-tail{transform-origin:5% 85%;animation:fxTail var(--tl,1.5s) ease-in-out infinite}
.fx-arml{transform-origin:50% 8%;animation:fxArmL 3.4s ease-in-out infinite}
.fx-armr{transform-origin:50% 8%;animation:fxArmR 3.4s ease-in-out infinite}
.fx-ground{transform-origin:50% 50%}
@keyframes fxSway{0%,100%{transform:rotate(-3deg) scale(1,1)}25%{transform:rotate(0) scale(1.02,.98)}50%{transform:rotate(3deg) scale(1,1)}75%{transform:rotate(0) scale(1.02,.98)}}
@keyframes fxHead{0%,100%{transform:rotate(0)}18%{transform:rotate(-9deg)}36%{transform:rotate(-9deg) translateY(-1px)}52%{transform:rotate(7deg)}70%{transform:rotate(7deg)}85%{transform:rotate(-2deg)}}
@keyframes fxBlink{0%,88%,100%{transform:scaleY(1)}91%{transform:scaleY(.1)}94%{transform:scaleY(1)}96%{transform:scaleY(.1)}98%{transform:scaleY(1)}}
@keyframes fxLook{0%,12%,100%{transform:translate(0,0)}18%,34%{transform:translate(-3.5px,1px)}42%,58%{transform:translate(3.5px,-1px)}66%,90%{transform:translate(0,-1.5px)}}
@keyframes fxEarL{0%,60%,82%,100%{transform:rotate(0)}66%{transform:rotate(-20deg)}72%{transform:rotate(6deg)}77%{transform:rotate(-8deg)}}
@keyframes fxEarR{0%,40%,62%,100%{transform:rotate(0)}46%{transform:rotate(20deg)}52%{transform:rotate(-6deg)}57%{transform:rotate(8deg)}}
@keyframes fxTail{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
@keyframes fxArmL{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-6deg)}}
@keyframes fxArmR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-4deg)}}
.fx.act-wave .fx-armr{animation:fxWave 1.7s ease-in-out}
.fx.act-wave .fx-head{animation:fxTiltR 1.7s ease-in-out}
@keyframes fxWave{0%,100%{transform:rotate(0)}18%{transform:rotate(-165deg)}30%{transform:rotate(-135deg)}42%{transform:rotate(-165deg)}54%{transform:rotate(-135deg)}66%{transform:rotate(-165deg)}82%{transform:rotate(-150deg)}}
@keyframes fxTiltR{0%,100%{transform:rotate(0)}20%,80%{transform:rotate(10deg)}}
.fx.act-hop .fx-all,.fx.act-tap .fx-all{animation:fxHop .9s cubic-bezier(.3,.7,.4,1)}
.fx.act-hop .fx-ground,.fx.act-tap .fx-ground{animation:fxGround .9s cubic-bezier(.3,.7,.4,1)}
.fx.act-tap .fx-arml{animation:fxCheerL .8s ease-in-out}
.fx.act-tap .fx-armr{animation:fxCheerR .8s ease-in-out}
@keyframes fxHop{0%{transform:translateY(0) scale(1.12,.86)}25%{transform:translateY(-26px) scale(.92,1.1)}50%{transform:translateY(-30px) scale(1)}78%{transform:translateY(0) scale(1.12,.86)}100%{transform:translateY(0) scale(1)}}
@keyframes fxGround{0%,78%,100%{transform:scale(1)}40%,55%{transform:scale(.6);opacity:.3}}
.fx.act-look .fx-look{animation:fxLookBig 2.2s ease-in-out}
.fx.act-look .fx-head{animation:fxHeadLook 2.2s ease-in-out}
@keyframes fxLookBig{0%,100%{transform:translate(0,0)}15%,40%{transform:translate(-4.5px,0)}55%,85%{transform:translate(4.5px,0)}}
@keyframes fxHeadLook{0%,100%{transform:rotate(0) translateX(0)}15%,40%{transform:rotate(-12deg) translateX(-3px)}55%,85%{transform:rotate(12deg) translateX(3px)}}
.fx.act-stretch .fx-sway{animation:fxStretch 1.5s ease-in-out}
.fx.act-stretch .fx-arml{animation:fxUpL 1.5s ease-in-out}
.fx.act-stretch .fx-armr{animation:fxUpR 1.5s ease-in-out}
@keyframes fxStretch{0%,100%{transform:scale(1,1)}30%,65%{transform:scale(.94,1.12)}80%{transform:scale(1.06,.94)}}
@keyframes fxUpL{0%,100%{transform:rotate(0)}30%,65%{transform:rotate(170deg)}}
@keyframes fxUpR{0%,100%{transform:rotate(0)}30%,65%{transform:rotate(-170deg)}}
@keyframes fxCheerL{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(155deg)}50%{transform:rotate(135deg)}}
@keyframes fxCheerR{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-155deg)}50%{transform:rotate(-135deg)}}
.fx.happy .fx-all{animation:fxJoy 2.2s cubic-bezier(.3,.7,.4,1) infinite}
.fx.happy .fx-ground{animation:fxGround2 2.2s cubic-bezier(.3,.7,.4,1) infinite}
.fx.happy .fx-tail{animation-duration:.35s}
.fx.happy .fx-arml{animation:fxCheerLoopL .55s ease-in-out infinite alternate}
.fx.happy .fx-armr{animation:fxCheerLoopR .55s ease-in-out infinite alternate}
.fx.happy .fx-head{animation:fxHeadHappy .55s ease-in-out infinite alternate}
.fx.happy .fx-spark{transform-origin:50% 50%;animation:fxSpark 1.1s ease-out infinite}
@keyframes fxJoy{0%{transform:translateY(0) scale(1.14,.84)}12%{transform:translateY(-30px) scale(.9,1.12)}24%{transform:translateY(-34px) scale(1)}38%{transform:translateY(0) scale(1.14,.84)}46%{transform:translateY(0) scale(1)}52%{transform:translateY(0) scale(1.14,.84)}64%{transform:translateY(-40px) scale(.9,1.12)}74%{transform:translateY(-44px) scale(1)}86%{transform:translateY(0) scale(1.12,.88)}100%{transform:translateY(0) scale(1)}}
@keyframes fxGround2{0%,38%,52%,80%,100%{transform:scale(1)}20%,66%{transform:scale(.55);opacity:.3}}
@keyframes fxCheerLoopL{0%{transform:rotate(140deg)}100%{transform:rotate(170deg)}}
@keyframes fxCheerLoopR{0%{transform:rotate(-140deg)}100%{transform:rotate(-170deg)}}
@keyframes fxHeadHappy{0%{transform:rotate(-6deg)}100%{transform:rotate(6deg)}}
@keyframes fxSpark{0%,10%{transform:scale(0) rotate(0)}40%{transform:scale(1.35) rotate(60deg)}75%,100%{transform:scale(0) rotate(120deg)}}
.fx.oops .fx-all{animation:fxShake 2.4s ease-in-out infinite}
.fx.oops .fx-head{animation:fxNo 2.4s ease-in-out infinite}
.fx.oops .fx-earl{animation:none;transform:rotate(-34deg)}
.fx.oops .fx-earr{animation:none;transform:rotate(34deg)}
.fx.oops .fx-tail{animation:fxTailSad 3s ease-in-out infinite}
.fx.oops .fx-arml{animation:fxFacepalm 2.4s ease-in-out infinite}
.fx.oops .fx-armr{animation:none;transform:rotate(8deg)}
.fx.oops .fx-drop{animation:fxDrop 1.4s ease-in infinite}
@keyframes fxShake{0%,34%,100%{transform:translateX(0)}4%{transform:translateX(-7px) rotate(-3deg)}8%{transform:translateX(7px) rotate(3deg)}12%{transform:translateX(-5px)}16%{transform:translateX(4px)}20%{transform:translateX(-2px)}}
@keyframes fxNo{0%,100%{transform:rotate(-8deg) translateY(3px)}40%{transform:rotate(-8deg) translateY(3px)}48%{transform:rotate(10deg) translateY(3px)}56%{transform:rotate(-10deg) translateY(3px)}64%{transform:rotate(8deg) translateY(3px)}72%{transform:rotate(-8deg) translateY(3px)}}
@keyframes fxTailSad{0%,100%{transform:rotate(26deg)}50%{transform:rotate(20deg)}}
@keyframes fxFacepalm{0%,30%{transform:rotate(0)}42%,88%{transform:rotate(-166deg) scaleY(2.05)}100%{transform:rotate(0)}} /* łapa na twarz, nie machanie */
@keyframes fxDrop{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.fx.fire .fx-all{animation:fxBounce .7s ease-in-out infinite}
.fx.fire .fx-tail{animation-duration:.6s}
.fx.fire .fx-armr{animation:fxPump .7s ease-in-out infinite}
.fx.fire .fx-arml{animation:fxArmL .7s ease-in-out infinite}
.fx.fire .fx-head{animation:fxHeadHappy .7s ease-in-out infinite alternate}
.fx.fire .fx-flame{transform-origin:50% 100%;animation:fxFlame .3s ease-in-out infinite alternate}
.fx.fire .fx-flame.in{animation-duration:.22s}
@keyframes fxBounce{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-10px) scale(.98,1.03)}}
@keyframes fxPump{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-175deg)}}
@keyframes fxFlame{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(.88,1.16) skewX(-7deg)}}
.fx.sleep .fx-sway{animation:fxSleepBreath 3.6s ease-in-out infinite}
.fx.sleep .fx-head{animation:fxNod 5s ease-in-out infinite}
.fx.sleep .fx-earl,.fx.sleep .fx-earr{animation:none}
.fx.sleep .fx-tail{animation:fxTail 5s ease-in-out infinite}
.fx.sleep .fx-arml,.fx.sleep .fx-armr{animation:none}
.fx.sleep .fx-snore{transform-origin:50% 50%;animation:fxSnore 3.6s ease-in-out infinite}
.fx.sleep .fx-z{transform-origin:50% 50%;animation:fxZ 3s ease-out infinite;opacity:0}
@keyframes fxSleepBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes fxNod{0%{transform:rotate(4deg) translateY(2px)}70%{transform:rotate(16deg) translateY(8px)}76%{transform:rotate(-4deg) translateY(-2px)}84%,100%{transform:rotate(4deg) translateY(2px)}}
