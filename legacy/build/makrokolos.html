<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Recall — makrokolos</title>
<style>
/* ============================================================
   NAUKA 2.0 — skóra silnika (krok 1: tokeny i klasy na zmiennych)
   Źródło prawdy dla kolorów i ruchu: design/tokens.css (wklejone niżej 1:1).
   Zasada: płaskie kolory, grube cienie pod spodem, duże promienie, zero gradientów.
   Motyw przedmiotu: engine.js ustawia --accent i --accent2 (hex z data/*.js);
   --accent-dark i --on-accent są liczone z --accent poniżej.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

/* ============================================================
   Recall 2.0 — tokeny motywu i ruch
   Wklej na początek styles.css (albo zaimportuj jako osobny plik).
   Zasada: płaskie kolory, grube cienie pod spodem, duże promienie.
   ============================================================ */
:root{
  /* tła */
  --bg:#0E0C1C;          /* tło ekranu */
  --surface:#1B1836;     /* karta */
  --surface-2:#15122B;   /* pasek nawigacji, sekcja */
  --line:#2C2850;        /* obramowanie karty */
  --line-2:#241F45;      /* separator, tor paska postępu */
  --shadow:#14122A;      /* cień pod kartą na tle bg */

  /* tekst */
  --txt:#F4F2FF;
  --txt-2:#D6D2F0;
  --muted:#9B95C9;
  --muted-2:#6E67A8;
  --muted-3:#4E4778;

  /* akcenty */
  --acid:#B4FF3A;   --acid-dark:#7FC400;   --on-acid:#14210A;
  --pink:#FF2E93;   --pink-dark:#B01460;   --on-pink:#200410;
  --amber:#FFA023;  --amber-dark:#B36A08;  --on-amber:#201202;
  --cyan:#22D3EE;   --cyan-dark:#108CA1;   --on-cyan:#04232B;
  --gold:#FFC043;   --gold-dark:#B3820E;   --on-gold:#241800;
  --red:#FF4767;    --red-dark:#A8203A;    --on-red:#2A0008;
  --violet:#A855F7; --violet-dark:#6B2AA8; --on-violet:#1A0A2A;
  --flame:#FF7A1A;

  /* tinty pod kafle i panele */
  --tint-acid:#1F2A12;   --tint-acid-line:#4E6B24;
  --tint-pink:#241536;   --tint-pink-line:#46216B;
  --tint-amber:#2A1C10;  --tint-amber-line:#5C3812;
  --tint-cyan:#0E2430;   --tint-cyan-line:#1A4C5E;
  --tint-gold:#2A2110;   --tint-gold-line:#574319;
  --tint-red:#2A1017;    --tint-red-line:#5C1F2E;

  /* motyw przedmiotu — nadpisywane per przedmiot */
  --accent:var(--acid);
  --accent-dark:var(--acid-dark);
  --on-accent:var(--on-acid);

  /* kształt */
  --r-chip:999px; --r-sm:13px; --r-md:18px; --r-lg:22px; --r-xl:28px;
  --drop:4px;      /* cień kart */
  --drop-btn:5px;  /* cień przycisków */
  --drop-node:6px; /* cień węzłów ścieżki */

  /* typografia */
  --font-display:'Bricolage Grotesque', system-ui, sans-serif; /* 800 */
  --font-body:'Plus Jakarta Sans', system-ui, sans-serif;      /* 500/600/700/800 */
}

/* ---------- RUCH ---------- */
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}

.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}

/* ---------- PRZEPISY NA KOMPONENTY ---------- */
/* Przycisk główny: płaski kolor + cień pod spodem, wciśnięcie zjeżdża w dół. */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:58px;border:none;border-radius:var(--r-md);cursor:pointer;
  font-family:var(--font-body);font-size:15px;font-weight:800;letter-spacing:1.2px;
  background:var(--accent);color:var(--on-accent);
  box-shadow:0 var(--drop-btn) 0 var(--accent-dark);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 var(--accent-dark)}
.btn--ghost{background:var(--surface);border:2px solid var(--line);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.btn--danger{background:var(--red);color:var(--on-red);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.btn[disabled]{background:#201C3E;color:#5C568F;box-shadow:none;cursor:default}

/* Karta */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
      box-shadow:0 var(--drop) 0 var(--shadow);padding:16px}

/* Pasek postępu — .bar i{width:X%} animuje się od zera klasą .a-grow */
.bar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* Plakietka */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-chip);
      font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}

/* Węzeł ścieżki */
.node{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 var(--drop-node) 0 var(--accent-dark);background:var(--accent)}
.node--current{width:88px;height:88px;box-shadow:0 7px 0 var(--accent-dark)}
.node--locked{background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--drop-node) 0 var(--shadow);cursor:not-allowed}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-dark)}

/* Minimalny cel dotyku: 44px. Tekst 4.5:1, duży 3:1. */

/* ---------- ALIASY STARYCH ZMIENNYCH (engine.js / stare klasy) + pochodne motywu ---------- */
:root{
  --bg2:var(--surface-2); --card:var(--surface); --card2:var(--surface-2);
  --lime:var(--acid); --purple:var(--violet); --orange:var(--amber); --green:var(--acid);
  --accent1:var(--pink);
  --accent2:var(--acid);                                     /* nadpisywane inline przez engine (hex przedmiotu) */
  --accent-dark:var(--acid-dark);                            /* fallback dla przeglądarek bez color-mix */
  --accent-dark:color-mix(in srgb, var(--accent) 68%, #000);
  --on-accent:#120E22;
  --accent-tint:var(--surface-2);
  --accent-tint:color-mix(in srgb, var(--accent) 14%, var(--surface));
  --accent-tint-line:var(--line);
  --accent-tint-line:color-mix(in srgb, var(--accent) 36%, var(--surface));
  /* krok 3 */
  --ink:#000;                                                /* baza do color-mix (ciemnienie akcentu) */
  --line-dash:#3E3870;                                       /* kreskowana ramka kafla „dodaj” (Main/EmptyState) */
  --accent-shadow:var(--shadow);
  --accent-shadow:color-mix(in srgb, var(--accent) 10%, var(--bg)); /* cień pod kaflem w tincie przedmiotu */
  /* krok 4: jaśniejsze odcienie tekstu na tintach (serce, panel dobrze/źle) */
  --red-soft:color-mix(in srgb, var(--red) 55%, var(--txt));
  --acid-soft:color-mix(in srgb, var(--acid) 45%, var(--muted));
  /* krok 5: licznik rundy na czas, fioletowy stan „przeciągane” (TaskOrder/TaskSort.html) */
  --amber-soft:color-mix(in srgb, var(--amber) 55%, var(--txt));
  --violet-soft:color-mix(in srgb, var(--violet) 40%, var(--txt));
  --violet-shadow:color-mix(in srgb, var(--violet) 12%, var(--bg));
}

/* ---------- BAZA ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);font-weight:500;background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
h1,h2,h3,.logo,.ftitle,.qq,.term,.exq{font-family:var(--font-display);font-weight:800}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px;z-index:30}
.logo{font-size:21px;letter-spacing:-.8px;line-height:1;display:flex;align-items:center;gap:8px}
.logo .g{color:var(--accent)}
.backbtn{background:var(--surface);border:2px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;flex:none;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.backbtn:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.pills{display:flex;align-items:center;gap:7px;flex:none}
.streak{display:flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);padding:7px 12px;border-radius:var(--r-chip);font-weight:800;font-size:14px;white-space:nowrap;color:var(--txt)}
.streak small{color:var(--muted);font-weight:700}
@media(max-width:380px){.pills{gap:5px}.streak{padding:6px 9px;font-size:13px}.logo{font-size:18px}}

.screen{flex:1;min-height:0;overflow:hidden;position:relative;display:none}
.screen.active{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 110px}

/* ---------- HOME: wybór przedmiotu ---------- */
.hero{padding:14px 4px 18px}
.hero h1{font-size:30px;letter-spacing:-1px;line-height:1.05}
.hero p{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.4}
.subjcard{display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:18px 18px 18px 22px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.subjcard:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.subjcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sa,var(--accent))}
.subjcard>*{position:relative;z-index:1}
.subjemoji{font-size:38px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);flex:none}
.subjmeta{flex:1;min-width:0}
.subjmeta h3{font-size:19px;letter-spacing:-.4px}
.subjmeta .sub{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35;font-weight:600}
.subjprog{margin-top:9px;display:flex;align-items:center;gap:8px}
.subjprog .bar{flex:1;height:10px;background:var(--line-2);border-radius:var(--r-chip);overflow:hidden}
.subjprog .bar i{display:block;height:100%;background:var(--sa,var(--accent));border-radius:var(--r-chip);animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.subjprog small{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.subjcard .chev{font-size:24px;color:var(--muted-2);flex:none}
.addcard{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:var(--r-xl);padding:16px 18px;color:var(--muted);font-weight:700;font-size:14.5px}
.addcard .subjemoji{background:var(--surface);font-size:30px;color:var(--muted)}

/* ---------- SUBJECT sub-tabs ---------- */
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;padding:8px 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:var(--font-body)}
.subtab.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- ŚCIEŻKA (Duolingo path) ---------- */
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px 120px}
.pathnode{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
.nodebtn{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;font-size:32px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 var(--drop-node) 0 var(--accent-dark);background:var(--accent);color:var(--on-accent);transition:transform .08s,box-shadow .08s}
.nodebtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-dark)}
.node-done{background:var(--accent)}
.node-open{width:88px;height:88px;font-size:36px;background:var(--acid);color:var(--on-acid);box-shadow:0 7px 0 var(--acid-dark);animation:dcPulse 1.5s ease-in-out infinite}
.node-open:active{box-shadow:0 3px 0 var(--acid-dark)}
.node-lock{background:var(--surface);border:2px solid var(--line);color:var(--muted-3);box-shadow:0 var(--drop-node) 0 var(--shadow);cursor:not-allowed}
.node-lock:active{transform:none;box-shadow:0 var(--drop-node) 0 var(--shadow)}
.nodebtn .stars{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap}
.nodelabel{font-size:12.5px;font-weight:800;text-align:center;max-width:180px;line-height:1.2;color:var(--txt)}
.nodelabel small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;margin-top:2px}
.node-lock+.nodelabel,.pathnode:has(.node-lock) .nodelabel{color:var(--muted-3)}
.pathnode:has(.node-open) .nodelabel{color:var(--acid)}
.connector{width:5px;height:16px;background:var(--line);border-radius:3px}
.connector.done{background:var(--accent)}
/* wężyk: offset per węzeł/łącznik przez --x (inline z engine.js); stary .pathzig:nth-child liczył też łączniki i psuł naprzemienność */
.pathnode,.connector{transform:translateX(var(--x,0px))}

/* ---------- karty / tagi (wspólne) ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;padding:6px 12px;border-radius:var(--r-chip);background:var(--surface-2);border:2px solid var(--line);color:var(--muted);margin-bottom:14px}
.progressrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.progressrow .bar{flex:1}
.bar i{width:0;transition:width .35s}
.counter{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;padding:8px 14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;letter-spacing:0;text-transform:none;cursor:pointer;white-space:nowrap;font-family:var(--font-body)}
.chips .chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* FEED / lekcja-feed */
.feedwrap{height:100%;overflow-y:scroll;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory}
.feedwrap::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:18px 18px 110px}
.fcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:24px 22px;position:relative;overflow:hidden;box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.fcard>*{position:relative;z-index:1}
.ftitle{font-size:24px;line-height:1.14;letter-spacing:-.6px;margin-bottom:14px}
.fbody{font-size:16px;line-height:1.5;color:var(--txt-2)}
.fbody b{color:var(--txt)}
.real{margin-top:16px;padding:13px 15px;background:var(--accent-tint);border:2px solid var(--accent-tint-line);border-left:6px solid var(--accent);border-radius:var(--r-sm);font-size:14.5px;line-height:1.45;color:var(--txt-2)}
.real .lbl{font-weight:800;color:var(--accent);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px}
.mnemo{margin-top:12px;padding:12px 15px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-left:6px solid var(--gold);border-radius:var(--r-sm);font-size:14.5px;line-height:1.45;color:var(--txt-2)}
.mnemo .lbl{font-weight:800;color:var(--gold);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px}

/* FISZKI */
.flip{flex:1;perspective:1600px;margin-bottom:14px;min-height:0}
.flipinner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,2,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--line);overflow-y:auto;box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.front{background:var(--surface)}
.back{background:var(--accent-tint);border-color:var(--accent-tint-line);transform:rotateY(180deg)}
.face .tag{position:absolute;top:18px;left:18px;margin:0}
.term{font-size:26px;letter-spacing:-.6px;line-height:1.15}
.deftxt{font-size:16.5px;line-height:1.5;color:var(--txt-2)}
.deftxt b{color:var(--accent)}
.tapomat{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--muted);font-size:12.5px;font-weight:700}
.fbtns{display:flex;gap:10px}
.fbtn{flex:1;height:54px;border:2px solid var(--line);border-radius:var(--r-md);font-size:14px;font-weight:800;letter-spacing:.6px;cursor:pointer;font-family:var(--font-body);transition:transform .08s,box-shadow .08s}
.fbtn:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 transparent}
.fbtn.no{background:var(--tint-red);color:var(--red);border-color:var(--tint-red-line);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.fbtn.yes{background:var(--tint-acid);color:var(--acid);border-color:var(--tint-acid-line);box-shadow:0 var(--drop-btn) 0 var(--acid-dark)}

/* QUIZ */
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;box-shadow:0 var(--drop) 0 var(--shadow)}
.qq{font-size:20px;line-height:1.22;letter-spacing:-.4px;margin:8px 0 18px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{text-align:left;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid var(--line);color:var(--txt);font-size:15.5px;font-weight:600;line-height:1.35;cursor:pointer;display:flex;gap:12px;align-items:flex-start;box-shadow:0 var(--drop) 0 var(--shadow);font-family:var(--font-body);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.opt .k{font-weight:800;color:var(--accent);flex:none}
.opt:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.opt.correct{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--txt);box-shadow:0 var(--drop) 0 var(--acid-dark)}
.opt.correct .k{color:var(--acid)}
.opt.wrong{background:var(--tint-red);border-color:var(--tint-red-line);color:var(--txt);box-shadow:0 var(--drop) 0 var(--red-dark);animation:dcShake .55s ease-in-out both}
.opt.wrong .k{color:var(--red)}
.opt.sel{background:var(--accent-tint);border-color:var(--accent)}
.opt.dim{opacity:.45;box-shadow:none}
.explain{margin-top:16px;padding:14px 16px;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-sm);font-size:14.5px;line-height:1.5;color:var(--txt-2);display:none}
.explain.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.explain b{color:var(--acid)}
.pill{height:58px;border:none;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;letter-spacing:1.2px;cursor:pointer;width:100%;font-family:var(--font-body);box-shadow:0 var(--drop-btn) 0 var(--accent-dark);transition:transform .08s,box-shadow .08s}
.pill:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 var(--accent-dark)}
.pill.ghost{background:var(--surface);border:2px solid var(--line);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.pill.ghost:active{box-shadow:0 0 0 var(--shadow)}
.qnext{margin-top:14px;display:none}
.qnext.show{display:block;animation:dcFadeUp .4s ease-out both}

/* WYNIK */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.result .big{font-size:60px;animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.result h2{font-size:28px;letter-spacing:-.8px}
.result p{color:var(--muted);font-size:15.5px;line-height:1.5;max-width:340px}
.result .score{font-size:19px;font-weight:800}
.result .score b{color:var(--accent)}

/* EGZAMIN */
.examhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.timer{font-weight:800;font-size:15px;background:var(--surface);border:2px solid var(--line);padding:7px 13px;border-radius:var(--r-chip);white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red);border-color:var(--red);animation:dcBlink 1.2s ease-in-out infinite}
.specs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.spec{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 16px;font-weight:800;font-size:15px;text-align:center;box-shadow:0 var(--drop) 0 var(--shadow)}
.spec small{display:block;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.review{margin-top:18px;text-align:left;width:100%}
.review h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted-2);margin-bottom:10px;font-family:var(--font-body)}
.ritem{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-bottom:9px;font-size:14px;line-height:1.45}
.ritem .rq{font-weight:800;margin-bottom:5px}
.ritem .rbad{color:var(--red)}
.ritem .rgood{color:var(--acid)}
.ritem .rsrc{color:var(--muted);font-size:12px;margin-top:5px}

/* INFO */
.zbox{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px;box-shadow:0 var(--drop) 0 var(--shadow)}
.zbox h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin-bottom:9px;font-family:var(--font-body)}
.zbox p,.zbox li{font-size:15px;line-height:1.55;color:var(--txt-2)}
.zbox ul{margin-left:18px;margin-top:4px}
.gradetbl{width:100%;border-collapse:collapse;font-size:14.5px}
.gradetbl td{padding:7px 4px;border-bottom:2px solid var(--line-2)}
.gradetbl td:last-child{text-align:right;font-weight:800;color:var(--gold)}

/* LEKCJA modal */
.lesson{position:absolute;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.lesson.open{display:flex;animation:dcFadeUp .3s ease-out both}
.lessonhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lessonhead .x{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;flex:none}
.lessonhead .bar{flex:1}
.lessonbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:0 16px 16px}
.lessonfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}

.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--surface-2);border-top:2px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;background:none;border:none;color:var(--muted-2);font-size:10.5px;font-weight:800;letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:var(--r-sm);font-family:var(--font-body)}
.nav button .ic{font-size:21px;line-height:1}
.nav button.active{color:var(--acid)}

.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--surface);border:2px solid var(--line);padding:10px 18px;border-radius:var(--r-chip);font-weight:800;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 var(--drop) 0 var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.swipehint{position:absolute;bottom:80px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px;font-weight:700;animation:dcBob 1.6s ease-in-out infinite;pointer-events:none;z-index:20}

/* ---------- ĆWICZENIA (wpisywanie, klocki, pary, speed) ---------- */
.exhub{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.excard{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 16px 22px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.excard:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.excard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.excard>*{position:relative;z-index:1}
.excard .eemoji{font-size:30px;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);flex:none}
.excard .emeta h3{font-size:16.5px;letter-spacing:-.3px}
.excard .emeta p{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35;font-weight:600}
.exprompt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.exq{font-size:23px;letter-spacing:-.5px;line-height:1.2;margin-bottom:18px}
.winput{width:100%;padding:15px 16px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:700;outline:none;font-family:var(--font-body)}
.winput:focus{border-color:var(--accent)}
.winput.ok{border-color:var(--tint-acid-line);background:var(--tint-acid)}
.winput.bad{border-color:var(--tint-red-line);background:var(--tint-red)}
.exfb{margin-top:14px;padding:13px 15px;border-radius:var(--r-sm);font-size:15px;line-height:1.45;display:none;border:2px solid var(--line)}
.exfb.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.exfb.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--txt-2)}
.exfb.bad{background:var(--tint-red);border-color:var(--tint-red-line);color:var(--txt-2)}
.exfb b{color:var(--txt)}
/* klocki */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.build{min-height:54px;border-bottom:2px dashed var(--line);padding:8px 4px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{padding:11px 14px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;min-width:44px;min-height:44px;text-align:center;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s;font-family:var(--font-body)}
.tile:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.tile.used{opacity:.25;pointer-events:none;box-shadow:none}
/* pary */
.matchwrap{display:flex;gap:10px}
.mcol{flex:1;display:flex;flex-direction:column;gap:9px}
.mitem{padding:13px 12px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:14.5px;font-weight:700;line-height:1.3;cursor:pointer;min-height:48px;display:flex;align-items:center;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.mitem:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.mitem.sel{border-color:var(--accent);background:var(--accent-tint)}
.mitem.done{opacity:.35;border-color:var(--tint-acid-line);background:var(--tint-acid);pointer-events:none;box-shadow:none}
.mitem.bad{border-color:var(--red);background:var(--tint-red);animation:dcShake .55s ease-in-out both}

/* ============================================================
   KROK 2 — IKONY (inline SVG z engine.icon()) i MONOGRAMY zamiast emoji
   Reguły tylko dopisane; kolory wyłącznie przez tokeny z :root.
   ============================================================ */
svg.ic{display:inline-block;flex:none;vertical-align:-.2em}
.ic-acid{color:var(--acid)}.ic-gold{color:var(--gold)}.ic-flame{color:var(--flame)}.ic-red{color:var(--red)}
.ic-cyan{color:var(--cyan)}.ic-muted{color:var(--muted)}.ic-dim{color:var(--muted-3)}.ic-accent{color:var(--accent)}
/* przyciski i plakietki z ikoną: flex + odstęp (spacja w etykiecie jest wtedy ignorowana) */
.pill,.fbtn,.backbtn,.lessonhead .x{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pill.qnext.show{display:inline-flex}
.subtab,.chips .chip{display:inline-flex;align-items:center;gap:6px}
.subtab .ic{opacity:.85}.subtab.active .ic{opacity:1}
.timer{display:inline-flex;align-items:center;gap:6px}
.toast{display:flex;align-items:center;gap:7px}
.real .lbl,.mnemo .lbl{display:flex;align-items:center;gap:6px}
.subjcard .chev{display:flex;align-items:center}
.hero h1{display:flex;align-items:center;gap:12px}
.exfb .ic{vertical-align:-.25em}
.addcard .subjemoji{color:var(--acid)}
.excard .eemoji{color:var(--accent)}

/* monogram: pierwsza litera nazwy w kafelku w kolorze przedmiotu (DESIGN.md §1) */
.mono{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:15px;
      background:var(--accent-tint);border:2px solid var(--accent-tint-line);color:var(--accent);
      font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.5px;line-height:1}
.mono.sm{width:34px;height:34px;border-radius:11px;font-size:16px}
.subjcard .subjemoji.mono{width:64px;height:64px;border-radius:var(--r-md);font-size:30px;
      background:color-mix(in srgb,var(--sa) 14%,var(--surface));border-color:color-mix(in srgb,var(--sa) 36%,var(--surface));color:var(--sa)}

/* ścieżka: check / bolt / lock w węźle, gwiazdki jako małe ikony w pigułce pod węzłem */
.nodebtn .stars{display:flex;align-items:center;gap:2px;bottom:-13px;padding:3px 7px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-chip);box-shadow:0 2px 0 var(--shadow)}
.starrow{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin-left:6px}

/* wynik: duży okrągły kafel z ikoną (LevelComplete.html) zamiast emoji 60px */
.result .big{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0;
      background:var(--accent);color:var(--on-accent);box-shadow:0 8px 0 var(--accent-dark);margin-bottom:4px}
.result .big.ok{background:var(--acid);color:var(--on-acid);box-shadow:0 8px 0 var(--acid-dark)}
.result .big.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 8px 0 var(--gold-dark)}
.result .big.hot{background:var(--amber);color:var(--on-amber);box-shadow:0 8px 0 var(--amber-dark)}
.result .big.fail{background:var(--red);color:var(--on-red);box-shadow:0 8px 0 var(--red-dark)}
/* miejsce na pigułkę gwiazdek pod zaliczonym węzłem; przyciski z 2-liniową etykietą nie wychodzą poza 58px */
.pathnode:has(.node-done) .nodelabel{margin-top:10px}
.pill{height:auto;min-height:58px;padding:8px 16px;line-height:1.2}

/* ============================================================
   KROK 3 — EKRAN „DZIŚ”, KAFLE PRZEDMIOTÓW, DOLNA NAWIGACJA, PROFIL / USTAWIENIA / SERIA / PUSTY STAN
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* motyw na kontenerze: --accent inline (z data/*.js), pochodne liczone lokalnie (na :root nie przeliczają się dla dzieci) */
.themed{--accent-tint:color-mix(in srgb,var(--accent) 14%,var(--surface));--accent-tint-line:color-mix(in srgb,var(--accent) 36%,var(--surface));
        --accent-shadow:color-mix(in srgb,var(--accent) 10%,var(--bg));--accent-dark:color-mix(in srgb,var(--accent) 68%,var(--ink))}
html.reduce-motion *{animation:none !important;transition:none !important}
#app{overflow:hidden}
.topbar{position:relative}

/* topbar: marka „NAUKA.” i tytuł widoku; pigułka serii jako przycisk */
.logo.brand{gap:0;color:var(--txt)}
.logo.ttl{font-size:18px;letter-spacing:-.4px;flex:1}
button.streak{cursor:pointer;font-family:var(--font-body);transition:transform .08s}
button.streak:active{transform:translateY(2px)}

/* tło: płaskie koło w rogu (a-float), pod treścią */
.blob{position:absolute;top:-130px;right:-100px;width:300px;height:300px;border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--violet) 22%,var(--bg))}
.blob.acid{top:60px;right:-90px;width:280px;height:280px;background:color-mix(in srgb,var(--acid) 12%,var(--bg))}
.blob.pink{top:auto;right:auto;bottom:120px;left:-100px;width:240px;height:240px;background:var(--tint-pink)}
.blob.amber{top:60px;right:auto;left:50%;margin-left:-140px;width:280px;height:280px;background:color-mix(in srgb,var(--amber) 12%,var(--tint-amber))}
.screen>.scroll{position:relative;z-index:1}

/* układ widoków głównych: kolumna z odstępem 13px jak w Main.html */
.today,.subjects,.profile,.settings{display:flex;flex-direction:column;gap:13px;padding-top:8px}
.today>*,.subjects>*,.profile>*,.settings>*{flex:none}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted-2)}
.eyebrow.sec{font-size:11px;margin-top:4px}
.today h1,.subjects h1{font-size:30px;letter-spacing:-1px;line-height:1.05;margin-top:6px}
.planbar{display:flex;align-items:center;gap:10px}
.planbar .bar{flex:1}
.planbar .bar i{background:var(--acid)}
.planbar span{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.sechdr{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.link{background:none;border:none;color:var(--acid);font-size:12.5px;font-weight:800;font-family:var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 4px}

/* mini-kafle pod paskiem: Misje (złoty tint) i Seria (bursztynowy tint) */
.minitiles{display:flex;gap:8px}
.minitile{flex:1;display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 12px;min-height:44px;font-size:12.5px;font-weight:800;font-family:var(--font-body);
          background:var(--surface);border:2px solid var(--line);color:var(--txt-2);text-align:left;cursor:default}
button.minitile{cursor:pointer;transition:transform .08s}
button.minitile:active{transform:translateY(2px)}
.minitile.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 35%,var(--txt))}
.minitile.amber{background:var(--tint-amber);border-color:var(--tint-amber-line);color:color-mix(in srgb,var(--amber) 35%,var(--txt))}

/* karta planu: wiersze zrobione / bieżący / późniejsze (Main.html) */
.plan{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:8px;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column}
.plan-row{display:flex;align-items:center;gap:13px;padding:11px 10px;min-height:58px;width:100%;background:none;border:none;border-radius:18px;
          text-align:left;color:var(--txt);font-family:var(--font-body);cursor:pointer}
.plan-row.cur{background:var(--accent-tint);border:2px solid var(--accent-tint-line);margin:4px 0;padding:12px 10px}
.plan-sep{height:2px;background:var(--line-2);margin:0 10px;flex:none}
.plan-tile{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--muted)}
.plan-row.done .plan-tile{background:var(--acid);color:var(--on-acid)}
.plan-row.cur .plan-tile{background:var(--accent);color:var(--on-accent)}
.plan-row .pt{flex:1;min-width:0}
.plan-row .t{font-size:14px;font-weight:700;color:var(--txt-2);line-height:1.25}
.plan-row.cur .t{font-size:14.5px;font-weight:800;color:var(--txt)}
.plan-row.done .t{color:var(--muted-2);text-decoration:line-through}
.plan-row .s{font-size:12px;font-weight:600;color:var(--muted-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-row.cur .s{color:color-mix(in srgb,var(--accent) 30%,var(--txt-2))}
.plan-row .rw{font-size:12px;font-weight:800;color:var(--muted-3);flex:none}
.plan-row .chev{color:var(--muted-3)}
.plan-row.cur .chev{color:color-mix(in srgb,var(--accent) 30%,var(--txt-2))}

/* siatka 2 kolumn i kafel przedmiotu: tint przedmiotu, monogram na pełnym akcencie (DESIGN.md §1), pasek poziomów */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.subjtile{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 10px;border-radius:22px;min-height:44px;
          background:var(--accent-tint);border:2px solid var(--accent-tint-line);box-shadow:0 4px 0 var(--accent-shadow);
          color:var(--txt);font-family:var(--font-body);cursor:pointer;text-align:center;transition:transform .08s,box-shadow .08s}
.subjtile:active{transform:translateY(4px);box-shadow:0 0 0 var(--accent-shadow)}
.subjtile .mono{width:44px;height:44px;border-radius:15px;font-size:22px}
.subjtile .name{font-size:13px;font-weight:800;line-height:1.25}
.subjtile .bar{width:100%;height:7px;background:var(--accent-shadow)}
.subjtile .bar i{background:var(--accent)}
.subjtile small{font-size:11px;font-weight:700;color:color-mix(in srgb,var(--accent) 30%,var(--txt-2))}
.subjtile.add{background:var(--surface-2);border:2px dashed var(--line-dash);box-shadow:none;justify-content:center}
.subjtile.add:active{transform:none}
.subjtile.add .mono{background:var(--line-2);border-color:var(--line-2);color:var(--acid)}
.subjtile.add .name{color:var(--acid)}
.mono.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mono.xs{width:32px;height:32px;border-radius:11px;font-size:15px}
.addcard .hint{font-size:12.5px;font-weight:600}

/* dolna nawigacja: 4 cele po 44+ px, aktywny w kolorze akcji */
.nav{justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{flex:0 0 68px;gap:4px;padding:4px 0;min-height:48px;font-size:10.5px}
.nav button .ic{transition:transform .08s}
.nav button:active .ic{transform:translateY(2px)}

/* profil: awatar, 4 kafle statystyk, lista XP w przedmiotach */
.prof{display:flex;align-items:center;gap:16px}
.avatar{width:72px;height:72px;border-radius:24px;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 5px 0 var(--acid-dark)}
.pmeta{flex:1;min-width:0}
.pmeta h2{font-size:23px;letter-spacing:-.7px}
.pmeta .s{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px}
.pmeta .planbar{margin-top:8px}
.stats{gap:11px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 4px 0 var(--shadow);text-align:left;color:var(--txt);font-family:var(--font-body)}
button.stat{cursor:pointer;transition:transform .08s,box-shadow .08s}
button.stat:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.stat .k{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-2)}
.stat .v{font-family:var(--font-display);font-size:30px;font-weight:800;margin-top:8px;line-height:1.1;letter-spacing:-.5px}
.stat .s{font-size:11.5px;font-weight:600;color:var(--muted-2);margin-top:2px}

/* ustawienia: karta z wierszami, przełącznik, reset */
.setcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:4px 15px;box-shadow:0 4px 0 var(--shadow)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;min-height:52px;width:100%;background:none;border:none;color:var(--txt);font-family:var(--font-body);text-align:left}
button.setrow{cursor:pointer}
.setrow .grow{flex:1;min-width:0}
.setrow .t{font-size:14px;font-weight:700}
.setrow .t.muted{color:var(--muted);font-weight:600}
.setrow .s{font-size:11.5px;font-weight:600;color:var(--muted-2);margin-top:2px}
.setrow .v{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.setrow .v.acid,.setrow.acid{color:var(--acid)}
.setrow.acid .t{font-weight:800}
.setrow .chev{color:var(--muted-3)}
.setsep{height:2px;background:var(--line-2)}
.toggle{width:48px;height:28px;border-radius:var(--r-chip);background:var(--line-2);padding:3px;display:flex;justify-content:flex-start;border:none;flex:none;cursor:pointer;transition:background .15s}
.toggle i{width:22px;height:22px;border-radius:50%;background:var(--muted-3);display:block;transition:transform .15s,background .15s}
.toggle.on{background:var(--acid)}
.toggle.on i{background:var(--on-acid);transform:translateX(20px)}
.pill.danger{background:var(--red);color:var(--on-red);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.pill.danger:active{box-shadow:0 0 0 var(--red-dark)}
.version{font-size:12px;font-weight:600;color:var(--muted-3);padding:4px}

/* seria: bursztynowa górna strefa, płomień, licznik, kropki tygodnia */
.streakbg{position:absolute;top:0;left:0;right:0;height:420px;background:var(--tint-amber)}
.streakview{display:flex;flex-direction:column;gap:14px;padding:14px 18px 30px;min-height:100%}
.streakview>*{flex:none}
.streakclose{align-self:flex-end;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
             background:color-mix(in srgb,var(--amber) 12%,var(--tint-amber));color:color-mix(in srgb,var(--amber) 40%,var(--txt-2))}
.streakhero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 4px;text-align:center}
.streakn{font-family:var(--font-display);font-size:76px;font-weight:800;letter-spacing:-3px;line-height:.9;color:var(--amber)}
.streakt{font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.6px;color:color-mix(in srgb,var(--amber) 25%,var(--txt))}
.streakp{font-size:14px;font-weight:600;color:color-mix(in srgb,var(--amber) 45%,var(--muted));max-width:280px;line-height:1.45}
.week{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px 16px;box-shadow:0 5px 0 var(--shadow);margin-top:60px}
.week .eyebrow{font-size:10.5px;letter-spacing:1.2px}
.days{display:flex;justify-content:space-between;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:800;color:var(--muted)}
.day.future{color:var(--muted-3)}
.day.today,.day.todaydone{color:color-mix(in srgb,var(--amber) 25%,var(--txt))}
.dot{width:38px;height:38px;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--on-amber)}
.day.done .dot{background:var(--flame)}
.day.todaydone .dot{background:var(--amber);border:3px solid color-mix(in srgb,var(--amber) 25%,var(--txt));animation:dcPulse 1.5s ease-in-out infinite}
.day.today .dot{background:var(--tint-amber);border:2px solid var(--amber);color:var(--amber);animation:dcPulse 1.5s ease-in-out infinite}
.day.future .dot{border:2px dashed var(--line-dash)}
.streakfoot{margin-top:auto;padding-top:14px}
.pill.amber{background:var(--amber);color:var(--on-amber);box-shadow:0 var(--drop-btn) 0 var(--amber-dark)}
.pill.amber:active{box-shadow:0 0 0 var(--amber-dark)}

/* pusty stan: brak przedmiotów w data/ (EmptyState.html) */
.empty{display:flex;flex-direction:column;gap:22px;padding:24px 22px 26px;min-height:100%}
.empty>*{flex:none}
.art{position:relative;width:190px;height:150px;margin:10px auto}
.art-a{position:absolute;top:18px;left:6px;width:120px;height:120px;border-radius:30px;background:var(--surface);border:2px solid var(--line)}
.art-b{position:absolute;top:8px;left:30px;width:120px;height:120px;border-radius:30px;background:var(--tint-pink);border:2px solid var(--tint-pink-line)}
.art-c{position:absolute;top:0;left:56px;width:124px;height:124px;border-radius:32px;background:var(--acid);color:var(--on-acid);box-shadow:0 7px 0 var(--acid-dark);display:flex;align-items:center;justify-content:center}
.empty h1{font-size:31px;letter-spacing:-1.1px;line-height:1.08}
.empty p{font-size:14px;font-weight:600;color:var(--muted);margin-top:9px;line-height:1.5}
.steps{display:flex;flex-direction:column;gap:13px}
.step{display:flex;align-items:center;gap:14px}
.step .num{width:40px;height:40px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--acid)}
.step .t{font-size:14.5px;font-weight:800}
.step .s{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.efoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}

/* ============================================================
   KROK 4 — ŚCIEŻKA, ROLADKA, QUIZ (DESIGN.md §5.4): pas nagłówka przedmiotu, wężyk ze skrzyniami, dymek ZACZNIJ,
   roladka na pełnym ekranie z paskiem segmentowym, kafle quizu 3D, panel dobrze/źle/koniec żyć (.sheet),
   serca (.hearts), combo, konfetti, LevelComplete. Tylko dopisane reguły; kolory przez tokeny i color-mix.
   ============================================================ */
/* pas nagłówka przedmiotu (Path.html): wstecz, monogram + nazwa, pasek poziomów, info, serca; pod spodem chipy zakładek */
.band{position:relative;z-index:30;padding:14px 18px 12px;background:var(--surface-2);border-bottom:2px solid var(--line)}
.brow{display:flex;align-items:center;gap:10px}
.bmeta{flex:1;min-width:0}
.bname{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.bname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname .mono.xs{width:26px;height:26px;border-radius:9px;font-size:13px}
.bprog{display:flex;align-items:center;gap:8px;margin-top:7px}
.bprog .bar{flex:1;height:10px}
.bprog span{font-size:11.5px;font-weight:800;color:color-mix(in srgb,var(--accent) 30%,var(--txt-2));white-space:nowrap}
.bprog b{color:var(--txt)}
.infobtn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:transform .08s}
.infobtn:active{transform:translateY(2px)}
.infobtn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.band .subtabs{padding:0;margin-top:12px}
.subtab{border:none;min-height:38px}
.subtab:not(.active){border:2px solid var(--line)}
/* serca: pigułka (w pasie przedmiotu i w nagłówku lekcji) */
.hearts{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-chip);padding:8px 12px 8px 10px;flex:none;min-height:40px;color:var(--red-soft);font-family:var(--font-body);font-size:14px;font-weight:800;cursor:pointer;transition:transform .08s}
.hearts:active{transform:translateY(2px)}
.hearts .ic{color:var(--red)}
.hearts.zero{color:var(--muted-2)}.hearts.zero .ic{color:var(--tint-red-line)} /* .zero, nie .empty (kolizja z pustym stanem) */
.hearts .minus{font-size:12px;color:var(--red)}
.counter.red{color:var(--red-soft);display:inline-flex;align-items:center;gap:3px}
.counter.red .ic{color:var(--red)}

/* ścieżka: karta rozdziału + wężyk */
.pathview{padding:14px 18px 150px;position:relative}
.blob.mid{top:210px;left:50%;right:auto;margin-left:-150px;width:300px;height:300px}
.chapter{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:var(--accent-tint);border:2px solid var(--accent-tint-line);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--accent-shadow);color:color-mix(in srgb,var(--accent) 30%,var(--txt-2))}
.chapter>i{width:6px;height:26px;border-radius:3px;background:var(--accent);flex:none}
.chapter .grow{flex:1;min-width:0}
.chapter .eyebrow{font-size:10.5px;letter-spacing:1.2px;color:inherit}
.chapter .t{font-size:14px;font-weight:800;color:var(--txt);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{position:relative;z-index:1;padding:8px 0 0;gap:6px}
.pathnode{gap:0}
.pathnode.cur{padding-top:52px}
.connector.first{margin-top:2px}
.nodelabel{margin-top:12px;font-size:12px;max-width:150px}
.nodelabel.cur{color:var(--acid);font-size:12.5px}
.nodelabel.lock{color:var(--muted-2)}
.nodelabel.gold{color:var(--gold)}
.node-lock{color:var(--muted-2)}
.node-chest{width:74px;height:74px;border-radius:18px;background:var(--surface);border:2px solid var(--tint-gold-line);color:var(--gold);box-shadow:0 var(--drop-node) 0 var(--shadow);cursor:pointer}
.node-chest:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
.pathnode:has(.node-done) .nodelabel{margin-top:18px}
/* dymek ZACZNIJ nad bieżącym węzłem (trójkąt = obrócony kwadrat, bez przezroczystych obramowań) */
.bubble{position:absolute;top:0;left:50%;margin-left:-54px;width:108px;background:var(--acid);color:var(--on-acid);border-radius:12px;padding:8px 0;text-align:center;font-size:12px;font-weight:800;letter-spacing:1px;box-shadow:0 4px 0 var(--acid-dark);z-index:2}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:12px;height:12px;background:var(--acid);transform:translateX(-50%) rotate(45deg);border-radius:2px}

/* roladka na pełnym ekranie (Lesson.html) */
.lessonhead{padding:14px 18px 0;gap:12px}
.segbar{flex:1;display:flex;gap:5px}
.segbar i{flex:1;height:10px;border-radius:999px;background:var(--line-2)}
.segbar i.on{background:var(--acid)}
.segbar i.bad{background:var(--red)}
.lessonbody{padding:18px 18px 0;overflow:hidden}
.lesson .fcard{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;border-radius:28px;padding:22px 20px;box-shadow:0 6px 0 var(--shadow)}
.fcard .fin{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.fcard .fin::-webkit-scrollbar{display:none}
.fcard .fin>*{flex:none}
.fcard .fin .tag{align-self:flex-start;margin:0}
.tag.accent{background:var(--accent-tint);border-color:var(--accent-tint);color:var(--accent)}
.lesson .ftitle{font-size:28px;letter-spacing:-.9px;line-height:1.1;margin:0}
.lesson .fbody{font-size:15.5px;line-height:1.55}
.lesson .real,.lesson .mnemo{margin:0;border-radius:18px;padding:14px 16px}
.lessonfoot{padding:16px 18px calc(24px + env(safe-area-inset-bottom))}
.lessonfoot.col{display:flex;flex-direction:column;gap:12px}
.swipehint2{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted-2)}
.pill.text{background:none;box-shadow:none;color:var(--muted);min-height:54px;letter-spacing:1px;font-size:14px}
.pill.text:active{transform:none}
.blob.cyan{top:120px;right:-120px;width:320px;height:320px;background:color-mix(in srgb,var(--cyan) 12%,var(--bg))}

/* quiz: chipy (combo / pytanie N z M), pytanie, kafle 3D z literą, SPRAWDŹ */
.quiz{position:relative;z-index:1;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0;overflow-y:auto;padding:4px 0 8px;scrollbar-width:none}
.quiz::-webkit-scrollbar{display:none}
.qchips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qchips .qn,.combo{display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--r-chip);font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;line-height:1.2}
.qchips .qn{background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.combo{background:var(--tint-gold);color:var(--gold)}
.combo.bad{background:var(--tint-red);color:var(--red-soft)}
.quiz .qq{font-size:26px;letter-spacing:-.8px;line-height:1.15;margin:0}
.quiz .qq.muted{color:var(--muted)}
.qopts{display:flex;flex-direction:column;gap:12px}
.qopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);padding:14px 16px;border-radius:20px;min-height:60px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);color:var(--txt-2);font-size:14.5px;font-weight:700;line-height:1.35;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.qopt:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.qopt .k{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--line-2);color:var(--muted)}
.qopt .t{flex:1;min-width:0}
.qopt.sel,.qopt.correct{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.qopt.sel .k,.qopt.correct .k{background:var(--acid);color:var(--on-acid)}
.qopt.correct{font-weight:800}
.qopt.wrong{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark);color:color-mix(in srgb,var(--red) 20%,var(--txt));font-weight:800}
.qopt.wrong .k{background:var(--red);color:var(--on-red)}
.qopt.dim{opacity:.55;background:color-mix(in srgb,var(--surface) 60%,var(--bg));border-color:var(--line-2);box-shadow:none;color:var(--muted)}
.qopt.dim .k{color:var(--muted-2)}
.qopt[disabled]{cursor:default}
.qopt[disabled]:active{transform:none}
.pill[disabled]{background:color-mix(in srgb,var(--surface) 70%,var(--line-2));color:var(--muted-2);box-shadow:none;cursor:default}
.pill[disabled]:active{transform:none}
.pill.hide{visibility:hidden}
.quizview .qcheck{margin-top:14px}

/* panel od dołu: dobrze / źle / koniec żyć */
.sheetback{position:absolute;inset:0;z-index:69;background:var(--bg);opacity:.75}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;border-radius:30px 30px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;border-top:3px solid var(--line);background:var(--surface-2);max-height:80dvh}
.sheet.ok{background:var(--tint-acid);border-top-color:var(--acid)}
.sheet.bad{background:var(--tint-red);border-top-color:var(--red)}
.srow{display:flex;align-items:center;gap:12px}
.srow .grow{flex:1;min-width:0}
.sico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acid);color:var(--on-acid);box-shadow:0 4px 0 var(--acid-dark)}
.sheet.bad .sico{background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-dark)}
.sheet .st{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.6px;color:var(--acid);line-height:1.1}
.sheet.bad .st{color:var(--red-soft)}
.sheet .ss{font-size:12.5px;font-weight:700;color:var(--acid-soft);margin-top:2px}
.sheet.bad .ss{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.xpchip{flex:none;background:var(--gold);color:var(--on-gold);border-radius:var(--r-chip);padding:8px 15px;font-size:14px;font-weight:800;box-shadow:0 4px 0 var(--gold-dark);white-space:nowrap}
.sbox{background:color-mix(in srgb,var(--tint-acid) 70%,var(--bg));border-radius:16px;padding:13px 15px;font-size:14px;font-weight:600;line-height:1.5;color:color-mix(in srgb,var(--acid) 30%,var(--txt));overflow-y:auto;min-height:0}
.sheet.bad .sbox{background:color-mix(in srgb,var(--tint-red) 70%,var(--bg));color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.sbox .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--acid-soft);margin-bottom:5px}
.sheet.bad .sbox .lbl{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.sbox b{color:var(--txt)}
.sbtns{display:flex;gap:10px}
.sbtns .pill{flex:1;letter-spacing:1px;font-size:14px}
.pill.red{background:var(--red);color:var(--on-red);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.pill.red:active{box-shadow:0 0 0 var(--red-dark)}
.pill.ghost.red{background:color-mix(in srgb,var(--tint-red) 60%,var(--bg));border-color:var(--tint-red-line);color:var(--red-soft);box-shadow:0 var(--drop-btn) 0 color-mix(in srgb,var(--tint-red) 50%,var(--bg))}
/* koniec żyć (NoHearts.html) */
.sheet.nohearts{border-top-color:var(--red);border-radius:32px 32px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));gap:16px}
.nhh{display:flex;justify-content:center;gap:10px;color:var(--tint-red-line)}
.nht{text-align:center}
.nht .st{font-size:30px;letter-spacing:-1px;color:var(--red-soft)}
.nht .ss{font-size:13.5px;font-weight:600;color:color-mix(in srgb,var(--red) 40%,var(--muted));margin-top:7px;line-height:1.45}
.nht .ss b{color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.nhcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:22px;padding:15px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg));color:var(--txt);font-family:var(--font-body);cursor:pointer;transition:transform .08s,box-shadow .08s}
.nhcard:active{transform:translateY(5px);box-shadow:0 0 0 var(--bg)}
.nhcard .ico{width:46px;height:46px;border-radius:15px;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;flex:none}
.nhcard .grow{flex:1;min-width:0}
.nhcard .t{font-size:15px;font-weight:800;color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.nhcard .s{font-size:12.5px;font-weight:600;color:var(--acid-soft);margin-top:2px}
.nhcard>svg:last-child{color:var(--acid-soft)}

/* konfetti (kolor i rozmiar kawałka przez --c / --s, ustawiane inline z tokenów) */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;display:block;width:var(--s,10px);height:var(--s,10px);border-radius:3px;background:var(--c,var(--acid))}
.confetti i.round{border-radius:50%}

/* LevelComplete.html */
.lessonbody.done{padding:0 22px}
.done .blob{top:60px;left:50%;right:auto;margin-left:-170px;width:340px;height:340px;background:color-mix(in srgb,var(--acid) 12%,var(--bg))}
.done .blob.red{background:color-mix(in srgb,var(--red) 12%,var(--bg))}
.lc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:52px 0 12px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;width:100%}
.lc::-webkit-scrollbar{display:none}
.lc>*{flex:none}
.lcstars{display:flex;align-items:flex-end;gap:10px}
.lcbig{width:132px;height:132px;border-radius:50%;background:var(--acid);color:var(--on-acid);box-shadow:0 8px 0 var(--acid-dark);display:flex;align-items:center;justify-content:center}
.lcbig.fail{background:var(--red);color:var(--on-red);box-shadow:0 8px 0 var(--red-dark)}
.lctxt{text-align:center}
.lct{font-family:var(--font-display);font-size:36px;font-weight:800;letter-spacing:-1.3px;line-height:1.05}
.lcs{font-size:14.5px;font-weight:700;color:var(--muted);margin-top:8px}
.lcstats{width:100%;display:flex;gap:10px}
.lcstat{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.lcstat .k{font-size:10px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-2)}
.lcstat .v{font-family:var(--font-display);font-size:26px;font-weight:800;margin-top:4px;line-height:1.1}
.lcstat .v.gold{color:var(--gold)}.lcstat .v.acid{color:var(--acid)}.lcstat .v.pink{color:var(--pink)}
.lcp{font-size:14px;font-weight:600;color:var(--muted);text-align:center;line-height:1.45;max-width:300px}
.lcstreak{width:100%;display:flex;align-items:center;gap:13px;background:var(--tint-amber);border:2px solid var(--tint-amber-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--tint-amber) 60%,var(--bg));color:var(--txt);font-family:var(--font-body);text-align:left;cursor:pointer;transition:transform .08s}
.lcstreak:active{transform:translateY(4px)}
.lcstreak .ico{width:44px;height:44px;border-radius:14px;background:var(--flame);color:var(--on-amber);display:flex;align-items:center;justify-content:center;flex:none}
.lcstreak .grow{flex:1;min-width:0}
.lcstreak .t{font-size:15px;font-weight:800}
.lcstreak .s{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--amber) 45%,var(--muted));margin-top:2px}
.lcstreak>svg:last-child{color:color-mix(in srgb,var(--amber) 45%,var(--muted))}
.lessonfoot .pill.a-glow{min-height:60px;border-radius:20px}
/* akcja w lekcji i w panelu „dobrze” zawsze w kwaśnej limonce (Lesson/QuizCorrect/LevelComplete.html), nie w kolorze przedmiotu */
.lesson .pill:not(.text):not([disabled]),.sheet.ok .pill{background:var(--acid);color:var(--on-acid);box-shadow:0 var(--drop-btn) 0 var(--acid-dark)}
.lesson .pill:not(.text):not([disabled]):active,.sheet.ok .pill:active{box-shadow:0 0 0 var(--acid-dark)}

/* ============================================================
   KROK 5 — NOWE TYPY ZADAŃ (DESIGN.md §4.1 / §5.5): tf, fill, match, order, sort
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* wspólna rama zadania (jak .quiz): chipy typu / combo / „Zadanie N z M”, tytuł, podtytuł, stopka z przyciskami */
.task{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow-y:auto;padding:4px 0 8px;scrollbar-width:none}
.task::-webkit-scrollbar{display:none}
.task>*{flex:none}
.task>.tfcard{flex:1 1 auto} /* karta zdania wypełnia wolne miejsce, kropki tuż nad przyciskami (TaskTrueFalse.html) */
.tchip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:var(--r-chip);font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;line-height:1.2}
.tchip.gold{background:var(--tint-gold);color:var(--gold)}
.tchip.pink{background:var(--tint-pink);color:color-mix(in srgb,var(--pink) 60%,var(--txt))}
.tchip.cyan{background:var(--tint-cyan);color:var(--cyan)}
.tchip.acid{background:var(--tint-acid);color:var(--acid)}
.ttitle{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.tsub{font-size:13px;font-weight:600;color:var(--muted);margin-top:5px;line-height:1.4}
.tfoot{display:flex;flex-direction:column;gap:10px}
.tfoot .hide{display:none}
.tflist{display:flex;flex-direction:column;gap:6px}
.tsep{height:2px;background:var(--line-2)}
.quizview .tfoot{margin-top:14px}

/* prawda / fałsz (TaskTrueFalse.html): runda na czas, karta zdania, kropki, wyjaśnienie, dwa duże przyciski 3D */
.timerbar{display:flex;align-items:center;gap:12px}
.timerbar .grow{flex:1;min-width:0}
.timerbar .eyebrow{color:var(--amber-soft);font-size:11px;letter-spacing:1.2px}
.timerbar .bar{margin-top:5px;height:10px}
.timerbar .bar i{background:var(--flame);transition:width 1s linear}
.ttime{display:inline-flex;align-items:center;gap:5px;color:var(--amber-soft);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.tfcard{background:var(--surface);border:2px solid var(--line);border-radius:30px;padding:28px 24px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:210px;text-align:center;transition:background .2s,border-color .2s}
.tfcard.okk{background:var(--tint-acid);border-color:var(--tint-acid-line)}
.tfcard.badd{background:var(--tint-red);border-color:var(--tint-red-line);animation:dcShake .55s ease-in-out both}
.tfq{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.9px;line-height:1.2;color:var(--txt)}
.tfmeta{padding:7px 14px;border-radius:var(--r-chip);background:var(--tint-amber);color:var(--amber);font-size:11.5px;font-weight:800}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.dots i.ok{background:var(--acid)}.dots i.bad{background:var(--red)}
.tfexp{display:none;padding:12px 15px;border-radius:16px;font-size:13.5px;font-weight:600;line-height:1.45;border:2px solid var(--line)}
.tfexp.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.tfexp.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.tfexp.bad{background:var(--tint-red);border-color:var(--tint-red-line);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.tfbtns{display:flex;gap:12px}
.tfbtn{flex:1;height:76px;border:none;border-radius:22px;cursor:pointer;font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:800;letter-spacing:1.2px;transition:transform .08s,box-shadow .08s}
.tfbtn.yes{background:var(--acid);color:var(--on-acid);box-shadow:0 6px 0 var(--acid-dark)}
.tfbtn.no{background:var(--red);color:var(--on-red);box-shadow:0 6px 0 var(--red-dark)}
.tfbtn:active{transform:translateY(6px);box-shadow:0 0 0 var(--bg)}
.tfbtn[disabled]{cursor:default}

/* uzupełnij zdanie (TaskFill.html): karta zdania ze slotami, bank kafelków, podpowiedź */
.fillcard{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 6px 0 var(--shadow)}
.filltxt{font-size:17px;font-weight:700;line-height:2.1;color:var(--txt-2)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:96px;min-height:36px;padding:5px 12px;margin:0 2px;border-radius:12px;background:var(--surface-2);border:2px dashed var(--muted-3);color:var(--muted-3);font-family:var(--font-body);font-size:15px;font-weight:800;line-height:1.3;vertical-align:middle;cursor:pointer}
.slot.filled{background:var(--tint-acid);border:2px solid var(--acid);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.slot.ok{border-color:var(--tint-acid-line)}
.slot.bad{background:var(--tint-red);border:2px solid var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.slot[disabled]{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.wordtile{min-height:48px;padding:12px 18px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);color:var(--txt);font-family:var(--font-body);font-size:14.5px;font-weight:800;cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s}
.wordtile:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.wordtile.used{background:var(--surface-2);border:2px dashed var(--line);color:var(--muted-3);box-shadow:none;cursor:default}
.wordtile.used:active{transform:none}
.wordtile.sel,.wordtile.drag{background:var(--violet);border-color:var(--violet);color:var(--on-violet);box-shadow:0 8px 0 var(--violet-shadow)}
.wordtile.drag{z-index:5;transition:none;animation:none}
.pool .wordtile{touch-action:none;user-select:none;-webkit-user-select:none}
.hintbox{display:flex;align-items:center;gap:10px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-radius:18px;padding:13px 15px;font-size:13.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.hintbox .ic{color:var(--gold)}

/* połącz w pary (TaskMatch.html): dwie kolumny kafli 3D, wybrany = cyjan + puls, para = limonka wygaszona, chybienie = czerwień + a-shake */
.matchcols{display:flex;gap:12px}
.matchcols .mcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.mbtn{min-height:76px;cursor:pointer;font-family:var(--font-body);text-align:left;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:18px;padding:13px;font-size:13.5px;font-weight:800;color:var(--txt-2);line-height:1.3;display:flex;align-items:center;gap:8px;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.mbtn.r{font-weight:700;font-size:13px;line-height:1.35}
.mbtn:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.mbtn.sel{background:var(--tint-cyan);border-color:var(--cyan);box-shadow:0 4px 0 var(--tint-cyan-line);color:color-mix(in srgb,var(--cyan) 30%,var(--txt));animation:dcPulse 1.5s ease-in-out infinite}
.mbtn.done{background:var(--tint-acid);border-color:var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 45%,var(--muted));opacity:.7;box-shadow:none;cursor:default}
.mbtn.done .ic{color:var(--acid)}
.mbtn.done:active{transform:none}
.mbtn.bad{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}

/* ustaw kolejność (TaskOrder.html): wiersz z numerem, tekstem, strzałkami ▲▼ i uchwytem; przeciągany = fiolet, po sprawdzeniu limonka/czerwień */
.orderlist{display:flex;flex-direction:column;gap:10px}
.orderitem{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:7px 6px 7px 12px;box-shadow:0 4px 0 var(--shadow);min-height:58px;position:relative;transition:background .15s,border-color .15s}
.onum{width:30px;height:30px;border-radius:10px;background:var(--line-2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}
.otxt{flex:1;min-width:0;font-size:14.5px;font-weight:800;color:var(--txt-2);line-height:1.25;padding-left:5px}
.ud{width:40px;height:44px;border:none;background:none;color:var(--muted-2);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-family:var(--font-body)}
.ud:active{background:var(--line-2)}
.ud[disabled]{opacity:.25;cursor:default}
.ud[disabled]:active{background:none}
.handle{width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted-3);flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:12px}
.orderitem.drag{background:var(--tint-pink);border-color:var(--violet);box-shadow:0 10px 0 var(--violet-shadow);z-index:5;transition:none}
.orderitem.drag .onum{background:var(--violet);color:var(--on-violet)}
.orderitem.drag .otxt{color:var(--txt)}
.orderitem.drag .handle{color:var(--violet-soft);cursor:grabbing}
.orderitem.ok{background:var(--tint-acid);border-color:var(--tint-acid-line)}
.orderitem.ok .onum{background:var(--acid);color:var(--on-acid)}
.orderitem.bad{background:var(--tint-red);border-color:var(--tint-red-line);animation:dcShake .55s ease-in-out both}
.orderitem.bad .onum{background:var(--red);color:var(--on-red)}

/* przypisz do kategorii (TaskSort.html): siatka koszyków ze strefą „upuść tutaj”, pula kafelków; wybrany kafelek = fiolet + a-bob */
.buckets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.bucket{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:13px;min-height:118px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:background .15s,border-color .15s}
.bhead{font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted-2)}
.bitem{min-height:44px;padding:9px 12px;border-radius:13px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 35%,var(--txt));font-size:12.5px;font-weight:800;text-align:left;font-family:var(--font-body);cursor:pointer;line-height:1.3}
.bitem.bad{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.bitem[disabled]{cursor:default}
.bdrop{flex:1;min-height:34px;border-radius:13px;border:2px dashed var(--line-dash);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--violet-soft)}
.bucket.hot{background:var(--tint-pink);border-color:var(--violet);animation:dcGlow 2.2s ease-in-out infinite}
.bucket.hot .bhead{color:var(--violet-soft)}
.bucket.hot .bdrop{border-color:var(--violet);animation:dcBlink 1.2s ease-in-out infinite}
.bucket.over{background:color-mix(in srgb,var(--violet) 45%,var(--surface));border-color:var(--txt)}
.bucket.over .bdrop{border-color:var(--txt);color:var(--txt);animation:none}

/* ============================================================
   KROK 5b — POZOSTAŁE TYPY ZADAŃ (DESIGN.md §4.1): typeterm, swipe, thesis, scenario, finderror, timeline, chain, chart, mathsteps, hotspot
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
.tchip.red{background:var(--tint-red);color:var(--red-soft)}
.tchip.violet{background:var(--tint-pink);color:var(--violet-soft)}
.ttitle.sm{font-size:21px}
.trow{display:flex;align-items:flex-start;gap:10px}
.trow .ttitle{flex:1;min-width:0}
.tcount{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);padding-top:7px}
/* mniejsze kafle A–D (Scenario / ChartRead): jak .qopt w quizie, 54 px */
.qopt.sm{min-height:54px;padding:12px 14px;font-size:14px;border-radius:18px;gap:13px}
.qopt.sm .k{width:30px;height:30px;font-size:13px;border-radius:10px}
.qopts{display:flex;flex-direction:column;gap:10px}

/* wpisz pojęcie (TypeTerm.html): karta definicji, pole w limonkowej ramce, kreski liter, podpowiedź i „nie pamiętam” */
.defcard,.scenecard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--shadow)}
.deftext{font-size:16.5px;font-weight:700;line-height:1.5;color:var(--txt);margin-top:9px}
.termbox{display:flex;align-items:center;margin-top:9px;background:var(--surface-2);border:2px solid var(--acid);border-radius:18px;padding:13px 16px;box-shadow:0 4px 0 var(--tint-acid);transition:border-color .15s,background .15s}
.termbox.ok{background:var(--tint-acid);border-color:var(--tint-acid-line)}
.termbox.bad{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--tint-red)}
.terminput{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt);font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.5px;min-height:32px}
.terminput[disabled]{opacity:1}
.letters{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap}
.letters i{width:20px;height:5px;border-radius:3px;background:var(--line-2)}
.letters i.on{background:var(--acid)}
.letters b{width:10px}
.termmeta{font-size:12px;font-weight:700;color:var(--muted-2);margin-top:7px}
.termbtns{display:flex;gap:10px}
.hintbtn{flex:1;cursor:pointer;font-family:var(--font-body);min-height:46px;border-radius:15px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;padding:0 10px}
.hintbtn.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.hintbtn[disabled]{opacity:.6;cursor:default}

/* dwie kategorie (Swipe.html): strefy po bokach, stos kart, stempel, kropki, dwa przyciski */
.swipestage{position:relative;height:352px;flex:none;overflow:hidden}
.szone{position:absolute;top:26px;bottom:56px;width:56px;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.szone.l{left:0;border-radius:0 22px 22px 0;background:var(--tint-red);border:2px solid var(--tint-red-line);border-left:none}
.szone.r{right:0;border-radius:22px 0 0 22px;background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-right:none}
.szone span{writing-mode:vertical-rl;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase}
.szone.l span{transform:rotate(180deg);color:var(--red-soft)}
.szone.r span{color:var(--cyan)}
.szone.near.l{border-color:var(--red)}
.szone.near.r{border-color:var(--cyan);animation:dcGlow 2.2s ease-in-out infinite}
.szone.okk{background:var(--tint-acid);border-color:var(--acid)}
.szone.badd{background:var(--tint-red);border-color:var(--red)}
.scard{position:absolute;left:50px;right:50px;top:12px;height:300px;border-radius:28px;background:var(--surface);border:2px solid var(--line)}
.scard.back{top:20px;left:62px;right:62px;transform:rotate(-3deg);background:var(--surface-2);border-color:var(--line-2)}
.scard.front{z-index:2;box-shadow:0 8px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .35s cubic-bezier(.2,.9,.3,1),background .2s,border-color .2s}
.scard.front.grab{transition:none;cursor:grabbing}
.scard.front.to-l{border-color:var(--red)}
.scard.front.to-r{border-color:var(--cyan)}
.scard.front.okk{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 8px 0 var(--acid-dark)}
.scard.front.badd{background:var(--tint-red);border-color:var(--red);box-shadow:0 8px 0 var(--red-dark)}
.scard.front.fly-l{transform:translateX(-140%) rotate(-18deg)}
.scard.front.fly-r{transform:translateX(140%) rotate(18deg)}
.sfront{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--txt);overflow-wrap:anywhere}
.sfront.long{font-size:24px;letter-spacing:-.5px;line-height:1.2}
.ssub{font-size:14px;font-weight:700;color:var(--muted)}
.stamp{position:absolute;top:18px;padding:6px 12px;border-radius:10px;border:3px solid;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:0;transition:opacity .15s}
.stamp.l{left:18px;transform:rotate(-12deg);color:var(--red);border-color:var(--red)}
.stamp.r{right:18px;transform:rotate(12deg);color:var(--cyan);border-color:var(--cyan)}
.scard.to-l .stamp.l,.scard.to-r .stamp.r{opacity:1}
.swipestage .dots{position:absolute;left:0;right:0;bottom:10px}
.dots i.cur{background:var(--cyan)}
.swbtns{display:flex;gap:12px}
.swbtn{flex:1;min-height:62px;border-radius:20px;cursor:pointer;font-family:var(--font-body);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:transform .08s,box-shadow .08s}
.swbtn.l{background:var(--tint-red);border:2px solid var(--tint-red-line);color:var(--red-soft);box-shadow:0 5px 0 var(--shadow)}
.swbtn.r{background:var(--cyan);border:none;color:var(--on-cyan);box-shadow:0 5px 0 var(--cyan-dark)}
.swbtn:active{transform:translateY(5px);box-shadow:0 0 0 var(--bg)}
.swbtn[disabled]{cursor:default}

/* czyja to teza (WhoSaid.html): karta z cudzysłowem, siatka 2 kolumn opcji {name, sub}; wybrana = fiolet */
.thcard{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:22px 20px;box-shadow:0 6px 0 var(--shadow)}
.thcard>.ic{color:var(--line-dash)}
.thtext{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.6px;line-height:1.25;color:var(--txt);margin-top:8px}
.thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
