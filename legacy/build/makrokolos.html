.thopt{cursor:pointer;font-family:var(--font-body);text-align:left;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:18px;padding:14px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.thopt .n{font-size:14.5px;font-weight:800;color:var(--txt);line-height:1.2}
.thopt .s{font-size:11.5px;font-weight:700;color:var(--muted)}
.thopt:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.thopt.sel{background:var(--tint-pink);border-color:var(--violet);box-shadow:0 4px 0 var(--violet)}
.thopt.sel .s{color:var(--violet-soft)}
.thopt.correct{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid)}
.thopt.correct .s{color:var(--acid-soft)}
.thopt.wrong{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark)}
.thopt.wrong .s{color:var(--red-soft)}
.thopt.dim{opacity:.55;box-shadow:none}
.thopt[disabled]{cursor:default}
.thopt[disabled]:active{transform:none}

/* scenariusz (Scenario.html): karta „Sytuacja” */
.scenetext{font-size:15px;font-weight:700;line-height:1.5;color:var(--txt-2);margin-top:8px}

/* znajdź błąd (FindError.html): zdania w karcie; wybrane = czerwień; po sprawdzeniu fałszywe przekreślone + poprawka; chybienie = bursztyn */
.errcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;gap:9px}
.errsent{width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);border:2px solid var(--line-2);color:var(--txt-2);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:700;line-height:1.45;transition:background .15s,border-color .15s}
.errsent.sel{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.errsent.correct{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt));text-decoration:line-through}
.errsent.wrong{border-color:var(--amber);color:var(--amber-soft)}
.errsent.dim{opacity:.55}
.errsent[disabled]{cursor:default}
.errfix{display:none;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.45;border:2px solid var(--line)}
.errfix.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.errfix.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.errfix.bad{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.errfix .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.notebox{display:flex;align-items:center;gap:10px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-radius:16px;padding:12px 14px;font-size:12.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.notebox .ic{color:var(--gold);flex:none}

/* oś czasu (Timeline.html): rok, kropka na osi, slot / przypięte wydarzenie; strefa pod palcem = .over */
.tl{position:relative;display:flex;flex-direction:column;gap:14px}
.tlaxis{position:absolute;left:73px;top:20px;bottom:20px;width:4px;border-radius:2px;background:var(--line-2)}
.tlrow{display:flex;align-items:center;gap:12px;position:relative}
.tlyear{width:54px;flex:none;text-align:right;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--txt)}
.tldot{width:16px;height:16px;border-radius:50%;background:var(--line-2);border:3px solid var(--bg);flex:none;z-index:1}
.tldot.on{background:var(--acid)}
.tldot.cur{background:var(--violet)}
.tlslot,.chslot{min-height:48px;border-radius:16px;border:2px dashed var(--line-dash);background:var(--surface-2);display:flex;align-items:center;padding:0 14px;font-size:12.5px;font-weight:800;color:var(--violet-soft);transition:background .15s,border-color .15s}
.tlslot{flex:1;min-width:0}
.tlslot.cur,.chslot.cur{border-color:var(--violet);background:var(--tint-pink)}
.tlslot.hot,.chslot.hot{border-color:var(--violet);background:var(--tint-pink);animation:dcBlink 1.2s ease-in-out infinite}
.tlslot.over,.chslot.over{background:color-mix(in srgb,var(--violet) 45%,var(--surface));border-color:var(--txt);color:var(--txt);animation:none}
.tlev,.chstep.filled{min-height:48px;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;color:color-mix(in srgb,var(--acid) 25%,var(--txt));line-height:1.3;transition:background .15s,border-color .15s}
.tlev{flex:1;min-width:0}
.tlev .ic,.chstep.filled .ic{color:var(--acid);flex:none}
.tlev.bad,.chstep.bad{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.tlev.bad .ic,.chstep.bad .ic{color:var(--red)}
.tlev[disabled],.chstep[disabled]{cursor:default}

/* łańcuch przyczyn (CauseChain.html): kolumna kroków ze strzałkami; given = zwykła karta, wstawione = limonka, slot „co dalej?” */
.chain{display:flex;flex-direction:column;gap:4px}
.chstep.given{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:14px;font-weight:800;color:var(--txt);box-shadow:0 4px 0 var(--shadow);line-height:1.3}
.chstep.filled{width:100%;font-size:14px}
.charrow{display:flex;justify-content:center;color:var(--muted-3);height:26px;align-items:center}
.chslot{min-height:50px}

/* wykres (ChartRead.html): karta z podpisem, SVG z jedną serią — słupki fiolet, linia cyjan, tekst w tokenach tekstu */
.chartcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 12px 10px;box-shadow:0 6px 0 var(--shadow)}
.chartlbl{font-size:12px;font-weight:800;color:var(--muted);padding:0 6px 6px}
svg.chart{width:100%;height:auto;display:block;font-family:var(--font-body)}
.cgrid{stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:4 5}
.caxis{stroke:var(--line);stroke-width:2}
.cbar{fill:var(--violet)}
.cval{fill:var(--txt-2);font-size:12px;font-weight:800}
.clab{fill:var(--muted-2);font-size:11px;font-weight:700}
.cline{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.cdot{fill:var(--cyan);stroke:var(--bg);stroke-width:2}

/* krok po kroku (MathSteps.html): karta z wierszami wyrażeń, ramka wyjaśnienia, siatka opcji w Bricolage */
.mathcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface-2);min-height:56px}
.mexpr{flex:1;min-width:0;font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--txt);letter-spacing:.5px;line-height:1.15;overflow-wrap:anywhere}
.mnote{font-size:11.5px;font-weight:700;color:var(--muted-2);text-align:right;max-width:44%;line-height:1.3}
.mrow .ic{flex:none}
.mrow.ok{background:var(--tint-acid);border:2px solid var(--tint-acid-line)}
.mrow.ok .mexpr{color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.mrow.ok .mnote{color:var(--acid-soft)}
.mrow.ok .ic{color:var(--acid)}
.mrow.bad{background:var(--tint-red);border:2px solid var(--tint-red-line)}
.mrow.bad .mexpr{color:color-mix(in srgb,var(--red) 20%,var(--txt));text-decoration:line-through}
.mrow.bad .mnote{color:var(--red-soft)}
.mrow.bad .ic{color:var(--red)}
.mexp{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:14px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);font-size:13px;font-weight:700;color:color-mix(in srgb,var(--gold) 55%,var(--txt));line-height:1.4}
.mexp .ic{color:var(--gold);flex:none}
.mrow.next{border:2px dashed var(--violet);background:var(--tint-pink);color:var(--violet-soft);font-size:13px;font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mopt{cursor:pointer;font-family:var(--font-display);min-height:62px;padding:8px 10px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);color:var(--txt);font-size:20px;font-weight:800;line-height:1.15;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.mopt:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.mopt.sel{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.mopt.dim{opacity:.45;box-shadow:none;cursor:default}
.mopt[disabled]:active{transform:none}

/* wskaż na schemacie (Hotspot.html): karta z obrazem, warstwa dotyku, pierścienie (pin = pozycja, ring = animacja), etykiety, chipy kolejnych celów */
.hotcard{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--shadow)}
.hotimg{position:relative;border-radius:16px;overflow:hidden;cursor:crosshair}
.hotimg svg,.hotimg img{width:100%;height:auto;display:block}
.hotlayer{position:absolute;inset:0}
.hotpin{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.hotring{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--acid);box-sizing:border-box}
.hotring.miss{border-color:var(--red);border-width:5px}
.hotring.reveal{border-color:var(--amber)}
.hottag{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);padding:5px 10px;border-radius:10px;background:var(--acid);color:var(--on-acid);font-size:12px;font-weight:800;white-space:nowrap;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.hottag.reveal{background:var(--amber);color:var(--on-amber)}
.hotchips{display:flex;gap:8px;flex-wrap:wrap}
.hotchip{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-2);font-size:12px;font-weight:700;color:var(--muted)}
.hotchip.cur{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--acid)}
.hotchip.done{color:var(--acid-soft);text-decoration:line-through}
/* w lekcji .pill jest limonkowy (krok 4) — przycisk „pokaż, gdzie to jest” w hotspot zostaje ghost; etykieta podpowiedzi typeterm w jednej linii */
.lesson .pill.ghost:not([disabled]){background:var(--surface);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.lesson .pill.ghost:not([disabled]):active{box-shadow:0 0 0 var(--shadow)}
.hintbtn{white-space:nowrap;font-size:12px;padding:0 8px}
/* przeciąganie kafelków/kart nie zaznacza tekstu; pole odpowiedzi w typeterm nadal edytowalne */
.task{-webkit-user-select:none;user-select:none}
.terminput{-webkit-user-select:text;user-select:text}
.hottag{white-space:normal;max-width:170px;width:max-content;text-align:center;line-height:1.3}

/* ============================================================
   KROK 6 — HANDOFF 2.0 + POWTÓRKA SRS: plus w nawigacji (Main.html), arkusze „Dodaj materiał” (QuickAdd/AddSubject.html)
   i „Wyjaśnijmy inaczej” (Explain.html), Review.html, FlashcardsDone.html, Profil (aktywność, odznaki), hub Fiszki.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* dolna nawigacja: Dziś · Powtórka · [+] · Fiszki · Profil; plus 62 px uniesiony o 34 px nad pasek */
.nav{overflow:visible}
.nav button.navplus{flex:0 0 62px;width:62px;height:62px;min-height:62px;margin-top:-34px;padding:0;gap:0;justify-content:center;border-radius:22px;background:var(--acid);color:var(--on-acid);box-shadow:0 5px 0 var(--acid-dark);transition:box-shadow .08s}
.nav button.navplus:active{box-shadow:0 0 0 var(--acid-dark)}
.nav button.navplus .ic{transition:none}
.nav button.navplus:active .ic{transform:none}

/* arkusze pełnej treści: uchwyt, nagłówek z tytułem i zamknięciem */
.shandle{width:44px;height:5px;border-radius:3px;background:var(--line-dash);margin:-6px auto 0;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .st2,.exhead .st2{font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.shead .sclose{width:40px;height:40px;box-shadow:none;color:var(--muted)}
.sheet.quickadd,.sheet.addinfo{border-radius:32px 32px 0 0;border-top-color:var(--acid);padding:14px 18px calc(26px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet.quickadd>*,.sheet.addinfo>*{flex:none}
/* „Dodaj materiał”: duża limonkowa karta zdjęcia, siatka plik / tekst, link do katalogu */
.qabig{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--acid);color:var(--on-acid);border:none;border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--acid-dark);transition:transform .08s,box-shadow .08s}
.qabig:active{transform:translateY(6px);box-shadow:0 0 0 var(--acid-dark)}
.qabig .ico{width:62px;height:62px;border-radius:20px;background:var(--on-acid);color:var(--acid);display:flex;align-items:center;justify-content:center;flex:none}
.qabig .grow{flex:1;min-width:0}
.qabig .t{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px}
.qabig .s{font-size:13px;font-weight:700;color:color-mix(in srgb,var(--on-acid) 75%,var(--acid));margin-top:3px}
.qagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.qatile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;cursor:pointer;font-family:var(--font-body);border-radius:22px;padding:15px 14px;min-height:44px;box-shadow:0 4px 0 var(--shadow);color:var(--txt);background:var(--surface);border:2px solid var(--line);transition:transform .08s,box-shadow .08s}
.qatile:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.qatile.pink{background:var(--tint-pink);border-color:var(--tint-pink-line)}.qatile.pink .ic{color:color-mix(in srgb,var(--pink) 60%,var(--txt))}
.qatile.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line)}.qatile.cyan .ic{color:var(--cyan)}
.qatile .t{font-size:14px;font-weight:800}
.qatile .s{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.qalink{background:none;border:none;cursor:pointer;font-family:var(--font-body);text-align:center;font-size:13px;font-weight:800;color:var(--muted);padding:6px;min-height:44px}
/* „Skąd wziąć materiał?” jako arkusz informacyjny: opis, ramka offline, 3 kroki z README */
.sp{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.45}
.infobox{display:flex;align-items:flex-start;gap:10px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:18px;padding:13px 15px;font-size:13.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.infobox .ic{color:var(--acid);flex:none;margin-top:2px}
.sheet .steps{gap:10px}
.sheet .step .num{width:34px;height:34px;border-radius:11px;font-size:15px}
.sheet .step .t{font-size:13.5px;line-height:1.3}
.sheet .step .s{font-size:12px}
.sheet code{font-family:inherit;font-weight:800;color:var(--acid)}
.sbtns .pill.ghost{color:var(--txt-2)}

/* „Wyjaśnijmy inaczej” (Explain.html): cyjanowa górna krawędź, ikona, plakietki źródeł, ramka z wyjaśnieniami, notka o AI */
.sheet.explain{border-top-color:var(--cyan);border-radius:32px 32px 0 0;max-height:86dvh}
.exhead{display:flex;align-items:center;gap:10px}
.exhead .ico{width:44px;height:44px;border-radius:14px;background:var(--cyan);color:var(--on-cyan);display:flex;align-items:center;justify-content:center;flex:none}
.exhead .grow{flex:1;min-width:0}
.exhead .st2{font-size:22px;letter-spacing:-.6px}
.exchips{display:flex;gap:7px;flex-wrap:wrap}
.exchip{padding:8px 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800}
.exchip.on{background:var(--cyan);border-color:var(--cyan);color:var(--on-cyan)}
.exbox{background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:22px;padding:17px;font-size:15px;font-weight:700;line-height:1.55;color:color-mix(in srgb,var(--cyan) 20%,var(--txt));overflow-y:auto;min-height:0;flex:0 1 auto}
.exbox b{color:var(--txt)}
.exbox .lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.exsep{height:2px;background:var(--tint-cyan-line);margin:14px 0}
.exnote{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted-2);line-height:1.35}
.exnote .ic{flex:none}
.pill.cyan,.lesson .pill.cyan:not([disabled]){background:var(--cyan);color:var(--on-cyan);box-shadow:0 var(--drop-btn) 0 var(--cyan-dark)}
.pill.cyan:active,.lesson .pill.cyan:not([disabled]):active{box-shadow:0 0 0 var(--cyan-dark)}
.sheet.explain .sbtns .pill.ghost{flex:0 0 140px}

/* Powtórka (Review.html): karta licznika w cyjanie, wiersze przedmiotów, stan pamięci */
.review,.cards{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.review>*,.cards>*{flex:none}
.rvhero{display:flex;align-items:center;gap:18px;background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:26px;padding:20px;box-shadow:0 6px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg));color:var(--cyan)}
.rvhero .grow{flex:1;min-width:0}
.rvn{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1;color:var(--cyan)}
.rvt{font-size:14px;font-weight:800;color:color-mix(in srgb,var(--cyan) 25%,var(--txt));margin-top:6px}
.rvs{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:4px;line-height:1.4}
.rvrows{display:flex;flex-direction:column;gap:10px}
.rvrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:13px 15px;min-height:44px;box-shadow:0 4px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s}
.rvrow:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.rvrow .mono{width:40px;height:40px;border-radius:14px;font-size:19px}
.rvrow .grow{flex:1;min-width:0}
.rvrow .t{font-size:14px;font-weight:800}
.rvrow .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvrow .n{font-size:16px;font-weight:800;color:color-mix(in srgb,var(--accent) 60%,var(--txt));flex:none}
.memcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:12px}
.memrow{display:flex;align-items:center;gap:12px}
.memrow .lb{flex:none;width:78px;font-size:12.5px;font-weight:700}
.memrow .bar{flex:1;height:12px}
.memrow .n{flex:none;width:26px;text-align:right;font-size:12px;font-weight:800;color:var(--muted)}
.memrow.red .lb{color:var(--red-soft)}.memrow.red .bar i{background:var(--red)}
.memrow.gold .lb{color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.memrow.gold .bar i{background:var(--gold)}
.memrow.acid .lb{color:var(--acid-soft)}.memrow.acid .bar i{background:var(--acid)}
.memnote{font-size:12.5px;font-weight:600;color:var(--muted-2);line-height:1.4}
.rvfoot{padding-top:2px;display:flex;flex-direction:column;gap:10px}
.rvfoot .pill{min-height:60px;border-radius:20px}
/* sesja powtórki: nagłówek jak w lekcji, licznik zamiast serc; fiszka wypełnia ekran, przyciski 62 px */
.rvcount{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:var(--r-chip);padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
.rvrun .flip{position:relative;z-index:1;margin:0 0 4px}
.rvrun .fbtns{width:100%}
.rvrun .fbtn{min-height:62px;border-radius:20px}
/* koniec powtórki (FlashcardsDone.html): pierścień celności jako SVG (kolor przez klasę), kafle w tintach, lista „wracają dziś” */
.rvring{position:relative;width:124px;height:124px}
.rvring svg{width:124px;height:124px;transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--line-2);stroke-width:11}
.ring-fg{fill:none;stroke:var(--cyan);stroke-width:11;stroke-linecap:round}
.rvpct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rvpct b{font-family:var(--font-display);font-size:34px;font-weight:800;color:var(--cyan);line-height:1}
.rvpct span{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:3px}
.lcstat .k.under{margin-top:3px;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:700}
.lcstat.acid{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}.lcstat.acid .v{color:var(--acid)}.lcstat.acid .k{color:var(--acid-soft)}
.lcstat.red{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}.lcstat.red .v{color:var(--red-soft)}.lcstat.red .k{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.lcstat.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}.lcstat.gold .v{color:var(--gold)}.lcstat.gold .k{color:color-mix(in srgb,var(--gold) 55%,var(--muted))}
.rvlist{width:100%;text-align:left;box-shadow:0 5px 0 var(--shadow)}
.rvlist .eyebrow{padding:10px 0 2px}
.rvlist .setrow{min-height:44px;padding:9px 0}
.rvlist .setrow .t{font-size:13.5px}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none;display:block}
.rdot.red{background:var(--red)}.rdot.gold{background:var(--gold)}
/* Profil: aktywność 8 tygodni (kolumna = tydzień, kostka = dzień), odznaki (zdobyte w tintach, zablokowane kreskowane) */
.heat{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--shadow);display:flex;gap:6px;justify-content:space-between}
.heat .col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.heat i{display:block;height:12px;border-radius:4px;background:var(--line-2)}
.heat i.on{background:var(--acid)}
.heat i.future{background:color-mix(in srgb,var(--line-2) 55%,var(--surface))}
.heat i.today{box-shadow:inset 0 0 0 2px var(--muted)}
.heat i.today.on{box-shadow:inset 0 0 0 2px var(--on-acid)}
.badges{display:flex;gap:11px}
.badge{flex:1;min-width:0;border-radius:20px;padding:12px 8px;text-align:center;background:var(--surface);border:2px solid var(--line);font-size:11px;font-weight:800;color:var(--muted);line-height:1.2}
.badge .ic{display:block;margin:0 auto 6px}
.badge.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.badge.gold .ic{color:var(--gold)}
.badge.amber{background:var(--tint-amber);border-color:var(--tint-amber-line);color:color-mix(in srgb,var(--amber) 55%,var(--txt))}.badge.amber .ic{color:var(--flame)}
.badge.lock{background:var(--surface-2);border:2px dashed var(--line-dash);color:var(--muted-3)}.badge.lock .ic{color:var(--muted-3)}
.profile .sechdr{min-height:40px}
.rvrun .blob{background:color-mix(in srgb,var(--cyan) 12%,var(--bg))}
.rvrun .flip{touch-action:pan-y}
.swipehint3{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:14px 6px 0;font-size:12px;font-weight:800}
.swipehint3 span{display:inline-flex;align-items:center;gap:6px}
.swipehint3 .l{color:var(--red-soft)}.swipehint3 .r{color:var(--acid)}

/* ============================================================
   KROK 7 — EGZAMIN I PLAN DO SPRAWDZIANU (DESIGN.md §4.3, §6 pkt 7): ExamStart.html, ExamRun.html, Exam.html, TestPlan.html,
   wiersz „Mam sprawdzian” w QuickAdd.html, chip „Sprawdzian za N dni” w pasie przedmiotu, wiersz „Do sprawdzianu” na Dziś.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* ExamStart: trzy kafle liczb, karty zakresu / ustawień / siatki ocen, ramka warunków, ostatnie podejście, start */
.exstart{display:flex;flex-direction:column;gap:13px;padding:14px 18px 150px}
.exstart>*{flex:none}
.egspecs{display:flex;gap:11px}
.egspec{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:15px 8px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.egspec b{display:block;font-family:var(--font-display);font-size:27px;font-weight:800;line-height:1.05;color:var(--txt)}
.egspec b.acid{color:var(--acid)}
.egspec span{display:block;font-size:11px;font-weight:700;color:var(--muted-2);margin-top:3px}
.egcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:4px 15px 10px;box-shadow:0 5px 0 var(--shadow)}
.eglbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);padding:10px 0 6px}
.egrow{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 0;background:none;border:none;text-align:left;cursor:pointer;font-family:var(--font-body);color:var(--muted)}
.egrow+.egrow{border-top:2px solid var(--line-2)}
.egrow .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-dash);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--on-acid)}
.egrow.on{color:var(--txt)}
.egrow.on .box{background:var(--acid);border-color:var(--acid)}
.egrow .t{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.egrow.all .t{font-weight:800}
.egrow .n{font-size:12px;font-weight:800;color:var(--muted-3)}
.egrow.on .n{color:var(--muted-2)}
.egchips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.egchip{min-height:40px;padding:0 14px;border-radius:var(--r-chip);background:var(--surface-2);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font-body)}
.egchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.egscale{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.egscale span{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted)}
.egscale span b{color:var(--gold);font-weight:800}
.egscale span b.fail{color:var(--red-soft)}
.egwarn{background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.egwarn .eglbl{color:var(--red-soft);padding:0}
.egwarn .r{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:color-mix(in srgb,var(--red) 20%,var(--txt));margin-top:10px}
.egwarn .r .ic{color:var(--red-soft);flex:none}
.egwarn .r .ic.ok{color:var(--acid)}
.eglast{display:flex;align-items:center;gap:13px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--shadow)}
.eglast .ico{width:44px;height:44px;border-radius:14px;background:var(--line-2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.eglast .ico.gold{background:var(--tint-gold);color:var(--gold)}
.eglast .grow{flex:1;min-width:0}
.eglast .t{font-size:13.5px;font-weight:800}
.eglast .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.35}
.egfoot{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line-2)}
.egfoot .pill{min-height:60px;border-radius:20px}
.eglast.d6{cursor:pointer;transition:transform .08s}
.eglast.d6:active{transform:translateY(2px)}
.eglast .chev{color:var(--muted-3)}

/* ExamRun (#lesson.egrun): nagłówek w --surface-2 z zamknięciem, „Pytanie N z M” + pasek (fiolet), timer (bursztyn, pod 2 min czerwień + .a-blink),
   przycisk siatki, pasek opadającego czasu; pytanie z flagą; kafle jak w quizie, wybór = fiolet; stopka wstecz / DALEJ (fiolet) */
.egrun .eghead{padding:14px 18px 12px;background:var(--surface-2);border-bottom:2px solid var(--line)}
.egtop{display:flex;align-items:center;gap:10px}
.egtop .x{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--txt);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.egtop .grow{flex:1;min-width:0}
.egn{font-size:13px;font-weight:800}
.egtop .bar{height:8px;margin-top:5px}
.egtop .bar i{background:var(--violet);transition:width .35s}
.egtimer{display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber);border:2px solid var(--tint-amber-line);border-radius:var(--r-chip);padding:0 12px;min-height:40px;color:var(--amber-soft);font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;font-family:var(--font-body);flex:none}
.egtimer .ic{color:var(--amber)}
.egtimer.warn{background:var(--tint-red);border-color:var(--red);color:var(--red-soft)}
.egtimer.warn .ic{color:var(--red)}
.eggridbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .08s}
.eggridbtn:active{transform:translateY(2px)}
.egdrain{height:5px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:12px}
.egdrain i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width 1s linear}
.egdrain.warn i{background:var(--red)}
.egqrow{display:flex;align-items:flex-start;gap:12px}
.egqrow .qq{flex:1;min-width:0;font-size:23px;letter-spacing:-.7px;line-height:1.2;margin:0}
.egflag{flex:none;width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .08s}
.egflag:active{transform:translateY(2px)}
.egflag.on{background:var(--tint-gold);border-color:var(--tint-gold-line);color:var(--gold)}
.egrun .qopt.sel{background:var(--tint-pink);border-color:var(--violet);box-shadow:0 4px 0 var(--violet);color:var(--txt)}
.egrun .qopt.sel .k{background:var(--violet);color:var(--on-violet)}
.egnav{display:flex;gap:11px}
.egnav .pill{flex:1;min-height:56px}
.egnav .egprev{flex:0 0 64px;padding:0}
.egnav .pill.ghost[disabled]{opacity:.4}
.pill.violet,.lesson .pill.violet:not([disabled]){background:var(--violet);color:var(--on-violet);box-shadow:0 var(--drop-btn) 0 var(--violet-dark)}
.pill.violet:active,.lesson .pill.violet:not([disabled]):active{box-shadow:0 0 0 var(--violet-dark)}
/* arkusze egzaminu: siatka pytań (7 kolumn ≥ 44 px), legenda, podsumowanie przed zakończeniem */
.sheet.eggrid,.sheet.egconfirm,.sheet.testplan{border-radius:32px 32px 0 0;border-top-color:var(--violet);padding:14px 18px calc(26px + env(safe-area-inset-bottom));overflow-y:auto;max-height:86dvh}
.sheet.eggrid>*,.sheet.egconfirm>*,.sheet.testplan>*{flex:none}
.egsquares{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.egsq{aspect-ratio:1;min-height:40px;border-radius:10px;background:var(--line-2);border:none;color:var(--muted-2);font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font-body);transition:transform .08s}
.egsq:active{transform:translateY(2px)}
.egsq.ans{background:var(--tint-acid-line);color:var(--txt)}
.egsq.flag{background:var(--tint-gold-line);color:var(--txt)}
.egsq.cur{background:var(--violet);color:var(--on-violet)}
.eglegend{display:flex;gap:12px;flex-wrap:wrap}
.eglegend span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted-2)}
.eglegend i{width:9px;height:9px;border-radius:3px;background:var(--line-2);display:block}
.eglegend i.ans{background:var(--tint-acid-line)}
.eglegend i.flag{background:var(--tint-gold-line)}
.eglegend i.cur{background:var(--violet)}
.egsum{display:flex;gap:10px}
.egsumtile{flex:1;min-width:0;border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface);border:2px solid var(--line)}
.egsumtile b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1.05}
.egsumtile span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.egsumtile.red{background:var(--tint-red);border-color:var(--tint-red-line)}
.egsumtile.red b{color:var(--red-soft)}
.egsumtile.gold{background:var(--tint-gold);border-color:var(--tint-gold-line)}
.egsumtile.gold b{color:var(--gold)}
.egsumtile.acid{background:var(--tint-acid);border-color:var(--tint-acid-line)}
.egsumtile.acid b{color:var(--acid)}

/* Wynik (Exam.html, #lesson.egres): karta z pierścieniem i oceną (limonka = zdane, czerwień = nie), kafle, siatka ocen z podświetlonym wierszem,
   karta talii błędów, przegląd pytań (złe najpierw, źródło src) */
.egres .lessonbody.done{padding:0 18px}
.egl{padding:14px 0 12px;gap:14px;align-items:stretch}
.eghero{display:flex;align-items:center;gap:18px;border-radius:28px;padding:20px;border:2px solid var(--line)}
.eghero.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 6px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.eghero.bad{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 6px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.eghero .rvring{width:108px;height:108px;flex:none}
.eghero .rvring svg{width:108px;height:108px}
.eghero .rvpct b{font-size:28px}
.eghero.ok .ring-fg{stroke:var(--acid)}
.eghero.ok .rvpct b{color:var(--acid)}
.eghero.ok .rvpct span{color:var(--acid-soft)}
.eghero.bad .ring-fg{stroke:var(--red)}
.eghero.bad .rvpct b{color:var(--red-soft)}
.eghero.bad .rvpct span{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.eghero .grow{flex:1;min-width:0}
.eghero .eglbl{padding:0;color:var(--acid-soft)}
.eghero.bad .eglbl{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.eggrade{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:4px;color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.eghero.bad .eggrade{color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.eggrade small{font-size:18px;letter-spacing:-.4px;margin-left:6px;color:var(--acid-soft)}
.eghero.bad .eggrade small{color:var(--red-soft)}
.egnote{font-size:12.5px;font-weight:700;margin-top:6px;color:var(--acid-soft);line-height:1.4}
.eghero.bad .egnote{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.egstats{display:flex;gap:10px}
.egstat{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.egstat b{display:block;font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.egstat span{display:block;font-size:10.5px;font-weight:700;color:var(--muted-2);margin-top:3px}
.egstat.acid b{color:var(--acid)}
.egstat.red b{color:var(--red-soft)}
.egstat.gold b{color:var(--gold)}
.egstat.cyan b{color:var(--cyan)}
.eglv{display:flex;flex-direction:column;gap:11px;padding:4px 0 8px}
.eglvrow{display:flex;align-items:center;gap:12px}
.eglvrow .lb{flex:none;width:118px;font-size:12px;font-weight:700;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eglvrow .bar{flex:1;height:12px}
.eglvrow .p{flex:none;width:36px;text-align:right;font-size:12px;font-weight:800}
.eglvrow.red .bar i{background:var(--red)}
.eglvrow.red .p{color:var(--red-soft)}
.eglvrow.gold .bar i{background:var(--gold)}
.eglvrow.gold .p{color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.eglvrow.acid .bar i{background:var(--acid)}
.eglvrow.acid .p{color:var(--acid-soft)}
.egscalelist{display:flex;flex-direction:column;padding-bottom:2px}
.egsrow{display:flex;align-items:center;gap:12px;padding:9px 8px;margin:0 -8px;border-radius:14px;font-size:13px;font-weight:700;color:var(--muted)}
.egsrow+.egsrow{margin-top:2px}
.egsrow .g{flex:none;width:50px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--txt-2)}
.egsrow .bar{flex:1;height:8px}
.egsrow .bar i{background:var(--line-dash)}
.egsrow .p{flex:none;width:66px;text-align:right;font-weight:800;white-space:nowrap}
.egsrow.on{background:var(--tint-acid);color:color-mix(in srgb,var(--acid) 30%,var(--txt));animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.egsrow.on .g{color:var(--acid)}
.egsrow.on .bar i{background:var(--acid)}
.egsrow.fail .g{color:var(--red-soft)}
.egsrow.fail.on{background:var(--tint-red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.egsrow.fail.on .bar i{background:var(--red)}
.egdeck{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg));color:var(--txt);transition:transform .08s,box-shadow .08s}
.egdeck:active{transform:translateY(4px);box-shadow:0 0 0 var(--bg)}
.egdeck .ico{width:44px;height:44px;border-radius:14px;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;flex:none}
.egdeck .grow{flex:1;min-width:0}
.egdeck .t{font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.egdeck .s{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--red) 40%,var(--muted));margin-top:2px}
.egdeck>svg:last-child{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.egdeck.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg));cursor:default}
.egdeck.ok .ico{background:var(--acid);color:var(--on-acid)}
.egdeck.ok .t{color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.egdeck.ok .s{color:var(--acid-soft)}
.egrev{display:flex;flex-direction:column;gap:9px;width:100%}
.egrev .eyebrow{padding:4px 0 0}
.egitem{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:13px 15px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:5px;text-align:left}
.egitem .qh{display:flex;gap:10px;align-items:flex-start;font-weight:800;color:var(--txt)}
.egitem .num{flex:none;width:26px;height:26px;border-radius:9px;background:var(--line-2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.egitem.bad{border-color:var(--tint-red-line)}
.egitem.bad .num{background:var(--red);color:var(--on-red)}
.egitem.ok{opacity:.8}
.egitem.ok .num{background:var(--tint-acid-line);color:var(--txt)}
.egitem .rbad{color:var(--red-soft);font-weight:700}
.egitem .rgood{color:var(--acid);font-weight:700}
.egitem .re{color:var(--txt-2);font-weight:600;font-size:13px}
.egitem .rsrc{display:flex;align-items:flex-start;gap:6px;color:var(--muted-2);font-size:12px;font-weight:600;line-height:1.35}
.egitem .rsrc .ic{flex:none;margin-top:2px}
.egitem .rsrc b{color:var(--muted);font-weight:800}

/* Plan do sprawdzianu (TestPlan.html): karta gotowości z pierścieniem (złoto), data i „za N dni”, wiersze dni (dziś = limonka, zrobione, pominięte,
   wolne = kreskowane, dzień sprawdzianu = czerwień), stopka */
.tplan{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.tplan>*{flex:none}
.tphero{display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 5px 0 var(--shadow)}
.tphero .rvring{width:88px;height:88px;flex:none}
.tphero .rvring svg{width:88px;height:88px}
.tphero .ring-bg,.tphero .ring-fg{stroke-width:9}
.tphero .ring-fg{stroke:var(--gold)}
.tphero .rvpct b{font-size:22px;color:var(--gold)}
.tphero .rvpct span{font-size:8.5px;color:var(--muted);letter-spacing:.3px}
.tphero .grow{flex:1;min-width:0}
.tphero .s{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tphero .d{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:4px;line-height:1.1}
.tphero .in{font-size:13px;font-weight:800;color:var(--red-soft);margin-top:3px}
.tprows{display:flex;flex-direction:column;gap:8px}
.tprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:11px 13px;min-height:60px;color:var(--txt);transition:transform .08s,box-shadow .08s}
.tprow .dy{width:40px;flex:none;text-align:center}
.tprow .dy small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.tprow .dy b{display:block;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--txt)}
.tprow .ico{width:34px;height:34px;border-radius:11px;background:var(--line-2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.tprow .grow{flex:1;min-width:0}
.tprow .t{font-size:13.5px;font-weight:800}
.tprow .s{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.badge2{flex:none;padding:4px 9px;border-radius:var(--r-chip);font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:var(--line-2);color:var(--muted)}
.tprow.tp-now{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid-dark)}
.tprow.tp-now:active{transform:translateY(4px);box-shadow:0 0 0 var(--acid-dark)}
.tprow.tp-now .dy small{color:var(--acid)}
.tprow.tp-now .dy b,.tprow.tp-now .t{color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.tprow.tp-now .s{color:var(--acid-soft)}
.tprow.tp-now .ico,.tprow.tp-now .badge2{background:var(--acid);color:var(--on-acid)}
.tprow.tp-done{opacity:.72}
.tprow.tp-done .ico{background:var(--acid);color:var(--on-acid)}
.tprow.tp-done .t{text-decoration:line-through;color:var(--muted)}
.tprow.tp-missed .ico{background:var(--tint-red);color:var(--red-soft)}
.tprow.tp-missed .t{color:var(--muted)}
.tprow.tp-missed .s{color:var(--red-soft)}
.tprow.tp-rest{background:var(--surface-2);border-style:dashed;cursor:default}
.tprow.tp-rest .dy small{color:var(--muted-3)}
.tprow.tp-rest .dy b,.tprow.tp-rest .t{color:var(--muted)}
.tprow.tp-rest .s,.tprow.tp-rest .ico{color:var(--muted-3)}
.tprow.tp-rest.tp-now{background:var(--tint-acid);border-style:solid}
.tprow.tp-exam{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark);cursor:default}
.tprow.tp-exam .dy small{color:var(--red)}
.tprow.tp-exam .dy b,.tprow.tp-exam .t{color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.tprow.tp-exam .s{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.tprow.tp-exam .ico,.tprow.tp-exam .badge2{background:var(--red);color:var(--on-red)}
.tpnote{font-size:12px;font-weight:600;color:var(--muted-2);text-align:center;line-height:1.4;padding:2px 0}
.tpfoot{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.tpfoot .pill{min-height:58px}
/* arkusz „Mam sprawdzian”: chipy przedmiotu (monogram) i zakresu, natywne pole daty, podsumowanie */
.sheet.testplan{border-top-color:var(--red)}
.tpchips{display:flex;gap:8px;flex-wrap:wrap}
.tpchip{min-height:40px;padding:0 13px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font-body);display:inline-flex;align-items:center;gap:7px}
.tpchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tpchip .mono{width:22px;height:22px;border-radius:7px;font-size:11px;margin-left:-4px}
.tpchip.on .mono{background:var(--on-accent);border-color:var(--on-accent);color:var(--accent)}
.tpdate{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:0 14px;min-height:54px;color:var(--muted)}
.tpdate input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt);font-family:var(--font-body);font-size:15px;font-weight:800;color-scheme:dark;min-height:44px}
.tpdate span{flex:none;font-size:12px;font-weight:800;color:var(--acid)}
.tpsum{display:flex;align-items:center;gap:10px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-radius:16px;padding:12px 14px;font-size:12.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.tpsum .ic{color:var(--gold);flex:none}
.sheet.testplan .eyebrow.sec{margin-top:0}
/* QuickAdd: wiersz „Mam sprawdzian — ułóż mi plan” (czerwony tint); pas przedmiotu: chip „Sprawdzian za N dni” */
.qatest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:18px;padding:13px 15px;min-height:52px;color:color-mix(in srgb,var(--red) 20%,var(--txt));font-size:14px;font-weight:800;transition:transform .08s}
.qatest:active{transform:translateY(2px)}
.qatest .ic{color:var(--red-soft);flex:none}
.qatest span{flex:1;min-width:0}
.qatest .chev{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.bandtest{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;min-height:40px;padding:6px 12px;border-radius:14px;background:var(--tint-red);border:2px solid var(--tint-red-line);color:color-mix(in srgb,var(--red) 20%,var(--txt));font-family:var(--font-body);font-size:12.5px;font-weight:800;cursor:pointer;text-align:left}
.bandtest .ic{color:var(--red-soft);flex:none}
.bandtest small{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:color-mix(in srgb,var(--red) 40%,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bandtest .chev{color:color-mix(in srgb,var(--red) 40%,var(--muted))}

/* ============================================================
   KROK 8 — GAMIFIKACJA (DESIGN.md §4.5, §6 pkt 8): gemy i Plecak (Shop.html), Misje (Missions.html), zamrożenia serii (Streak.html),
   ComeBack.html, Album pojęć (Album.html), Boss rozdziału (Boss.html), Duch (Ghost.html), odznaki (Profile.html), NoHearts za gemy.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez klasy .a-*.
   ============================================================ */
/* pigułka gemów: w pasku Dziś (→ Plecak) i w pasie przedmiotu */
.streak.gems{color:color-mix(in srgb,var(--cyan) 55%,var(--txt));cursor:pointer;transition:transform .08s}
.streak.gems:active{transform:translateY(2px)}
.band .streak.gems{padding:7px 10px 7px 8px;font-size:13px;min-height:40px}
.pills .streak{padding:7px 10px 7px 9px;font-size:13.5px}
.ic-violet{color:var(--violet)}.ic-pink{color:var(--pink)}.ic-palette{color:var(--violet)}
.ic .eye{fill:var(--bg)}.ic .mouth{fill:none;stroke:var(--bg);stroke-width:1.6;stroke-linecap:round}
.toast .ic.a-pop{animation-duration:.5s}
.minitiles .minitile{padding:10px 9px;gap:6px;font-size:12px;white-space:nowrap}
.minitile.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:color-mix(in srgb,var(--cyan) 35%,var(--txt))}
.combo.boost{background:var(--tint-gold);color:var(--gold);border:2px solid var(--tint-gold-line)}
/* motyw (Plecak): kolor rozmytego koła na ekranie Dziś */
.blob.th-cyan{background:color-mix(in srgb,var(--cyan) 18%,var(--bg))}
.blob.th-pink{background:color-mix(in srgb,var(--pink) 20%,var(--bg))}
.blob.th-gold{background:color-mix(in srgb,var(--gold) 18%,var(--bg))}
.blob.th-amber{background:color-mix(in srgb,var(--amber) 18%,var(--bg))}
.blob.gold{top:-110px;right:-80px;width:260px;height:260px;background:var(--tint-gold)}
.shop,.missions,.album,.comeback{padding-bottom:30px}
.shop>*,.missions>*,.album>*{flex:none} /* dzieci kolumny flex nie kurczą się (chipy z overflow-x, notka) */

/* Plecak (Shop.html): wiersze w tintach z kaflem ikony i przyciskiem ceny 3D */
.shop{display:flex;flex-direction:column;gap:13px;padding-top:14px}
.shoprow{display:flex;align-items:center;gap:14px;border-radius:24px;padding:15px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--shadow)}
.shoprow .ico{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--txt)}
.shoprow .grow{flex:1;min-width:0}
.shoprow .t{font-size:15px;font-weight:800}
.shoprow .s{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.shoprow .buy{flex:none;display:inline-flex;align-items:center;gap:5px;border:none;border-radius:14px;padding:11px 14px;min-height:44px;font-family:var(--font-body);font-size:13px;font-weight:800;cursor:pointer;transition:transform .08s,box-shadow .08s;background:var(--acid);color:var(--on-acid);box-shadow:0 4px 0 var(--acid-dark)}
.shoprow .buy:active{transform:translateY(4px);box-shadow:none}
.shoprow .buy.short{background:var(--surface-2);color:var(--muted-2);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.shoprow .buy.owned{background:var(--line-2);color:var(--muted);box-shadow:none;cursor:default}
.shoprow.red{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.shoprow.red .ico{background:var(--red);color:var(--on-red)}.shoprow.red .t{color:color-mix(in srgb,var(--red) 20%,var(--txt))}.shoprow.red .s{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.shoprow.red .buy:not(.short):not(.owned){background:var(--red);color:var(--on-red);box-shadow:0 4px 0 var(--red-dark)}
.shoprow.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg))}
.shoprow.cyan .ico{background:var(--cyan);color:var(--on-cyan)}.shoprow.cyan .t{color:color-mix(in srgb,var(--cyan) 25%,var(--txt))}.shoprow.cyan .s{color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.shoprow.cyan .buy:not(.short):not(.owned){background:var(--cyan);color:var(--on-cyan);box-shadow:0 4px 0 var(--cyan-dark)}
.shoprow.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}
.shoprow.gold .ico{background:var(--gold);color:var(--on-gold)}.shoprow.gold .t{color:color-mix(in srgb,var(--gold) 25%,var(--txt))}.shoprow.gold .s{color:color-mix(in srgb,var(--gold) 45%,var(--muted))}
.shoprow.gold .buy:not(.short):not(.owned){background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-dark)}
.shoprow.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg))}
.shoprow.violet .ico{background:var(--violet);color:var(--on-violet)}.shoprow.violet .s{color:var(--violet-soft)}
.shoprow.violet .buy:not(.short):not(.owned){background:var(--violet);color:var(--on-violet);box-shadow:0 4px 0 var(--violet-dark)}
.themechips{display:flex;gap:7px;flex-wrap:wrap;margin-top:-3px}
.themechip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;font-family:var(--font-body);cursor:pointer}
.themechip i{width:14px;height:14px;border-radius:5px;background:var(--sw,var(--violet))}
.themechip.on{border-color:var(--sw,var(--violet));color:var(--txt)}
.setrow .v.cyan{color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}

/* Misje (Missions.html) */
.missions{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.msh{min-height:auto}
.msleft{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.msleft .ic{color:var(--muted)}
.msrows{display:flex;flex-direction:column;gap:11px}
.msrow{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--shadow)}
.msrow .mstop{display:flex;align-items:center;gap:13px}
.msrow .ico{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--muted)}
.msrow .grow{flex:1;min-width:0}
.msrow .t{font-size:14px;font-weight:800}
.msrow .s{font-size:12px;font-weight:700;color:var(--muted);margin-top:3px}
.msrow .rw{display:flex;align-items:center;gap:4px;flex:none;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}
.msrow .rw .ic{color:var(--cyan)}
.msrow .bar{margin-top:12px}
.msrow.acid .ico{background:var(--tint-acid);color:var(--acid)}.msrow.acid .bar i{background:var(--acid)}
.msrow.pink .ico{background:var(--tint-pink);color:var(--pink)}.msrow.pink .bar i{background:var(--pink)}
.msrow.cyan .ico{background:var(--tint-cyan);color:var(--cyan)}.msrow.cyan .bar i{background:var(--cyan)}
.msrow.gold .ico{background:var(--tint-gold);color:var(--gold)}.msrow.gold .bar i{background:var(--gold)}
.msrow.amber .ico{background:var(--tint-amber);color:var(--flame)}.msrow.amber .bar i{background:var(--amber)}
.msrow.ready{border-color:var(--acid)}
.msrow .claim{flex:none;min-height:44px;padding:0 16px;border:none;border-radius:14px;background:var(--acid);color:var(--on-acid);font-family:var(--font-body);font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 0 var(--acid-dark);cursor:pointer;transition:transform .08s,box-shadow .08s}
.msrow .claim:active{transform:translateY(4px);box-shadow:none}
.msrow.weekly{background:var(--tint-gold);border-color:var(--tint-gold-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}
.msrow.weekly .ico{width:54px;height:54px;border-radius:17px;background:var(--gold);color:var(--on-gold)}
.msrow.weekly .t{font-size:15px;color:color-mix(in srgb,var(--gold) 25%,var(--txt))}
.msrow.weekly .s{font-size:12.5px;color:color-mix(in srgb,var(--gold) 45%,var(--muted))}
.msrow.weekly .bar{height:12px;background:color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}.msrow.weekly .bar i{background:var(--gold)}
.msrow.done{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.msrow.done .ico{background:var(--acid);color:var(--on-acid)}
.msrow.done .t{color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.msrow.done .s{color:var(--acid-soft)}
.msnote{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px dashed var(--line-dash);border-radius:20px;padding:13px 15px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4}
.msnote .ic{color:var(--muted-2);flex:none}
.msfoot{padding:6px 0 8px}

/* Seria: karta zamrożeń (Streak.html), dzień uratowany zamrożeniem w kropkach tygodnia */
.freezecard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg));margin-top:14px;color:var(--txt);font-family:var(--font-body);cursor:pointer;transition:transform .08s;position:relative;z-index:1}
.freezecard:active{transform:translateY(3px)}
.freezecard .ico{width:44px;height:44px;border-radius:14px;background:var(--cyan);color:var(--on-cyan);display:flex;align-items:center;justify-content:center;flex:none}
.freezecard .grow{flex:1;min-width:0}
.freezecard .t{font-size:14.5px;font-weight:800}
.freezecard .s{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:2px}
.freezecard .chev{color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.day.frozen .dot{background:var(--cyan);color:var(--on-cyan)}

/* ComeBack.html: ciepły powrót po ≥ 3 dniach */
.comeback{display:flex;flex-direction:column;gap:16px;padding:30px 22px 26px;min-height:100%}
.comeback>*{flex:none}
.cbart{display:flex;justify-content:center}
.cbico{width:104px;height:104px;border-radius:34px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted-2)}
.cbtxt{text-align:center}
.cbtxt h1{font-size:30px;letter-spacing:-1.1px;line-height:1.08}
.cbtxt p{font-size:14px;font-weight:600;color:var(--muted);margin-top:9px;line-height:1.5}
.cbstreak{display:flex;align-items:center;gap:14px;background:var(--tint-amber);border:2px solid var(--tint-amber-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-amber) 60%,var(--bg))}
.cbstreak>.ic{color:var(--tint-amber-line);flex:none}
.cbstreak .grow{flex:1;min-width:0}
.cbstreak .t{font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--amber) 25%,var(--txt))}
.cbstreak .nums{display:flex;align-items:center;gap:9px;margin-top:4px;font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1}
.cbstreak .old{color:var(--muted-2);text-decoration:line-through}
.cbstreak .nums .ic{color:var(--muted-2)}
.cbstreak .new{color:var(--amber)}
.cbdue{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:17px;box-shadow:0 5px 0 var(--shadow)}
.cbdue .hd{display:flex;align-items:center;justify-content:space-between}
.cbdue .hd b{font-size:12px;font-weight:800;color:var(--red-soft)}
.cbdue .sp{margin-top:8px}
.cbdue .row{display:flex;align-items:center;gap:12px;margin-top:11px}
.cbdue .lb{flex:none;width:84px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbdue .bar{flex:1;height:12px}
.cbdue .n{flex:none;width:40px;text-align:right;font-size:12px;font-weight:800;color:var(--muted)}
.cbdue .row.r1 .bar i{background:var(--red)}.cbdue .row.r2 .bar i{background:var(--gold)}.cbdue .row.r3 .bar i{background:var(--acid)}
.cbwarm{display:flex;align-items:center;gap:13px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.cbwarm .ico{width:46px;height:46px;border-radius:15px;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;flex:none}
.cbwarm .grow{flex:1;min-width:0}
.cbwarm .t{font-size:15px;font-weight:800;color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.cbwarm .s{font-size:12.5px;font-weight:600;color:var(--acid-soft);margin-top:3px;line-height:1.4}
.cbfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}

/* Album pojęć (Album.html): chipy przedmiotów, siatka 3 kolumn, rzadkość kolorem, zablokowane jako sylwetki */
.album{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.albhead{display:flex;flex-direction:column;gap:8px}
.albhead .bar{height:12px}.albhead .bar i{background:var(--acid)}
.albpct{font-size:12px;font-weight:800;color:var(--acid)}
.albchips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.albchips::-webkit-scrollbar{display:none}
.albchip{flex:none;min-height:40px;padding:0 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;font-family:var(--font-body);cursor:pointer;white-space:nowrap}
.albchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.albgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.alb{position:relative;aspect-ratio:3/4;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);border:2px solid var(--line-dash);box-shadow:0 4px 0 var(--shadow);text-align:left;font-family:var(--font-body);color:var(--muted);cursor:pointer;transition:transform .08s;min-height:44px;overflow:hidden}
.alb:active{transform:translateY(3px)}
.alb .sw{width:26px;height:26px;border-radius:9px;background:var(--line-dash);flex:none}
.alb .t{font-size:12px;font-weight:800;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.alb .d{display:none;font-size:10.5px;font-weight:600;line-height:1.3;color:var(--txt-2);overflow:hidden}
.alb.flip .t,.alb.flip .sw{display:none}
.alb.flip .d{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical}
.alb.rare{background:var(--tint-cyan);border-color:var(--cyan);color:color-mix(in srgb,var(--cyan) 60%,var(--txt))}.alb.rare .sw{background:var(--cyan)}
.alb.epic{background:var(--tint-gold);border-color:var(--gold);color:color-mix(in srgb,var(--gold) 60%,var(--txt))}.alb.epic .sw{background:var(--gold)}
.alb.lock{background:var(--surface-2);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;color:var(--muted-3);cursor:default}
.alb .new{position:absolute;top:6px;right:6px;padding:3px 8px;border-radius:var(--r-chip);background:var(--pink);color:var(--on-pink);font-size:9.5px;font-weight:800;letter-spacing:1px}
.alblegend{display:flex;gap:14px;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.alblegend span{display:flex;align-items:center;gap:6px}
.alblegend i{width:10px;height:10px;border-radius:3px;background:var(--line-dash)}
.alblegend i.rare{background:var(--cyan)}.alblegend i.epic{background:var(--gold)}
.albnote{text-align:center}

/* Boss rozdziału (Boss.html): węzeł na ścieżce, potwór w kolorze przedmiotu, pasek życia, cios / pudło */
.boss .b1{fill:var(--accent);stroke:var(--accent-dark);stroke-width:6}
.boss .b2{fill:var(--accent-dark)}
.boss .b3{fill:none;stroke:var(--on-accent);stroke-width:6;stroke-linecap:round}
.boss .b4{fill:var(--txt)}
.boss .b6{fill:var(--on-accent)}
.boss .b5{fill:none;stroke:var(--on-accent);stroke-width:5;stroke-linecap:round}
.node-boss{width:84px;height:84px;border-radius:26px;background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--drop-node) 0 var(--shadow);position:relative}
.node-boss .boss{display:block}
.node-boss.locked .boss .b1{fill:var(--line-2);stroke:var(--line)}
.node-boss.locked .boss .b2{fill:var(--surface-2)}
.node-boss.locked .boss .b4{fill:var(--muted-3)}
.node-boss.locked .boss .b3,.node-boss.locked .boss .b5{stroke:var(--surface)}
.node-boss.locked .boss .b6{fill:var(--surface)}
.node-boss.open{background:var(--accent-tint);border-color:var(--accent);box-shadow:0 var(--drop-node) 0 var(--accent-dark)}
.node-boss.beaten{background:var(--accent-tint);border-color:var(--accent-tint-line)}
.node-boss .won,.lcbig.boss .won{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--acid-dark)}
.node-boss:active{transform:translateY(3px)}
.pathnode:has(.node-boss.open) .nodelabel{color:var(--acid)}
.bossrun .bosshead{padding:14px 18px 0}
.bosslbl{flex:1;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--violet-soft)}
.bosshero{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 18px 0}
.bossav{position:relative}
.bossav .boss{display:block}
.bosshit{position:absolute;top:-4px;right:-30px;padding:5px 11px;border-radius:var(--r-chip);background:var(--red);box-shadow:0 4px 0 var(--red-dark);color:var(--on-red);font-size:15px;font-weight:800}
.bossname{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px}
.bosshp{width:100%;display:flex;align-items:center;gap:10px}
.bosshp .bar{flex:1;height:16px;border:2px solid var(--line-dash);background:var(--line-2)}
.bosshp .bar i{background:var(--red);transition:width .35s}
.bosshp span{font-size:13px;font-weight:800;color:var(--red-soft);white-space:nowrap}
.bossq{display:flex;align-items:center;justify-content:space-between;margin-bottom:-8px}
.bossq .eyebrow{font-size:11px}
.bosstime{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--amber-soft)}
.bosstime.warn{color:var(--red-soft)}
.bossrun .lessonbody{padding-top:10px}
.bossrun .quiz .qq{font-size:20px}
.bossrun .qopt{min-height:54px;padding:11px 14px}
.bossrun .lessonfoot{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.bossnote{font-size:12px;font-weight:700;color:var(--muted-2);text-align:center}
.bossexp{position:relative;z-index:2;margin-top:10px;background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45;color:color-mix(in srgb,var(--red) 20%,var(--txt));flex:none}
.bossexp b{color:var(--red-soft)}
.lcbig.boss{background:var(--accent-tint);border:3px solid var(--accent);box-shadow:0 8px 0 var(--accent-dark);position:relative}
.lcbig.boss.lost{border-color:var(--red);box-shadow:0 8px 0 var(--red-dark)}
.lcrewards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lcreward{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);font-size:12.5px;font-weight:800;color:var(--txt-2)}
.lcreward.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.lcreward.gold .ic{color:var(--gold)}
.lcreward.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:color-mix(in srgb,var(--cyan) 55%,var(--txt))}.lcreward.cyan .ic{color:var(--cyan)}
.lcreward.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);color:var(--violet-soft)}.lcreward.violet .ic{color:var(--violet)}

/* Duch (Ghost.html): karta wyścigu nad pytaniem, wiersz na ekranie wyniku */
.ghostcard{position:relative;z-index:1;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:9px;margin-bottom:12px;flex:none}
.ghrow{display:flex;align-items:center;gap:10px}
.ghrow .av{width:32px;height:32px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--acid);color:var(--on-acid);font-size:12px;font-weight:800}
.ghrow.ghost{opacity:.78}
.ghrow.ghost .av{background:var(--violet);color:var(--on-violet)}
.ghrow .grow{flex:1;min-width:0}
.ghrow .lab{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800}
.ghrow .lab span{color:var(--muted)}
.ghrow .bar{height:9px;margin-top:5px}
.ghrow .bar i{background:var(--acid);transition:width .4s}
.ghrow.ghost .bar{background:var(--surface-2);border:1px dashed var(--line-dash)}
.ghrow.ghost .bar i{background:var(--violet)}
.ghnote{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.35}
.ghnote .ic{color:var(--violet);flex:none}
.ghnote.lead{color:var(--acid-soft)}.ghnote.lead .ic{color:var(--acid)}
.lcghost{width:100%;display:flex;align-items:center;gap:13px;background:var(--tint-pink);border:2px solid var(--tint-pink-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg));text-align:left}
.lcghost .ico{width:44px;height:44px;border-radius:14px;background:var(--violet);color:var(--on-violet);display:flex;align-items:center;justify-content:center;flex:none}
.lcghost.win{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.lcghost.win .ico{background:var(--acid);color:var(--on-acid)}
.lcghost .grow{flex:1;min-width:0}
.lcghost .t{font-size:15px;font-weight:800}
.lcghost .s{font-size:12.5px;font-weight:600;color:var(--violet-soft);margin-top:2px;line-height:1.35}
.lcghost.win .s{color:var(--acid-soft)}

/* Odznaki (Profile.html): siatka 3 kolumn, odblokowane w tintach, zablokowane kreskowane */
.badgegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badgegrid .badge{padding:12px 6px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px}
.badgegrid .badge .ic{margin:0}
.badge.acid{background:var(--tint-acid);border-color:var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 55%,var(--txt))}.badge.acid .ic{color:var(--acid)}
.badge.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);color:color-mix(in srgb,var(--cyan) 55%,var(--txt))}.badge.cyan .ic{color:var(--cyan)}
.badge.violet{background:var(--tint-pink);border-color:var(--tint-pink-line);color:var(--violet-soft)}.badge.violet .ic{color:var(--violet)}
.badge.pink{background:var(--tint-pink);border-color:var(--tint-pink-line);color:color-mix(in srgb,var(--pink) 55%,var(--txt))}.badge.pink .ic{color:var(--pink)}

/* Koniec żyć: „Uzupełnij wszystkie” za gemy (NoHearts.html) */
.nhcard.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line);box-shadow:0 5px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg))}
.nhcard.cyan .ico{background:var(--cyan);color:var(--on-cyan)}
.nhcard.cyan .t{color:color-mix(in srgb,var(--cyan) 25%,var(--txt))}
.nhcard.cyan .s{color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.nhcard.cyan>svg:last-child{color:color-mix(in srgb,var(--cyan) 45%,var(--muted))}
.nhcard.short{opacity:.72}
.node-chest.opened{opacity:.6;color:var(--muted)}
.bossrun .qchips{display:none} /* w walce liczy się „Cios N” i zegar, chipy sesji są zbędne */

/* ============================================================
   KROK 9 — DOMKNIĘCIE (wersja 2.0): LevelPick.html, Onboarding.html, Catalog.html, Settings.html, ErrorState.html (+ pasek offline),
   SubjectInfo.html, WeeklyStory.html, Cram.html, EditContent.html, SourceView.html, ekran „wymaga wersji online” (ShareClass/League/Friends/
   Scanner/Detected/Generating/Explain). Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez klasy .a-*.
   ============================================================ */
/* wspólne: mały przycisk tekstowy, „Źródło” jako przycisk, cel dzienny na Dziś, udostępnianie w pasie przedmiotu */
.pill.text.sm{min-height:44px;font-size:12.5px;letter-spacing:.4px;text-transform:none;color:var(--muted)}
.pill.ghost.sm{min-height:46px;font-size:13px;letter-spacing:.4px;text-transform:none}
.pill.gold,.lesson .pill.gold:not([disabled]){background:var(--gold);color:var(--on-gold);box-shadow:0 var(--drop-btn) 0 var(--gold-dark)}
.pill.gold:active,.lesson .pill.gold:not([disabled]):active{box-shadow:0 0 0 var(--gold-dark)}
button.rsrc{display:flex;align-items:flex-start;gap:6px;width:100%;text-align:left;background:none;border:none;padding:8px 0 0;cursor:pointer;font-family:var(--font-body);color:var(--muted-2);font-size:12px;font-weight:600;line-height:1.35;min-height:32px}
button.rsrc .ic{flex:none;margin-top:2px}
button.rsrc span{flex:1;min-width:0}
button.rsrc b{color:var(--muted);font-weight:800}
button.rsrc .chev{color:var(--muted-3)}
.sbox button.rsrc{color:inherit;opacity:.85}
.sbox button.rsrc b{color:inherit}
.egedit{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:36px;padding:0 12px;margin-top:4px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-2);color:var(--muted);font-family:var(--font-body);font-size:12px;font-weight:800;cursor:pointer}
.egedit:active{transform:translateY(2px)}
.goalrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:0;min-height:24px;cursor:pointer;font-family:var(--font-body);text-align:left;margin-top:-4px}
.goalrow .bar{flex:1;height:8px}
.goalrow .bar i{background:var(--gold)}
.goalrow span{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.subtab.share{margin-left:auto;color:var(--cyan);border-color:var(--tint-cyan-line);background:var(--tint-cyan)}
.eglast.cram{cursor:pointer;transition:transform .08s;background:var(--tint-pink);border-color:var(--tint-pink-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-pink) 60%,var(--bg))}
.eglast.cram:active{transform:translateY(2px)}
.eglast .ico.violet{background:var(--violet);color:var(--on-violet)}
.eglast.cram .s{color:var(--violet-soft)}

/* pasek offline nad aplikacją (poza #app) */
.netbar{position:fixed;top:0;left:0;right:0;margin:0 auto;max-width:560px;z-index:120;display:none;align-items:center;gap:8px;padding:9px 16px;background:var(--tint-amber);border-bottom:2px solid var(--tint-amber-line);color:var(--amber-soft);font-size:12px;font-weight:800;line-height:1.3}
.netbar.on{display:flex}
.netbar .ic{color:var(--amber);flex:none}

/* pierwsze uruchomienie (LevelPick / Onboarding): kropki kroków, karty opcji z kaflem ikony i kółkiem wyboru, chipy celu */
.ob{display:flex;flex-direction:column;gap:14px;padding:18px 20px 30px;min-height:100%}
.ob>*{flex:none}
.obdots{display:flex;gap:8px}
.obdots i{flex:1;height:8px;border-radius:999px;background:var(--line-2)}
.obdots i.on{background:var(--acid-dark)}
.obdots i.cur{background:var(--acid)}
.obhead h1{font-size:34px;letter-spacing:-1.3px;line-height:1.02}
.obhead p{font-size:14.5px;font-weight:700;color:var(--muted);margin-top:10px;line-height:1.45}
.obopts{display:flex;flex-direction:column;gap:12px}
.obopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;min-height:76px;box-shadow:0 5px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.obopt:active{transform:translateY(5px);box-shadow:0 0 0 var(--shadow)}
.obopt .ico{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--line-2);color:var(--txt)}
.obopt.amber .ico{background:var(--amber);color:var(--on-amber)}
.obopt.acid .ico{background:var(--acid);color:var(--on-acid)}
.obopt.pink .ico{background:var(--pink);color:var(--on-pink)}
.obopt.cyan .ico{background:var(--cyan);color:var(--on-cyan)}
.obopt .grow{flex:1;min-width:0}
.obopt .t{font-size:16.5px;font-weight:800}
.obopt .s{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.obopt .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-dash);display:flex;align-items:center;justify-content:center;flex:none;color:var(--on-acid)}
.obopt.on{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 5px 0 var(--acid-dark)}
.obopt.on .t{color:var(--acid)}
.obopt.on .s{color:var(--acid-soft)}
.obopt.on .ck{background:var(--acid);border-color:var(--acid)}
.obbar{width:10px;height:32px;border-radius:5px;background:var(--line-dash);flex:none;margin:0 6px 0 2px}
.obopt.on .obbar{background:var(--acid)}
.obeye{margin-top:6px}
.obchips{display:flex;flex-wrap:wrap;gap:9px}
.obchip{min-height:46px;padding:0 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);color:var(--txt-2);font-family:var(--font-body);font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.obchip:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.obchip.on{background:var(--acid);border-color:var(--acid);color:var(--on-acid);box-shadow:0 4px 0 var(--acid-dark)}
.obfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px}
.obfoot .pill{min-height:60px;border-radius:20px}
.obrem{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--shadow)}
.obrem .ico{width:48px;height:48px;border-radius:16px;background:var(--tint-cyan);color:var(--cyan);display:flex;align-items:center;justify-content:center;flex:none}
.obrem .grow{flex:1;min-width:0}
.obrem .t{font-size:15.5px;font-weight:800}
.obrem .s{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px;line-height:1.35}
.obrem .s b{color:var(--txt-2)}
.obnote{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:2px dashed var(--line-dash);border-radius:22px;padding:14px 16px;font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.4}

/* katalog (Catalog.html): pole szukania, chipy etapów, karta „masz notatki?”, karty przedmiotów 2 kolumny */
.catalog{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.catalog>*{flex:none}
.catsearch{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:0 18px;min-height:60px;color:var(--muted-2);box-shadow:0 4px 0 var(--shadow)}
.catsearch:focus-within{border-color:var(--acid)}
.catsearch .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.catsearch input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--txt);font-family:var(--font-body);font-size:16px;font-weight:700;min-height:44px}
.catsearch input::placeholder{color:var(--muted-2)}
.catchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.catchips::-webkit-scrollbar{display:none}
.catchip{flex:none;min-height:44px;padding:0 16px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-family:var(--font-body);font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.catchip.on{background:var(--acid);border-color:var(--acid);color:var(--on-acid)}
.catcta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-acid);border:2px solid var(--acid);border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 var(--acid-dark);color:var(--txt);transition:transform .08s,box-shadow .08s}
.catcta:active{transform:translateY(5px);box-shadow:0 0 0 var(--acid-dark)}
.catcta .ico{width:48px;height:48px;border-radius:16px;background:var(--acid);color:var(--on-acid);display:flex;align-items:center;justify-content:center;flex:none}
.catcta .grow{flex:1;min-width:0}
.catcta .t{font-size:15.5px;font-weight:800;color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.catcta .s{font-size:12.5px;font-weight:700;color:var(--acid-soft);margin-top:3px}
.catlist{display:flex;flex-direction:column;gap:12px}
.catcard{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:15px 14px 13px;min-height:44px;box-shadow:0 5px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s}
.catcard:active{transform:translateY(5px);box-shadow:0 0 0 var(--shadow)}
.catcard .mono{width:46px;height:46px;border-radius:16px;font-size:22px}
.catcard .t{font-size:16px;font-weight:800;margin-top:4px;line-height:1.2}
.catcard .s{font-size:12px;font-weight:700;color:var(--muted);line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.catmeta{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:4px;font-size:11.5px;font-weight:800;color:var(--muted-2)}
.catmeta .open{display:inline-flex;align-items:center;gap:2px;color:var(--acid)}
.catempty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 16px;background:var(--surface-2);border:2px dashed var(--line-dash);border-radius:22px;color:var(--muted-2)}
.catempty .t{font-size:15px;font-weight:800;color:var(--txt-2)}
.catempty .s{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.4;max-width:280px}

/* ustawienia: pole godziny, ukryty input pliku, notka, wiersz czerwony, lista „co nowego” */
