<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAUKA — makro</title>
<style>
/* ============================================================
   NAUKA 2.0 — skóra silnika (krok 1: tokeny i klasy na zmiennych)
   Źródło prawdy dla kolorów i ruchu: design/tokens.css (wklejone niżej 1:1).
   Zasada: płaskie kolory, grube cienie pod spodem, duże promienie, zero gradientów.
   Motyw przedmiotu: engine.js ustawia --accent i --accent2 (hex z data/*.js);
   --accent-dark i --on-accent są liczone z --accent poniżej.
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

/* ============================================================
   NAUKA 2.0 — tokeny motywu i ruch
   Wklej na początek styles.css (albo zaimportuj jako osobny plik).
   Zasada: płaskie kolory, grube cienie pod spodem, duże promienie.
   ============================================================ */
:root{
  /* tła */
  --bg:#0E0C1C;          /* tło ekranu */
  --surface:#1B1836;     /* karta */
  --surface-2:#15122B;   /* pasek nawigacji, sekcja */
  --line:#2C2850;        /* obramowanie karty */
  --line-2:#241F45;      /* separator, tor paska postępu */
  --shadow:#14122A;      /* cień pod kartą na tle bg */

  /* tekst */
  --txt:#F4F2FF;
  --txt-2:#D6D2F0;
  --muted:#9B95C9;
  --muted-2:#6E67A8;
  --muted-3:#4E4778;

  /* akcenty */
  --acid:#B4FF3A;   --acid-dark:#7FC400;   --on-acid:#14210A;
  --pink:#FF2E93;   --pink-dark:#B01460;   --on-pink:#200410;
  --amber:#FFA023;  --amber-dark:#B36A08;  --on-amber:#201202;
  --cyan:#22D3EE;   --cyan-dark:#108CA1;   --on-cyan:#04232B;
  --gold:#FFC043;   --gold-dark:#B3820E;   --on-gold:#241800;
  --red:#FF4767;    --red-dark:#A8203A;    --on-red:#2A0008;
  --violet:#A855F7; --violet-dark:#6B2AA8; --on-violet:#1A0A2A;
  --flame:#FF7A1A;

  /* tinty pod kafle i panele */
  --tint-acid:#1F2A12;   --tint-acid-line:#4E6B24;
  --tint-pink:#241536;   --tint-pink-line:#46216B;
  --tint-amber:#2A1C10;  --tint-amber-line:#5C3812;
  --tint-cyan:#0E2430;   --tint-cyan-line:#1A4C5E;
  --tint-gold:#2A2110;   --tint-gold-line:#574319;
  --tint-red:#2A1017;    --tint-red-line:#5C1F2E;

  /* motyw przedmiotu — nadpisywane per przedmiot */
  --accent:var(--acid);
  --accent-dark:var(--acid-dark);
  --on-accent:var(--on-acid);

  /* kształt */
  --r-chip:999px; --r-sm:13px; --r-md:18px; --r-lg:22px; --r-xl:28px;
  --drop:4px;      /* cień kart */
  --drop-btn:5px;  /* cień przycisków */
  --drop-node:6px; /* cień węzłów ścieżki */

  /* typografia */
  --font-display:'Bricolage Grotesque', system-ui, sans-serif; /* 800 */
  --font-body:'Plus Jakarta Sans', system-ui, sans-serif;      /* 500/600/700/800 */
}

/* ---------- RUCH ---------- */
@keyframes dcFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-16px,0)}}
@keyframes dcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes dcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes dcBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.28)}36%{transform:scale(1)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
@keyframes dcGrow{from{width:0}}
@keyframes dcRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes dcPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.16);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes dcFall{0%{transform:translateY(-160px) rotate(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(430px) rotate(460deg);opacity:0}}
@keyframes dcBlink{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes dcSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes dcGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.14)}}
@keyframes dcFadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes dcShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}36%{transform:translateX(8px)}54%{transform:translateX(-5px)}72%{transform:translateX(3px)}}

.a-float{animation:dcFloat 9s ease-in-out infinite}
.a-bob{animation:dcBob 1.6s ease-in-out infinite}
.a-pulse{animation:dcPulse 1.5s ease-in-out infinite}
.a-beat{animation:dcBeat 1.9s ease-in-out infinite}
.a-spin{animation:dcSpin 2.8s linear infinite}
.a-grow{animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.a-rise{animation:dcRise .55s cubic-bezier(.2,.9,.3,1) both}
.a-pop{animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.a-fall{animation:dcFall 3.4s linear infinite}
.a-blink{animation:dcBlink 1.2s ease-in-out infinite}
.a-sway{animation:dcSway 4.2s ease-in-out infinite}
.a-glow{animation:dcGlow 2.2s ease-in-out infinite}
.a-up{animation:dcFadeUp .55s ease-out both}
.a-shake{animation:dcShake .55s ease-in-out .3s both}
.d1{animation-delay:.12s}.d2{animation-delay:.26s}.d3{animation-delay:.4s}
.d4{animation-delay:.55s}.d5{animation-delay:.72s}.d6{animation-delay:.9s}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}

/* ---------- PRZEPISY NA KOMPONENTY ---------- */
/* Przycisk główny: płaski kolor + cień pod spodem, wciśnięcie zjeżdża w dół. */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:58px;border:none;border-radius:var(--r-md);cursor:pointer;
  font-family:var(--font-body);font-size:15px;font-weight:800;letter-spacing:1.2px;
  background:var(--accent);color:var(--on-accent);
  box-shadow:0 var(--drop-btn) 0 var(--accent-dark);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 var(--accent-dark)}
.btn--ghost{background:var(--surface);border:2px solid var(--line);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.btn--danger{background:var(--red);color:var(--on-red);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.btn[disabled]{background:#201C3E;color:#5C568F;box-shadow:none;cursor:default}

/* Karta */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);
      box-shadow:0 var(--drop) 0 var(--shadow);padding:16px}

/* Pasek postępu — .bar i{width:X%} animuje się od zera klasą .a-grow */
.bar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* Plakietka */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-chip);
      font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}

/* Węzeł ścieżki */
.node{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 var(--drop-node) 0 var(--accent-dark);background:var(--accent)}
.node--current{width:88px;height:88px;box-shadow:0 7px 0 var(--accent-dark)}
.node--locked{background:var(--surface);border:2px solid var(--line);box-shadow:0 var(--drop-node) 0 var(--shadow);cursor:not-allowed}
.node:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-dark)}

/* Minimalny cel dotyku: 44px. Tekst 4.5:1, duży 3:1. */

/* ---------- ALIASY STARYCH ZMIENNYCH (engine.js / stare klasy) + pochodne motywu ---------- */
:root{
  --bg2:var(--surface-2); --card:var(--surface); --card2:var(--surface-2);
  --lime:var(--acid); --purple:var(--violet); --orange:var(--amber); --green:var(--acid);
  --accent1:var(--pink);
  --accent2:var(--acid);                                     /* nadpisywane inline przez engine (hex przedmiotu) */
  --accent-dark:var(--acid-dark);                            /* fallback dla przeglądarek bez color-mix */
  --accent-dark:color-mix(in srgb, var(--accent) 68%, #000);
  --on-accent:#120E22;
  --accent-tint:var(--surface-2);
  --accent-tint:color-mix(in srgb, var(--accent) 14%, var(--surface));
  --accent-tint-line:var(--line);
  --accent-tint-line:color-mix(in srgb, var(--accent) 36%, var(--surface));
}

/* ---------- BAZA ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);font-weight:500;background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
h1,h2,h3,.logo,.ftitle,.qq,.term,.exq{font-family:var(--font-display);font-weight:800}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px;z-index:30}
.logo{font-size:21px;letter-spacing:-.8px;line-height:1;display:flex;align-items:center;gap:8px}
.logo .g{color:var(--accent)}
.backbtn{background:var(--surface);border:2px solid var(--line);color:var(--txt);width:44px;height:44px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;flex:none;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.backbtn:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.pills{display:flex;align-items:center;gap:7px;flex:none}
.streak{display:flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);padding:7px 12px;border-radius:var(--r-chip);font-weight:800;font-size:14px;white-space:nowrap;color:var(--txt)}
.streak small{color:var(--muted);font-weight:700}
@media(max-width:380px){.pills{gap:5px}.streak{padding:6px 9px;font-size:13px}.logo{font-size:18px}}

.screen{flex:1;min-height:0;overflow:hidden;position:relative;display:none}
.screen.active{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 110px}

/* ---------- HOME: wybór przedmiotu ---------- */
.hero{padding:14px 4px 18px}
.hero h1{font-size:30px;letter-spacing:-1px;line-height:1.05}
.hero p{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.4}
.subjcard{display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:18px 18px 18px 22px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.subjcard:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.subjcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sa,var(--accent))}
.subjcard>*{position:relative;z-index:1}
.subjemoji{font-size:38px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);flex:none}
.subjmeta{flex:1;min-width:0}
.subjmeta h3{font-size:19px;letter-spacing:-.4px}
.subjmeta .sub{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35;font-weight:600}
.subjprog{margin-top:9px;display:flex;align-items:center;gap:8px}
.subjprog .bar{flex:1;height:10px;background:var(--line-2);border-radius:var(--r-chip);overflow:hidden}
.subjprog .bar i{display:block;height:100%;background:var(--sa,var(--accent));border-radius:var(--r-chip);animation:dcGrow 1.2s cubic-bezier(.2,.9,.3,1) both}
.subjprog small{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.subjcard .chev{font-size:24px;color:var(--muted-2);flex:none}
.addcard{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:var(--r-xl);padding:16px 18px;color:var(--muted);font-weight:700;font-size:14.5px}
.addcard .subjemoji{background:var(--surface);font-size:30px;color:var(--muted)}

/* ---------- SUBJECT sub-tabs ---------- */
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;padding:8px 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:var(--font-body)}
.subtab.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- ŚCIEŻKA (Duolingo path) ---------- */
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px 120px}
.pathnode{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
.nodebtn{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;font-size:32px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 var(--drop-node) 0 var(--accent-dark);background:var(--accent);color:var(--on-accent);transition:transform .08s,box-shadow .08s}
.nodebtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--accent-dark)}
.node-done{background:var(--accent)}
.node-open{width:88px;height:88px;font-size:36px;background:var(--acid);color:var(--on-acid);box-shadow:0 7px 0 var(--acid-dark);animation:dcPulse 1.5s ease-in-out infinite}
.node-open:active{box-shadow:0 3px 0 var(--acid-dark)}
.node-lock{background:var(--surface);border:2px solid var(--line);color:var(--muted-3);box-shadow:0 var(--drop-node) 0 var(--shadow);cursor:not-allowed}
.node-lock:active{transform:none;box-shadow:0 var(--drop-node) 0 var(--shadow)}
.nodebtn .stars{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap}
.nodelabel{font-size:12.5px;font-weight:800;text-align:center;max-width:180px;line-height:1.2;color:var(--txt)}
.nodelabel small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;margin-top:2px}
.node-lock+.nodelabel,.pathnode:has(.node-lock) .nodelabel{color:var(--muted-3)}
.pathnode:has(.node-open) .nodelabel{color:var(--acid)}
.connector{width:5px;height:16px;background:var(--line);border-radius:3px}
.connector.done{background:var(--accent)}
.pathzig:nth-child(odd){transform:translateX(-46px)}
.pathzig:nth-child(even){transform:translateX(46px)}

/* ---------- karty / tagi (wspólne) ---------- */
.tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;padding:6px 12px;border-radius:var(--r-chip);background:var(--surface-2);border:2px solid var(--line);color:var(--muted);margin-bottom:14px}
.progressrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.progressrow .bar{flex:1}
.bar i{width:0;transition:width .35s}
.counter{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;padding:8px 14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;letter-spacing:0;text-transform:none;cursor:pointer;white-space:nowrap;font-family:var(--font-body)}
.chips .chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* FEED / lekcja-feed */
.feedwrap{height:100%;overflow-y:scroll;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory}
.feedwrap::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:18px 18px 110px}
.fcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:24px 22px;position:relative;overflow:hidden;box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.fcard>*{position:relative;z-index:1}
.ftitle{font-size:24px;line-height:1.14;letter-spacing:-.6px;margin-bottom:14px}
.fbody{font-size:16px;line-height:1.5;color:var(--txt-2)}
.fbody b{color:var(--txt)}
.real{margin-top:16px;padding:13px 15px;background:var(--accent-tint);border:2px solid var(--accent-tint-line);border-left:6px solid var(--accent);border-radius:var(--r-sm);font-size:14.5px;line-height:1.45;color:var(--txt-2)}
.real .lbl{font-weight:800;color:var(--accent);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px}
.mnemo{margin-top:12px;padding:12px 15px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-left:6px solid var(--gold);border-radius:var(--r-sm);font-size:14.5px;line-height:1.45;color:var(--txt-2)}
.mnemo .lbl{font-weight:800;color:var(--gold);font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;display:block;margin-bottom:4px}

/* FISZKI */
.flip{flex:1;perspective:1600px;margin-bottom:14px;min-height:0}
.flipinner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,2,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid var(--line);overflow-y:auto;box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.front{background:var(--surface)}
.back{background:var(--accent-tint);border-color:var(--accent-tint-line);transform:rotateY(180deg)}
.face .tag{position:absolute;top:18px;left:18px;margin:0}
.term{font-size:26px;letter-spacing:-.6px;line-height:1.15}
.deftxt{font-size:16.5px;line-height:1.5;color:var(--txt-2)}
.deftxt b{color:var(--accent)}
.tapomat{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--muted);font-size:12.5px;font-weight:700}
.fbtns{display:flex;gap:10px}
.fbtn{flex:1;height:54px;border:2px solid var(--line);border-radius:var(--r-md);font-size:14px;font-weight:800;letter-spacing:.6px;cursor:pointer;font-family:var(--font-body);transition:transform .08s,box-shadow .08s}
.fbtn:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 transparent}
.fbtn.no{background:var(--tint-red);color:var(--red);border-color:var(--tint-red-line);box-shadow:0 var(--drop-btn) 0 var(--red-dark)}
.fbtn.yes{background:var(--tint-acid);color:var(--acid);border-color:var(--tint-acid-line);box-shadow:0 var(--drop-btn) 0 var(--acid-dark)}

/* QUIZ */
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-xl);padding:22px 20px;display:flex;flex-direction:column;box-shadow:0 var(--drop) 0 var(--shadow)}
.qq{font-size:20px;line-height:1.22;letter-spacing:-.4px;margin:8px 0 18px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{text-align:left;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid var(--line);color:var(--txt);font-size:15.5px;font-weight:600;line-height:1.35;cursor:pointer;display:flex;gap:12px;align-items:flex-start;box-shadow:0 var(--drop) 0 var(--shadow);font-family:var(--font-body);transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.opt .k{font-weight:800;color:var(--accent);flex:none}
.opt:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.opt.correct{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--txt);box-shadow:0 var(--drop) 0 var(--acid-dark)}
.opt.correct .k{color:var(--acid)}
.opt.wrong{background:var(--tint-red);border-color:var(--tint-red-line);color:var(--txt);box-shadow:0 var(--drop) 0 var(--red-dark);animation:dcShake .55s ease-in-out both}
.opt.wrong .k{color:var(--red)}
.opt.sel{background:var(--accent-tint);border-color:var(--accent)}
.opt.dim{opacity:.45;box-shadow:none}
.explain{margin-top:16px;padding:14px 16px;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-sm);font-size:14.5px;line-height:1.5;color:var(--txt-2);display:none}
.explain.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.explain b{color:var(--acid)}
.pill{height:58px;border:none;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;letter-spacing:1.2px;cursor:pointer;width:100%;font-family:var(--font-body);box-shadow:0 var(--drop-btn) 0 var(--accent-dark);transition:transform .08s,box-shadow .08s}
.pill:active{transform:translateY(var(--drop-btn));box-shadow:0 0 0 var(--accent-dark)}
.pill.ghost{background:var(--surface);border:2px solid var(--line);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.pill.ghost:active{box-shadow:0 0 0 var(--shadow)}
.qnext{margin-top:14px;display:none}
.qnext.show{display:block;animation:dcFadeUp .4s ease-out both}

/* WYNIK */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.result .big{font-size:60px;animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.result h2{font-size:28px;letter-spacing:-.8px}
.result p{color:var(--muted);font-size:15.5px;line-height:1.5;max-width:340px}
.result .score{font-size:19px;font-weight:800}
.result .score b{color:var(--accent)}

/* EGZAMIN */
.examhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.timer{font-weight:800;font-size:15px;background:var(--surface);border:2px solid var(--line);padding:7px 13px;border-radius:var(--r-chip);white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red);border-color:var(--red);animation:dcBlink 1.2s ease-in-out infinite}
.specs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.spec{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 16px;font-weight:800;font-size:15px;text-align:center;box-shadow:0 var(--drop) 0 var(--shadow)}
.spec small{display:block;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.review{margin-top:18px;text-align:left;width:100%}
.review h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted-2);margin-bottom:10px;font-family:var(--font-body)}
.ritem{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-bottom:9px;font-size:14px;line-height:1.45}
.ritem .rq{font-weight:800;margin-bottom:5px}
.ritem .rbad{color:var(--red)}
.ritem .rgood{color:var(--acid)}
.ritem .rsrc{color:var(--muted);font-size:12px;margin-top:5px}

/* INFO */
.zbox{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:12px;box-shadow:0 var(--drop) 0 var(--shadow)}
.zbox h3{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin-bottom:9px;font-family:var(--font-body)}
.zbox p,.zbox li{font-size:15px;line-height:1.55;color:var(--txt-2)}
.zbox ul{margin-left:18px;margin-top:4px}
.gradetbl{width:100%;border-collapse:collapse;font-size:14.5px}
.gradetbl td{padding:7px 4px;border-bottom:2px solid var(--line-2)}
.gradetbl td:last-child{text-align:right;font-weight:800;color:var(--gold)}

/* LEKCJA modal */
.lesson{position:absolute;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.lesson.open{display:flex;animation:dcFadeUp .3s ease-out both}
.lessonhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lessonhead .x{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;flex:none}
.lessonhead .bar{flex:1}
.lessonbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:0 16px 16px}
.lessonfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}

.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--surface-2);border-top:2px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;background:none;border:none;color:var(--muted-2);font-size:10.5px;font-weight:800;letter-spacing:.4px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:var(--r-sm);font-family:var(--font-body)}
.nav button .ic{font-size:21px;line-height:1}
.nav button.active{color:var(--acid)}

.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--surface);border:2px solid var(--line);padding:10px 18px;border-radius:var(--r-chip);font-weight:800;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 var(--drop) 0 var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.swipehint{position:absolute;bottom:80px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px;font-weight:700;animation:dcBob 1.6s ease-in-out infinite;pointer-events:none;z-index:20}

/* ---------- ĆWICZENIA (wpisywanie, klocki, pary, speed) ---------- */
.exhub{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.excard{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px 18px 16px 22px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.excard:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.excard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.excard>*{position:relative;z-index:1}
.excard .eemoji{font-size:30px;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:2px solid var(--line);border-radius:var(--r-md);flex:none}
.excard .emeta h3{font-size:16.5px;letter-spacing:-.3px}
.excard .emeta p{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35;font-weight:600}
.exprompt{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:6px}
.exq{font-size:23px;letter-spacing:-.5px;line-height:1.2;margin-bottom:18px}
.winput{width:100%;padding:15px 16px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:700;outline:none;font-family:var(--font-body)}
.winput:focus{border-color:var(--accent)}
.winput.ok{border-color:var(--tint-acid-line);background:var(--tint-acid)}
.winput.bad{border-color:var(--tint-red-line);background:var(--tint-red)}
.exfb{margin-top:14px;padding:13px 15px;border-radius:var(--r-sm);font-size:15px;line-height:1.45;display:none;border:2px solid var(--line)}
.exfb.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.exfb.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--txt-2)}
.exfb.bad{background:var(--tint-red);border-color:var(--tint-red-line);color:var(--txt-2)}
.exfb b{color:var(--txt)}
/* klocki */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.build{min-height:54px;border-bottom:2px dashed var(--line);padding:8px 4px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{padding:11px 14px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;min-width:44px;min-height:44px;text-align:center;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s;font-family:var(--font-body)}
.tile:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.tile.used{opacity:.25;pointer-events:none;box-shadow:none}
/* pary */
.matchwrap{display:flex;gap:10px}
.mcol{flex:1;display:flex;flex-direction:column;gap:9px}
.mitem{padding:13px 12px;border-radius:var(--r-sm);background:var(--surface);border:2px solid var(--line);color:var(--txt);font-size:14.5px;font-weight:700;line-height:1.3;cursor:pointer;min-height:48px;display:flex;align-items:center;box-shadow:0 var(--drop) 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.mitem:active{transform:translateY(var(--drop));box-shadow:0 0 0 var(--shadow)}
.mitem.sel{border-color:var(--accent);background:var(--accent-tint)}
.mitem.done{opacity:.35;border-color:var(--tint-acid-line);background:var(--tint-acid);pointer-events:none;box-shadow:none}
.mitem.bad{border-color:var(--red);background:var(--tint-red);animation:dcShake .55s ease-in-out both}

/* ============================================================
   KROK 2 — IKONY (inline SVG z engine.icon()) i MONOGRAMY zamiast emoji
   Reguły tylko dopisane; kolory wyłącznie przez tokeny z :root.
   ============================================================ */
svg.ic{display:inline-block;flex:none;vertical-align:-.2em}
.ic-acid{color:var(--acid)}.ic-gold{color:var(--gold)}.ic-flame{color:var(--flame)}.ic-red{color:var(--red)}
.ic-cyan{color:var(--cyan)}.ic-muted{color:var(--muted)}.ic-dim{color:var(--muted-3)}.ic-accent{color:var(--accent)}
/* przyciski i plakietki z ikoną: flex + odstęp (spacja w etykiecie jest wtedy ignorowana) */
.pill,.fbtn,.backbtn,.lessonhead .x{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pill.qnext.show{display:inline-flex}
.subtab,.chips .chip{display:inline-flex;align-items:center;gap:6px}
.subtab .ic{opacity:.85}.subtab.active .ic{opacity:1}
.timer{display:inline-flex;align-items:center;gap:6px}
.toast{display:flex;align-items:center;gap:7px}
.real .lbl,.mnemo .lbl{display:flex;align-items:center;gap:6px}
.subjcard .chev{display:flex;align-items:center}
.hero h1{display:flex;align-items:center;gap:12px}
.exfb .ic{vertical-align:-.25em}
.addcard .subjemoji{color:var(--acid)}
.excard .eemoji{color:var(--accent)}

/* monogram: pierwsza litera nazwy w kafelku w kolorze przedmiotu (DESIGN.md §1) */
.mono{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:15px;
      background:var(--accent-tint);border:2px solid var(--accent-tint-line);color:var(--accent);
      font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.5px;line-height:1}
.mono.sm{width:34px;height:34px;border-radius:11px;font-size:16px}
.subjcard .subjemoji.mono{width:64px;height:64px;border-radius:var(--r-md);font-size:30px;
      background:color-mix(in srgb,var(--sa) 14%,var(--surface));border-color:color-mix(in srgb,var(--sa) 36%,var(--surface));color:var(--sa)}

/* ścieżka: check / bolt / lock w węźle, gwiazdki jako małe ikony w pigułce pod węzłem */
.nodebtn .stars{display:flex;align-items:center;gap:2px;bottom:-13px;padding:3px 7px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-chip);box-shadow:0 2px 0 var(--shadow)}
.starrow{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;margin-left:6px}

/* wynik: duży okrągły kafel z ikoną (LevelComplete.html) zamiast emoji 60px */
.result .big{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0;
      background:var(--accent);color:var(--on-accent);box-shadow:0 8px 0 var(--accent-dark);margin-bottom:4px}
.result .big.ok{background:var(--acid);color:var(--on-acid);box-shadow:0 8px 0 var(--acid-dark)}
.result .big.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 8px 0 var(--gold-dark)}
.result .big.hot{background:var(--amber);color:var(--on-amber);box-shadow:0 8px 0 var(--amber-dark)}
.result .big.fail{background:var(--red);color:var(--on-red);box-shadow:0 8px 0 var(--red-dark)}
/* miejsce na pigułkę gwiazdek pod zaliczonym węzłem; przyciski z 2-liniową etykietą nie wychodzą poza 58px */
.pathnode:has(.node-done) .nodelabel{margin-top:10px}
.pill{height:auto;min-height:58px;padding:8px 16px;line-height:1.2}

</style>

<body>
<div id="app"></div>
<script>
/* ============================================================
   PRZEDMIOT: Polityka makroekonomiczna dla zrównoważonego rozwoju
   Źródło: 7 prezentacji dr. Witolda Siekierzyńskiego (Uczelnia Łazarskiego)
   + 43 pytania testowe z prezentacji zespołowych (~40% testu)
   ============================================================ */
window.SUBJECTS = window.SUBJECTS || [];
window.SUBJECTS.push({
  id:"makro",
  name:"Polityka makroekonomiczna",
  short:"Makro",
  emoji:"📊",
  tagline:"Zrównoważony rozwój, doktryny, fiskalna, ESG, praca, innowacje + behawioralka.",
  accent:"#FF2E93", accentDark:"#B01460", onAccent:"#200410",
  accent2:"#FF2E93",
  grading:{pass:50,examMin:20,scale:[[98,"5,5"],[90,"5"],[80,"4,5"],[70,"4"],[60,"3,5"],[50,"3"]],failLabel:"2 — niezaliczone"},
  info:`
    <div class="zbox"><h3>Jak liczy się ocena</h3>
      <p>🧪 <b>Sprawdzian końcowy = 60% oceny</b> (test, min. <b>50%</b> zalicza)<br>
      🎤 <b>Prezentacja zespołowa = 40% oceny</b><br>
      📌 Dozwolone łącznie <b>2 nieobecności</b> na warsztatach.</p></div>
    <div class="zbox"><h3>⚡ Najważniejszy cheat</h3>
      <p>4 pytania testowe z ostatniego slajdu KAŻDEJ prezentacji zespołowej (wszystkich grup, <b>łącznie z Twoją</b>) to <b>~40% pytań na teście</b>. Wszystkie wrzucone do poziomu <b>🎤 Pytania grup</b> i do quizu.</p></div>
    <div class="zbox"><h3>Siatka ocen (test)</h3>
      <table class="gradetbl">
        <tr><td>50–59%</td><td>3</td></tr><tr><td>60–69%</td><td>3,5</td></tr><tr><td>70–79%</td><td>4</td></tr>
        <tr><td>80–89%</td><td>4,5</td></tr><tr><td>90–97%</td><td>5</td></tr><tr><td>98–100%</td><td>5,5</td></tr></table></div>`,
  levels:[
    /* ---------------- L1 ---------------- */
    {id:"l1",title:"Podstawy",emoji:"🧩",
     feed:[
      {title:"Makro vs społeczna — o co biega",body:"<b>Polityka makroekonomiczna</b> = zarządzanie całą gospodarką państwa (alokacja zasobów, dług = wiarygodność fiskalna, stopy = polityka pieniężna).<br><br><b>Polityka społeczna</b> = państwo kształtuje warunki życia i łagodzi nierówności. Pomoc + inwestycja w kapitał ludzki (zdrowie, edukacja).",real:"Makro = pilnowanie kasy państwa. Społeczna = pilnowanie ludzi."},
      {title:"Kwestia społeczna to nie jeden problem",body:"<b>Kwestia społeczna</b> = wspólne podłoże problemów (bezrobocie, kryzys mieszkaniowy, ubóstwo). Systemowa sprzeczność w strukturze społeczeństwa (Rysz-Kowalczyk).",real:"Nie 'jeden ma pecha', tylko 'system tak ustawiony, że produkuje te problemy'."},
      {title:"Zrównoważony rozwój = 3 sfery",body:"Równowaga: 💰 <b>ekonomicznej</b>, 👥 <b>społecznej</b>, 🌍 <b>ekologicznej</b>. Rozwój, który nie zagraża przyszłym pokoleniom.",real:"3 nogi stołka — wywal jedną i rozwój się wywraca. Motyw całego kursu.",mnemo:"<b>EKO-SPO-EKO</b>: Ekonomia, Społeczeństwo, Ekologia."},
      {title:"Polityka społeczna ma pipeline",body:"<b>Diagnoza → Analiza przyczyn → Propozycje → Decyzja → Legislacja → Wdrożenie → Ewaluacja.</b> Na końcu: zadziałało? Co poprawić?",real:"Jak roadmapa produktu: od 'co zepsute' do 'czy nasza łatka pomogła'."},
      {title:"4 narzędzia polityki społecznej",body:"💸 <b>Ekonomiczne</b> (podatki, zasiłki, dotacje)<br>⚖️ <b>Prawne</b> (Kodeks pracy, ustawy)<br>📢 <b>Informacyjne</b> (kampanie, poradnictwo)<br>👷 <b>Kadrowe</b> (pracownicy socjalni, urzędnicy)",mnemo:"<b>KASA · PRAWO · GADANIE · LUDZIE</b> = cztery dźwignie państwa."},
      {title:"Ludzie NIE są homo economicus",body:"Realny człowiek ≠ kalkulator. Działa na <b>racjonalności ograniczonej</b>, <b>heurystykach</b>, <b>status quo bias</b> ('zawsze tak robiliśmy') i normach.",real:"Behawioralka wraca w KAŻDEJ części kursu — ogarnij raz, masz darmowe punkty wszędzie."}
     ],
     flashcards:[
      {t:"Polityka makroekonomiczna",d:"Zarządzanie gospodarką państwa jako całością: alokacja zasobów, wiarygodność fiskalna (dług), polityka pieniężna (stopy)."},
      {t:"Polityka społeczna",d:"Działalność państwa kształtująca warunki życia i łagodząca nierówności. Pomoc + inwestycja w kapitał ludzki. Opiera się na wiedzy i wartościach (aksjologii)."},
      {t:"Kwestia społeczna",d:"Wspólne podłoże różnych problemów (bezrobocie, ubóstwo, mieszkania). Systemowa sprzeczność w strukturze społeczeństwa (Rysz-Kowalczyk)."},
      {t:"Zrównoważony rozwój",d:"Równowaga 3 sfer: ekonomicznej, społecznej i ekologicznej. Rozwój niezagrażający przyszłym pokoleniom."},
      {t:"4 instrumenty polityki społecznej",d:"<b>Ekonomiczne</b> (podatki, zasiłki), <b>prawne</b> (ustawy), <b>informacyjne</b> (kampanie), <b>kadrowe</b> (pracownicy socjalni). Mnemo: KASA, PRAWO, GADANIE, LUDZIE."},
      {t:"Racjonalność ograniczona",d:"Bounded rationality — człowiek nie jest idealnym kalkulatorem; decyduje na podstawie heurystyk i skrótów myślowych."},
      {t:"Status quo bias",d:"Skłonność do trzymania się obecnego stanu — 'zawsze tak robiliśmy'. Opór przed zmianą."}
     ],
     quiz:[
      {q:"Czym różni się polityka makroekonomiczna od społecznej?",a:["Makro = zarządzanie całą gospodarką; społeczna = warunki życia i nierówności","Makro = tylko podatki; społeczna = tylko emerytury","To dokładnie to samo","Makro dotyczy gmin, społeczna państwa"],c:0,e:"Makro = gospodarka jako całość (dług, stopy). Społeczna = warunki życia i nierówności."},
      {q:"Ile rodzajów instrumentów ma polityka społeczna?",a:["3: prawne, kadrowe, militarne","4: ekonomiczne, prawne, informacyjne, kadrowe","2: podatki i zasiłki","5: w tym cyfrowe"],c:1,e:"Cztery: KASA, PRAWO, GADANIE, LUDZIE."},
      {q:"Co znaczy, że człowiek nie jest 'homo economicus'?",a:["Że nie zna ekonomii","Że działa na heurystykach i biasach, nie jak idealny kalkulator","Że zawsze decyduje racjonalnie","Że nie płaci podatków"],c:1,e:"Racjonalność ograniczona, heurystyki, status quo bias, normy."},
      {q:"Trzy sfery zrównoważonego rozwoju to:",a:["polityczna, militarna, kulturowa","ekonomiczna, społeczna, ekologiczna","lokalna, krajowa, globalna","prawna, fiskalna, monetarna"],c:1,e:"Równowaga 3 sfer — rozwój niezagrażający przyszłym pokoleniom."}
     ]},
    /* ---------------- L2 ---------------- */
    {id:"l2",title:"Doktryny",emoji:"🏛️",
     feed:[
      {title:"Ordoliberalizm = liberalizm uporządkowany",body:"Szkoła fryburska (Eucken, Böhm). Państwo świadomie tworzy <b>ramy</b> dla wolnego rynku, bo rynek sam się niszczy (monopole). Państwo = <b>strażnik ładu</b>, ustala reguły gry.",real:"Państwo = sędzia na meczu, nie zawodnik. Nie strzela goli, pilnuje zasad."},
      {title:"SGR: 'Dobrobyt przez konkurencję'",body:"<b>Społeczna Gospodarka Rynkowa</b> (Erhard) = praktyczne wdrożenie ordoliberalizmu. Fundament: <b>subsydiarność</b> — państwo pomaga TYLKO gdy jednostka/rodzina nie da rady.",real:"Pomoc tak, rozpieszczanie nie. Najpierw ty/rodzina, na końcu państwo."},
      {title:"Welfare state — i jego haczyk",body:"<b>Państwo opiekuńcze</b> = aktywny protektor, szeroka redystrybucja, 'solidarność transferowa'. Krytyka ordo: <b>moral hazard</b>, zabija bodźce; 'państwo podatków' → 'państwo długu' (Streeck).",real:"Dużo dawania = ludzie przywykają, kasa się kończy → kredyt na koszt wnuków."}

<script>
/* ============================================================
   NAUKA — silnik wieloprzedmiotowej platformy do nauki
   Dane przedmiotów rejestrują się w window.SUBJECTS (patrz data/*.js)

   ============================================================ */
(function(){
"use strict";

/* ---------- bezpieczny storage (iOS file:// potrafi rzucać) ---------- */
const STORE=(()=>{try{const ls=globalThis['localStorage'];const t='__nk_t';ls.setItem(t,'1');ls.removeItem(t);return ls;}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();
const PKEY='nauka_progress_v1';
let PROGRESS=(()=>{try{return JSON.parse(STORE.getItem(PKEY)||'{}');}catch(e){return {};}})();
function saveProgress(){try{STORE.setItem(PKEY,JSON.stringify(PROGRESS));}catch(e){}}
function subjState(id){ if(!PROGRESS[id])PROGRESS[id]={xp:0,levels:{}}; return PROGRESS[id]; }

/* ---------- daily streak (osobny klucz, nie rusza postępów) ---------- */
const MKEY='nauka_meta_v1';
let META=(()=>{try{return JSON.parse(STORE.getItem(MKEY)||'{}');}catch(e){return {};}})();
function saveMeta(){try{STORE.setItem(MKEY,JSON.stringify(META));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}
/* aktualna „żywa” seria do wyświetlenia (0 jeśli wygasła) */
function streakDisplay(){ if(!META.lastDay)return 0; const d=dayDiff(META.lastDay,todayStr()); return (d===0||d===1)?(META.streak||0):0; }
/* odnotuj aktywność dziś; zwraca true gdy seria została dziś przedłużona/zaczęta */
function touchStreak(){
  const t=todayStr();
  if(META.lastDay===t)return false; // już policzone dzisiaj
  if(META.lastDay){const d=dayDiff(META.lastDay,t); META.streak=(d===1)?(META.streak||0)+1:1;}
  else META.streak=1;
  META.lastDay=t; META.best=Math.max(META.best||0,META.streak); saveMeta();
  return true;
}

  bookmark:{d:'M5 5h14v14l-7-4-7 4z'},

  edit:{d:'M4 20h4L19 9l-4-4L4 16zM13 7l4 4'},
  link:{d:'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5'},
  map:{d:'M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14',w:2.4},
  grid:{d:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',w:2.4},
  flag:{d:'M5 21V4M5 4h12l-2 4 2 4H5'}
};
function icon(name,o){
  o=o||{};const ic=ICONS[name]||ICONS.alert;
  const size=o.size||20, sw=o.stroke||ic.w||2.6;
  const filled=(o.fill!=null)?!!o.fill:!!ic.fill;
  const body=ic.d.indexOf('<')>=0?ic.d:'<path d="'+ic.d+'"/>';
  const paint=filled?'fill="currentColor" stroke="none"':'fill="none" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round"';
  return '<svg class="ic'+(o.cls?' '+o.cls:'')+'" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" '+paint+' aria-hidden="true">'+body+'</svg>';
}
/* monogram zamiast emoji z danych: pierwsza litera/cyfra nazwy w kafelku w kolorze --accent */
function initial(str){const m=String(str||'').match(/[\p{L}\p{N}]/u);return m?m[0].toUpperCase():'?';}
function mono(txt,cls){return '<div class="mono'+(cls?' '+cls:'')+'" aria-hidden="true">'+txt+'</div>';}
/* 3 gwiazdki: zdobyte = pełne złote, reszta = kontur */
function starRow(nStars,size){return [0,1,2].map(i=>icon('star',{size:size||12,fill:i<nStars,stroke:2,cls:i<nStars?'ic-gold':'ic-dim'})).join('');}
/* duży kafel wyniku (.result .big): gold/hot/ok/fail albo '' = kolor przedmiotu */
const BIG_IC={gold:'trophy',hot:'flame',ok:'check',fail:'x-circle'};
function bigTile(kind,ic){return '<div class="big'+(kind?' '+kind:'')+'">'+icon(ic||BIG_IC[kind]||'check',{size:60,stroke:3.2})+'</div>';}
/* etykiety przycisków z ikoną (spacja: w block-layout zostaje odstęp, flex ją ignoruje) */
const LBL={
  next:'dalej '+icon('chevron-right',{size:18,stroke:3}),
  result:'wynik '+icon('flag',{size:18}),
  check:'sprawdź '+icon('check',{size:18,stroke:3.4}),
  again:'jeszcze raz '+icon('refresh',{size:18,stroke:2.8}),
  back:icon('back',{size:18,stroke:3})+' '
};
const TOAST_TONE={check:'acid',flame:'flame',close:'red','x-circle':'red',lock:'muted',info:'cyan',trophy:'gold',bolt:'gold'};

function toast(t,ic){const box=document.getElementById('toast');if(!box)return;box.innerHTML=ic?icon(ic,{size:16,cls:'ic-'+(TOAST_TONE[ic]||'acid')}):'';const s=document.createElement('span');s.textContent=t;box.appendChild(s);box.classList.add('show');clearTimeout(box._t);box._t=setTimeout(()=>box.classList.remove('show'),1500);}
function addXP(id,n){const s=subjState(id);s.xp+=n;saveProgress();const ext=touchStreak();updateXP();updateStreakUI();if(ext&&META.streak>1)setTimeout(()=>toast('seria '+META.streak+' dni z rzędu!','flame'),1600);}
function updateXP(){const x=document.getElementById('xpNum');if(x&&current)x.textContent=subjState(current.id).xp;}
function updateStreakUI(){const n=streakDisplay();document.querySelectorAll('[id="streakNum"]').forEach(e=>e.textContent=n);}

/* pula wszystkich elementów danego przedmiotu (ze wszystkich poziomów) */
function allCards(s){return s.levels.flatMap(l=>(l.flashcards||[]).map(c=>({...c,lvl:l.title})));}
function allQuiz(s){return s.levels.flatMap(l=>(l.quiz||[]).map(q=>({...q,lvl:l.title})));}
function allFeed(s){return s.levels.flatMap(l=>(l.feed||[]).map(f=>({...f,lvl:l.title})));}

function applyTheme(s){
  const r=document.documentElement.style;
  const set=(k,v)=>{if(v)r.setProperty(k,v);else r.removeProperty(k);};
  set('--accent', s&&s.accent);            // brak = domyślny --acid z :root
  set('--accent2', s&&(s.accent2||s.accent));
  set('--accent-dark', s&&s.accentDark);   // brak = color-mix z --accent w styles.css
  set('--on-accent', s&&s.onAccent);
}

/* ============================================================ HOME */
function renderHome(){
  current=null;
  applyTheme(null);
  app.innerHTML='';
  const top=el('div','topbar');
  top.appendChild(el('div','logo',icon('book',{size:24,cls:'ic-acid'})+'<span class="g">NAUKA</span>'));

  app.appendChild(top);

  const sc=el('div','screen active');const scroll=el('div','scroll');

  scroll.appendChild(hero);

  SUBJECTS.forEach(s=>{
    const st=subjState(s.id);
    const total=s.levels.length;
    const done=s.levels.filter(l=>st.levels[l.id]&&st.levels[l.id].done).length;
    const pct=total?Math.round(done/total*100):0;
    const card=el('div','subjcard');
    card.style.setProperty('--sa', s.accent);
    card.innerHTML=`<div class="subjemoji mono" aria-hidden="true">${initial(s.short||s.name)}</div>
      <div class="subjmeta">
        <h3>${s.name}</h3>
        <div class="sub">${s.tagline||''}</div>
        <div class="subjprog"><div class="bar"><i style="width:${pct}%"></i></div><small>${done}/${total} poziomów</small></div>
      </div><div class="chev">${icon('chevron-right',{size:22})}</div>`;
    card.onclick=()=>openSubject(s.id);
    scroll.appendChild(card);
  });
  const add=el('div','addcard');
  add.innerHTML='<div class="subjemoji">'+icon('plus',{size:26,stroke:3})+'</div><div>Kolejny przedmiot?<br><span style="font-size:12.5px;font-weight:600">Dodaj plik w <b>data/</b> (patrz README) i pojawi się tutaj.</span></div>';

/* ============================================================ SUBJECT shell */
function openSubject(id){
  current=SUBJECTS.find(s=>s.id===id);
  if(!current)return renderHome();
  applyTheme(current);
  curTab='path';
  renderSubject();
}
function renderSubject(){
  const s=current;
  try{clearInterval(cwInt);clearInterval(exInt);}catch(e){}
  app.innerHTML='';
  const top=el('div','topbar');

  pills.appendChild(el('div','streak',`${icon('bolt',{size:16,cls:'ic-gold'})}<span id="xpNum">${subjState(s.id).xp}</span> <small>xp</small>`));
  top.appendChild(pills);

  const tabs=el('div','subtabs');
  [['path','map','Ścieżka'],['fiszki','cards','Fiszki'],['quiz','brain','Quiz'],['cwicz','edit','Ćwiczenia'],['egzamin','target','Egzamin'],['info','info','Info']].forEach(([k,ic,lab])=>{
    const b=el('div','subtab'+(curTab===k?' active':''),icon(ic,{size:15})+'<span>'+lab+'</span>');
    b.onclick=()=>{curTab=k;renderSubject();};
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  const sc=el('div','screen active');sc.id='subjscreen';
  app.appendChild(sc);
  if(curTab==='path')renderPath(sc);
  else if(curTab==='fiszki')renderFiszki(sc);
  else if(curTab==='quiz')renderQuiz(sc);
  else if(curTab==='cwicz')renderCwicz(sc);
  else if(curTab==='egzamin')renderEgzamin(sc);
  else if(curTab==='info')renderInfo(sc);

  // toast + lesson container
  app.appendChild(el('div','toast',''));app.lastChild.id='toast';
  const lesson=el('div','lesson');lesson.id='lesson';app.appendChild(lesson);
}

/* ---------- ŚCIEŻKA (Duolingo) ---------- */
function levelUnlocked(s,idx){
  if(idx===0)return true;
  const prev=s.levels[idx-1];
  const st=subjState(s.id);
  return !!(st.levels[prev.id]&&st.levels[prev.id].done);
}
function renderPath(sc){
  const s=current;const st=subjState(s.id);
  const wrap=el('div','scroll');
  const path=el('div','path');
  s.levels.forEach((lv,i)=>{
    if(i>0){const c=el('div','connector'+( (st.levels[s.levels[i-1].id]||{}).done?' done':''));path.appendChild(c);}
    const unlocked=levelUnlocked(s,i);
    const done=(st.levels[lv.id]||{}).done;
    const stars=(st.levels[lv.id]||{}).stars||0;
    const node=el('div','pathnode pathzig');
    const cls = done?'node-done':(unlocked?'node-open':'node-lock');
    const btn=el('button','nodebtn '+cls, done?icon('check',{size:34,stroke:3.4}):(unlocked?icon('bolt',{size:40}):icon('lock',{size:28})));
    btn.setAttribute('aria-label',(done?'Powtórz: ':unlocked?'Zacznij: ':'Zablokowane: ')+lv.title);
    if(done){btn.innerHTML+=`<span class="stars">${starRow(stars,12)}</span>`;}
    if(unlocked){btn.onclick=()=>startLesson(lv);}else{btn.onclick=()=>toast('Najpierw zalicz poprzedni poziom','lock');}
    node.appendChild(btn);
    node.appendChild(el('div','nodelabel',`${lv.title}<small>${(lv.quiz||[]).length} pytań · ${(lv.flashcards||[]).length} fiszek</small>`));
    path.appendChild(node);
  });
  wrap.appendChild(path);sc.appendChild(wrap);
}

/* ---------- LEKCJA: feed -> quiz bramka ---------- */
let lessonState=null;
function startLesson(lv){
  lessonState={lv,phase:'feed',feedIdx:0,quiz:shuffle(lv.quiz||[]).slice(0,Math.min(6,(lv.quiz||[]).length)),qIdx:0,score:0,answered:false};
  if(!lessonState.quiz.length){ // brak quizu — sam feed
    lessonState.quiz=[];
  }
  const L=document.getElementById('lesson');L.classList.add('open');
  renderLesson();
}
function closeLesson(){document.getElementById('lesson').classList.remove('open');renderSubject();}
function renderLesson(){
  const L=document.getElementById('lesson');const s=current;const ls=lessonState;const lv=ls.lv;
  const totalFeed=(lv.feed||[]).length;
  let progPct;
  if(ls.phase==='feed') progPct = totalFeed?ls.feedIdx/(totalFeed+ls.quiz.length)*100:0;
  else progPct = (totalFeed+ls.qIdx)/(totalFeed+ls.quiz.length)*100;
  L.innerHTML='';
  const head=el('div','lessonhead');
  const x=el('button','x',icon('close',{size:18,stroke:3}));x.setAttribute('aria-label','Zamknij');x.onclick=closeLesson;head.appendChild(x);
  head.appendChild(el('div','bar',`<i style="width:${progPct}%"></i>`));
  L.appendChild(head);
  const body=el('div','lessonbody');L.appendChild(body);

  if(ls.phase==='feed'){
    const f=lv.feed[ls.feedIdx];
    const fw=el('div');fw.style.cssText='flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto';
    const card=el('div','fcard');
    card.innerHTML=`<span class="tag">${lv.title} · ${ls.feedIdx+1}/${totalFeed}</span>
      <div class="ftitle">${f.title}</div><div class="fbody">${f.body}</div>
      ${f.real?`<div class="real"><span class="lbl">${icon('bulb',{size:14})}po ludzku</span>${f.real}</div>`:''}
      ${f.mnemo?`<div class="mnemo"><span class="lbl">${icon('bookmark',{size:14})}zapamiętaj</span>${f.mnemo}</div>`:''}`;
    fw.appendChild(card);body.appendChild(fw);
    const foot=el('div','lessonfoot');
    const b=el('button','pill', ls.feedIdx+1<totalFeed?LBL.next:(ls.quiz.length?'lecimy z quizem '+icon('brain',{size:18}):'zakończ '+icon('check',{size:18,stroke:3.4})));
    b.onclick=()=>{ if(ls.feedIdx+1<totalFeed){ls.feedIdx++;renderLesson();} else if(ls.quiz.length){ls.phase='quiz';renderLesson();} else finishLesson(); };
    foot.appendChild(b);L.appendChild(foot);
  } else if(ls.phase==='quiz'){
    if(ls.qIdx>=ls.quiz.length)return finishLesson();
    const q=ls.quiz[ls.qIdx];ls.answered=false;
    const qc=el('div','qcard');qc.style.cssText='flex:1;overflow-y:auto';
    qc.innerHTML=`<span class="tag">pytanie ${ls.qIdx+1}/${ls.quiz.length}</span>
      <div class="qq">${q.q}</div>
      <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="explain" id="lexp"><b>czemu:</b> ${q.e||''}</div>`;
    body.appendChild(qc);
    const foot=el('div','lessonfoot');
    const nb=el('button','pill qnext',LBL.next);nb.id='lnext';
    nb.onclick=()=>{ls.qIdx++;renderLesson();};
    foot.appendChild(nb);L.appendChild(foot);
    qc.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      if(ls.answered)return;ls.answered=true;const i=+o.dataset.i;
      qc.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');else x.classList.add('dim');});
      if(i===q.c){ls.score++;addXP(s.id,5);toast('GIT +5xp','check');}else{toast('mid, czytaj wyjaśnienie','info');}
      document.getElementById('lexp').classList.add('show');
      const nx=document.getElementById('lnext');nx.classList.add('show');nx.innerHTML=(ls.qIdx+1>=ls.quiz.length)?'zobacz '+LBL.result:LBL.next;
    });
  }
}
function finishLesson(){
  const s=current;const ls=lessonState;const lv=ls.lv;
  const total=ls.quiz.length||1;const pct=ls.quiz.length?Math.round(ls.score/ls.quiz.length*100):100;
  const stars = pct>=90?3:(pct>=70?2:(pct>=50?1:0));
  const passed = ls.quiz.length?pct>=50:true;
  const st=subjState(s.id);const prev=st.levels[lv.id]||{};
  if(passed){
    st.levels[lv.id]={done:true,stars:Math.max(stars,prev.stars||0),best:Math.max(pct,prev.best||0)};
    if(!prev.done)addXP(s.id,15);
    saveProgress();
  }
  const L=document.getElementById('lesson');
  const kind = !passed?'fail':(pct>=90?'gold':pct>=70?'hot':'ok');
  const verdict = !passed?'Poniżej 50% — poziom niezaliczony. Przejedź feed jeszcze raz i spróbuj ponownie, dasz radę.':
    (pct>=90?'Mistrzostwo. Trzy gwiazdki, profesor by płakał ze szczęścia.':pct>=70?'Solidnie! Poziom zaliczony, lecimy dalej.':'Zaliczone na styk — wróć kiedyś po więcej gwiazdek.');
  L.innerHTML=`<div class="lessonhead"><button class="x" id="lx" aria-label="Zamknij">${icon('close',{size:18,stroke:3})}</button><div class="bar"><i style="width:100%"></i></div></div>
   <div class="lessonbody"><div class="result">
     ${bigTile(kind)}
     <h2>${lv.title}</h2>
     ${ls.quiz.length?`<div class="score">Trafione <b>${ls.score}/${ls.quiz.length}</b> (${pct}%) ${passed?'<span class="starrow">'+starRow(stars,18)+'</span>':''}</div>`:''}
     <p>${verdict}</p>
   </div></div>
   <div class="lessonfoot">${passed?'<button class="pill" id="lcont">dalej na ścieżkę '+icon('map',{size:18})+'</button>':'<button class="pill" id="lretry">spróbuj '+LBL.again+'</button>'}</div>`;
  document.getElementById('lx').onclick=closeLesson;
  const cont=document.getElementById('lcont');if(cont)cont.onclick=closeLesson;
  const retry=document.getElementById('lretry');if(retry)retry.onclick=()=>startLesson(lv);
}

/* ---------- FISZKI (cały przedmiot, filtr po poziomach) ---------- */
let fState=null;
function renderFiszki(sc){
  const s=current;
  if(!fState||fState.subj!==s.id)fState={subj:s.id,lvl:'all',idx:0,flipped:false};
  const wrap=el('div','scroll');
  const chips=el('div','chips');
  const mk=(id,name)=>{const c=el('div','chip'+(fState.lvl===id?' active':''),name);c.onclick=()=>{fState.lvl=id;fState.idx=0;renderFiszki(sc);};return c;};
  chips.appendChild(mk('all','Wszystko'));
  s.levels.forEach(l=>chips.appendChild(mk(l.id,l.title)));
  wrap.appendChild(chips);
  const list = fState.lvl==='all'?allCards(s):(s.levels.find(l=>l.id===fState.lvl).flashcards||[]).map(c=>({...c,lvl:s.levels.find(l=>l.id===fState.lvl).title}));
  if(fState.idx>=list.length)fState.idx=0;
  const c=list[fState.idx]||{t:'—',d:'Brak fiszek'};
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${list.length?fState.idx/list.length*100:0}%"></i></div><div class="counter">${list.length?fState.idx+1:0}/${list.length}</div>`));
  const flip=el('div','flip'+(fState.flipped?' flipped':''));flip.style.height='calc(100dvh - 320px)';
  flip.innerHTML=`<div class="flipinner">
    <div class="face front"><span class="tag">${c.lvl||''}</span><div class="term">${c.t}</div><div class="tapomat">tapnij = odpowiedź</div></div>
    <div class="face back"><span class="tag">odpowiedź</span><div class="deftxt">${c.d}</div><div class="tapomat">tapnij = wróć</div></div></div>`;
  flip.onclick=()=>{fState.flipped=!fState.flipped;flip.classList.toggle('flipped');};
  wrap.appendChild(flip);
  const btns=el('div','fbtns');
  const no=el('button','fbtn no',icon('refresh',{size:18,stroke:2.8})+' jeszcze nie');const yes=el('button','fbtn yes',icon('check',{size:18,stroke:3.4})+' umiem');
  const next=(known)=>{if(known){addXP(s.id,2);toast('+2xp','check');}fState.flipped=false;fState.idx=(fState.idx+1)%Math.max(1,list.length);renderFiszki(sc);};
  no.onclick=()=>next(false);yes.onclick=()=>next(true);
  btns.appendChild(no);btns.appendChild(yes);wrap.appendChild(btns);
  sc.innerHTML='';sc.appendChild(wrap);
}

/* ---------- QUIZ (cały przedmiot, filtr po poziomach) ---------- */
let qState=null;
function renderQuiz(sc){
  const s=current;
  if(!qState||qState.subj!==s.id)qState={subj:s.id,lvl:'all',list:null,idx:0,score:0,answered:false};
  if(!qState.list){
    qState.list = qState.lvl==='all'?shuffle(allQuiz(s)):shuffle((s.levels.find(l=>l.id===qState.lvl).quiz||[]));
    qState.idx=0;qState.score=0;
  }
  const wrap=el('div','scroll');
  const chips=el('div','chips');
  const mk=(id,name)=>{const c=el('div','chip'+(qState.lvl===id?' active':''),name);c.onclick=()=>{qState.lvl=id;qState.list=null;renderQuiz(sc);};return c;};
  chips.appendChild(mk('all','Wszystko'));
  s.levels.forEach(l=>chips.appendChild(mk(l.id,l.title)));
  wrap.appendChild(chips);
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${qState.list.length?qState.idx/qState.list.length*100:0}%"></i></div><div class="counter">${Math.min(qState.idx+1,qState.list.length)}/${qState.list.length}</div>`));
  const card=el('div','qcard');
  if(qState.idx>=qState.list.length){
    const pct=qState.list.length?Math.round(qState.score/qState.list.length*100):0;
    card.innerHTML=`<div class="result">${bigTile(pct>=70?'hot':pct>=50?'ok':'fail')}<h2>Wynik</h2>
      <div class="score">Trafione <b>${qState.score}/${qState.list.length}</b> (${pct}%)</div>
      <p>${pct>=70?'Solidnie ogarniasz ten przedmiot.':pct>=50?'Spoko, ale przejedź jeszcze fiszki.':'Wróć do fiszek i ścieżki, potem tu wróć.'}</p>
      <button class="pill" id="qre">${LBL.again}</button></div>`;
    wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
    document.getElementById('qre').onclick=()=>{qState.list=null;renderQuiz(sc);};
    return;
  }
  const q=qState.list[qState.idx];qState.answered=false;
  card.innerHTML=`<span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="explain" id="qexp"><b>czemu:</b> ${q.e||''}</div>
    <button class="pill qnext" id="qnext" style="margin-top:14px">${LBL.next}</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  card.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(qState.answered)return;qState.answered=true;const i=+o.dataset.i;
    card.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');else x.classList.add('dim');});
    if(i===q.c){qState.score++;addXP(s.id,3);toast('GIT +3xp','check');}else toast('mid','info');
    document.getElementById('qexp').classList.add('show');
    const n=document.getElementById('qnext');n.classList.add('show');n.innerHTML=(qState.idx+1>=qState.list.length)?LBL.result:LBL.next;
  });
  document.getElementById('qnext').onclick=()=>{qState.idx++;renderQuiz(sc);};
}

/* ---------- EGZAMIN ---------- */
let exState=null,exInt=null;
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0');}
function exGrade(s,pct){
  const sc=s.grading&&s.grading.scale; // [[min,label],...] malejąco
  if(sc){for(const[min,lab]of sc){if(pct>=min)return lab;}return s.grading.failLabel||'2 — niezaliczone';}
  if(pct>=90)return'5';if(pct>=70)return'4';if(pct>=50)return'3';return'2 — niezaliczone';
}
function renderEgzamin(sc){
  const s=current;clearInterval(exInt);exState=null;
  const wrap=el('div','scroll');
  const ALL=allQuiz(s).length;
  const N=Math.min(20,ALL);
  const lim=(s.grading&&s.grading.examMin)||20;
  const fullLim=Math.max(lim,Math.ceil(ALL*0.75)); // ~45s na pytanie
  wrap.innerHTML=`<div class="result">${bigTile('','target')}<h2>Egzamin</h2>
    <div class="specs"><div class="spec">${N}<small>losowych</small></div><div class="spec">${lim}:00<small>na czas</small></div><div class="spec">${(s.grading&&s.grading.pass)||50}%<small>zalicza</small></div></div>
    <p>Bez podpowiedzi w trakcie. Na końcu % i ocena wg siatki + przegląd błędów.</p>
    <button class="pill" id="exstart">${icon('bolt',{size:18})} symulacja — ${N} losowych</button>
    <button class="pill" id="exfull" style="margin-top:10px">${icon('list',{size:18})} Test końcowy — WSZYSTKIE ${ALL} pytań</button>
    <p style="font-size:13px;margin-top:6px">Test końcowy = każde pytanie z przedmiotu, w losowej kolejności (${fullLim}:00).</p></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exstart').onclick=()=>beginExam(sc,N,lim*60);
  document.getElementById('exfull').onclick=()=>beginExam(sc,ALL,fullLim*60);
}
function beginExam(sc,N,limit){
  const s=current;
  exState={pool:shuffle(allQuiz(s)).slice(0,N),idx:0,pick:[],left:limit};
  exState.pick=new Array(exState.pool.length).fill(null);
  clearInterval(exInt);
  exInt=setInterval(()=>{exState.left--;const t=document.getElementById('extimer');if(t){t.lastChild.textContent=fmt(exState.left);t.classList.toggle('warn',exState.left<=60);}if(exState.left<=0){clearInterval(exInt);examFinish(sc);}},1000);
  renderExamQ(sc);
}
function renderExamQ(sc){
  const s=current;const ex=exState;
  if(ex.idx>=ex.pool.length)return examFinish(sc);
  const q=ex.pool[ex.idx];const sel=ex.pick[ex.idx];const last=ex.idx+1>=ex.pool.length;
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Pytanie ${ex.idx+1}/${ex.pool.length}</div><div class="timer" id="extimer">${icon('clock',{size:16})}<span>${fmt(ex.left)}</span></div></div>
    <div class="progressrow"><div class="bar"><i style="width:${ex.idx/ex.pool.length*100}%"></i></div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
      <div class="opts">${q.a.map((o,i)=>`<button class="opt${sel===i?' sel':''}" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        ${ex.idx>0?'<button class="pill ghost" style="flex:1" id="exprev">'+LBL.back+'wstecz</button>':''}
        <button class="pill" style="flex:2" id="exnext">${last?'zakończ i sprawdź '+icon('flag',{size:18}):LBL.next}</button></div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ex.pick[ex.idx]=+o.dataset.i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.i===ex.pick[ex.idx]));});
  const nx=document.getElementById('exnext');nx.onclick=()=>{if(last)examFinish(sc);else{ex.idx++;renderExamQ(sc);}};
  const pv=document.getElementById('exprev');if(pv)pv.onclick=()=>{ex.idx--;renderExamQ(sc);};
}
function examFinish(sc){
  clearInterval(exInt);const s=current;const ex=exState;
  let correct=0;const wrong=[];
  ex.pool.forEach((q,i)=>{if(ex.pick[i]===q.c)correct++;else wrong.push({q,sel:ex.pick[i]});});
  const pct=Math.round(correct/ex.pool.length*100);
  const grade=exGrade(s,pct);const pass=(s.grading&&s.grading.pass)||50;
  const kind=pct>=90?'gold':pct>=70?'hot':pct>=pass?'ok':'fail';
  addXP(s.id,correct*3);
  const rev = wrong.length? wrong.map(w=>`<div class="ritem"><div class="rq">${w.q.q}</div>
      <div class="rbad">Twoja: ${w.sel==null?'— (brak)':keys[w.sel]+'. '+w.q.a[w.sel]}</div>
      <div class="rgood">Dobra: ${keys[w.q.c]}. ${w.q.a[w.q.c]}</div>
      <div class="rsrc">${w.q.lvl||''} · ${w.q.e||''}</div></div>`).join('') : '<div class="ritem rgood">'+icon('check',{size:16,stroke:3.4})+' Zero błędów. Clean sweep.</div>';
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="result">${bigTile(kind)}<h2>Ocena: ${grade}</h2>
    <div class="score">Trafione <b>${correct}/${ex.pool.length}</b> (${pct}%)</div>
    <p>${pct>=pass?'Zdane!':'Poniżej progu — wróć do ścieżki i fiszek.'}</p>
    <button class="pill" id="exagain">${LBL.again}</button></div>
    <div class="review"><h3>Przegląd błędów (${wrong.length})</h3>${rev}</div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exagain').onclick=()=>renderEgzamin(sc);
  if(pct>=pass)toast('zdane! ocena '+grade,'trophy');else toast('niezaliczone','x-circle');
}

/* ================= ĆWICZENIA (wpisywanie, klocki, pary, speed) ================= */
let cw=null, cwInt=null;
function exNorm(str){return (str||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\b(the|a|an|to|el|la|los|las|un|una|unos|unas)\b/g,' ').replace(/\s+/g,' ').trim();}
function exClean(str){return (str||'').replace(/\([^)]*\)/g,'').replace(/…|\.\.\./g,'').replace(/\s+/g,' ').trim();}
function typePool(s){return allCards(s).map(c=>({prompt:exClean(c.d),ans:exClean(c.t),lvl:c.lvl})).filter(c=>c.prompt&&c.ans&&c.ans.length<=30&&!/\//.test(c.ans));}
function tilePool(s){return typePool(s).filter(c=>c.ans.replace(/\s/g,'').length<=18);}
function matchPool(s){return allCards(s).map(c=>({a:exClean(c.t),b:exClean(c.d)})).filter(c=>c.a&&c.b);}

function renderCwicz(sc){
  clearInterval(cwInt);cw=null;
  const s=current;const wrap=el('div','scroll');
  const hub=el('div','exhub');
  const items = s.lang
   ? [['typing','edit','Wpisywanie','Po polsku → '+(s.short||'język')+'. Wpisz słowo z klawiatury.'],
      ['tiles','grid','Klocki — ułóż słowo','Poukładaj literki/wyrazy w poprawne słowo.'],
      ['match','link','Połącz w pary','Dopasuj słowo do tłumaczenia.']]
   : [['match','link','Połącz w pary','Dopasuj pojęcie do definicji.'],
      ['speed','bolt','Szybki quiz na czas','60 sekund — ile zdążysz trafić?'],
      ['typing','edit','Wpisz pojęcie','Z definicji wpisz właściwy termin.']];
  hub.appendChild(el('div','exprompt','Wybierz ćwiczenie'));
  items.forEach(([k,em,t,p])=>{
    const c=el('div','excard',`<div class="eemoji">${icon(em,{size:26,stroke:2.4})}</div><div class="emeta"><h3>${t}</h3><p>${p}</p></div>`);
    c.onclick=()=>{ if(k==='typing')cwStartTyping(sc); else if(k==='tiles')cwStartTiles(sc); else if(k==='match')cwStartMatch(sc); else cwStartSpeed(sc); };
    hub.appendChild(c);
  });
  wrap.appendChild(hub);sc.innerHTML='';sc.appendChild(wrap);
}
function cwBackBtn(sc){const b=el('button','pill ghost',LBL.back+'ćwiczenia');b.style.marginTop='12px';b.onclick=()=>renderCwicz(sc);return b;}
function cwResult(sc,kind,score,total,retry){
  clearInterval(cwInt);
  const wrap=el('div','scroll');const pct=total?Math.round(score/total*100):0;
  wrap.innerHTML=`<div class="result">${bigTile(kind)}<h2>Wynik</h2>
    <div class="score">Dobrze: <b>${score}/${total}</b> (${pct}%)</div>
    <p>${pct>=80?'Świetnie! Masz to w małym palcu.':pct>=50?'Niezłe, jeszcze runda i będzie czysto.':'Spoko, powtórz — od tego jest ćwiczenie.'}</p></div>`;
  const f=el('div');f.style.cssText='display:flex;gap:10px;padding:0 0 8px';
  const r=el('button','pill',LBL.again);r.onclick=retry;
  f.appendChild(r);f.appendChild(cwBackBtn(sc));wrap.appendChild(f);
  sc.innerHTML='';sc.appendChild(wrap);
}
/* --- TYPING --- */
function cwStartTyping(sc){const pool=shuffle(typePool(current)).slice(0,12);
  if(!pool.length){toast('Brak danych do wpisywania');return renderCwicz(sc);}
  cw={type:'typing',list:pool,idx:0,score:0};cwRenderTyping(sc);}
function cwRenderTyping(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'gold':'ok',cw.score,cw.list.length,()=>cwStartTyping(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">przetłumacz / wpisz</div><div class="exq">${it.prompt}</div>
    <input class="winput" id="win" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="wpisz odpowiedź…">
    <div class="exfb" id="wfb"></div>
    <button class="pill qnext" id="wnext" style="margin-top:14px">${LBL.check}</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const inp=document.getElementById('win'),btn=document.getElementById('wnext'),fb=document.getElementById('wfb');
  setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  let checked=false;
  const check=()=>{
    if(checked){cw.idx++;cwRenderTyping(sc);return;}
    checked=true;
    const ok=inp.value.trim()!=='' && exNorm(inp.value)===exNorm(it.ans);
    inp.classList.add(ok?'ok':'bad');inp.disabled=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp','check');fb.className='exfb ok show';fb.innerHTML=icon('check',{size:16,stroke:3.4,cls:'ic-acid'})+' Dobrze: <b>'+it.ans+'</b>';}
    else{toast('prawie!');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.innerHTML=(cw.idx+1>=cw.list.length)?LBL.result:LBL.next;
  };
  btn.onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
}
/* --- TILES --- */
function cwStartTiles(sc){const pool=shuffle(tilePool(current)).slice(0,10);
  if(!pool.length){toast('Brak danych');return renderCwicz(sc);}
  cw={type:'tiles',list:pool,idx:0,score:0,_n:-1};cwRenderTiles(sc);}
function cwRenderTiles(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'gold':'ok',cw.score,cw.list.length,()=>cwStartTiles(sc));
  const phrase=/\s/.test(it.ans.trim());
  const sep=phrase?' ':'';
  if(cw._n!==cw.idx){cw._n=cw.idx;const units=phrase?it.ans.trim().split(/\s+/):it.ans.replace(/\s/g,'').split('');cw.tiles=shuffle(units.map(ch=>({ch,used:false})));cw.build=[];cw.checked=false;}
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">ułóż: ${it.prompt}</div>
    <div class="build" id="build"></div><div class="tiles" id="bank"></div>
    <div class="exfb" id="tfb"></div>
    <button class="pill qnext" id="tnext" style="margin-top:8px">${LBL.check}</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const bankEl=document.getElementById('bank'),buildEl=document.getElementById('build'),fb=document.getElementById('tfb'),btn=document.getElementById('tnext');
  cw.build.forEach((ti,pos)=>{const b=el('button','tile',cw.tiles[ti].ch);b.onclick=()=>{if(cw.checked)return;cw.tiles[ti].used=false;cw.build.splice(pos,1);cwRenderTiles(sc);};buildEl.appendChild(b);});
  cw.tiles.forEach((tl,ti)=>{const b=el('button','tile'+(tl.used?' used':''),tl.ch);b.onclick=()=>{if(cw.checked||tl.used)return;tl.used=true;cw.build.push(ti);cwRenderTiles(sc);};bankEl.appendChild(b);});
  btn.onclick=()=>{
    if(cw.checked){cw.idx++;cwRenderTiles(sc);return;}
    const got=cw.build.map(i=>cw.tiles[i].ch).join(sep);
    const ok=exNorm(got)===exNorm(it.ans);cw.checked=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp','check');fb.className='exfb ok show';fb.innerHTML=icon('check',{size:16,stroke:3.4,cls:'ic-acid'})+' <b>'+it.ans+'</b>';}
    else{toast('nie tak');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.innerHTML=(cw.idx+1>=cw.list.length)?LBL.result:LBL.next;
  };
}
/* --- MATCH --- */
function cwStartMatch(sc){const pool=shuffle(matchPool(current)).slice(0,5);
  if(pool.length<2){toast('Za mało danych');return renderCwicz(sc);}
  cw={type:'match',pairs:pool,left:shuffle(pool.map((p,i)=>({i,t:p.a}))),right:shuffle(pool.map((p,i)=>({i,t:p.b}))),selL:null,selR:null,done:0,matched:new Set()};
  cwRenderMatch(sc);}
function cwRenderMatch(sc){
  if(cw.done>=cw.pairs.length)return cwResult(sc,'ok',cw.pairs.length,cw.pairs.length,()=>cwStartMatch(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','exprompt','Połącz w pary (tapnij z lewej, potem z prawej)'));
  const mw=el('div','matchwrap');const lc=el('div','mcol'),rc=el('div','mcol');
  const trunc=t=>t.length>64?t.slice(0,62)+'…':t;
  cw.left.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('L'+o.i)?' done':'')+(cw.selL===o.i?' sel':''),o.t);it.onclick=()=>{if(cw.matched.has('L'+o.i))return;cw.selL=o.i;tryMatch(sc);};lc.appendChild(it);});
  cw.right.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('R'+o.i)?' done':'')+(cw.selR===o.i?' sel':''),trunc(o.t));it.onclick=()=>{if(cw.matched.has('R'+o.i))return;cw.selR=o.i;tryMatch(sc);};rc.appendChild(it);});
  mw.appendChild(lc);mw.appendChild(rc);wrap.appendChild(mw);
  const f=el('div');f.style.cssText='margin-top:14px';f.appendChild(cwBackBtn(sc));wrap.appendChild(f);
  sc.innerHTML='';sc.appendChild(wrap);
}
function tryMatch(sc){
  if(cw.selL==null||cw.selR==null){cwRenderMatch(sc);return;}
  if(cw.selL===cw.selR){cw.matched.add('L'+cw.selL);cw.matched.add('R'+cw.selR);cw.done++;cw.selL=null;cw.selR=null;addXP(current.id,3);toast('para! +3xp','check');cwRenderMatch(sc);}
  else{toast('nie pasuje','close');cw.selL=null;cw.selR=null;cwRenderMatch(sc);}
}
/* --- SPEED --- */
function cwStartSpeed(sc){cw={type:'speed',list:shuffle(allQuiz(current)),idx:0,score:0,left:60};
  clearInterval(cwInt);cwInt=setInterval(()=>{cw.left--;const t=document.getElementById('spdt');if(t){t.lastChild.textContent=cw.left+'s';t.classList.toggle('warn',cw.left<=10);}if(cw.left<=0){clearInterval(cwInt);cwResult(sc,(cw.score>=10)?'hot':'ok',cw.score,cw.idx,()=>cwStartSpeed(sc));}},1000);
  cwRenderSpeed(sc);}
function cwRenderSpeed(sc){
  if(cw.idx>=cw.list.length){clearInterval(cwInt);return cwResult(sc,'hot',cw.score,cw.idx,()=>cwStartSpeed(sc));}
  const q=cw.list[cw.idx];const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Trafione: ${cw.score}</div><div class="timer" id="spdt">${icon('clock',{size:16})}<span>${cw.left}s</span></div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  let locked=false;
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(locked)return;locked=true;const i=+o.dataset.i;
    wrap.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');});
    if(i===q.c){cw.score++;addXP(current.id,2);}
    setTimeout(()=>{cw.idx++;cwRenderSpeed(sc);},450);
  });
}

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  app=document.getElementById('app');
  if(!SUBJECTS.length){app.innerHTML='<div class="topbar"><div class="logo">'+icon('book',{size:24,cls:'ic-acid'})+'<span class="g">NAUKA</span></div></div><div class="scroll"><div class="zbox"><p>Brak załadowanych przedmiotów. Dodaj plik danych w <b>data/</b> (np. data/makro.js).</p></div></div>';return;}
  renderHome();
});
})();
