<body>
<div id="app"></div>
<script>
/* ============================================================
   PRZEDMIOT: Globalizacja, regionalizacja i konkurencyjność międzynarodowa
   Źródło: 4 prezentacje dr. Dominika Brodackiego (Zajęcia 1–4)
   Zaliczenie: aktywność 20% + prezentacja 40% + zaliczenie pisemne 40%
   ============================================================ */
window.SUBJECTS = window.SUBJECTS || [];
window.SUBJECTS.push({
  id:"globalizacja",
  name:"Globalizacja i regionalizacja",
  short:"Global",
  emoji:"🌍",
  tagline:"Fale globalizacji, teorie (liberalizm/realizm/krytycyzm), global governance, efekt brukselski, konkurencyjność, kultura, regionalizacja.",
  accent:"#B4FF3A", accentDark:"#7FC400", onAccent:"#14210A",
  accent2:"#B4FF3A",
  grading:{pass:50,examMin:20,scale:[[98,"5,5"],[90,"5"],[80,"4,5"],[70,"4"],[60,"3,5"],[50,"3"]],failLabel:"2 — niezaliczone"},
  info:`
    <div class="zbox"><h3>Jak liczy się ocena</h3>
      <p>🙋 <b>Aktywność na zajęciach = 20%</b><br>
      🎤 <b>Prezentacja (pary/trójki) = 40%</b> — 10 min, najważniejsze wydarzenia z ostatnich 2 tygodni (co / kto / kiedy / jak / dlaczego ważne) i ich wpływ na konkurencyjność.<br>
      🧪 <b>Zaliczenie pisemne (ostatnie zajęcia) = 40%</b>.</p></div>
    <div class="zbox"><h3>Siatka ocen (test)</h3>
      <table class="gradetbl">
        <tr><td>50–59</td><td>3</td></tr><tr><td>60–69</td><td>3,5</td></tr><tr><td>70–79</td><td>4</td></tr>
        <tr><td>80–89</td><td>4,5</td></tr><tr><td>90–98</td><td>5</td></tr><tr><td>98–100</td><td>5,5</td></tr></table></div>
    <div class="zbox"><h3>⚡ Motyw przewodni kursu</h3>
      <p>Świat przechodzi <b>od logiki efektywności do logiki bezpieczeństwa</b>. „Produkować najtaniej” → „produkować bezpiecznie”. Zapamiętaj to zdanie — spina cały przedmiot.</p></div>`,
  levels:[
    /* ---------------- L1 ---------------- */
    {id:"l1",title:"Czym jest globalizacja",emoji:"🧭",
     feed:[
      {title:"Definicja, którą musisz umieć",body:"<b>Globalizacja</b> = proces rosnącej <b>współzależności</b> między państwami, gospodarkami i społeczeństwami, obejmujący przepływy <b>towarów, kapitału, ludzi, technologii i idei</b>.",real:"Świat coraz mocniej połączony kablami zależności. Ruszysz jeden koniec — drga drugi.",mnemo:"Przepływy: <b>TO-KA-LU-TE-I</b> — Towary, Kapitał, Ludzie, Technologia, Idee."},
      {title:"To NIE tylko gospodarka",body:"Globalizacja obejmuje też: 🏛️ <b>politykę</b> (instytucje globalne, np. WTO), 👥 <b>społeczeństwo</b> (migracje), 🎭 <b>kulturę</b> i 🌱 <b>środowisko</b> (zmiany klimatu).",real:"Nie tylko o tym, skąd masz telefon — też o memach, wizach i CO₂."},
      {title:"5 wymiarów globalizacji",body:"💰 <b>Gospodarczy</b> · 🔌 <b>Technologiczny</b> · 👥 <b>Społeczny</b> · 🎭 <b>Kulturowy</b> · 🏛️ <b>Polityczny</b>.",mnemo:"<b>GO-TE-SPO-KU-PO</b> — pięć nóg globalizacji."},
      {title:"Czym globalizacja NIE jest",body:"❌ To nie to samo co <b>liberalizm gospodarczy</b> (integracja może iść przy różnych systemach).<br>❌ Nie <b>McDonaldyzacja</b> — wymiana kultur jest wielokierunkowa, powstają hybrydy.<br>❌ Nie sam <b>internet</b> — cyfryzacja ją przyspieszyła, ale nie jest jej źródłem.<br>❌ Nie zwykły <b>handel</b> — chodzi o integrację systemów produkcji, nie tylko eksport/import.",real:"Globalizacja ≠ 'wszędzie ten sam Big Mac'. To głębsza integracja, nie tylko przelewy i paczki."},
      {title:"Globalizacja vs internacjonalizacja vs regionalizacja",body:"<b>Globalizacja</b> = integracja w skali świata.<br><b>Internacjonalizacja</b> = współpraca między odrębnymi państwami (bez zlewania się w jeden system).<br><b>Regionalizacja</b> = zacieśnianie więzi wewnątrz jednego regionu (np. UE, ASEAN).",real:"Regionalizacja to globalizacja 'na dzielni' — bliżej, bezpieczniej, w gronie sąsiadów/sojuszników."}
     ],
     flashcards:[
      {t:"Globalizacja",d:"Proces rosnącej współzależności między państwami, gospodarkami i społeczeństwami; obejmuje przepływy towarów, kapitału, ludzi, technologii i idei."},
      {t:"5 wymiarów globalizacji",d:"Gospodarczy, technologiczny, społeczny, kulturowy, polityczny."},
      {t:"Globalizacja to nie McDonaldyzacja",d:"Wymiana kulturowa jest wielokierunkowa; lokalne kultury adaptują globalne wzorce, powstają hybrydy — to przenikanie kultur, nie tylko ich ujednolicanie."},
      {t:"Internacjonalizacja",d:"Współpraca i wymiana między odrębnymi państwami — bez zlewania się gospodarek w jeden zintegrowany system (to odróżnia ją od globalizacji)."},
      {t:"Regionalizacja",d:"Zacieśnianie integracji gospodarczej/handlowej między państwami jednego regionu lub bliskiego sąsiedztwa (UE, ASEAN, USMCA)."},
      {t:"Globalna wioska",d:"Marshall McLuhan — dzięki elektronicznej łączności świat staje się jedną wioską: natychmiastowa komunikacja, wspólna przestrzeń medialna. Nie musi oznaczać harmonii."}
     ],
     quiz:[
      {q:"Globalizacja to przede wszystkim:",a:["tylko wolny handel towarami","proces rosnącej współzależności obejmujący przepływy towarów, kapitału, ludzi, technologii i idei","synonim McDonaldyzacji świata","to samo co internet"],c:1,e:"Definicja z wykładu: rosnąca współzależność + 5 typów przepływów."},
      {q:"Które NIE jest jednym z 5 wymiarów globalizacji?",a:["gospodarczy","technologiczny","militarny","kulturowy"],c:2,e:"5 wymiarów: gospodarczy, technologiczny, społeczny, kulturowy, polityczny."},
      {q:"Dlaczego globalizacja to NIE to samo co McDonaldyzacja?",a:["bo McDonald's zbankrutował","bo wymiana kultur jest wielokierunkowa i powstają hybrydy, a nie samo ujednolicenie","bo kultura się nie zmienia","bo globalizacja dotyczy tylko gospodarki"],c:1,e:"Kultury się przenikają i adaptują wzorce — to hybrydyzacja, nie prosta homogenizacja."},
      {q:"Czym regionalizacja różni się od globalizacji?",a:["to integracja w obrębie jednego regionu/sąsiedztwa, nie całego świata","to zakaz handlu","to synonim globalizacji","dotyczy tylko kultury"],c:0,e:"Regionalizacja = zacieśnianie więzi wewnątrz regionu (UE, ASEAN, RCEP)."}
     ]},
    /* ---------------- L2 ---------------- */
    {id:"l2",title:"Fale globalizacji",emoji:"🌊",
     feed:[
      {title:"Falowy charakter — I FALA (1870–1914)",body:"Napęd: <b>rewolucja przemysłowa</b>, wynalazki (<b>kolej i telegraf</b>), <b>standard złota</b>, masowe migracje. Udział eksportu w światowym PKB skoczył z ~5% (1870) do ~14% (1913).",real:"Pierwsza globalizacja to nie internet — to para, tory i telegraf. Londyn = centrum finansów świata.",mnemo:"I fala = <b>Kolej + Telegraf + Złoto + Migracje</b>."},
      {title:"Wielki reset: wojny i protekcjonizm",body:"Wojny światowe, <b>Wielki Kryzys</b>, nacjonalizm gospodarczy i protekcjonizm cofnęły integrację. Poziom handlu z 1913 r. odzyskano dopiero w latach <b>70.–80. XX w.</b>",real:"Globalizacja NIE jest liniowa. Raz się cofnęła na ~60 lat. Może znów."},
      {title:"II FALA (1945–2008)",body:"Fundamenty ładu: <b>Bretton Woods</b> (1944, MFW + Bank Światowy), <b>GATT → WTO</b>. Potem globalne łańcuchy wartości, <b>offshoring</b>, <b>China shock</b>, <b>just-in-time</b>.",real:"Po wojnie zbudowano 'reguły gry' i produkcja rozlała się po świecie w poszukiwaniu taniości."},
      {title:"Hiperglobalizacja (1990–2008)",body:"Turbo-faza: <b>upadek ZSRR</b>, <b>liberalizacja kapitału</b>, <b>cyfryzacja</b>, ekspansja WTO. Świat jednobiegunowy, kapitał płynie swobodnie.",real:"Lata 90.–2000. — 'im więcej globalizacji, tym lepiej'. Szczyt wiary w wolny rynek bez granic."},
      {title:"2008 — ROK PRZEŁOMU",body:"<b>Kryzys finansowy</b> + wzrost <b>populizmu</b> + <b>wojny handlowe</b> + <b>kryzys zaufania do instytucji</b>. Od tego momentu mówimy o <b>deglobalizacji / slowbalisation</b>.",real:"2008 to zakręt. Później: friend-shoring, nearshoring, decoupling — dobił to COVID i wojna w Ukrainie.",mnemo:"Po 2008: <b>Slow-Friend-Near-De</b> (slowbalisation, friend-shoring, nearshoring, decoupling)."}
     ],
     flashcards:[
      {t:"I fala globalizacji (1870–1914)",d:"Napęd: rewolucja przemysłowa, kolej i telegraf, standard złota, masowe migracje. Eksport w PKB świata: z ~5% (1870) do ~14% (1913). Londyn = centrum finansów."},
      {t:"Przerwa 1914–lata 70./80.",d:"Wojny światowe, Wielki Kryzys, nacjonalizm gospodarczy i protekcjonizm cofnęły globalizację; poziom handlu z 1913 r. odzyskano dopiero w latach 70.–80. XX w."},
      {t:"II fala globalizacji (1945–2008)",d:"Bretton Woods (MFW, Bank Światowy), GATT → WTO. Globalne łańcuchy wartości, offshoring, China shock, just-in-time."},
      {t:"Hiperglobalizacja (1990–2008)",d:"Upadek ZSRR, liberalizacja przepływów kapitału, cyfryzacja, ekspansja WTO. Szczyt integracji świata."},
      {t:"Rok przełomu 2008",d:"Kryzys finansowy, wzrost populizmu, wojny handlowe, kryzys zaufania do instytucji. Początek deglobalizacji / slowbalisation."},
      {t:"China shock",d:"Gwałtowny wpływ wejścia Chin do WTO (2001) i ich taniej produkcji na przemysł krajów rozwiniętych — utrata miejsc pracy w produkcji na Zachodzie."},
      {t:"Just-in-time vs just-in-case",d:"JIT = minimalne zapasy, dostawa 'na czas' (maks. efektywność). JIC = bufory i zapasy na wypadek szoków (maks. odporność). Świat przechodzi z JIT na JIC."}
     ],
     quiz:[
      {q:"Co napędzało I falę globalizacji (1870–1914)?",a:["internet i social media","kolej, telegraf, standard złota i masowe migracje","WTO i Bretton Woods","upadek ZSRR"],c:1,e:"I fala = rewolucja przemysłowa, kolej/telegraf, złoto, migracje."},
      {q:"Rok 2008 w historii globalizacji to:",a:["początek I fali","rok przełomu — kryzys finansowy, populizm, wojny handlowe, spadek zaufania do instytucji","podpisanie Bretton Woods","upadek ZSRR"],c:1,e:"2008 = zakręt ku deglobalizacji / slowbalisation."},
      {q:"Instytucje Bretton Woods (1944) to m.in.:",a:["WTO i NATO","MFW i Bank Światowy","ASEAN i Mercosur","G20 i BRICS"],c:1,e:"Bretton Woods powołało MFW i Bank Światowy; handlem zajął się GATT → WTO."},
      {q:"Kiedy świat odzyskał poziom integracji handlowej z 1913 r.?",a:["już w 1920 r.","dopiero w latach 70.–80. XX w.","w 1945 r.","nigdy"],c:1,e:"Wojny, Wielki Kryzys i protekcjonizm cofnęły globalizację aż do lat 70.–80."},
      {q:"Just-in-time oznacza:",a:["duże zapasy na wypadek kryzysu","produkcję z minimalnymi zapasami, dostawą 'na czas' — maks. efektywność","zakaz importu","powrót produkcji do kraju"],c:1,e:"JIT = efektywność; przeciwieństwo to just-in-case (odporność)."}
     ]},
    /* ---------------- L3 ---------------- */
    {id:"l3",title:"Teorie globalizacji",emoji:"🎓",
     feed:[
      {title:"Liberalizm — 'rynek sam integruje świat'",body:"Globalizacja to <b>pozytywny, naturalny</b> efekt technologii i rynku. Napędza ją: <b>technologia, rynek (efektywność), kapitał</b>. Prowadzi do <b>konwergencji</b> (biedniejsi nadrabiają), a państwa wolą <b>współpracować niż walczyć</b> (kompleksowa współzależność).",real:"'Im więcej globalizacji, tym lepiej.' Kapitał nie ma narodowości — kraje muszą się dostosować.",mnemo:"Liberalizm: napędza <b>RYNEK</b>, priorytet = <b>EFEKTYWNOŚĆ</b>, państwo = rola <b>ograniczona</b>."},
      {title:"Realizm — 'liczą się państwa i siła'",body:"Najważniejsi aktorzy to <b>państwa</b>, a ich cel to <b>bezpieczeństwo i siła</b>. Globalizacja jest <b>narzędziem</b> zwiększania potęgi. Świat = system <b>rywalizujących państw</b>, nie współpracujących rynków. Trwa tylko, gdy zgadza się z interesem najsilniejszych.",real:"Wojny handlowe, sankcje, kontrola eksportu chipów, USA vs Chiny, friend-shoring. Bezpieczeństwo > tania cena.",mnemo:"Realizm: napędza <b>PAŃSTWO</b>, priorytet = <b>BEZPIECZEŃSTWO</b>, państwo = rola <b>kluczowa</b>."},
      {title:"Instytucjonalizm (neoliberalizm)",body:"Globalizacja generuje chaos — <b>instytucje</b> (ONZ, WTO, MFW, NATO) tworzą zasady i normy, dostarczają wiarygodnych informacji, zmniejszają ryzyko oszustwa. Państwa współpracują nie dlatego, że 'są dobre', ale bo <b>im się to opłaca</b>.",real:"Reguły > dobra wola. Instytucje to 'sędzia i tablica wyników', dzięki którym opłaca się grać fair."},
      {title:"Podejście krytyczne",body:"Globalizacja = rozszerzenie <b>kapitalizmu/neoliberalizmu</b> → pogłębia <b>nierówności</b>. Świat dzieli się na <b>centrum</b> (Zachód) i <b>peryferie</b>. Napędza ją kapitał (korporacje, rynki finansowe) i interesy elit; osłabia suwerenność biedniejszych.",real:"Outsourcing do tańszych krajów, niskie płace globalnego Południa, zyski w centrum, dominacja Big Tech."},
      {title:"Konstruktywizm — 'globalizacja jest tym, co o niej myślimy'",body:"Globalizacja <b>nie jest 'dana'</b> — jest tworzona przez <b>idee</b> (wolny handel), <b>normy</b> (prawa człowieka, klimat) i <b>przekonania</b> (świat bez granic). Interesy państw <b>nie są stałe</b>.",real:"Dlaczego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'? Bo zmieniło się to, jak o niej myślimy."}
     ],
     flashcards:[
      {t:"Liberalizm (teoria globalizacji)",d:"Globalizacja = naturalny, pozytywny efekt rynku i technologii. Napęd: technologia, rynek, kapitał. Prowadzi do konwergencji; współzależność skłania państwa do współpracy. Napędza rynek, priorytet efektywność, rola państwa ograniczona."},
      {t:"Realizm (teoria globalizacji)",d:"Państwa to główni aktorzy; cel = bezpieczeństwo i siła. Globalizacja to narzędzie potęgi. Napędza państwo, priorytet bezpieczeństwo, rola państwa kluczowa. Tłumaczy wojny handlowe, sankcje, friend-shoring."},
      {t:"Instytucjonalizm / neoliberalizm",d:"Instytucje (ONZ, WTO, MFW, NATO) porządkują chaos globalizacji, dostarczają informacji i zmniejszają ryzyko oszustwa. Państwa współpracują, bo to się opłaca (zyski + bezpieczeństwo)."},
      {t:"Podejście krytyczne",d:"Globalizacja = rozszerzenie kapitalizmu/neoliberalizmu, pogłębia nierówności. Podział świata na centrum i peryferie; napędza ją kapitał i interesy elit. Tłumaczy nierówności, ale ignoruje wzrost gospodarczy."},
      {t:"Konstruktywizm",d:"Globalizacja jest społecznie konstruowana przez idee, normy i przekonania; interesy państw nie są stałe. Świat konstruktywistów to świat idei."},
      {t:"Liberalizm vs realizm (tabela)",d:"Co napędza? rynek vs państwo. Co ma priorytet? efektywność vs bezpieczeństwo. Rola państwa? ograniczona vs kluczowa."},
      {t:"Krytyka liberalizmu",d:"Tłumaczy wzrost handlu po 1945, sukces globalnych firm i tygrysów azjatyckich, ALE: ignoruje politykę, zakłada, że wszyscy korzystają, nie przewidział kryzysu 2008 ani wojen handlowych."}
     ],
     quiz:[
      {q:"Według liberalizmu globalizację napędza przede wszystkim:",a:["państwo i jego siła","rynek, technologia i kapitał","instytucje międzynarodowe","interesy elit i kapitał (nierówności)"],c:1,e:"Liberalizm: rynek + technologia + kapitał; priorytet efektywność, rola państwa ograniczona."},
      {q:"Realizm najlepiej tłumaczy:",a:["konwergencję biednych krajów","wojny handlowe, sankcje, kontrolę eksportu technologii, friend-shoring","zanik roli państw","świat idei i norm"],c:1,e:"Realizm: liczą się państwa, siła i bezpieczeństwo — stąd sankcje i wojny handlowe."},
      {q:"Podejście krytyczne opisuje globalizację jako:",a:["naturalny, korzystny proces dla wszystkich","dominację centrum (Zachodu) nad peryferiami, pogłębiającą nierówności","chaos porządkowany przez instytucje","zbiór idei i przekonań"],c:1,e:"Krytycyzm: kapitalizm + podział centrum–peryferie + nierówności."},
      {q:"Kluczowa teza konstruktywizmu:",a:["globalizacja jest 'dana' i niezmienna","globalizacja jest konstruowana przez idee, normy i przekonania; interesy państw nie są stałe","liczy się tylko rynek","liczy się tylko siła militarna"],c:1,e:"Dlatego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'."},
      {q:"Wg instytucjonalizmu państwa współpracują, ponieważ:",a:["są z natury dobre","współpraca instytucjonalna po prostu im się opłaca (zyski i bezpieczeństwo)","zmusza je do tego jedno mocarstwo","nie mają wojska"],c:1,e:"Instytucje zmniejszają ryzyko oszustwa i dostarczają informacji — kooperacja się opłaca."}
     ]},
    /* ---------------- L4 ---------------- */
    {id:"l4",title:"Polityka i global governance",emoji:"🏛️",
     feed:[
      {title:"Państwa wracają do gry",body:"Po dekadach 'rynek załatwi wszystko' państwo znów sięga po narzędzia: <b>regulacje, polityka handlowa, sankcje, subsydia, bariery handlowe, kontrole eksportu</b>.",real:"Widmo neoliberalizmu odchodzi. Rząd znów ustawia stół, a nie tylko sprząta po rynku."},
      {title:"Global governance — co to jest",body:"<b>Globalne zarządzanie</b> = sposób koordynowania zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy <b>przekraczające granice</b> (klimat, handel, zdrowie, prawa człowieka).",real:"Nie ma rządu światowego, ale są 'reguły gry'. Zarządzanie bez jednego szefa.",mnemo:"Global governance = <b>rządzenie bez rządu</b> — sieć, nie hierarchia."},
      {title:"Usieciowienie zamiast hierarchii",body:"Cecha global governance: <b>rezygnacja z hierarchii</b>. Więzi wertykalne ustępują <b>horyzontalnym</b> — współpracują autonomiczne podmioty. Rośnie rola prywatnych ciał (ISO, ICANN, IASB, FSC) i korporacji ponadnarodowych.",real:"Świat rządzony jak sieć znajomości, nie jak wojsko. Nikt nie wydaje rozkazów — wszyscy się dogadują (albo nie)."},
      {title:"Rola instytucji — 4 funkcje",body:"🛡️ <b>Stabilność</b>: MFW (pożyczki), Bank Światowy, Komitet Bazylejski (normy dla banków).<br>🔮 <b>Przewidywalność</b>: WTO (zasady handlu), OECD (podatki), IFRS/IASB (rachunkowość).<br>🤝 <b>Koordynacja</b>: WHO (pandemie), UNFCCC (klimat), G20 (polityka makro).<br>⚖️ <b>Rozwiązywanie sporów</b>: WTO DSU, ICSID (arbitraż inwestycyjny), MTS w Hadze.",mnemo:"4 funkcje: <b>Stabilność · Przewidywalność · Koordynacja · Spory</b>."},
      {title:"Kryzys instytucji — paraliż WTO",body:"<b>USA</b>: WTO nie radzi sobie z krajem o gospodarce nie w pełni rynkowej (subsydia Chin). <b>Chiny</b>: USA łamią zasady, nakładając jednostronne cła. <b>Fakt</b>: USA <b>zablokowały obsadzanie sędziów odwoławczych (2019–2023)</b> → WTO działa, ale nie egzekwuje odwołań.",real:"Sędzia jest, ale bez asystentów VAR — wyroki zapadają, tylko nikt ich nie wdroży. Instytucja słabnie.",mnemo:"Kryzys: <b>paraliż WTO + unilateralizm państw + spadek zaufania</b>."},
      {title:"Plurilateralizm i nowe bloki",body:"Obok WTO rosną kluby: <b>BRICS</b> (Brazylia, Rosja, Indie, Chiny, RPA), <b>QUAD</b> (USA, Japonia, Indie, Australia), <b>SCO</b> (Szanghajska Org. Współpracy), <b>G20</b> jako 'rząd globalizacji'. Bloki handlowe: RCEP, USMCA, IPEF, UE–Mercosur.",real:"Zamiast jednej wielkiej ligi (WTO) — coraz więcej mniejszych klubów 'dla swoich'."}
     ],
     flashcards:[
      {t:"Global governance (globalne zarządzanie)",d:"Koordynacja zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy przekraczające granice (klimat, handel, zdrowie). Nie ma rządu światowego, ale są globalne reguły."},
      {t:"Usieciowienie global governance",d:"Rezygnacja z hierarchii — więzi wertykalne ustępują horyzontalnym; współpracują autonomiczne podmioty, rośnie rola ciał prywatnych (ISO, ICANN, IASB, FSC) i korporacji."},
      {t:"4 funkcje instytucji globalnych",d:"Stabilność (MFW, Bank Światowy, Bazylea), przewidywalność (WTO, OECD, IFRS), koordynacja (WHO, UNFCCC, G20), rozwiązywanie sporów (WTO DSU, ICSID, MTS w Hadze)."},
      {t:"MFW vs Bank Światowy",d:"MFW = pożyczki stabilizacyjne i nadzór makroekonomiczny (bezpiecznik walutowy/finansowy). Bank Światowy = finansowanie rozwoju."},
      {t:"Paraliż WTO (2019–2023)",d:"USA zablokowały obsadzanie sędziów Organu Apelacyjnego → WTO działa, ale nie może egzekwować odwołań w sporach handlowych. Efekt: osłabienie instytucji."},
      {t:"Plurilateralizm",d:"Wielostronność w węższym gronie — kluby zamiast globalnej organizacji: BRICS, QUAD, RIC, SCO. Także bloki handlowe: RCEP, USMCA, IPEF."},
      {t:"Kryzys instytucji",d:"Trzy objawy: paraliż WTO, unilateralizm państw (działanie w pojedynkę), spadek zaufania do instytucji."}
     ],
     quiz:[
      {q:"Global governance najlepiej opisać jako:",a:["światowy rząd z armią","rządzenie bez rządu — sieć reguł i norm koordynujących państwa, firmy i organizacje","wyłącznie działania ONZ","synonim WTO"],c:1,e:"Nie ma rządu światowego, ale są globalne reguły — koordynacja bez hierarchii."},
      {q:"Na czym polega paraliż WTO (2019–2023)?",a:["WTO została rozwiązana","USA zablokowały obsadzanie sędziów odwoławczych → brak egzekucji odwołań","Chiny wystąpiły z WTO","zniesiono wszystkie cła"],c:1,e:"Organ Apelacyjny bez sędziów — spory się toczą, ale odwołań nie da się rozstrzygnąć."},
      {q:"Która instytucja pełni funkcję STABILNOŚCI (bezpiecznik finansowy)?",a:["WHO","MFW (pożyczki stabilizacyjne, nadzór makro)","UNFCCC","WTO DSU"],c:1,e:"Stabilność: MFW, Bank Światowy, Komitet Bazylejski. WHO = koordynacja zdrowia."},
      {q:"BRICS, QUAD i SCO to przykłady:",a:["korporacji ponadnarodowych","plurilateralizmu — współpracy w węższym gronie zamiast globalnej organizacji","agend ONZ","banków centralnych"],c:1,e:"Plurilateralizm = kluby 'dla swoich' obok uniwersalnej WTO."},
      {q:"'Państwa wracają do gry' oznacza powrót narzędzi takich jak:",a:["tylko obniżki podatków","regulacje, sankcje, subsydia, bariery handlowe, kontrole eksportu","likwidacja ceł","prywatyzacja wszystkiego"],c:1,e:"Odwrót od neoliberalnego 'rynek załatwi wszystko' ku aktywnej roli państwa."}
     ]},
    /* ---------------- L5 ---------------- */
    {id:"l5",title:"Mocarstwa i konkurencyjność",emoji:"⚔️",
     feed:[
      {title:"Walka o to, czyje będą reguły",body:"Nie ma rządu światowego, ale są reglobalne reguły — i trwa walka, <b>kto je ustala</b>. 🇪🇺 <b>UE</b> — wpływ <b>regulacyjny</b>. 🇺🇸 <b>USA</b> — technologiczno-finansowy. 🇨🇳 <b>Chiny</b> — infrastrukturalno-przemysłowy. 🇷🇺 <b>Rosja</b> — surowcowo-geopolityczny.",real:"Zwycięzca standardów (AI, ESG, technologie, handel) zgarnia przewagę konkurencyjną. Kto pisze reguły, ten wygrywa mecz.",mnemo:"UE=regulacje · USA=tech+finanse · Chiny=przemysł · Rosja=surowce."},
      {title:"Efekt brukselski",body:"Zjawisko, w którym <b>regulacje i standardy UE stają się globalnymi normami</b>. Dzięki ogromnemu jednolitemu rynkowi firmy spoza Europy dostosowują produkty do wymogów UE, by móc tu sprzedawać. Przykłady: <b>RODO/GDPR, AI Act, CBAM, ESG</b>.",real:"UE nie narzuca prawa siłą, tylko atrakcyjnością rynku (soft power). Chcesz sprzedawać 450 mln ludziom? Grasz wg zasad Brukseli.",mnemo:"Efekt brukselski = <b>eksport regulacji przez wielkość rynku</b>."},
      {title:"USA — dolar, Big Tech, sankcje",body:"Siła USA: <b>dominacja dolara</b> (efekt dolara — mocny USD czyni świat biedniejszym i droższy import), <b>Big Tech</b> (Google, Apple, Microsoft, Amazon), <b>kontrola technologii</b> (eksport chipów do Chin), <b>sankcje finansowe</b> (SWIFT), chmura.",real:"Dolar to broń. Wyłączenie ze SWIFT boli bardziej niż niejedna sankcja celna."},
      {title:"Chiny i Rosja",body:"🇨🇳 <b>Chiny</b>: Inicjatywa <b>Pasa i Szlaku</b> (2013), dominacja przemysłowa, kontrola <b>surowców krytycznych</b>, skala rynku wewnętrznego.<br>🇷🇺 <b>Rosja</b>: eksport <b>surowców energetycznych</b>, geopolityka, destabilizacja rynków.",real:"Chiny budują świat betonem i fabrykami; Rosja gra gazem i chaosem."},
      {title:"Konkurencyjność państwa",body:"<b>Zdolność gospodarki do tworzenia trwałego wzrostu dobrobytu i przewag międzynarodowych</b> — konkurowania na rynkach przy utrzymaniu wysokiego poziomu życia. Buduje ją: <b>technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność państwa i prawa</b>.",real:"Konkurencyjność to NIE samo PKB. Coraz bardziej zależy od odporności, technologii i bezpieczeństwa (np. półprzewodniki)."},
      {title:"Polska: hub produkcyjny i pułapka średniego dochodu",body:"Polska (OECD TiVA) = silnie wpięta w globalne łańcuchy jako <b>producent/montażysta</b>, głównie w niemieckim hubie. Dużo <b>zagranicznej</b> wartości dodanej w eksporcie, mało własnej. <b>Pułapka średniego dochodu</b>: po szybkim wzroście na taniej pracy kraj traci impet i nie awansuje do grona bogatych. Nadzieja: <b>konwergencja</b> i innowacyjność.",real:"Jesteśmy montownią Europy. Wyzwanie to AWANS w łańcuchu wartości (własne technologie/marki), nie ucieczka z niego.",mnemo:"Pułapka średniego dochodu = <b>tania praca się wypaliła, a innowacji brak</b>."}
     ],
     flashcards:[
      {t:"Cztery ośrodki władzy globalnej",d:"UE — wpływ regulacyjny; USA — technologiczno-finansowy; Chiny — infrastrukturalno-przemysłowy; Rosja — surowcowo-geopolityczny."},
      {t:"Efekt brukselski",d:"Regulacje i standardy UE stają się globalnymi normami, bo firmy spoza UE dostosowują produkty do wymogów wielkiego rynku wewnętrznego (soft power, nie siła). Przykłady: RODO, AI Act, CBAM, ESG."},
      {t:"Siła USA w gospodarce globalnej",d:"Dominacja dolara (efekt dolara), Big Tech (Google, Apple, Microsoft, Amazon), kontrola eksportu technologii (chipy), sankcje finansowe (SWIFT), chmura."},
      {t:"Inicjatywa Pasa i Szlaku (2013)",d:"Chiński program inwestycji w infrastrukturę (porty, koleje, drogi) łączący Azję, Europę i Afrykę — narzędzie wpływu infrastrukturalno-przemysłowego Chin."},
      {t:"Konkurencyjność państwa",d:"Zdolność gospodarki do trwałego wzrostu dobrobytu i przewag międzynarodowych przy wysokim poziomie życia. Buduje ją: technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność."},
      {t:"Pozycja Polski w GVC",d:"Ogniwo produkcyjno-montażowe (hub produkcyjny), głównie w niemieckim hubie. Dużo zagranicznej wartości dodanej w eksporcie, rzadko dostarcza kluczowe technologie/marki. Wyzwanie: awans w łańcuchu wartości."},
      {t:"Pułapka średniego dochodu",d:"Kraj po szybkim wzroście (tania praca + import technologii) traci impet i nie awansuje do gospodarek wysokorozwiniętych: wypalenie przewag kosztowych, brak innowacji, niska wydajność."},
      {t:"Konwergencja",d:"Proces, w którym uboższe kraje/regiony rozwijają się szybciej niż bogate, zmniejszając różnice w PKB na mieszkańca i standardzie życia."}
     ],
     quiz:[
      {q:"Efekt brukselski polega na tym, że:",a:["UE narzuca prawo siłą militarną","standardy UE stają się globalne, bo firmy dostosowują się do wielkiego rynku wewnętrznego","Bruksela obniża cła do zera","UE kopiuje regulacje z USA"],c:1,e:"Soft power rynku: RODO, AI Act, CBAM, ESG stają się światowymi normami."},
      {q:"Który ośrodek kojarzymy z 'wpływem regulacyjnym'?",a:["USA","UE","Chiny","Rosja"],c:1,e:"UE = regulacje; USA = tech+finanse; Chiny = przemysł; Rosja = surowce."},
      {q:"Pułapka średniego dochodu to sytuacja, gdy kraj:",a:["ma za wysokie płace od startu","po wzroście na taniej pracy traci impet i nie awansuje do bogatych (brak innowacji)","jest za bogaty, by rosnąć","nie ma dostępu do morza"],c:1,e:"Wypalenie przewag kosztowych + brak inwestycji w innowacje i edukację."},
      {q:"Pozycja Polski w globalnych łańcuchach wartości to głównie:",a:["centrum technologiczne dostarczające kluczowe komponenty","ogniwo produkcyjno-montażowe ('hub produkcyjny'), mocno wpięte w niemiecki hub","kraj poza łańcuchami globalnymi","eksporter wyłącznie surowców"],c:1,e:"Dużo zagranicznej wartości dodanej; wyzwanie = awans w łańcuchu, nie jego opuszczenie."},
      {q:"Konkurencyjność państwa w XXI w. zależy CORAZ BARDZIEJ od:",a:["wyłącznie wielkości PKB","odporności, technologii i bezpieczeństwa (np. półprzewodniki), nie tylko kosztów","liczby ludności","powierzchni kraju"],c:1,e:"Przejście od 'najtaniej' do 'bezpiecznie i odpornie'."}
     ]},
    /* ---------------- L6 ---------------- */
    {id:"l6",title:"Wymiar społeczno-kulturowy",emoji:"🎭",
     feed:[
      {title:"Wymiar społeczny i 'problem szczęścia'",body:"Globalizacja tworzy <b>społeczeństwo informacyjne</b>, w którym rządzi <b>klasa kreatywna</b>, wiedza i kapitał intelektualny. Paradoks Easterlina: wyższy dochód zwiększa satysfakcję, ale <b>po ok. 10 000 USD</b> dodatkowy dochód niewiele już zmienia.",real:"Kasa daje szczęście — do pewnego progu. Potem wykres się wypłaszcza. Wzorce konsumpcji z bogatych krajów rodzą alienację i frustrację."},
      {title:"Jakość życia i wskaźniki",body:"<b>Jakość życia</b> = stopień zaspokojenia potrzeb materialnych i niematerialnych. Mierniki: <b>HDI</b> (ONZ: dochód + długość życia + lata nauki), <b>World Happiness Index</b>, Quality of Life Index (Numbeo). Z HDI narodziła się <b>ekonomia szczęścia</b>.",real:"HDI to 'PKB z duszą' — dorzuca zdrowie i edukację do samych pieniędzy."},
      {title:"Nie ufaj rankingom bezkrytycznie",body:"Problemy wskaźników: 📏 <b>trudność pomiaru</b> (HDI używa średnich lat nauki jako proxy jakości edukacji), 🎯 <b>uprzedzenia i wagi</b> autorów (im złożniejszy indeks, tym więcej arbitralnych decyzji), 🎭 <b>działania 'pod ranking'</b> (reformy poprawiające wynik, ale nie życie ludzi).",real:"Ranking to model, nie prawda objawiona. Rządy potrafią 'grać pod tabelkę' zamiast realnie poprawiać życie."},
      {title:"Migracje i drenaż mózgów",body:"Migracje zarobkowe, studenci, globalny rynek pracy. <b>Drenaż mózgów</b>: najlepiej wykształceni i przedsiębiorczy emigrują do <b>centrów globalizacji</b> — oni zyskują, ale kraj pochodzenia <b>traci kapitał intelektualny</b>. Ryzyka: napięcia społeczne, kryzys tożsamości.",real:"Twój najzdolniejszy znajomy z roku wyjeżdża do Londynu. On wygrywa, Polska traci mózg."},
      {title:"Globalna wioska i kultura",body:"<b>Marshall McLuhan</b>: elektroniczna współzależność czyni świat <b>globalną wioską</b> (natychmiastowa komunikacja, wspólne trendy — niekoniecznie harmonia). Kultura: <b>HOMOGENIZACJA</b> (McDonald's, Netflix) vs <b>HYBRYDYZACJA</b> (K-pop, anime, lokalne wersje globalnych produktów).",real:"Świat = jedna wioska z wi-fi. Ale lokalne tożsamości nie znikają — mieszają się (hybrydyzacja)."},
      {title:"Soft power i antyglobalizm",body:"<b>Soft power</b> — zdolność zdobywania wpływów <b>atrakcyjnością</b> (film, muzyka, kuchnia, moda), nie przymusem. Nowi eksporterzy kultury: USA, <b>Korea Płd.</b>, Japonia, Indie. <b>Antyglobalizm</b> — ruch przeciw dominacji korporacji, nierównościom i narzucaniu reform przez MFW/BŚ/WTO.",real:"K-pop i Hollywood to broń miękka. A social media rozkręciły globalizację kultury szybciej niż handel — kosztem baniek i polaryzacji."}
     ],
     flashcards:[
      {t:"Społeczeństwo informacyjne",d:"Społeczeństwo skutecznie komunikujące się z otoczeniem, w którym wiodącą rolę odgrywa klasa kreatywna, kapitał intelektualny, wiedza i twórczość jako źródło bogactwa."},
      {t:"Problem szczęścia (paradoks Easterlina)",d:"Wyższy dochód zwiększa satysfakcję życiową, ale po przekroczeniu ok. 10 000 USD dodatkowy wzrost dochodu w niewielkim stopniu podnosi satysfakcję społeczeństwa."},
      {t:"HDI (Human Development Index)",d:"Wskaźnik ONZ łączący dochód, długość życia i liczbę lat nauki. Zapoczątkował porównywanie rozwoju społecznego i ekonomię szczęścia; efekt: World Happiness Index."},
      {t:"Ograniczenia rankingów/wskaźników",d:"Trudność pomiaru (miary zastępcze, np. lata nauki jako proxy jakości edukacji), uprzedzenia i arbitralne wagi autorów, działania krajów 'pod ranking' zamiast realnej poprawy życia."},
      {t:"Drenaż mózgów (brain drain)",d:"Emigracja najlepiej wykształconych, zdolnych i przedsiębiorczych do centrów globalizacji. Emigranci zyskują, ale kraj pochodzenia traci kapitał intelektualny."},
      {t:"Globalna wioska (McLuhan)",d:"Elektroniczna współzależność kształtuje świat na podobieństwo jednej wioski: natychmiastowa komunikacja, wspólna przestrzeń medialna, globalne trendy — niekoniecznie harmonia."},
      {t:"Homogenizacja vs hybrydyzacja",d:"Homogenizacja = ujednolicanie kultury (McDonald's, Netflix, TikTok). Hybrydyzacja = mieszanie i lokalne adaptacje globalnych wzorców (K-pop, anime, lokalne wersje produktów)."},
      {t:"Soft power",d:"Zdolność państwa do zdobywania wpływów i sojuszników przez atrakcyjność kulturową, polityczną i ideową (film, muzyka, kuchnia, moda), a nie przymus. Eksporterzy: USA, Korea Płd., Japonia, Indie."},
      {t:"Antyglobalizm",d:"Ruch społeczno-polityczny przeciw globalizacji (zwł. ekonomicznej i korporacyjnej): krytyka dominacji korporacji, nierówności, wyzysku słabszych i reform narzucanych przez MFW, Bank Światowy i WTO."}
     ],
     quiz:[
      {q:"Paradoks Easterlina ('problem szczęścia') mówi, że:",a:["dochód nigdy nie wpływa na szczęście","po ok. 10 000 USD dodatkowy dochód niewiele już podnosi satysfakcję życiową","bogatsi są zawsze nieszczęśliwi","szczęście zależy tylko od PKB"],c:1,e:"Dochód podnosi satysfakcję do progu ~10 000 USD, potem wykres się wypłaszcza."},
      {q:"HDI (ONZ) łączy:",a:["tylko PKB per capita","dochód, długość życia i liczbę lat nauki","emisje CO₂ i inflację","liczbę turystów i eksport"],c:1,e:"HDI = 'PKB z duszą' — dorzuca zdrowie i edukację."},
      {q:"Drenaż mózgów oznacza, że:",a:["kraj zyskuje specjalistów z zagranicy","najzdolniejsi emigrują do centrów globalizacji, a kraj pochodzenia traci kapitał intelektualny","spada liczba studentów","rośnie bezrobocie wśród niewykształconych"],c:1,e:"Emigrant zyskuje, kraj wysyłający traci mózgi."},
      {q:"Homogenizacja i hybrydyzacja kultury to:",a:["dwa słowa na to samo","ujednolicanie (McDonald's/Netflix) vs mieszanie i lokalne adaptacje (K-pop/anime)","nazwy instytucji ONZ","rodzaje ceł"],c:1,e:"Kultura i się ujednolica, i tworzy hybrydy — jednocześnie."},
      {q:"Soft power to:",a:["siła militarna","zdolność zdobywania wpływów atrakcyjnością kultury i idei, nie przymusem","miękka waluta","program pomocy żywnościowej"],c:1,e:"Hollywood, K-pop, kuchnia, moda — wpływ bez przymusu. Eksporterzy: USA, Korea, Japonia, Indie."}
     ]},

    const st=subjState(s.id);
    const open=s.levels.find((l,i)=>levelUnlocked(s,i)&&!(st.levels[l.id]||{}).done);
    if(open)tasks.push({id:s.id+':lesson:'+open.id,done:false});
    const n=Math.min(12,allCards(s).length);
    if(n)tasks.push({id:s.id+':review',done:false,need:n,prog:0});
    const doneLv=[...s.levels].reverse().find(l=>(st.levels[l.id]||{}).done)||s.levels[0];
    if(doneLv&&(doneLv.quiz||[]).length)tasks.push({id:s.id+':quiz:'+doneLv.id,done:false});
    if(allQuiz(s).length>=5)tasks.push({id:s.id+':exam',done:false});
  });
  return tasks;
}
/* opis zadania z jego id (etykiety liczone z danych, więc w storage siedzi tylko id + done) */
function taskInfo(t){
  const parts=t.id.split(':');const sid=parts[0],kind=parts[1],lvId=parts[2];
  const s=SUBJECTS.find(x=>x.id===sid);if(!s)return null;
  const lv=lvId?s.levels.find(l=>l.id===lvId):null;
  const short=s.short||s.name;const base={t,s,kind,reward:REWARD[kind]||0};
  const openAt=(tab,setup)=>()=>openSubject(sid,tab,setup);
  if(kind==='lesson'){if(!lv)return null;const nf=(lv.feed||[]).length,nq=(lv.quiz||[]).length;
    return {...base,icon:'book',title:'Roladka — '+noEmoji(lv.title),sub:`${nf} ${pl(nf,'dawka','dawki','dawek')} · ${nq} ${pl(nq,'pytanie','pytania','pytań')} · +15`,go:openAt('path')};}
  if(kind==='review'){const n=t.need||12,p=t.prog||0;
    return {...base,icon:'cards',title:`Powtórka — ${n} ${pl(n,'fiszka','fiszki','fiszek')}`,sub:p?`${p} z ${n} przejrzane · +20`:`${short} · ${Math.max(1,Math.round(n/4))} min · +20`,go:openAt('fiszki')};}
  if(kind==='quiz'){if(!lv)return null;const n=(lv.quiz||[]).length,m=Math.max(1,Math.round(n*0.5));
    return {...base,icon:'question',title:'Quiz — '+noEmoji(lv.title),sub:`${n} ${pl(n,'pytanie','pytania','pytań')} · ${short} · ${m} min · +25`,
      go:openAt('quiz',()=>{qState={subj:sid,lvl:lv.id,list:null,idx:0,score:0,answered:false};})};}
  if(kind==='exam'){const N=Math.min(20,allQuiz(s).length);
    return {...base,icon:'file',title:'Egzamin próbny',sub:`${N} ${pl(N,'pytanie','pytania','pytań')} · opcjonalnie · +40`,go:openAt('egzamin')};}
  return null;
}
/* zaliczenie zadania: lesson (z id poziomu), quiz / exam / review (po przedmiocie); nagroda idzie przez addXP */
function completeDaily(sid,kind,lvId){
  const d=daily();const pre=sid+':'+kind;
  const t=d.tasks.find(x=>!x.done&&(lvId?x.id===pre+':'+lvId:(x.id===pre||x.id.indexOf(pre+':')===0)));
  if(!t)return false;
  t.done=true;saveProgress();
  const r=REWARD[kind]||0;if(r)addXP(sid,r);
  setTimeout(()=>toast('plan dnia: +'+r+'xp','bolt'),3200);
  return true;
}
function tickDaily(sid,kind,n){
  const d=daily();const t=d.tasks.find(x=>!x.done&&x.id===sid+':'+kind);if(!t)return;
  t.prog=(t.prog||0)+(n||1);
  if(t.prog>=(t.need||1))completeDaily(sid,kind);else saveProgress();
}

function weekDots(){
  const t=todayStr();const now=new Date();const dow=(now.getDay()+6)%7; // 0 = poniedziałek
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
  const n=streakDisplay(),last=META.lastDay;const out=[];
  for(let i=0;i<7;i++){
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);const ds=dstr(d);
    const toToday=dayDiff(ds,t); // >0 przeszłość, 0 dziś, <0 przyszłość
    let st='miss';
    if(toToday<0)st='future';
    else if(n>0&&last){const off=dayDiff(ds,last);if(off>=0&&off<n)st='done';}
    if(toToday===0)st=(st==='done')?'todaydone':'today';
    out.push({lab:DAYS_S[(i+1)%7],st});
  }
  return out;
}

/* ============================================================ KROK 4: życia, combo, panel dobrze/źle, kafle quizu, konfetti
   Życia (DESIGN.md §4.3) w tym samym kluczu: PROGRESS.hearts={n, refillAt, quest?}.
   −1 za błąd w quizie lekcji (nie w zakładce Quiz, nie w egzaminie); regeneracja 1/30 min liczona z refillAt przy odczycie. */
const HEARTS_MAX=5, HEART_MS=30*60*1000, HEART_REV=10;
function hearts(){
  let h=PROGRESS.hearts;
  if(!h||typeof h.n!=='number'){h=PROGRESS.hearts={n:HEARTS_MAX,refillAt:null};saveProgress();}
  const now=Date.now();let ch=false;
  while(h.n<HEARTS_MAX&&h.refillAt&&now>=h.refillAt){h.n++;h.refillAt+=HEART_MS;ch=true;}
  if(h.n>=HEARTS_MAX&&h.refillAt){h.refillAt=null;ch=true;}
  if(ch)saveProgress();
  return h;
}
function loseHeart(){const h=hearts();if(h.n>0){h.n--;if(!h.refillAt)h.refillAt=Date.now()+HEART_MS;saveProgress();}updateHearts();return h.n;}
function gainHeart(n){const h=hearts();h.n=Math.min(HEARTS_MAX,h.n+(n||1));if(h.n>=HEARTS_MAX)h.refillAt=null;saveProgress();updateHearts();return h.n;}
function heartEta(){const h=hearts();return (h.n>=HEARTS_MAX||!h.refillAt)?0:Math.max(0,h.refillAt-Date.now());}
function etaText(ms){const m=Math.max(1,Math.ceil(ms/60000));return m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} ${pl(m,'minutę','minuty','minut')}`;}
/* „serce za N fiszek”: zadanie odzyskania życia (z panelu Koniec żyć), liczone w renderFiszki */
function heartReview(){const h=hearts();if(!h.quest)return;h.quest--;if(h.quest<=0){delete h.quest;gainHeart();setTimeout(()=>toast('Życie odzyskane: +1','heart'),350);}saveProgress();}
/* pigułka serc (przycisk: tap = kiedy wraca życie); .n aktualizowane przez updateHearts() */
function heartsPill(o){
  o=o||{};const h=hearts();
  const b=el('button','hearts'+(o.beat?' a-beat':'')+(h.n===0?' zero':''),icon('heart',{size:o.size||16,cls:o.iconBeat?'a-beat':''})+`<span class="n">${h.n}</span>`);
  b.setAttribute('aria-label','Życia: '+h.n+' z '+HEARTS_MAX);
  b.onclick=()=>{const e=heartEta();toast(e?'Kolejne życie za '+etaText(e):'Pełne życia','heart');};
  return b;
}
function updateHearts(){const n=hearts().n;document.querySelectorAll('.hearts').forEach(p=>{const s=p.querySelector('.n');if(s)s.textContent=n;p.classList.toggle('zero',n===0);});}
/* combo: kolejne poprawne w lekcji; mnożnik XP ×2 od 5, ×3 od 10 */
function comboMult(c){return c>=10?3:c>=5?2:1;}
const ORD=['','Pierwsza','Druga','Trzecia','Czwarta','Piąta','Szósta','Siódma','Ósma','Dziewiąta','Dziesiąta'];
function comboText(c){return c>=2?((ORD[c]||c+'.')+' poprawna z rzędu'):'Tak trzymaj';}

/* klawiatura: jeden nasłuch (INIT), bieżący widok podstawia keyFn; advOk = ochrona przed podwójnym „dalej” (tap + Enter) */
let keyFn=null,lastAdv=0,nhInt=null;
function advOk(){const t=Date.now();if(t-lastAdv<350)return false;lastAdv=t;return true;}

/* konfetti: n kawałków .a-fall z różnym opóźnieniem (d1…d6) i kolorem tylko z tokenów (--c) */
const CONF=['pink','cyan','gold','acid'];
function confetti(n){
  const c=el('div','confetti');c.setAttribute('aria-hidden','true');
  for(let i=0;i<n;i++){const p=el('i','a-fall'+(i%7?' d'+(i%7):'')+(i%3===1?' round':''));p.style.cssText=`left:${(i*37+11)%92}%;top:${(i*53+40)%300}px;--c:var(--${CONF[i%4]});--s:${7+(i*5)%7}px`;c.appendChild(p);}
  return c;
}

/* panel od dołu (.sheet.ok / .bad / .nohearts): jeden na raz, [data-primary] = przycisk pod Enter */
function openSheet(kind,html){
  closeSheet();
  const s=el('div','sheet a-rise '+kind,html);s.id='sheet';s.setAttribute('role','dialog');
  app.appendChild(s);
  keyFn=e=>{if(e.key==='Enter'||e.key===' '){const b=s.querySelector('[data-primary]');if(b){e.preventDefault();b.click();}}};
  return s;
}
function closeSheet(){const s=document.getElementById('sheet');if(s)s.remove();const b=document.getElementById('sheetback');if(b)b.remove();clearInterval(nhInt);keyFn=null;}
function sheetBack(){if(!document.getElementById('sheetback')){const b=el('div','sheetback');b.id='sheetback';app.appendChild(b);}}
/* dobrze: ikona, „Dobrze!”, combo, chip +XP (z mnożnikiem), wyjaśnienie e, DALEJ */
function sheetOk(q,o){
  const s=openSheet('ok',`<div class="srow"><div class="sico a-pop d2">${icon('check',{size:26,stroke:3.6})}</div>
    <div class="grow"><div class="st">Dobrze!</div><div class="ss">${comboText(o.combo)}</div></div>
    <span class="xpchip a-pop d3">+${o.xp} XP${o.mult>1?' ×'+o.mult:''}</span></div>
    ${q.e?`<div class="sbox"><div class="lbl">Dlaczego</div><div>${q.e}</div></div>`:''}
    <button class="pill" id="snext" data-primary>DALEJ</button>`);
  s.querySelector('#snext').onclick=()=>{if(!advOk())return;closeSheet();o.onNext();};

}
/* źle: „Nie tym razem”, poprawna litera, wyjaśnienie, [DO FISZEK] DALEJ */
function sheetBad(q,o){
  const s=openSheet('bad',`<div class="srow"><div class="sico">${icon('close',{size:24,stroke:3.6})}</div>
    <div class="grow"><div class="st">Nie tym razem</div><div class="ss">Poprawna: odpowiedź ${keys[q.c]}</div></div></div>
    ${q.e?`<div class="sbox"><div class="lbl">Zapamiętaj</div><div>${q.e}</div></div>`:''}
    <div class="sbtns">${o.onCards?'<button class="pill ghost red" id="scards">DO FISZEK</button>':''}<button class="pill red" id="snext" data-primary>DALEJ</button></div>`);
  s.querySelector('#snext').onclick=()=>{if(!advOk())return;closeSheet();o.onNext();};
  const c=s.querySelector('#scards');if(c)c.onclick=()=>{closeSheet();o.onCards();};

}
/* Koniec żyć (NoHearts.html): licznik do następnego życia, „Powtórz N fiszek” (+1 życie), „Wróć później”.
   inLesson=true → lekcja przerwana (poziom niezaliczony); gemy/„Uzupełnij wszystkie” dojdą w kroku 8. */
function showNoHearts(o){
  o=o||{};
  const s=openSheet('nohearts',`<div class="nhh">${[0,1,2,3,4].map(()=>icon('heart',{size:30,fill:false,stroke:2.2})).join('')}</div>
    <div class="nht"><div class="st a-pop d1">Koniec żyć</div><div class="ss">Kolejne życie wraca za <b class="a-blink" id="nheta">${etaText(heartEta())}</b>. Możesz też odzyskać je od razu.</div></div>
    <button class="nhcard a-glow" id="nhrev">${'<div class="ico">'+icon('refresh',{size:24,stroke:2.8})+'</div>'}<div class="grow"><div class="t">Powtórz ${HEART_REV} fiszek</div><div class="s">odzyskujesz jedno życie · za darmo</div></div>${icon('chevron-right',{size:20})}</button>
    <button class="pill text" id="nhlater" data-primary>WRÓĆ PÓŹNIEJ</button>`);
  sheetBack(); // tło przyciemniające pod panelem (po openSheet, bo closeSheet je zdejmuje)
  const leave=()=>{closeSheet();if(o.inLesson)closeLesson();};
  s.querySelector('#nhlater').onclick=leave;
  s.querySelector('#nhrev').onclick=()=>{hearts().quest=HEART_REV;saveProgress();closeSheet();goCards(o.lv);toast(`Przejrzyj ${HEART_REV} fiszek — wraca życie`,'heart');};
  nhInt=setInterval(()=>{const e=document.getElementById('nheta');if(!e)return clearInterval(nhInt);if(hearts().n>0){leave();toast('Życie wróciło','heart');return;}e.textContent=etaText(heartEta());},1000);
  return s;
}
/* fiszki przefiltrowane do poziomu (z lekcji: zamyka ją bez wyniku) */
function goCards(lv){
  const L=document.getElementById('lesson');if(L)L.classList.remove('open');
  lessonState=null;fState={subj:current.id,lvl:lv?lv.id:'all',idx:0,flipped:false};curTab='fiszki';renderSubject();
}

/* pytanie + kafle 3D z literą + SPRAWDŹ (Quiz.html). o={n,total,combo,broken,tag,onAnswer(i,ok)} → {body,foot}.
   Wybór podświetla kafel i odblokowuje SPRAWDŹ; po sprawdzeniu kafle: correct / wrong (.a-shake) / dim. Klawisze: 1-5 / A-E, Enter. */
function quizBlock(q,o){
  const body=el('div','quiz');
  const chips=[];
  if(o.combo>=2)chips.push(`<span class="combo a-pop">Combo x${o.combo}</span>`);else if(o.broken)chips.push('<span class="combo bad">Combo zerwane</span>');
  if(o.tag)chips.push(`<span class="qn">${o.tag}</span>`);
  chips.push(`<span class="qn">Pytanie ${o.n} z ${o.total}</span>`);
  body.innerHTML=`<div class="qchips">${chips.join('')}</div><div class="qq a-up">${q.q}</div>
    <div class="qopts">${q.a.map((a,i)=>`<button class="qopt a-up d${Math.min(6,i+1)}" data-i="${i}"><span class="k">${keys[i]}</span><span class="t">${a}</span></button>`).join('')}</div>`;
  const btn=el('button','pill qcheck','SPRAWDŹ');btn.disabled=true;btn.id='qcheck';
  let sel=null,done=false;
  const opts=[...body.querySelectorAll('.qopt')];
  const select=i=>{if(done||!opts[i])return;sel=i;opts.forEach(x=>x.classList.toggle('sel',+x.dataset.i===i));btn.disabled=false;};
  const check=()=>{
    if(done||sel==null)return;done=true;
    const ok=sel===q.c;
    opts.forEach(x=>{const xi=+x.dataset.i;x.disabled=true;x.classList.remove('sel','a-up','d1','d2','d3','d4','d5','d6');
      if(xi===q.c){x.classList.add('correct',ok?'a-pop':'a-glow');x.querySelector('.k').innerHTML=icon('check',{size:18,stroke:3.6});}
      else if(xi===sel){x.classList.add('wrong','a-shake');x.querySelector('.k').innerHTML=icon('close',{size:17,stroke:3.6});}
      else x.classList.add('dim');});
    body.querySelector('.qq').classList.add('muted');
    btn.classList.add('hide');btn.disabled=true;keyFn=null;
    o.onAnswer(sel,ok);
  };
  opts.forEach(x=>x.onclick=()=>select(+x.dataset.i));
  btn.onclick=check;
  keyFn=e=>{const k=(e.key||'').toLowerCase();const m=/^[1-5]$/.test(k)?+k-1:'abcde'.indexOf(k);if(k.length===1&&m>=0&&m<opts.length)select(m);else if(e.key==='Enter'&&sel!=null){e.preventDefault();check();}};
  return {body,foot:btn};
}

/* ============================================================ SUBJECT shell (Path.html: pas nagłówka w --surface-2 + chipy zakładek) */
function openSubject(id,tab,setup){
  current=SUBJECTS.find(s=>s.id===id);
  if(!current)return go('today');
  applyTheme(current);
  curTab=tab||'path';
  if(setup)setup();
  renderSubject();
}
function renderSubject(){
  const s=current;const st=subjState(s.id);
  try{clearInterval(cwInt);clearInterval(exInt);}catch(e){}
  closeSheet();keyFn=null;
  app.innerHTML='';
  const total=s.levels.length,done=s.levels.filter(l=>(st.levels[l.id]||{}).done).length,pct=total?Math.round(done/total*100):0;
  const band=el('div','band');
  const row=el('div','brow');
  const back=el('button','backbtn',icon('back',{size:20,stroke:3}));back.setAttribute('aria-label','Wróć do planu dnia');back.onclick=()=>go('today');row.appendChild(back);
  row.appendChild(el('div','bmeta',`<div class="bname">${mono(initial(s.short||s.name),'xs solid')}<span>${s.short||s.name}</span></div>
    <div class="bprog"><div class="bar"><i class="a-grow" style="width:${pct}%"></i></div><span>${done}/${total} · <b id="xpNum">${st.xp}</b> xp</span></div>`));
  const info=el('button','infobtn'+(curTab==='info'?' active':''),icon('info',{size:19}));info.setAttribute('aria-label','Zasady zaliczenia');info.onclick=()=>{curTab='info';renderSubject();};row.appendChild(info);
  row.appendChild(heartsPill({iconBeat:true}));
  band.appendChild(row);
  const tabs=el('div','subtabs');
  [['path','map','Ścieżka'],['fiszki','cards','Fiszki'],['quiz','brain','Quiz'],['cwicz','edit','Ćwiczenia'],['egzamin','target','Egzamin']].forEach(([k,ic,lab])=>{
    const b=el('button','subtab'+(curTab===k?' active':''),icon(ic,{size:15})+'<span>'+lab+'</span>');
    if(curTab===k)b.setAttribute('aria-current','page');
    b.onclick=()=>{curTab=k;renderSubject();};
    tabs.appendChild(b);
  });
  band.appendChild(tabs);app.appendChild(band);

  const sc=el('div','screen active');sc.id='subjscreen';
  app.appendChild(sc);
  if(curTab==='path')renderPath(sc);
  else if(curTab==='fiszki')renderFiszki(sc);
  else if(curTab==='quiz')renderQuiz(sc);
  else if(curTab==='cwicz')renderCwicz(sc);
  else if(curTab==='egzamin')renderEgzamin(sc);
  else if(curTab==='info')renderInfo(sc);

  // toast + lesson container
  app.appendChild(el('div','toast',''));app.lastChild.id='toast';
  const lesson=el('div','lesson');lesson.id='lesson';app.appendChild(lesson);
}

/* ---------- ŚCIEŻKA (Path.html): karta rozdziału, wężyk węzłów (offset --x per węzeł, łączniki w połowie drogi), skrzynia co 3 poziomy ---------- */
function levelUnlocked(s,idx){
  if(idx===0)return true;
  const prev=s.levels[idx-1];
  const st=subjState(s.id);
  return !!(st.levels[prev.id]&&st.levels[prev.id].done);
}
const PATH_OFF=[-104,8,96,-28]; // poziome przesunięcia kolejnych węzłów (px), cyklicznie
function renderPath(sc){
  const s=current;const st=subjState(s.id);
  const isDone=lv=>!!(st.levels[lv.id]||{}).done;
  const wrap=el('div','scroll pathview');
  wrap.appendChild(el('div','blob a-float mid'));
  const curIdx=s.levels.findIndex((l,i)=>levelUnlocked(s,i)&&!isDone(l));
  const all=curIdx<0;
  wrap.appendChild(el('div','chapter a-up',`<i></i><div class="grow"><div class="eyebrow">Rozdział ${all?s.levels.length:curIdx+1}</div><div class="t">${all?'Wszystko zaliczone':noEmoji(s.levels[curIdx].title)}</div></div>${icon('list',{size:18})}`));
  const path=el('div','path');
  const items=[];
  s.levels.forEach((lv,i)=>{items.push({lv,i});if((i+1)%3===0)items.push({chest:true,after:i});});
  const xOf=k=>PATH_OFF[k%PATH_OFF.length];
  const doneOf=it=>it.chest?isDone(s.levels[it.after]):isDone(it.lv);
  path.appendChild(el('div','connector done first'));
  items.forEach((it,k)=>{
    const x=xOf(k);
    if(k>0){const c=el('div','connector'+(doneOf(items[k-1])?' done':''));c.style.setProperty('--x',((xOf(k-1)+x)/2)+'px');path.appendChild(c);}
    const node=el('div','pathnode');node.style.setProperty('--x',x+'px');
    if(it.chest){
      const open=doneOf(it);
      const btn=el('button','nodebtn node-chest a-sway',icon('chest',{size:32,stroke:2.4}));
      btn.setAttribute('aria-label','Skrzynia: '+(open?'do otwarcia':'po zaliczeniu poziomu '+(it.after+1)));
      btn.onclick=()=>toast(open?'Skrzynia: klejnoty dojdą w kroku 8':'Skrzynia otworzy się po zaliczeniu poziomu '+(it.after+1),open?'gem':'lock');
      node.appendChild(btn);node.appendChild(el('div','nodelabel gold','Skrzynia'));
    }else{
      const lv=it.lv,i=it.i;const unlocked=levelUnlocked(s,i),done=isDone(lv),stars=(st.levels[lv.id]||{}).stars||0;
      const cur=unlocked&&!done;
      if(cur){node.classList.add('cur');node.appendChild(el('div','bubble a-bob','ZACZNIJ'));}
      const btn=el('button','nodebtn '+(done?'node-done':cur?'node-open a-pulse':'node-lock'),done?icon('check',{size:34,stroke:3.4}):cur?icon('bolt',{size:40}):icon('lock',{size:28}));
      btn.setAttribute('aria-label',(done?'Powtórz: ':cur?'Zacznij: ':'Zablokowane: ')+lv.title);
      if(done)btn.innerHTML+=`<span class="stars">${starRow(stars,12)}</span>`;
      btn.onclick=unlocked?()=>startLesson(lv):()=>toast('Najpierw zalicz poprzedni poziom','lock');
      node.appendChild(btn);
      node.appendChild(el('div','nodelabel'+(cur?' cur':done?'':' lock'),noEmoji(lv.title)));
    }
    path.appendChild(node);
  });
  wrap.appendChild(path);sc.innerHTML='';sc.appendChild(wrap);
  // auto-scroll do bieżącego węzła (na środek ekranu)
  requestAnimationFrame(()=>{const n=wrap.querySelector('.node-open');if(!n)return;const r=n.getBoundingClientRect(),w=wrap.getBoundingClientRect();wrap.scrollTop=Math.max(0,r.top-w.top+wrap.scrollTop-w.height/2+r.height/2);});
}

/* ---------- LEKCJA: roladka (Lesson.html) -> quiz z panelem dobrze/źle, życiami i combo -> LevelComplete ---------- */
let lessonState=null;
function startLesson(lv){
  if(hearts().n<=0){showNoHearts({inLesson:false,lv});return;} // bez życia nie zaczynasz
  lessonState={lv,phase:(lv.feed||[]).length?'feed':'quiz',feedIdx:0,quiz:shuffle(lv.quiz||[]).slice(0,Math.min(6,(lv.quiz||[]).length)),qIdx:0,score:0,answered:false,combo:0,maxCombo:0,broken:false,xp:0,marks:[]};
  const L=document.getElementById('lesson');L.classList.add('open');
  renderLesson();
}
function closeLesson(){closeSheet();keyFn=null;lessonState=null;const L=document.getElementById('lesson');if(L)L.classList.remove('open');renderSubject();}
/* nagłówek lekcji: zamknij, pasek segmentowy (krok = dawka albo pytanie; zły = czerwony), serca */
function lessonHead(ls){
  const totalFeed=(ls.lv.feed||[]).length,steps=totalFeed+ls.quiz.length;
  const cur=ls.phase==='feed'?ls.feedIdx:totalFeed+ls.qIdx;
  const head=el('div','lessonhead');
  const x=el('button','x',icon('close',{size:18,stroke:3}));x.setAttribute('aria-label','Zamknij lekcję');x.onclick=closeLesson;head.appendChild(x);
  const seg=el('div','segbar');seg.setAttribute('aria-label',`krok ${Math.min(cur+1,steps)} z ${steps}`);
  for(let i=0;i<steps;i++)seg.appendChild(el('i',i<cur?(ls.marks[i]==='bad'?'bad':'on'):''));
  head.appendChild(seg);
  head.appendChild(heartsPill());
  return head;
}
function renderLesson(){
  const L=document.getElementById('lesson');const s=current;const ls=lessonState;const lv=ls.lv;
  const totalFeed=(lv.feed||[]).length;
  closeSheet();
  L.innerHTML='';
  L.appendChild(lessonHead(ls));
  const body=el('div','lessonbody');L.appendChild(body);

  if(ls.phase==='feed'){
    const f=lv.feed[ls.feedIdx];
    body.appendChild(el('div','blob a-float cyan'));
    const card=el('div','fcard a-up');
    card.innerHTML=`<div class="fin"><span class="tag accent">Mikro-dawka ${ls.feedIdx+1}/${totalFeed}</span>
      <div class="ftitle">${f.title}</div><div class="fbody">${f.body}</div>
      ${f.real?`<div class="real a-up d2"><span class="lbl">${icon('bulb',{size:15})}po ludzku</span>${f.real}</div>`:''}
      ${f.mnemo?`<div class="mnemo a-up d3"><span class="lbl">${icon('bookmark',{size:15})}zapamiętaj</span>${f.mnemo}</div>`:''}</div>`;
    body.appendChild(card);
    const last=ls.feedIdx+1>=totalFeed;
    const next=()=>{if(!advOk())return;if(!last){ls.feedIdx++;renderLesson();}else if(ls.quiz.length){ls.phase='quiz';renderLesson();}else finishLesson();};
    const prev=()=>{if(ls.feedIdx>0&&advOk()){ls.feedIdx--;renderLesson();}};
    const foot=el('div','lessonfoot col');
    foot.appendChild(el('div','swipehint2',icon('arrow-up',{size:16,cls:'a-bob'})+'<span>przesuń w górę, żeby przejść dalej</span>'));
    const b=el('button','pill a-glow',last?(ls.quiz.length?'LECIMY Z QUIZEM':'ZAKOŃCZ'):'KONTYNUUJ');b.id='lnext';b.onclick=next;foot.appendChild(b);
    L.appendChild(foot);
    // swipe: w górę = dalej (gdy karta przewinięta do końca), w dół = wstecz
    let y0=null,x0=0;
    body.onpointerdown=e=>{y0=e.clientY;x0=e.clientX;};
    body.onpointerup=e=>{if(y0==null)return;const dy=e.clientY-y0,dx=Math.abs(e.clientX-x0);y0=null;if(dx>60)return;
      const fin=card.querySelector('.fin');const atEnd=fin.scrollTop+fin.clientHeight>=fin.scrollHeight-6;
      if(dy<-70&&atEnd)next();else if(dy>70&&fin.scrollTop<=0)prev();};
    keyFn=e=>{if(e.key==='Enter'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}else if(e.key==='ArrowLeft')prev();};
  } else if(ls.phase==='quiz'){
    if(ls.qIdx>=ls.quiz.length)return finishLesson();
    const q=ls.quiz[ls.qIdx];ls.answered=false;
    const stepIdx=totalFeed+ls.qIdx;
    const qb=quizBlock(q,{n:ls.qIdx+1,total:ls.quiz.length,combo:ls.combo,broken:ls.broken,onAnswer:(i,ok)=>{
      ls.answered=true;ls.broken=false;
      const next=()=>{ls.qIdx++;renderLesson();};
      if(ok){
        ls.score++;ls.combo++;ls.maxCombo=Math.max(ls.maxCombo,ls.combo);
        const m=comboMult(ls.combo),xp=5*m;ls.xp+=xp;addXP(s.id,xp);
        body.appendChild(confetti(4));
        sheetOk(q,{xp,mult:m,combo:ls.combo,onNext:next});
      }else{
        ls.broken=ls.combo>=2;ls.combo=0;ls.marks[stepIdx]='bad';
        loseHeart();
        const hp=L.querySelector('.hearts');if(hp){hp.classList.add('a-beat');hp.appendChild(el('span','minus a-blink','−1'));}
        const seg=L.querySelectorAll('.segbar i')[stepIdx];if(seg)seg.className='bad';
        sheetBad(q,{onNext:()=>{if(hearts().n<=0)showNoHearts({inLesson:true,lv});else next();},onCards:()=>goCards(lv)});
      }
    }});
    body.appendChild(qb.body);
    const foot=el('div','lessonfoot');foot.appendChild(qb.foot);L.appendChild(foot);
  }
}
/* wynik poziomu (LevelComplete.html); logika XP/gwiazdek/zaliczenia jak dotąd + bonus combo w XP z quizu */
function finishLesson(){
  const s=current;const ls=lessonState;const lv=ls.lv;
  const pct=ls.quiz.length?Math.round(ls.score/ls.quiz.length*100):100;
  const stars = pct>=90?3:(pct>=70?2:(pct>=50?1:0));

/* ---------- QUIZ (cały przedmiot, filtr po poziomach): kafle 3D + panel dobrze/źle; bez serc i combo (to tylko w lekcji) ---------- */
let qState=null;
function renderQuiz(sc){
  const s=current;closeSheet();
  if(!qState||qState.subj!==s.id)qState={subj:s.id,lvl:'all',list:null,idx:0,score:0,answered:false};

/* ---------- EGZAMIN ---------- */
let exState=null,exInt=null;
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0');}
function exGrade(s,pct){
  const sc=s.grading&&s.grading.scale; // [[min,label],...] malejąco
  if(sc){for(const[min,lab]of sc){if(pct>=min)return lab;}return s.grading.failLabel||'2 — niezaliczone';}
  if(pct>=90)return'5';if(pct>=70)return'4';if(pct>=50)return'3';return'2 — niezaliczone';
}
function renderEgzamin(sc){
  const s=current;clearInterval(exInt);exState=null;
  const wrap=el('div','scroll');
  const ALL=allQuiz(s).length;
  const N=Math.min(20,ALL);
  const lim=(s.grading&&s.grading.examMin)||20;
  const fullLim=Math.max(lim,Math.ceil(ALL*0.75)); // ~45s na pytanie
  wrap.innerHTML=`<div class="result">${bigTile('','target')}<h2>Egzamin</h2>
    <div class="specs"><div class="spec">${N}<small>losowych</small></div><div class="spec">${lim}:00<small>na czas</small></div><div class="spec">${(s.grading&&s.grading.pass)||50}%<small>zalicza</small></div></div>
    <p>Bez podpowiedzi w trakcie. Na końcu % i ocena wg siatki + przegląd błędów.</p>
    <button class="pill" id="exstart">${icon('bolt',{size:18})} symulacja — ${N} losowych</button>
    <button class="pill" id="exfull" style="margin-top:10px">${icon('list',{size:18})} Test końcowy — WSZYSTKIE ${ALL} pytań</button>
    <p style="font-size:13px;margin-top:6px">Test końcowy = każde pytanie z przedmiotu, w losowej kolejności (${fullLim}:00).</p></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exstart').onclick=()=>beginExam(sc,N,lim*60);
  document.getElementById('exfull').onclick=()=>beginExam(sc,ALL,fullLim*60);
}
function beginExam(sc,N,limit){
  const s=current;
  exState={pool:shuffle(allQuiz(s)).slice(0,N),idx:0,pick:[],left:limit};
  exState.pick=new Array(exState.pool.length).fill(null);
  clearInterval(exInt);
  exInt=setInterval(()=>{exState.left--;const t=document.getElementById('extimer');if(t){t.lastChild.textContent=fmt(exState.left);t.classList.toggle('warn',exState.left<=60);}if(exState.left<=0){clearInterval(exInt);examFinish(sc);}},1000);
  renderExamQ(sc);
}
function renderExamQ(sc){
  const s=current;const ex=exState;
  if(ex.idx>=ex.pool.length)return examFinish(sc);
  const q=ex.pool[ex.idx];const sel=ex.pick[ex.idx];const last=ex.idx+1>=ex.pool.length;
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Pytanie ${ex.idx+1}/${ex.pool.length}</div><div class="timer" id="extimer">${icon('clock',{size:16})}<span>${fmt(ex.left)}</span></div></div>
    <div class="progressrow"><div class="bar"><i style="width:${ex.idx/ex.pool.length*100}%"></i></div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
      <div class="opts">${q.a.map((o,i)=>`<button class="opt${sel===i?' sel':''}" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        ${ex.idx>0?'<button class="pill ghost" style="flex:1" id="exprev">'+LBL.back+'wstecz</button>':''}
        <button class="pill" style="flex:2" id="exnext">${last?'zakończ i sprawdź '+icon('flag',{size:18}):LBL.next}</button></div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ex.pick[ex.idx]=+o.dataset.i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.i===ex.pick[ex.idx]));});
  const nx=document.getElementById('exnext');nx.onclick=()=>{if(last)examFinish(sc);else{ex.idx++;renderExamQ(sc);}};
  const pv=document.getElementById('exprev');if(pv)pv.onclick=()=>{ex.idx--;renderExamQ(sc);};
}
function examFinish(sc){
  clearInterval(exInt);const s=current;const ex=exState;
  let correct=0;const wrong=[];
  ex.pool.forEach((q,i)=>{if(ex.pick[i]===q.c)correct++;else wrong.push({q,sel:ex.pick[i]});});
  const pct=Math.round(correct/ex.pool.length*100);
  const grade=exGrade(s,pct);const pass=(s.grading&&s.grading.pass)||50;
  const kind=pct>=90?'gold':pct>=70?'hot':pct>=pass?'ok':'fail';
  addXP(s.id,correct*3);
  completeDaily(s.id,'exam');
  const rev = wrong.length? wrong.map(w=>`<div class="ritem"><div class="rq">${w.q.q}</div>
      <div class="rbad">Twoja: ${w.sel==null?'— (brak)':keys[w.sel]+'. '+w.q.a[w.sel]}</div>
      <div class="rgood">Dobra: ${keys[w.q.c]}. ${w.q.a[w.q.c]}</div>
      <div class="rsrc">${w.q.lvl||''} · ${w.q.e||''}</div></div>`).join('') : '<div class="ritem rgood">'+icon('check',{size:16,stroke:3.4})+' Zero błędów. Clean sweep.</div>';
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="result">${bigTile(kind)}<h2>Ocena: ${grade}</h2>
    <div class="score">Trafione <b>${correct}/${ex.pool.length}</b> (${pct}%)</div>
    <p>${pct>=pass?'Zdane!':'Poniżej progu — wróć do ścieżki i fiszek.'}</p>
    <button class="pill" id="exagain">${LBL.again}</button></div>
    <div class="review"><h3>Przegląd błędów (${wrong.length})</h3>${rev}</div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exagain').onclick=()=>renderEgzamin(sc);
  if(pct>=pass)toast('zdane! ocena '+grade,'trophy');else toast('niezaliczone','x-circle');
}

/* ================= ĆWICZENIA (wpisywanie, klocki, pary, speed) ================= */
let cw=null, cwInt=null;
function exNorm(str){return (str||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\b(the|a|an|to|el|la|los|las|un|una|unos|unas)\b/g,' ').replace(/\s+/g,' ').trim();}
function exClean(str){return (str||'').replace(/\([^)]*\)/g,'').replace(/…|\.\.\./g,'').replace(/\s+/g,' ').trim();}
function typePool(s){return allCards(s).map(c=>({prompt:exClean(c.d),ans:exClean(c.t),lvl:c.lvl})).filter(c=>c.prompt&&c.ans&&c.ans.length<=30&&!/\//.test(c.ans));}
function tilePool(s){return typePool(s).filter(c=>c.ans.replace(/\s/g,'').length<=18);}
function matchPool(s){return allCards(s).map(c=>({a:exClean(c.t),b:exClean(c.d)})).filter(c=>c.a&&c.b);}

function renderCwicz(sc){
  clearInterval(cwInt);cw=null;
  const s=current;const wrap=el('div','scroll');
  const hub=el('div','exhub');
  const items = s.lang
   ? [['typing','edit','Wpisywanie','Po polsku → '+(s.short||'język')+'. Wpisz słowo z klawiatury.'],
      ['tiles','grid','Klocki — ułóż słowo','Poukładaj literki/wyrazy w poprawne słowo.'],
      ['match','link','Połącz w pary','Dopasuj słowo do tłumaczenia.']]
   : [['match','link','Połącz w pary','Dopasuj pojęcie do definicji.'],
      ['speed','bolt','Szybki quiz na czas','60 sekund — ile zdążysz trafić?'],
      ['typing','edit','Wpisz pojęcie','Z definicji wpisz właściwy termin.']];
  hub.appendChild(el('div','exprompt','Wybierz ćwiczenie'));
  items.forEach(([k,em,t,p])=>{
    const c=el('div','excard',`<div class="eemoji">${icon(em,{size:26,stroke:2.4})}</div><div class="emeta"><h3>${t}</h3><p>${p}</p></div>`);
    c.onclick=()=>{ if(k==='typing')cwStartTyping(sc); else if(k==='tiles')cwStartTiles(sc); else if(k==='match')cwStartMatch(sc); else cwStartSpeed(sc); };
    hub.appendChild(c);
  });
  wrap.appendChild(hub);sc.innerHTML='';sc.appendChild(wrap);
}
function cwBackBtn(sc){const b=el('button','pill ghost',LBL.back+'ćwiczenia');b.style.marginTop='12px';b.onclick=()=>renderCwicz(sc);return b;}
function cwResult(sc,kind,score,total,retry){
  clearInterval(cwInt);
  const wrap=el('div','scroll');const pct=total?Math.round(score/total*100):0;
  wrap.innerHTML=`<div class="result">${bigTile(kind)}<h2>Wynik</h2>
    <div class="score">Dobrze: <b>${score}/${total}</b> (${pct}%)</div>
    <p>${pct>=80?'Świetnie! Masz to w małym palcu.':pct>=50?'Niezłe, jeszcze runda i będzie czysto.':'Spoko, powtórz — od tego jest ćwiczenie.'}</p></div>`;

/* --- TYPING --- */
function cwStartTyping(sc){const pool=shuffle(typePool(current)).slice(0,12);
  if(!pool.length){toast('Brak danych do wpisywania');return renderCwicz(sc);}
  cw={type:'typing',list:pool,idx:0,score:0};cwRenderTyping(sc);}
function cwRenderTyping(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'gold':'ok',cw.score,cw.list.length,()=>cwStartTyping(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">przetłumacz / wpisz</div><div class="exq">${it.prompt}</div>
    <input class="winput" id="win" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="wpisz odpowiedź…">
    <div class="exfb" id="wfb"></div>
    <button class="pill qnext" id="wnext" style="margin-top:14px">${LBL.check}</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const inp=document.getElementById('win'),btn=document.getElementById('wnext'),fb=document.getElementById('wfb');
  setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  let checked=false;
  const check=()=>{
    if(checked){cw.idx++;cwRenderTyping(sc);return;}
    checked=true;
    const ok=inp.value.trim()!=='' && exNorm(inp.value)===exNorm(it.ans);
    inp.classList.add(ok?'ok':'bad');inp.disabled=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp','check');fb.className='exfb ok show';fb.innerHTML=icon('check',{size:16,stroke:3.4,cls:'ic-acid'})+' Dobrze: <b>'+it.ans+'</b>';}
    else{toast('prawie!');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.innerHTML=(cw.idx+1>=cw.list.length)?LBL.result:LBL.next;
  };
  btn.onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
}
/* --- TILES --- */
function cwStartTiles(sc){const pool=shuffle(tilePool(current)).slice(0,10);
  if(!pool.length){toast('Brak danych');return renderCwicz(sc);}
  cw={type:'tiles',list:pool,idx:0,score:0,_n:-1};cwRenderTiles(sc);}
function cwRenderTiles(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'gold':'ok',cw.score,cw.list.length,()=>cwStartTiles(sc));
  const phrase=/\s/.test(it.ans.trim());
  const sep=phrase?' ':'';
  if(cw._n!==cw.idx){cw._n=cw.idx;const units=phrase?it.ans.trim().split(/\s+/):it.ans.replace(/\s/g,'').split('');cw.tiles=shuffle(units.map(ch=>({ch,used:false})));cw.build=[];cw.checked=false;}
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">ułóż: ${it.prompt}</div>
    <div class="build" id="build"></div><div class="tiles" id="bank"></div>
    <div class="exfb" id="tfb"></div>
    <button class="pill qnext" id="tnext" style="margin-top:8px">${LBL.check}</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const bankEl=document.getElementById('bank'),buildEl=document.getElementById('build'),fb=document.getElementById('tfb'),btn=document.getElementById('tnext');
  cw.build.forEach((ti,pos)=>{const b=el('button','tile',cw.tiles[ti].ch);b.onclick=()=>{if(cw.checked)return;cw.tiles[ti].used=false;cw.build.splice(pos,1);cwRenderTiles(sc);};buildEl.appendChild(b);});
  cw.tiles.forEach((tl,ti)=>{const b=el('button','tile'+(tl.used?' used':''),tl.ch);b.onclick=()=>{if(cw.checked||tl.used)return;tl.used=true;cw.build.push(ti);cwRenderTiles(sc);};bankEl.appendChild(b);});
  btn.onclick=()=>{
    if(cw.checked){cw.idx++;cwRenderTiles(sc);return;}
    const got=cw.build.map(i=>cw.tiles[i].ch).join(sep);
    const ok=exNorm(got)===exNorm(it.ans);cw.checked=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp','check');fb.className='exfb ok show';fb.innerHTML=icon('check',{size:16,stroke:3.4,cls:'ic-acid'})+' <b>'+it.ans+'</b>';}
    else{toast('nie tak');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.innerHTML=(cw.idx+1>=cw.list.length)?LBL.result:LBL.next;
  };
}
/* --- MATCH --- */
function cwStartMatch(sc){const pool=shuffle(matchPool(current)).slice(0,5);
  if(pool.length<2){toast('Za mało danych');return renderCwicz(sc);}
  cw={type:'match',pairs:pool,left:shuffle(pool.map((p,i)=>({i,t:p.a}))),right:shuffle(pool.map((p,i)=>({i,t:p.b}))),selL:null,selR:null,done:0,matched:new Set()};
  cwRenderMatch(sc);}
function cwRenderMatch(sc){
  if(cw.done>=cw.pairs.length)return cwResult(sc,'ok',cw.pairs.length,cw.pairs.length,()=>cwStartMatch(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','exprompt','Połącz w pary (tapnij z lewej, potem z prawej)'));
  const mw=el('div','matchwrap');const lc=el('div','mcol'),rc=el('div','mcol');
  const trunc=t=>t.length>64?t.slice(0,62)+'…':t;
  cw.left.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('L'+o.i)?' done':'')+(cw.selL===o.i?' sel':''),o.t);it.onclick=()=>{if(cw.matched.has('L'+o.i))return;cw.selL=o.i;tryMatch(sc);};lc.appendChild(it);});
  cw.right.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('R'+o.i)?' done':'')+(cw.selR===o.i?' sel':''),trunc(o.t));it.onclick=()=>{if(cw.matched.has('R'+o.i))return;cw.selR=o.i;tryMatch(sc);};rc.appendChild(it);});
  mw.appendChild(lc);mw.appendChild(rc);wrap.appendChild(mw);
  const f=el('div');f.style.cssText='margin-top:14px';f.appendChild(cwBackBtn(sc));wrap.appendChild(f);
  sc.innerHTML='';sc.appendChild(wrap);
}
function tryMatch(sc){
  if(cw.selL==null||cw.selR==null){cwRenderMatch(sc);return;}
  if(cw.selL===cw.selR){cw.matched.add('L'+cw.selL);cw.matched.add('R'+cw.selR);cw.done++;cw.selL=null;cw.selR=null;addXP(current.id,3);toast('para! +3xp','check');cwRenderMatch(sc);}
  else{toast('nie pasuje','close');cw.selL=null;cw.selR=null;cwRenderMatch(sc);}
}
/* --- SPEED --- */
function cwStartSpeed(sc){cw={type:'speed',list:shuffle(allQuiz(current)),idx:0,score:0,left:60};
  clearInterval(cwInt);cwInt=setInterval(()=>{cw.left--;const t=document.getElementById('spdt');if(t){t.lastChild.textContent=cw.left+'s';t.classList.toggle('warn',cw.left<=10);}if(cw.left<=0){clearInterval(cwInt);cwResult(sc,(cw.score>=10)?'hot':'ok',cw.score,cw.idx,()=>cwStartSpeed(sc));}},1000);
  cwRenderSpeed(sc);}
function cwRenderSpeed(sc){
  if(cw.idx>=cw.list.length){clearInterval(cwInt);return cwResult(sc,'hot',cw.score,cw.idx,()=>cwStartSpeed(sc));}
  const q=cw.list[cw.idx];const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Trafione: ${cw.score}</div><div class="timer" id="spdt">${icon('clock',{size:16})}<span>${cw.left}s</span></div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  let locked=false;
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(locked)return;locked=true;const i=+o.dataset.i;
    wrap.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');});
    if(i===q.c){cw.score++;addXP(current.id,2);}
    setTimeout(()=>{cw.idx++;cwRenderSpeed(sc);},450);
  });
}

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  app=document.getElementById('app');
  applyMotion();
  // klawiatura (lekcja, quiz, panele): jeden nasłuch, widok podstawia keyFn; pola tekstowe (ćwiczenia) pomijane
  document.addEventListener('keydown',e=>{if(!keyFn)return;const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;keyFn(e);});
  if(!SUBJECTS.length)return renderEmpty();
  go('today');
});
})();
