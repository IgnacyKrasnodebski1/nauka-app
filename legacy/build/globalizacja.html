<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAUKA — globalizacja</title>
<style>
/* ============================================================
   NAUKA — wieloprzedmiotowa platforma do nauki (gen-z brainrot)
   Wspólne style dla silnika. Motyw per przedmiot przez --accent.
   ============================================================ */
:root{
  --bg:#0a0a12; --bg2:#12121f; --card:#1a1a2e; --card2:#222238;
  --txt:#f2f2fa; --muted:#9a9ab8;
  --pink:#ff2d95; --purple:#a855f7; --cyan:#22d3ee; --lime:#aaff00; --orange:#ff7a00; --red:#ff3b5c; --green:#1ed760;
  --accent:linear-gradient(135deg,#ff2d95,#a855f7,#22d3ee);
  --accent1:#ff2d95; --accent2:#22d3ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#1c1030 0%,var(--bg) 55%),var(--bg);
  color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;
}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px;z-index:30}
.logo{font-weight:900;font-size:18px;letter-spacing:-.5px;line-height:1;display:flex;align-items:center;gap:8px}
.logo .g{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}
.backbtn{background:var(--card);border:1px solid #ffffff14;color:var(--txt);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;flex:none}
.pills{display:flex;align-items:center;gap:7px;flex:none}
.streak{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid #ffffff14;padding:7px 11px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.streak small{color:var(--muted);font-weight:600}
@media(max-width:380px){.pills{gap:5px}.streak{padding:6px 9px;font-size:13px}.logo{font-size:16px}}

.screen{flex:1;min-height:0;overflow:hidden;position:relative;display:none}
.screen.active{display:block}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 110px}

/* ---------- HOME: wybór przedmiotu ---------- */
.hero{padding:14px 4px 18px}
.hero h1{font-size:27px;font-weight:900;letter-spacing:-.6px;line-height:1.1}
.hero p{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.4}
.subjcard{display:flex;align-items:center;gap:16px;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:22px;padding:18px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.subjcard:active{transform:scale(.98)}
.subjcard::before{content:"";position:absolute;inset:0;background:var(--sa,var(--accent));opacity:.10}
.subjcard>*{position:relative;z-index:1}
.subjemoji{font-size:42px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:#00000033;border-radius:18px;flex:none}
.subjmeta{flex:1;min-width:0}
.subjmeta h3{font-size:19px;font-weight:900;letter-spacing:-.3px}
.subjmeta .sub{color:var(--muted);font-size:13.5px;margin-top:3px;line-height:1.35}
.subjprog{margin-top:9px;display:flex;align-items:center;gap:8px}
.subjprog .bar{flex:1;height:7px;background:#ffffff14;border-radius:999px;overflow:hidden}
.subjprog .bar i{display:block;height:100%;background:var(--sa,var(--accent));border-radius:999px}
.subjprog small{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.subjcard .chev{font-size:24px;color:var(--muted);flex:none}
.addcard{display:flex;align-items:center;gap:14px;border:1.5px dashed #ffffff22;border-radius:22px;padding:16px 18px;color:var(--muted);font-weight:700;font-size:14.5px}
.addcard .subjemoji{background:#ffffff08;font-size:30px}

/* ---------- SUBJECT sub-tabs ---------- */
.subtabs{display:flex;gap:7px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:none;padding:9px 15px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff14;color:var(--muted);font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.subtab.active{background:var(--accent);color:#fff;border-color:transparent}

/* ---------- ŚCIEŻKA (Duolingo path) ---------- */
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px 120px}
.pathnode{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.nodebtn{width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;font-size:34px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 6px 0 #00000055;transition:transform .1s}
.nodebtn:active{transform:translateY(3px);box-shadow:0 3px 0 #00000055}
.node-done{background:var(--accent)}
.node-open{background:linear-gradient(150deg,var(--card2),#2c2c48);border:2px solid var(--accent2)}
.node-lock{background:#1a1a28;color:#55556e;box-shadow:0 6px 0 #00000033;cursor:not-allowed}
.nodebtn .stars{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;filter:drop-shadow(0 1px 1px #000)}
.nodelabel{font-size:13.5px;font-weight:800;text-align:center;max-width:180px;line-height:1.2}
.nodelabel small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.connector{width:4px;height:26px;background:#ffffff14;border-radius:2px}
.connector.done{background:var(--accent2)}
.pathzig:nth-child(odd){transform:translateX(-46px)}
.pathzig:nth-child(even){transform:translateX(46px)}

/* ---------- karty / tagi (wspólne) ---------- */
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;padding:5px 11px;border-radius:999px;background:#ffffff14;color:var(--txt);margin-bottom:14px}
.progressrow{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.bar{flex:1;height:8px;background:#ffffff12;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s}
.counter{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff14;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:transparent}

/* FEED / lekcja-feed */
.feedwrap{height:100%;overflow-y:scroll;-webkit-overflow-scrolling:touch;scroll-snap-type:y mandatory}
.feedwrap::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;padding:18px 18px 110px}
.fcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:26px;padding:24px 22px;position:relative;overflow:hidden;box-shadow:0 20px 60px #00000066}
.fcard::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:.10}
.fcard>*{position:relative;z-index:1}
.ftitle{font-size:24px;font-weight:900;line-height:1.14;letter-spacing:-.5px;margin-bottom:14px}
.fbody{font-size:16px;line-height:1.5;color:#e7e7f4}
.fbody b{color:#fff}
.real{margin-top:16px;padding:13px 15px;background:#00000033;border-left:3px solid var(--accent2);border-radius:12px;font-size:14.5px;line-height:1.45;color:#dcdcf0}
.real .lbl{font-weight:800;color:var(--accent2);font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}
.mnemo{margin-top:12px;padding:12px 15px;background:#2a230066;border-left:3px solid var(--lime);border-radius:12px;font-size:14.5px;line-height:1.45}
.mnemo .lbl{font-weight:800;color:var(--lime);font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}

/* FISZKI */
.flip{flex:1;perspective:1600px;margin-bottom:14px;min-height:0}
.flipinner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,2,.5,1);transform-style:preserve-3d;cursor:pointer}
.flip.flipped .flipinner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid #ffffff12;overflow-y:auto}
.front{background:linear-gradient(160deg,#2a1840,#1a1a2e)}
.back{background:linear-gradient(160deg,#0f2f33,#1a1a2e);transform:rotateY(180deg)}
.face .tag{position:absolute;top:18px;left:18px;margin:0}
.term{font-size:25px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.deftxt{font-size:16.5px;line-height:1.5;color:#eaeaf6}
.deftxt b{color:var(--accent2)}
.tapomat{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600}
.fbtns{display:flex;gap:10px}
.fbtn{flex:1;padding:15px;border:none;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;transition:transform .1s}
.fbtn:active{transform:scale(.96)}
.fbtn.no{background:#33222e;color:#ff7a99;border:1px solid #ff3b5c40}
.fbtn.yes{background:#16331f;color:#7dffa6;border:1px solid #1ed76040}

/* QUIZ */
.qcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column}
.qq{font-size:20px;font-weight:900;line-height:1.22;letter-spacing:-.3px;margin:8px 0 18px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{text-align:left;padding:15px 16px;border-radius:15px;background:#ffffff0a;border:1.5px solid #ffffff14;color:var(--txt);font-size:15.5px;font-weight:600;line-height:1.35;cursor:pointer;transition:all .15s;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-weight:900;color:var(--purple);flex:none}
.opt:active{transform:scale(.985)}
.opt.correct{background:#13351f;border-color:var(--green);color:#c9ffd9}
.opt.correct .k{color:var(--green)}
.opt.wrong{background:#35161f;border-color:var(--red);color:#ffd0da}
.opt.wrong .k{color:var(--red)}
.opt.sel{background:#2a2350;border-color:var(--purple)}
.opt.dim{opacity:.45}
.explain{margin-top:16px;padding:14px 16px;background:#00000040;border-radius:14px;font-size:14.5px;line-height:1.5;color:#e3e3f2;display:none}
.explain.show{display:block;animation:pop .3s}
.explain b{color:var(--lime)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(7px);opacity:1}}
.pill{padding:15px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:16px;font-weight:900;cursor:pointer;width:100%}
.pill:active{transform:scale(.97)}
.pill.ghost{background:#ffffff10;border:1px solid #ffffff20}
.qnext{margin-top:14px;display:none}
.qnext.show{display:block;animation:pop .3s}

/* WYNIK */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.result .big{font-size:60px}
.result h2{font-size:26px;font-weight:900;letter-spacing:-.5px}
.result p{color:var(--muted);font-size:15.5px;line-height:1.5;max-width:340px}
.result .score{font-size:19px;font-weight:900}
.result .score b{background:var(--accent);-webkit-background-clip:text;background-clip:text;color:transparent}

/* EGZAMIN */
.examhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.timer{font-weight:900;font-size:16px;background:var(--card);border:1px solid #ffffff14;padding:7px 13px;border-radius:999px;white-space:nowrap}
.timer.warn{color:var(--red);border-color:var(--red);animation:bob 1s infinite}
.specs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.spec{background:var(--card);border:1px solid #ffffff14;border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;text-align:center}
.spec small{display:block;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.review{margin-top:18px;text-align:left;width:100%}
.review h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;font-weight:800}
.ritem{background:var(--card);border:1px solid #ffffff12;border-radius:14px;padding:13px 15px;margin-bottom:9px;font-size:14px;line-height:1.45}
.ritem .rq{font-weight:800;margin-bottom:5px}
.ritem .rbad{color:#ff8aa3}
.ritem .rgood{color:#7dffa6}
.ritem .rsrc{color:var(--muted);font-size:12px;margin-top:5px}

/* INFO */
.zbox{background:var(--card);border:1px solid #ffffff12;border-radius:18px;padding:16px 18px;margin-bottom:12px}
.zbox h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent2);margin-bottom:9px;font-weight:800}
.zbox p,.zbox li{font-size:15px;line-height:1.55;color:#e7e7f4}
.zbox ul{margin-left:18px;margin-top:4px}
.gradetbl{width:100%;border-collapse:collapse;font-size:14.5px}
.gradetbl td{padding:6px 4px;border-bottom:1px solid #ffffff10}
.gradetbl td:last-child{text-align:right;font-weight:900;color:var(--lime)}

/* LEKCJA modal */
.lesson{position:absolute;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.lesson.open{display:flex;animation:pop .25s}
.lessonhead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lessonhead .x{width:36px;height:36px;border-radius:50%;background:#ffffff14;border:none;color:#fff;font-size:18px;font-weight:800;cursor:pointer;flex:none}
.lessonhead .bar{flex:1}
.lessonbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;padding:0 16px 16px}
.lessonfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}

.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(16,16,28,.92);backdrop-filter:blur(14px);border-top:1px solid #ffffff12;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40}
.nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:12px}
.nav button .ic{font-size:21px;line-height:1}
.nav button.active{color:var(--txt)}

.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--card2);border:1px solid #ffffff20;padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.swipehint{position:absolute;bottom:80px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px;font-weight:600;animation:bob 1.6s infinite;pointer-events:none;z-index:20}

/* ---------- ĆWICZENIA (wpisywanie, klocki, pary, speed) ---------- */
.exhub{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.excard{display:flex;align-items:center;gap:14px;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid #ffffff12;border-radius:20px;padding:16px 18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.excard:active{transform:scale(.98)}
.excard::before{content:"";position:absolute;inset:0;background:var(--accent);opacity:.08}
.excard>*{position:relative;z-index:1}
.excard .eemoji{font-size:32px;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:#00000033;border-radius:15px;flex:none}
.excard .emeta h3{font-size:16.5px;font-weight:900;letter-spacing:-.2px}
.excard .emeta p{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.35}
.exprompt{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.exq{font-size:23px;font-weight:900;letter-spacing:-.4px;line-height:1.2;margin-bottom:18px}
.winput{width:100%;padding:15px 16px;border-radius:15px;background:#0e0e1a;border:2px solid #ffffff1e;color:var(--txt);font-size:18px;font-weight:700;outline:none}
.winput:focus{border-color:var(--accent2)}
.winput.ok{border-color:var(--green);background:#13351f}
.winput.bad{border-color:var(--red);background:#35161f}
.exfb{margin-top:14px;padding:13px 15px;border-radius:13px;font-size:15px;line-height:1.45;display:none}
.exfb.show{display:block;animation:pop .25s}
.exfb.ok{background:#13351f;color:#c9ffd9}
.exfb.bad{background:#35161f;color:#ffd0da}
.exfb b{color:#fff}
/* klocki */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.build{min-height:54px;border-bottom:2px dashed #ffffff22;padding:8px 4px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tile{padding:11px 14px;border-radius:12px;background:#23233a;border:1px solid #ffffff1e;color:var(--txt);font-size:18px;font-weight:800;cursor:pointer;min-width:40px;text-align:center}
.tile:active{transform:scale(.95)}
.tile.used{opacity:.25;pointer-events:none}
/* pary */
.matchwrap{display:flex;gap:10px}
.mcol{flex:1;display:flex;flex-direction:column;gap:9px}
.mitem{padding:13px 12px;border-radius:13px;background:#ffffff0c;border:1.5px solid #ffffff1e;color:var(--txt);font-size:14.5px;font-weight:700;line-height:1.3;cursor:pointer;min-height:48px;display:flex;align-items:center}
.mitem.sel{border-color:var(--accent2);background:#2a2350}
.mitem.done{opacity:.35;border-color:var(--green);pointer-events:none}
.mitem.bad{border-color:var(--red);animation:pop .2s}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   PRZEDMIOT: Globalizacja, regionalizacja i konkurencyjność międzynarodowa
   Źródło: 4 prezentacje dr. Dominika Brodackiego (Zajęcia 1–4)
   Zaliczenie: aktywność 20% + prezentacja 40% + zaliczenie pisemne 40%
   ============================================================ */
window.SUBJECTS = window.SUBJECTS || [];
window.SUBJECTS.push({
  id:"globalizacja",
  name:"Globalizacja i regionalizacja",
  short:"Global",
  emoji:"🌍",
  tagline:"Fale globalizacji, teorie (liberalizm/realizm/krytycyzm), global governance, efekt brukselski, konkurencyjność, kultura, regionalizacja.",
  accent:"linear-gradient(135deg,#2563eb,#06b6d4,#22c55e)",
  accent2:"#06b6d4",
  grading:{pass:50,examMin:20,scale:[[98,"5,5"],[90,"5"],[80,"4,5"],[70,"4"],[60,"3,5"],[50,"3"]],failLabel:"2 — niezaliczone"},
  info:`
    <div class="zbox"><h3>Jak liczy się ocena</h3>
      <p>🙋 <b>Aktywność na zajęciach = 20%</b><br>
      🎤 <b>Prezentacja (pary/trójki) = 40%</b> — 10 min, najważniejsze wydarzenia z ostatnich 2 tygodni (co / kto / kiedy / jak / dlaczego ważne) i ich wpływ na konkurencyjność.<br>
      🧪 <b>Zaliczenie pisemne (ostatnie zajęcia) = 40%</b>.</p></div>
    <div class="zbox"><h3>Siatka ocen (test)</h3>
      <table class="gradetbl">
        <tr><td>50–59</td><td>3</td></tr><tr><td>60–69</td><td>3,5</td></tr><tr><td>70–79</td><td>4</td></tr>
        <tr><td>80–89</td><td>4,5</td></tr><tr><td>90–98</td><td>5</td></tr><tr><td>98–100</td><td>5,5</td></tr></table></div>
    <div class="zbox"><h3>⚡ Motyw przewodni kursu</h3>
      <p>Świat przechodzi <b>od logiki efektywności do logiki bezpieczeństwa</b>. „Produkować najtaniej” → „produkować bezpiecznie”. Zapamiętaj to zdanie — spina cały przedmiot.</p></div>`,
  levels:[
    /* ---------------- L1 ---------------- */
    {id:"l1",title:"Czym jest globalizacja",emoji:"🧭",
     feed:[
      {title:"Definicja, którą musisz umieć",body:"<b>Globalizacja</b> = proces rosnącej <b>współzależności</b> między państwami, gospodarkami i społeczeństwami, obejmujący przepływy <b>towarów, kapitału, ludzi, technologii i idei</b>.",real:"Świat coraz mocniej połączony kablami zależności. Ruszysz jeden koniec — drga drugi.",mnemo:"Przepływy: <b>TO-KA-LU-TE-I</b> — Towary, Kapitał, Ludzie, Technologia, Idee."},

      {title:"Falowy charakter — I FALA (1870–1914)",body:"Napęd: <b>rewolucja przemysłowa</b>, wynalazki (<b>kolej i telegraf</b>), <b>standard złota</b>, masowe migracje. Udział eksportu w światowym PKB skoczył z ~5% (1870) do ~14% (1913).",real:"Pierwsza globalizacja to nie internet — to para, tory i telegraf. Londyn = centrum finansów świata.",mnemo:"I fala = <b>Kolej + Telegraf + Złoto + Migracje</b>."},
      {title:"Wielki reset: wojny i protekcjonizm",body:"Wojny światowe, <b>Wielki Kryzys</b>, nacjonalizm gospodarczy i protekcjonizm cofnęły integrację. Poziom handlu z 1913 r. odzyskano dopiero w latach <b>70.–80. XX w.</b>",real:"Globalizacja NIE jest liniowa. Raz się cofnęła na ~60 lat. Może znów."},
      {title:"II FALA (1945–2008)",body:"Fundamenty ładu: <b>Bretton Woods</b> (1944, MFW + Bank Światowy), <b>GATT → WTO</b>. Potem globalne łańcuchy wartości, <b>offshoring</b>, <b>China shock</b>, <b>just-in-time</b>.",real:"Po wojnie zbudowano 'reguły gry' i produkcja rozlała się po świecie w poszukiwaniu taniości."},
      {title:"Hiperglobalizacja (1990–2008)",body:"Turbo-faza: <b>upadek ZSRR</b>, <b>liberalizacja kapitału</b>, <b>cyfryzacja</b>, ekspansja WTO. Świat jednobiegunowy, kapitał płynie swobodnie.",real:"Lata 90.–2000. — 'im więcej globalizacji, tym lepiej'. Szczyt wiary w wolny rynek bez granic."},
      {title:"2008 — ROK PRZEŁOMU",body:"<b>Kryzys finansowy</b> + wzrost <b>populizmu</b> + <b>wojny handlowe</b> + <b>kryzys zaufania do instytucji</b>. Od tego momentu mówimy o <b>deglobalizacji / slowbalisation</b>.",real:"2008 to zakręt. Później: friend-shoring, nearshoring, decoupling — dobił to COVID i wojna w Ukrainie.",mnemo:"Po 2008: <b>Slow-Friend-Near-De</b> (slowbalisation, friend-shoring, nearshoring, decoupling)."}

    {id:"l3",title:"Teorie globalizacji",emoji:"🎓",
     feed:[
      {title:"Liberalizm — 'rynek sam integruje świat'",body:"Globalizacja to <b>pozytywny, naturalny</b> efekt technologii i rynku. Napędza ją: <b>technologia, rynek (efektywność), kapitał</b>. Prowadzi do <b>konwergencji</b> (biedniejsi nadrabiają), a państwa wolą <b>współpracować niż walczyć</b> (kompleksowa współzależność).",real:"'Im więcej globalizacji, tym lepiej.' Kapitał nie ma narodowości — kraje muszą się dostosować.",mnemo:"Liberalizm: napędza <b>RYNEK</b>, priorytet = <b>EFEKTYWNOŚĆ</b>, państwo = rola <b>ograniczona</b>."},
      {title:"Realizm — 'liczą się państwa i siła'",body:"Najważniejsi aktorzy to <b>państwa</b>, a ich cel to <b>bezpieczeństwo i siła</b>. Globalizacja jest <b>narzędziem</b> zwiększania potęgi. Świat = system <b>rywalizujących państw</b>, nie współpracujących rynków. Trwa tylko, gdy zgadza się z interesem najsilniejszych.",real:"Wojny handlowe, sankcje, kontrola eksportu chipów, USA vs Chiny, friend-shoring. Bezpieczeństwo > tania cena.",mnemo:"Realizm: napędza <b>PAŃSTWO</b>, priorytet = <b>BEZPIECZEŃSTWO</b>, państwo = rola <b>kluczowa</b>."},
      {title:"Instytucjonalizm (neoliberalizm)",body:"Globalizacja generuje chaos — <b>instytucje</b> (ONZ, WTO, MFW, NATO) tworzą zasady i normy, dostarczają wiarygodnych informacji, zmniejszają ryzyko oszustwa. Państwa współpracują nie dlatego, że 'są dobre', ale bo <b>im się to opłaca</b>.",real:"Reguły > dobra wola. Instytucje to 'sędzia i tablica wyników', dzięki którym opłaca się grać fair."},
      {title:"Podejście krytyczne",body:"Globalizacja = rozszerzenie <b>kapitalizmu/neoliberalizmu</b> → pogłębia <b>nierówności</b>. Świat dzieli się na <b>centrum</b> (Zachód) i <b>peryferie</b>. Napędza ją kapitał (korporacje, rynki finansowe) i interesy elit; osłabia suwerenność biedniejszych.",real:"Outsourcing do tańszych krajów, niskie płace globalnego Południa, zyski w centrum, dominacja Big Tech."},
      {title:"Konstruktywizm — 'globalizacja jest tym, co o niej myślimy'",body:"Globalizacja <b>nie jest 'dana'</b> — jest tworzona przez <b>idee</b> (wolny handel), <b>normy</b> (prawa człowieka, klimat) i <b>przekonania</b> (świat bez granic). Interesy państw <b>nie są stałe</b>.",real:"Dlaczego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'? Bo zmieniło się to, jak o niej myślimy."}
     ],
     flashcards:[
      {t:"Liberalizm (teoria globalizacji)",d:"Globalizacja = naturalny, pozytywny efekt rynku i technologii. Napęd: technologia, rynek, kapitał. Prowadzi do konwergencji; współzależność skłania państwa do współpracy. Napędza rynek, priorytet efektywność, rola państwa ograniczona."},
      {t:"Realizm (teoria globalizacji)",d:"Państwa to główni aktorzy; cel = bezpieczeństwo i siła. Globalizacja to narzędzie potęgi. Napędza państwo, priorytet bezpieczeństwo, rola państwa kluczowa. Tłumaczy wojny handlowe, sankcje, friend-shoring."},
      {t:"Instytucjonalizm / neoliberalizm",d:"Instytucje (ONZ, WTO, MFW, NATO) porządkują chaos globalizacji, dostarczają informacji i zmniejszają ryzyko oszustwa. Państwa współpracują, bo to się opłaca (zyski + bezpieczeństwo)."},
      {t:"Podejście krytyczne",d:"Globalizacja = rozszerzenie kapitalizmu/neoliberalizmu, pogłębia nierówności. Podział świata na centrum i peryferie; napędza ją kapitał i interesy elit. Tłumaczy nierówności, ale ignoruje wzrost gospodarczy."},
      {t:"Konstruktywizm",d:"Globalizacja jest społecznie konstruowana przez idee, normy i przekonania; interesy państw nie są stałe. Świat konstruktywistów to świat idei."},
      {t:"Liberalizm vs realizm (tabela)",d:"Co napędza? rynek vs państwo. Co ma priorytet? efektywność vs bezpieczeństwo. Rola państwa? ograniczona vs kluczowa."},
      {t:"Krytyka liberalizmu",d:"Tłumaczy wzrost handlu po 1945, sukces globalnych firm i tygrysów azjatyckich, ALE: ignoruje politykę, zakłada, że wszyscy korzystają, nie przewidział kryzysu 2008 ani wojen handlowych."}
     ],
     quiz:[
      {q:"Według liberalizmu globalizację napędza przede wszystkim:",a:["państwo i jego siła","rynek, technologia i kapitał","instytucje międzynarodowe","interesy elit i kapitał (nierówności)"],c:1,e:"Liberalizm: rynek + technologia + kapitał; priorytet efektywność, rola państwa ograniczona."},
      {q:"Realizm najlepiej tłumaczy:",a:["konwergencję biednych krajów","wojny handlowe, sankcje, kontrolę eksportu technologii, friend-shoring","zanik roli państw","świat idei i norm"],c:1,e:"Realizm: liczą się państwa, siła i bezpieczeństwo — stąd sankcje i wojny handlowe."},
      {q:"Podejście krytyczne opisuje globalizację jako:",a:["naturalny, korzystny proces dla wszystkich","dominację centrum (Zachodu) nad peryferiami, pogłębiającą nierówności","chaos porządkowany przez instytucje","zbiór idei i przekonań"],c:1,e:"Krytycyzm: kapitalizm + podział centrum–peryferie + nierówności."},
      {q:"Kluczowa teza konstruktywizmu:",a:["globalizacja jest 'dana' i niezmienna","globalizacja jest konstruowana przez idee, normy i przekonania; interesy państw nie są stałe","liczy się tylko rynek","liczy się tylko siła militarna"],c:1,e:"Dlatego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'."},
      {q:"Wg instytucjonalizmu państwa współpracują, ponieważ:",a:["są z natury dobre","współpraca instytucjonalna po prostu im się opłaca (zyski i bezpieczeństwo)","zmusza je do tego jedno mocarstwo","nie mają wojska"],c:1,e:"Instytucje zmniejszają ryzyko oszustwa i dostarczają informacji — kooperacja się opłaca."}

    /* ---------------- L4 ---------------- */
    {id:"l4",title:"Polityka i global governance",emoji:"🏛️",
     feed:[
      {title:"Państwa wracają do gry",body:"Po dekadach 'rynek załatwi wszystko' państwo znów sięga po narzędzia: <b>regulacje, polityka handlowa, sankcje, subsydia, bariery handlowe, kontrole eksportu</b>.",real:"Widmo neoliberalizmu odchodzi. Rząd znów ustawia stół, a nie tylko sprząta po rynku."},
      {title:"Global governance — co to jest",body:"<b>Globalne zarządzanie</b> = sposób koordynowania zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy <b>przekraczające granice</b> (klimat, handel, zdrowie, prawa człowieka).",real:"Nie ma rządu światowego, ale są 'reguły gry'. Zarządzanie bez jednego szefa.",mnemo:"Global governance = <b>rządzenie bez rządu</b> — sieć, nie hierarchia."},
      {title:"Usieciowienie zamiast hierarchii",body:"Cecha global governance: <b>rezygnacja z hierarchii</b>. Więzi wertykalne ustępują <b>horyzontalnym</b> — współpracują autonomiczne podmioty. Rośnie rola prywatnych ciał (ISO, ICANN, IASB, FSC) i korporacji ponadnarodowych.",real:"Świat rządzony jak sieć znajomości, nie jak wojsko. Nikt nie wydaje rozkazów — wszyscy się dogadują (albo nie)."},
      {title:"Rola instytucji — 4 funkcje",body:"🛡️ <b>Stabilność</b>: MFW (pożyczki), Bank Światowy, Komitet Bazylejski (normy dla banków).<br>🔮 <b>Przewidywalność</b>: WTO (zasady handlu), OECD (podatki), IFRS/IASB (rachunkowość).<br>🤝 <b>Koordynacja</b>: WHO (pandemie), UNFCCC (klimat), G20 (polityka makro).<br>⚖️ <b>Rozwiązywanie sporów</b>: WTO DSU, ICSID (arbitraż inwestycyjny), MTS w Hadze.",mnemo:"4 funkcje: <b>Stabilność · Przewidywalność · Koordynacja · Spory</b>."},
      {title:"Kryzys instytucji — paraliż WTO",body:"<b>USA</b>: WTO nie radzi sobie z krajem o gospodarce nie w pełni rynkowej (subsydia Chin). <b>Chiny</b>: USA łamią zasady, nakładając jednostronne cła. <b>Fakt</b>: USA <b>zablokowały obsadzanie sędziów odwoławczych (2019–2023)</b> → WTO działa, ale nie egzekwuje odwołań.",real:"Sędzia jest, ale bez asystentów VAR — wyroki zapadają, tylko nikt ich nie wdroży. Instytucja słabnie.",mnemo:"Kryzys: <b>paraliż WTO + unilateralizm państw + spadek zaufania</b>."},
      {title:"Plurilateralizm i nowe bloki",body:"Obok WTO rosną kluby: <b>BRICS</b> (Brazylia, Rosja, Indie, Chiny, RPA), <b>QUAD</b> (USA, Japonia, Indie, Australia), <b>SCO</b> (Szanghajska Org. Współpracy), <b>G20</b> jako 'rząd globalizacji'. Bloki handlowe: RCEP, USMCA, IPEF, UE–Mercosur.",real:"Zamiast jednej wielkiej ligi (WTO) — coraz więcej mniejszych klubów 'dla swoich'."}
     ],
     flashcards:[
      {t:"Global governance (globalne zarządzanie)",d:"Koordynacja zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy przekraczające granice (klimat, handel, zdrowie). Nie ma rządu światowego, ale są globalne reguły."},
      {t:"Usieciowienie global governance",d:"Rezygnacja z hierarchii — więzi wertykalne ustępują horyzontalnym; współpracują autonomiczne podmioty, rośnie rola ciał prywatnych (ISO, ICANN, IASB, FSC) i korporacji."},
      {t:"4 funkcje instytucji globalnych",d:"Stabilność (MFW, Bank Światowy, Bazylea), przewidywalność (WTO, OECD, IFRS), koordynacja (WHO, UNFCCC, G20), rozwiązywanie sporów (WTO DSU, ICSID, MTS w Hadze)."},
      {t:"MFW vs Bank Światowy",d:"MFW = pożyczki stabilizacyjne i nadzór makroekonomiczny (bezpiecznik walutowy/finansowy). Bank Światowy = finansowanie rozwoju."},

      {t:"Plurilateralizm",d:"Wielostronność w węższym gronie — kluby zamiast globalnej organizacji: BRICS, QUAD, RIC, SCO. Także bloki handlowe: RCEP, USMCA, IPEF."},
      {t:"Kryzys instytucji",d:"Trzy objawy: paraliż WTO, unilateralizm państw (działanie w pojedynkę), spadek zaufania do instytucji."}

      {title:"USA — dolar, Big Tech, sankcje",body:"Siła USA: <b>dominacja dolara</b> (efekt dolara — mocny USD czyni świat biedniejszym i droższy import), <b>Big Tech</b> (Google, Apple, Microsoft, Amazon), <b>kontrola technologii</b> (eksport chipów do Chin), <b>sankcje finansowe</b> (SWIFT), chmura.",real:"Dolar to broń. Wyłączenie ze SWIFT boli bardziej niż niejedna sankcja celna."},

      {title:"Konkurencyjność państwa",body:"<b>Zdolność gospodarki do tworzenia trwałego wzrostu dobrobytu i przewag międzynarodowych</b> — konkurowania na rynkach przy utrzymaniu wysokiego poziomu życia. Buduje ją: <b>technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność państwa i prawa</b>.",real:"Konkurencyjność to NIE samo PKB. Coraz bardziej zależy od odporności, technologii i bezpieczeństwa (np. półprzewodniki)."},
      {title:"Polska: hub produkcyjny i pułapka średniego dochodu",body:"Polska (OECD TiVA) = silnie wpięta w globalne łańcuchy jako <b>producent/montażysta</b>, głównie w niemieckim hubie. Dużo <b>zagranicznej</b> wartości dodanej w eksporcie, mało własnej. <b>Pułapka średniego dochodu</b>: po szybkim wzroście na taniej pracy kraj traci impet i nie awansuje do grona bogatych. Nadzieja: <b>konwergencja</b> i innowacyjność.",real:"Jesteśmy montownią Europy. Wyzwanie to AWANS w łańcuchu wartości (własne technologie/marki), nie ucieczka z niego.",mnemo:"Pułapka średniego dochodu = <b>tania praca się wypaliła, a innowacji brak</b>."}

      {t:"Konkurencyjność państwa",d:"Zdolność gospodarki do trwałego wzrostu dobrobytu i przewag międzynarodowych przy wysokim poziomie życia. Buduje ją: technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność."},

    {id:"l6",title:"Wymiar społeczno-kulturowy",emoji:"🎭",
     feed:[
      {title:"Wymiar społeczny i 'problem szczęścia'",body:"Globalizacja tworzy <b>społeczeństwo informacyjne</b>, w którym rządzi <b>klasa kreatywna</b>, wiedza i kapitał intelektualny. Paradoks Easterlina: wyższy dochód zwiększa satysfakcję, ale <b>po ok. 10 000 USD</b> dodatkowy dochód niewiele już zmienia.",real:"Kasa daje szczęście — do pewnego progu. Potem wykres się wypłaszcza. Wzorce konsumpcji z bogatych krajów rodzą alienację i frustrację."},
      {title:"Jakość życia i wskaźniki",body:"<b>Jakość życia</b> = stopień zaspokojenia potrzeb materialnych i niematerialnych. Mierniki: <b>HDI</b> (ONZ: dochód + długość życia + lata nauki), <b>World Happiness Index</b>, Quality of Life Index (Numbeo). Z HDI narodziła się <b>ekonomia szczęścia</b>.",real:"HDI to 'PKB z duszą' — dorzuca zdrowie i edukację do samych pieniędzy."},
      {title:"Nie ufaj rankingom bezkrytycznie",body:"Problemy wskaźników: 📏 <b>trudność pomiaru</b> (HDI używa średnich lat nauki jako proxy jakości edukacji), 🎯 <b>uprzedzenia i wagi</b> autorów (im złożniejszy indeks, tym więcej arbitralnych decyzji), 🎭 <b>działania 'pod ranking'</b> (reformy poprawiające wynik, ale nie życie ludzi).",real:"Ranking to model, nie prawda objawiona. Rządy potrafią 'grać pod tabelkę' zamiast realnie poprawiać życie."},
      {title:"Migracje i drenaż mózgów",body:"Migracje zarobkowe, studenci, globalny rynek pracy. <b>Drenaż mózgów</b>: najlepiej wykształceni i przedsiębiorczy emigrują do <b>centrów globalizacji</b> — oni zyskują, ale kraj pochodzenia <b>traci kapitał intelektualny</b>. Ryzyka: napięcia społeczne, kryzys tożsamości.",real:"Twój najzdolniejszy znajomy z roku wyjeżdża do Londynu. On wygrywa, Polska traci mózg."},
      {title:"Globalna wioska i kultura",body:"<b>Marshall McLuhan</b>: elektroniczna współzależność czyni świat <b>globalną wioską</b> (natychmiastowa komunikacja, wspólne trendy — niekoniecznie harmonia). Kultura: <b>HOMOGENIZACJA</b> (McDonald's, Netflix) vs <b>HYBRYDYZACJA</b> (K-pop, anime, lokalne wersje globalnych produktów).",real:"Świat = jedna wioska z wi-fi. Ale lokalne tożsamości nie znikają — mieszają się (hybrydyzacja)."},
      {title:"Soft power i antyglobalizm",body:"<b>Soft power</b> — zdolność zdobywania wpływów <b>atrakcyjnością</b> (film, muzyka, kuchnia, moda), nie przymusem. Nowi eksporterzy kultury: USA, <b>Korea Płd.</b>, Japonia, Indie. <b>Antyglobalizm</b> — ruch przeciw dominacji korporacji, nierównościom i narzucaniu reform przez MFW/BŚ/WTO.",real:"K-pop i Hollywood to broń miękka. A social media rozkręciły globalizację kultury szybciej niż handel — kosztem baniek i polaryzacji."}
     ],
     flashcards:[
      {t:"Społeczeństwo informacyjne",d:"Społeczeństwo skutecznie komunikujące się z otoczeniem, w którym wiodącą rolę odgrywa klasa kreatywna, kapitał intelektualny, wiedza i twórczość jako źródło bogactwa."},
      {t:"Problem szczęścia (paradoks Easterlina)",d:"Wyższy dochód zwiększa satysfakcję życiową, ale po przekroczeniu ok. 10 000 USD dodatkowy wzrost dochodu w niewielkim stopniu podnosi satysfakcję społeczeństwa."},
      {t:"HDI (Human Development Index)",d:"Wskaźnik ONZ łączący dochód, długość życia i liczbę lat nauki. Zapoczątkował porównywanie rozwoju społecznego i ekonomię szczęścia; efekt: World Happiness Index."},
      {t:"Ograniczenia rankingów/wskaźników",d:"Trudność pomiaru (miary zastępcze, np. lata nauki jako proxy jakości edukacji), uprzedzenia i arbitralne wagi autorów, działania krajów 'pod ranking' zamiast realnej poprawy życia."},
      {t:"Drenaż mózgów (brain drain)",d:"Emigracja najlepiej wykształconych, zdolnych i przedsiębiorczych do centrów globalizacji. Emigranci zyskują, ale kraj pochodzenia traci kapitał intelektualny."},
      {t:"Globalna wioska (McLuhan)",d:"Elektroniczna współzależność kształtuje świat na podobieństwo jednej wioski: natychmiastowa komunikacja, wspólna przestrzeń medialna, globalne trendy — niekoniecznie harmonia."},
      {t:"Homogenizacja vs hybrydyzacja",d:"Homogenizacja = ujednolicanie kultury (McDonald's, Netflix, TikTok). Hybrydyzacja = mieszanie i lokalne adaptacje globalnych wzorców (K-pop, anime, lokalne wersje produktów)."},
      {t:"Soft power",d:"Zdolność państwa do zdobywania wpływów i sojuszników przez atrakcyjność kulturową, polityczną i ideową (film, muzyka, kuchnia, moda), a nie przymus. Eksporterzy: USA, Korea Płd., Japonia, Indie."},
      {t:"Antyglobalizm",d:"Ruch społeczno-polityczny przeciw globalizacji (zwł. ekonomicznej i korporacyjnej): krytyka dominacji korporacji, nierówności, wyzysku słabszych i reform narzucanych przez MFW, Bank Światowy i WTO."}

      {q:"HDI (ONZ) łączy:",a:["tylko PKB per capita","dochód, długość życia i liczbę lat nauki","emisje CO₂ i inflację","liczbę turystów i eksport"],c:1,e:"HDI = 'PKB z duszą' — dorzuca zdrowie i edukację."},
      {q:"Drenaż mózgów oznacza, że:",a:["kraj zyskuje specjalistów z zagranicy","najzdolniejsi emigrują do centrów globalizacji, a kraj pochodzenia traci kapitał intelektualny","spada liczba studentów","rośnie bezrobocie wśród niewykształconych"],c:1,e:"Emigrant zyskuje, kraj wysyłający traci mózgi."},
      {q:"Homogenizacja i hybrydyzacja kultury to:",a:["dwa słowa na to samo","ujednolicanie (McDonald's/Netflix) vs mieszanie i lokalne adaptacje (K-pop/anime)","nazwy instytucji ONZ","rodzaje ceł"],c:1,e:"Kultura i się ujednolica, i tworzy hybrydy — jednocześnie."},

    {id:"l7",title:"Ekonomia i regionalizacja",emoji:"🔗",
     feed:[
      {title:"Wymiar ekonomiczny i GVC",body:"<b>Wymiar ekonomiczny</b> = rosnąca integracja gospodarek przez handel, inwestycje zagraniczne, przepływy finansowe i <b>globalne łańcuchy wartości (GVC)</b> — produkcja jednego wyrobu rozproszona po wielu krajach.",real:"Twój telefon to ONZ w kieszeni: projekt w USA, chip z Tajwanu, montaż w Chinach, minerały z Afryki."},
      {title:"Od efektywności do odporności",body:"Globalizacja przechodzi <b>od logiki efektywności do logiki bezpieczeństwa</b>. Nowe priorytety: <b>od just-in-time do just-in-case</b>, od 'najtańszy dostawca' do 'najbardziej niezawodny', od globalnych łańcuchów do <b>regionalnych ekosystemów</b>.",real:"COVID i Ever Given nauczyły firmy: taniej ≠ pewniej. Lepiej mieć bufor niż stać z pustą fabryką.",mnemo:"Nowy paradygmat: <b>Just-in-CASE</b>, nie just-in-time."},
      {title:"Dywersyfikacja — 5 wymiarów",body:"Budowanie odporności = zmniejszanie uzależnienia od jednego kraju/dostawcy. Dywersyfikuj: 🌍 <b>geograficznie</b>, 🏭 <b>dostawców</b> (multi/dual sourcing), 🚢 <b>transport/logistyka</b>, ⚙️ <b>technologie/komponenty</b>, 🛒 <b>klientów i rynki zbytu</b>.",real:"Nie trzymaj wszystkich jajek w jednym chińskim koszyku. Rozłóż ryzyko na kilka."},
      {title:"Cztery '-shoringi'",body:"<b>Offshoring</b> — produkcja do krajów niskokosztowych (stara logika).<br><b>Nearshoring</b> — skracanie dystansu geograficznego.<br><b>Reshoring</b> — powrót produkcji do kraju.<br><b>Friend-shoring</b> — do państw sojuszniczych / stabilnych politycznie.<br>Przykłady: półprzewodniki, farmacja, motoryzacja.",real:"Off = daleko i tanio. Near = bliżej. Re = do domu. Friend = do kumpli. Trend idzie od 'off' ku reszcie.",mnemo:"<b>OFF → NEAR → RE → FRIEND</b>: coraz bliżej i coraz bezpieczniej."},
      {title:"Regionalizacja i bloki handlowe",body:"Gospodarka staje się bardziej <b>regionalna</b>. Kluczowe bloki: <b>UE</b>, <b>ASEAN</b> (Azja Płd.-Wsch.), <b>USMCA</b> (USA-Meksyk-Kanada, zastąpiło NAFTA), <b>Mercosur</b> (Ameryka Płd.), <b>RCEP</b> (Azja-Pacyfik — <b>największa strefa wolnego handlu świata</b>).",real:"Zamiast jednego globalnego rynku — kilka wielkich 'dzielnic'. RCEP to nowy rekordzista.",mnemo:"UE · ASEAN · USMCA · Mercosur · RCEP (największy)."},
      {title:"Deglobalizacja — dlaczego regiony rosną",body:"Napęd deglobalizacji: kryzys 2008, Brexit, pandemia, <b>trumpizm</b> ('amerykanizm, nie globalizm'), wojna w Ukrainie, napięcia USA–Chiny, <b>splinternet</b> (podzielony internet). Regionalizacja rośnie przez: <b>bezpieczeństwo, krótsze łańcuchy, geopolitykę i odporność</b>.",real:"Świat nie tyle się rozłącza, co przełącza na tryb 'regionalny i bezpieczny'. Multipolarność: USA, Chiny, UE, Indie, Global South."}
     ],
     flashcards:[
      {t:"Globalne łańcuchy wartości (GVC)",d:"Rozproszenie produkcji jednego wyrobu po wielu krajach (projekt, komponenty, montaż w różnych miejscach). Rdzeń ekonomicznego wymiaru globalizacji."},
      {t:"Od efektywności do bezpieczeństwa",d:"Motyw przewodni: od just-in-time do just-in-case, od 'najtańszy dostawca' do 'najbardziej niezawodny', od globalnych łańcuchów do regionalnych ekosystemów technologicznych."},
      {t:"Dywersyfikacja łańcuchów — 5 wymiarów",d:"Geograficzna, dostawców (multi/dual sourcing), transportu i logistyki, technologii i komponentów, klientów i rynków zbytu. Cel: mniejsze uzależnienie i odporność na szoki."},
      {t:"Offshoring / Nearshoring / Reshoring / Friend-shoring",d:"Offshoring = produkcja w krajach niskokosztowych; nearshoring = skracanie dystansu; reshoring = powrót do kraju; friend-shoring = do państw sojuszniczych/stabilnych."},
      {t:"RCEP",d:"Regionalne Kompleksowe Partnerstwo Gospodarcze — Azja i Pacyfik (ASEAN + Chiny, Japonia, Korea Płd., Australia, Nowa Zelandia). Największa strefa wolnego handlu na świecie."},
      {t:"USMCA i Mercosur",d:"USMCA = porozumienie USA–Meksyk–Kanada (zastąpiło NAFTA). Mercosur = Wspólny Rynek Południa (Brazylia, Argentyna, Urugwaj, Paragwaj)."},
      {t:"Slowbalisation / deglobalizacja",d:"Spowolnienie i cofanie integracji po 2008: kryzys finansowy, Brexit, pandemia, trumpizm, wojna w Ukrainie, napięcia USA–Chiny, splinternet."},
      {t:"Splinternet",d:"Podzielony, rozfragmentowany internet — efekt regionalizacji i geopolityki (różne regulacje, ekosystemy i ograniczenia w różnych blokach)."}
     ],
     quiz:[
      {q:"'Od just-in-time do just-in-case' opisuje przejście:",a:["od odporności do efektywności","od maksymalnej efektywności do maksymalnej odporności łańcuchów dostaw","od handlu do autarkii","od regionalizacji do globalizacji"],c:1,e:"Nowy paradygmat: bufory i niezawodność ważniejsze niż sama taniość."},

      {q:"Dlaczego rośnie znaczenie regionalizacji?",a:["bo znika bezpieczeństwo jako priorytet","przez bezpieczeństwo, krótsze łańcuchy dostaw, geopolitykę i odporność gospodarki","bo spadły ceny transportu","bo zniesiono wszystkie cła"],c:1,e:"Regiony = krótsze, pewniejsze łańcuchy w niestabilnym, multipolarnym świecie."}
     ]}

<script>
/* ============================================================
   NAUKA — silnik wieloprzedmiotowej platformy do nauki
   Dane przedmiotów rejestrują się w window.SUBJECTS (patrz data/*.js)
   Tryby: Ścieżka (Duolingo) + Fiszki + Quiz + Egzamin + Info
   ============================================================ */
(function(){
"use strict";

/* ---------- bezpieczny storage (iOS file:// potrafi rzucać) ---------- */
const STORE=(()=>{try{const ls=globalThis['localStorage'];const t='__nk_t';ls.setItem(t,'1');ls.removeItem(t);return ls;}catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();
const PKEY='nauka_progress_v1';
let PROGRESS=(()=>{try{return JSON.parse(STORE.getItem(PKEY)||'{}');}catch(e){return {};}})();
function saveProgress(){try{STORE.setItem(PKEY,JSON.stringify(PROGRESS));}catch(e){}}
function subjState(id){ if(!PROGRESS[id])PROGRESS[id]={xp:0,levels:{}}; return PROGRESS[id]; }

/* ---------- daily streak (osobny klucz, nie rusza postępów) ---------- */
const MKEY='nauka_meta_v1';
let META=(()=>{try{return JSON.parse(STORE.getItem(MKEY)||'{}');}catch(e){return {};}})();
function saveMeta(){try{STORE.setItem(MKEY,JSON.stringify(META));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayDiff(a,b){const pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);}
/* aktualna „żywa” seria do wyświetlenia (0 jeśli wygasła) */
function streakDisplay(){ if(!META.lastDay)return 0; const d=dayDiff(META.lastDay,todayStr()); return (d===0||d===1)?(META.streak||0):0; }
/* odnotuj aktywność dziś; zwraca true gdy seria została dziś przedłużona/zaczęta */
function touchStreak(){
  const t=todayStr();
  if(META.lastDay===t)return false; // już policzone dzisiaj
  if(META.lastDay){const d=dayDiff(META.lastDay,t); META.streak=(d===1)?(META.streak||0)+1:1;}
  else META.streak=1;
  META.lastDay=t; META.best=Math.max(META.best||0,META.streak); saveMeta();
  return true;
}

/* ---------- helpers ---------- */
const SUBJECTS = (window.SUBJECTS||[]);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>[...a].sort(()=>Math.random()-0.5);
const keys=['A','B','C','D','E'];
let app, current=null, curTab='path';

function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1500);}
function addXP(id,n){const s=subjState(id);s.xp+=n;saveProgress();const ext=touchStreak();updateXP();updateStreakUI();if(ext&&META.streak>1)setTimeout(()=>toast('🔥 seria '+META.streak+' dni z rzędu!'),1600);}
function updateXP(){const x=document.getElementById('xpNum');if(x&&current)x.textContent=subjState(current.id).xp;}
function updateStreakUI(){const n=streakDisplay();document.querySelectorAll('[id="streakNum"]').forEach(e=>e.textContent=n);}

/* pula wszystkich elementów danego przedmiotu (ze wszystkich poziomów) */
function allCards(s){return s.levels.flatMap(l=>(l.flashcards||[]).map(c=>({...c,lvl:l.title})));}
function allQuiz(s){return s.levels.flatMap(l=>(l.quiz||[]).map(q=>({...q,lvl:l.title})));}
function allFeed(s){return s.levels.flatMap(l=>(l.feed||[]).map(f=>({...f,lvl:l.title})));}

function applyTheme(s){
  const r=document.documentElement.style;
  r.setProperty('--accent', s.accent || 'linear-gradient(135deg,#ff2d95,#a855f7,#22d3ee)');
  r.setProperty('--accent2', s.accent2 || '#22d3ee');
}

/* ============================================================ HOME */
function renderHome(){
  current=null;
  document.documentElement.style.setProperty('--accent','linear-gradient(135deg,#ff2d95,#a855f7,#22d3ee)');
  document.documentElement.style.setProperty('--accent2','#22d3ee');
  app.innerHTML='';
  const top=el('div','topbar');
  top.appendChild(el('div','logo','📚 <span class="g">NAUKA</span>'));
  let totXP=Object.values(PROGRESS).reduce((a,s)=>a+(s.xp||0),0);
  const pills=el('div','pills');
  pills.appendChild(el('div','streak',`🔥 <span id="streakNum">${streakDisplay()}</span> <small>dni</small>`));
  pills.appendChild(el('div','streak',`⚡ <span>${totXP}</span> <small>xp</small>`));
  top.appendChild(pills);
  app.appendChild(top);

  const sc=el('div','screen active');const scroll=el('div','scroll');
  const hero=el('div','hero');
  hero.innerHTML='<h1>Wybierz przedmiot 👇</h1><p>Ucz się w stylu gen-z: poziomy jak w Duolingo, fiszki, quizy i symulacja egzaminu. Wszystko z prezek z zajęć.</p>';
  scroll.appendChild(hero);

  SUBJECTS.forEach(s=>{
    const st=subjState(s.id);
    const total=s.levels.length;
    const done=s.levels.filter(l=>st.levels[l.id]&&st.levels[l.id].done).length;
    const pct=total?Math.round(done/total*100):0;
    const card=el('div','subjcard');
    card.style.setProperty('--sa', s.accent);
    card.innerHTML=`<div class="subjemoji">${s.emoji}</div>
      <div class="subjmeta">
        <h3>${s.name}</h3>
        <div class="sub">${s.tagline||''}</div>
        <div class="subjprog"><div class="bar"><i style="width:${pct}%"></i></div><small>${done}/${total} poziomów</small></div>
      </div><div class="chev">›</div>`;
    card.onclick=()=>openSubject(s.id);
    scroll.appendChild(card);
  });
  const add=el('div','addcard');
  add.innerHTML='<div class="subjemoji">＋</div><div>Kolejny przedmiot?<br><span style="font-size:12.5px;font-weight:600">Dodaj plik w <b>data/</b> (patrz README) i pojawi się tutaj.</span></div>';
  scroll.appendChild(add);
  sc.appendChild(scroll);app.appendChild(sc);
}

/* ============================================================ SUBJECT shell */
function openSubject(id){
  current=SUBJECTS.find(s=>s.id===id);
  if(!current)return renderHome();
  applyTheme(current);
  curTab='path';
  renderSubject();
}
function renderSubject(){
  const s=current;
  try{clearInterval(cwInt);clearInterval(exInt);}catch(e){}
  app.innerHTML='';
  const top=el('div','topbar');
  const back=el('button','backbtn','‹');back.onclick=renderHome;
  top.appendChild(back);
  top.appendChild(el('div','logo',`${s.emoji} <span class="g">${s.short||s.name}</span>`));
  const pills=el('div','pills');
  pills.appendChild(el('div','streak',`🔥 <span id="streakNum">${streakDisplay()}</span> <small>dni</small>`));
  pills.appendChild(el('div','streak',`⚡ <span id="xpNum">${subjState(s.id).xp}</span> <small>xp</small>`));
  top.appendChild(pills);
  app.appendChild(top);

  const tabs=el('div','subtabs');
  [['path','🗺️ Ścieżka'],['fiszki','🎴 Fiszki'],['quiz','🧠 Quiz'],['cwicz','✍️ Ćwiczenia'],['egzamin','🎯 Egzamin'],['info','📋 Info']].forEach(([k,lab])=>{
    const b=el('div','subtab'+(curTab===k?' active':''),lab);
    b.onclick=()=>{curTab=k;renderSubject();};
    tabs.appendChild(b);
  });
  app.appendChild(tabs);

  const sc=el('div','screen active');sc.id='subjscreen';
  app.appendChild(sc);
  if(curTab==='path')renderPath(sc);
  else if(curTab==='fiszki')renderFiszki(sc);
  else if(curTab==='quiz')renderQuiz(sc);
  else if(curTab==='cwicz')renderCwicz(sc);
  else if(curTab==='egzamin')renderEgzamin(sc);
  else if(curTab==='info')renderInfo(sc);

  // toast + lesson container
  app.appendChild(el('div','toast',''));app.lastChild.id='toast';
  const lesson=el('div','lesson');lesson.id='lesson';app.appendChild(lesson);
}

/* ---------- ŚCIEŻKA (Duolingo) ---------- */
function levelUnlocked(s,idx){
  if(idx===0)return true;
  const prev=s.levels[idx-1];
  const st=subjState(s.id);
  return !!(st.levels[prev.id]&&st.levels[prev.id].done);
}
function renderPath(sc){
  const s=current;const st=subjState(s.id);
  const wrap=el('div','scroll');
  const path=el('div','path');
  s.levels.forEach((lv,i)=>{
    if(i>0){const c=el('div','connector'+( (st.levels[s.levels[i-1].id]||{}).done?' done':''));path.appendChild(c);}
    const unlocked=levelUnlocked(s,i);
    const done=(st.levels[lv.id]||{}).done;
    const stars=(st.levels[lv.id]||{}).stars||0;
    const node=el('div','pathnode pathzig');
    const cls = done?'node-done':(unlocked?'node-open':'node-lock');
    const btn=el('button','nodebtn '+cls, done?'✓':(unlocked?(lv.emoji||'📘'):'🔒'));
    if(done){btn.innerHTML+=`<span class="stars">${'⭐'.repeat(stars)}${'·'.repeat(Math.max(0,3-stars))}</span>`;}
    if(unlocked){btn.onclick=()=>startLesson(lv);}else{btn.onclick=()=>toast('Najpierw zalicz poprzedni poziom 🔒');}
    node.appendChild(btn);
    node.appendChild(el('div','nodelabel',`${lv.title}<small>${(lv.quiz||[]).length} pytań · ${(lv.flashcards||[]).length} fiszek</small>`));
    path.appendChild(node);
  });
  wrap.appendChild(path);sc.appendChild(wrap);
}

/* ---------- LEKCJA: feed -> quiz bramka ---------- */
let lessonState=null;
function startLesson(lv){
  lessonState={lv,phase:'feed',feedIdx:0,quiz:shuffle(lv.quiz||[]).slice(0,Math.min(6,(lv.quiz||[]).length)),qIdx:0,score:0,answered:false};
  if(!lessonState.quiz.length){ // brak quizu — sam feed
    lessonState.quiz=[];
  }
  const L=document.getElementById('lesson');L.classList.add('open');
  renderLesson();
}
function closeLesson(){document.getElementById('lesson').classList.remove('open');renderSubject();}
function renderLesson(){
  const L=document.getElementById('lesson');const s=current;const ls=lessonState;const lv=ls.lv;
  const totalFeed=(lv.feed||[]).length;
  let progPct;
  if(ls.phase==='feed') progPct = totalFeed?ls.feedIdx/(totalFeed+ls.quiz.length)*100:0;
  else progPct = (totalFeed+ls.qIdx)/(totalFeed+ls.quiz.length)*100;
  L.innerHTML='';
  const head=el('div','lessonhead');
  const x=el('button','x','✕');x.onclick=closeLesson;head.appendChild(x);
  head.appendChild(el('div','bar',`<i style="width:${progPct}%"></i>`));
  L.appendChild(head);
  const body=el('div','lessonbody');L.appendChild(body);

  if(ls.phase==='feed'){
    const f=lv.feed[ls.feedIdx];
    const fw=el('div');fw.style.cssText='flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto';
    const card=el('div','fcard');
    card.innerHTML=`<span class="tag">${lv.title} · ${ls.feedIdx+1}/${totalFeed}</span>
      <div class="ftitle">${f.title}</div><div class="fbody">${f.body}</div>
      ${f.real?`<div class="real"><span class="lbl">po ludzku 🗣️</span>${f.real}</div>`:''}
      ${f.mnemo?`<div class="mnemo"><span class="lbl">zapamiętaj 🧠</span>${f.mnemo}</div>`:''}`;
    fw.appendChild(card);body.appendChild(fw);
    const foot=el('div','lessonfoot');
    const b=el('button','pill', ls.feedIdx+1<totalFeed?'dalej →':(ls.quiz.length?'lecimy z quizem 🧠':'zakończ ✅'));
    b.onclick=()=>{ if(ls.feedIdx+1<totalFeed){ls.feedIdx++;renderLesson();} else if(ls.quiz.length){ls.phase='quiz';renderLesson();} else finishLesson(); };
    foot.appendChild(b);L.appendChild(foot);
  } else if(ls.phase==='quiz'){
    if(ls.qIdx>=ls.quiz.length)return finishLesson();
    const q=ls.quiz[ls.qIdx];ls.answered=false;
    const qc=el('div','qcard');qc.style.cssText='flex:1;overflow-y:auto';
    qc.innerHTML=`<span class="tag">pytanie ${ls.qIdx+1}/${ls.quiz.length}</span>
      <div class="qq">${q.q}</div>
      <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="explain" id="lexp"><b>czemu:</b> ${q.e||''}</div>`;
    body.appendChild(qc);
    const foot=el('div','lessonfoot');
    const nb=el('button','pill qnext','dalej →');nb.id='lnext';
    nb.onclick=()=>{ls.qIdx++;renderLesson();};
    foot.appendChild(nb);L.appendChild(foot);
    qc.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      if(ls.answered)return;ls.answered=true;const i=+o.dataset.i;
      qc.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');else x.classList.add('dim');});
      if(i===q.c){ls.score++;addXP(s.id,5);toast('GIT +5xp 🟢');}else{toast('mid, czytaj wyjaśnienie 👇');}
      document.getElementById('lexp').classList.add('show');
      const nx=document.getElementById('lnext');nx.classList.add('show');nx.textContent=(ls.qIdx+1>=ls.quiz.length)?'zobacz wynik 🏁':'dalej →';
    });
  }
}
function finishLesson(){
  const s=current;const ls=lessonState;const lv=ls.lv;
  const total=ls.quiz.length||1;const pct=ls.quiz.length?Math.round(ls.score/ls.quiz.length*100):100;
  const stars = pct>=90?3:(pct>=70?2:(pct>=50?1:0));
  const passed = ls.quiz.length?pct>=50:true;
  const st=subjState(s.id);const prev=st.levels[lv.id]||{};
  if(passed){
    st.levels[lv.id]={done:true,stars:Math.max(stars,prev.stars||0),best:Math.max(pct,prev.best||0)};
    if(!prev.done)addXP(s.id,15);
    saveProgress();
  }
  const L=document.getElementById('lesson');
  const emoji = !passed?'😵':(pct>=90?'👑':pct>=70?'🔥':'✅');
  const verdict = !passed?'Poniżej 50% — poziom niezaliczony. Przejedź feed jeszcze raz i spróbuj ponownie, dasz radę.':
    (pct>=90?'Mistrzostwo. Trzy gwiazdki, profesor by płakał ze szczęścia.':pct>=70?'Solidnie! Poziom zaliczony, lecimy dalej.':'Zaliczone na styk — wróć kiedyś po więcej gwiazdek.');
  L.innerHTML=`<div class="lessonhead"><button class="x" id="lx">✕</button><div class="bar"><i style="width:100%"></i></div></div>
   <div class="lessonbody"><div class="result">
     <div class="big">${emoji}</div>
     <h2>${lv.title}</h2>
     ${ls.quiz.length?`<div class="score">Trafione <b>${ls.score}/${ls.quiz.length}</b> (${pct}%) ${passed?'· '+'⭐'.repeat(stars):''}</div>`:''}
     <p>${verdict}</p>
   </div></div>
   <div class="lessonfoot">${passed?'<button class="pill" id="lcont">dalej na ścieżkę 🗺️</button>':'<button class="pill" id="lretry">spróbuj jeszcze raz 🔁</button>'}</div>`;
  document.getElementById('lx').onclick=closeLesson;
  const cont=document.getElementById('lcont');if(cont)cont.onclick=closeLesson;
  const retry=document.getElementById('lretry');if(retry)retry.onclick=()=>startLesson(lv);
}

/* ---------- FISZKI (cały przedmiot, filtr po poziomach) ---------- */
let fState=null;
function renderFiszki(sc){
  const s=current;
  if(!fState||fState.subj!==s.id)fState={subj:s.id,lvl:'all',idx:0,flipped:false};
  const wrap=el('div','scroll');
  const chips=el('div','chips');
  const mk=(id,name)=>{const c=el('div','chip'+(fState.lvl===id?' active':''),name);c.onclick=()=>{fState.lvl=id;fState.idx=0;renderFiszki(sc);};return c;};
  chips.appendChild(mk('all','Wszystko 🌀'));
  s.levels.forEach(l=>chips.appendChild(mk(l.id,l.title)));
  wrap.appendChild(chips);
  const list = fState.lvl==='all'?allCards(s):(s.levels.find(l=>l.id===fState.lvl).flashcards||[]).map(c=>({...c,lvl:s.levels.find(l=>l.id===fState.lvl).title}));
  if(fState.idx>=list.length)fState.idx=0;
  const c=list[fState.idx]||{t:'—',d:'Brak fiszek'};
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${list.length?fState.idx/list.length*100:0}%"></i></div><div class="counter">${list.length?fState.idx+1:0}/${list.length}</div>`));
  const flip=el('div','flip'+(fState.flipped?' flipped':''));flip.style.height='calc(100dvh - 320px)';
  flip.innerHTML=`<div class="flipinner">
    <div class="face front"><span class="tag">${c.lvl||''}</span><div class="term">${c.t}</div><div class="tapomat">tapnij = odpowiedź 👀</div></div>
    <div class="face back"><span class="tag">odpowiedź ✅</span><div class="deftxt">${c.d}</div><div class="tapomat">tapnij = wróć ↩</div></div></div>`;
  flip.onclick=()=>{fState.flipped=!fState.flipped;flip.classList.toggle('flipped');};
  wrap.appendChild(flip);
  const btns=el('div','fbtns');
  const no=el('button','fbtn no','jeszcze nie 😵');const yes=el('button','fbtn yes','umiem 💪');
  const next=(known)=>{if(known){addXP(s.id,2);toast('+2xp 💪');}fState.flipped=false;fState.idx=(fState.idx+1)%Math.max(1,list.length);renderFiszki(sc);};
  no.onclick=()=>next(false);yes.onclick=()=>next(true);
  btns.appendChild(no);btns.appendChild(yes);wrap.appendChild(btns);
  sc.innerHTML='';sc.appendChild(wrap);
}

/* ---------- QUIZ (cały przedmiot, filtr po poziomach) ---------- */
let qState=null;
function renderQuiz(sc){
  const s=current;
  if(!qState||qState.subj!==s.id)qState={subj:s.id,lvl:'all',list:null,idx:0,score:0,answered:false};
  if(!qState.list){
    qState.list = qState.lvl==='all'?shuffle(allQuiz(s)):shuffle((s.levels.find(l=>l.id===qState.lvl).quiz||[]));
    qState.idx=0;qState.score=0;
  }
  const wrap=el('div','scroll');
  const chips=el('div','chips');
  const mk=(id,name)=>{const c=el('div','chip'+(qState.lvl===id?' active':''),name);c.onclick=()=>{qState.lvl=id;qState.list=null;renderQuiz(sc);};return c;};
  chips.appendChild(mk('all','Wszystko 🌀'));
  s.levels.forEach(l=>chips.appendChild(mk(l.id,l.title)));
  wrap.appendChild(chips);
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${qState.list.length?qState.idx/qState.list.length*100:0}%"></i></div><div class="counter">${Math.min(qState.idx+1,qState.list.length)}/${qState.list.length}</div>`));
  const card=el('div','qcard');
  if(qState.idx>=qState.list.length){
    const pct=qState.list.length?Math.round(qState.score/qState.list.length*100):0;
    card.innerHTML=`<div class="result"><div class="big">${pct>=70?'🔥':pct>=50?'😎':'💀'}</div><h2>Wynik</h2>
      <div class="score">Trafione <b>${qState.score}/${qState.list.length}</b> (${pct}%)</div>
      <p>${pct>=70?'Solidnie ogarniasz ten przedmiot.':pct>=50?'Spoko, ale przejedź jeszcze fiszki.':'Wróć do fiszek i ścieżki, potem tu wróć.'}</p>
      <button class="pill" id="qre">jeszcze raz 🔁</button></div>`;
    wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
    document.getElementById('qre').onclick=()=>{qState.list=null;renderQuiz(sc);};
    return;
  }
  const q=qState.list[qState.idx];qState.answered=false;
  card.innerHTML=`<span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="explain" id="qexp"><b>czemu:</b> ${q.e||''}</div>
    <button class="pill qnext" id="qnext" style="margin-top:14px">dalej →</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  card.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(qState.answered)return;qState.answered=true;const i=+o.dataset.i;
    card.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');else x.classList.add('dim');});
    if(i===q.c){qState.score++;addXP(s.id,3);toast('GIT +3xp 🟢');}else toast('mid 👇');
    document.getElementById('qexp').classList.add('show');
    const n=document.getElementById('qnext');n.classList.add('show');n.textContent=(qState.idx+1>=qState.list.length)?'wynik 🏁':'dalej →';
  });
  document.getElementById('qnext').onclick=()=>{qState.idx++;renderQuiz(sc);};
}

/* ---------- EGZAMIN ---------- */
let exState=null,exInt=null;
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0');}
function exGrade(s,pct){
  const sc=s.grading&&s.grading.scale; // [[min,label],...] malejąco
  if(sc){for(const[min,lab]of sc){if(pct>=min)return lab;}return s.grading.failLabel||'2 — niezaliczone';}
  if(pct>=90)return'5';if(pct>=70)return'4';if(pct>=50)return'3';return'2 — niezaliczone';
}
function renderEgzamin(sc){
  const s=current;clearInterval(exInt);exState=null;
  const wrap=el('div','scroll');
  const ALL=allQuiz(s).length;
  const N=Math.min(20,ALL);
  const lim=(s.grading&&s.grading.examMin)||20;
  const fullLim=Math.max(lim,Math.ceil(ALL*0.75)); // ~45s na pytanie
  wrap.innerHTML=`<div class="result"><div class="big">🎯</div><h2>Egzamin</h2>
    <div class="specs"><div class="spec">${N}<small>losowych</small></div><div class="spec">${lim}:00<small>na czas</small></div><div class="spec">${(s.grading&&s.grading.pass)||50}%<small>zalicza</small></div></div>
    <p>Bez podpowiedzi w trakcie. Na końcu % i ocena wg siatki + przegląd błędów.</p>
    <button class="pill" id="exstart">symulacja — ${N} losowych 🎲</button>
    <button class="pill" id="exfull" style="margin-top:10px">📋 Test końcowy — WSZYSTKIE ${ALL} pytań</button>
    <p style="font-size:13px;margin-top:6px">Test końcowy = każde pytanie z przedmiotu, w losowej kolejności (${fullLim}:00).</p></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exstart').onclick=()=>beginExam(sc,N,lim*60);
  document.getElementById('exfull').onclick=()=>beginExam(sc,ALL,fullLim*60);
}
function beginExam(sc,N,limit){
  const s=current;
  exState={pool:shuffle(allQuiz(s)).slice(0,N),idx:0,pick:[],left:limit};
  exState.pick=new Array(exState.pool.length).fill(null);
  clearInterval(exInt);
  exInt=setInterval(()=>{exState.left--;const t=document.getElementById('extimer');if(t){t.textContent='⏱ '+fmt(exState.left);t.classList.toggle('warn',exState.left<=60);}if(exState.left<=0){clearInterval(exInt);examFinish(sc);}},1000);
  renderExamQ(sc);
}
function renderExamQ(sc){
  const s=current;const ex=exState;
  if(ex.idx>=ex.pool.length)return examFinish(sc);
  const q=ex.pool[ex.idx];const sel=ex.pick[ex.idx];const last=ex.idx+1>=ex.pool.length;
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Pytanie ${ex.idx+1}/${ex.pool.length}</div><div class="timer" id="extimer">⏱ ${fmt(ex.left)}</div></div>
    <div class="progressrow"><div class="bar"><i style="width:${ex.idx/ex.pool.length*100}%"></i></div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
      <div class="opts">${q.a.map((o,i)=>`<button class="opt${sel===i?' sel':''}" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        ${ex.idx>0?'<button class="pill ghost" style="flex:1" id="exprev">← wstecz</button>':''}
        <button class="pill" style="flex:2" id="exnext">${last?'zakończ i sprawdź 🏁':'dalej →'}</button></div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ex.pick[ex.idx]=+o.dataset.i;wrap.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',+x.dataset.i===ex.pick[ex.idx]));});
  const nx=document.getElementById('exnext');nx.onclick=()=>{if(last)examFinish(sc);else{ex.idx++;renderExamQ(sc);}};
  const pv=document.getElementById('exprev');if(pv)pv.onclick=()=>{ex.idx--;renderExamQ(sc);};
}
function examFinish(sc){
  clearInterval(exInt);const s=current;const ex=exState;
  let correct=0;const wrong=[];
  ex.pool.forEach((q,i)=>{if(ex.pick[i]===q.c)correct++;else wrong.push({q,sel:ex.pick[i]});});
  const pct=Math.round(correct/ex.pool.length*100);
  const grade=exGrade(s,pct);const pass=(s.grading&&s.grading.pass)||50;
  const emoji=pct>=90?'👑':pct>=70?'🔥':pct>=pass?'😮‍💨':'💀';
  addXP(s.id,correct*3);
  const rev = wrong.length? wrong.map(w=>`<div class="ritem"><div class="rq">${w.q.q}</div>
      <div class="rbad">Twoja: ${w.sel==null?'— (brak)':keys[w.sel]+'. '+w.q.a[w.sel]}</div>
      <div class="rgood">Dobra: ${keys[w.q.c]}. ${w.q.a[w.q.c]}</div>
      <div class="rsrc">${w.q.lvl||''} · ${w.q.e||''}</div></div>`).join('') : '<div class="ritem rgood">Zero błędów. Clean sweep 🧼</div>';
  const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="result"><div class="big">${emoji}</div><h2>Ocena: ${grade}</h2>
    <div class="score">Trafione <b>${correct}/${ex.pool.length}</b> (${pct}%)</div>
    <p>${pct>=pass?'Zdane! 🎉':'Poniżej progu — wróć do ścieżki i fiszek.'}</p>
    <button class="pill" id="exagain">jeszcze raz 🔁</button></div>
    <div class="review"><h3>Przegląd błędów (${wrong.length})</h3>${rev}</div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  document.getElementById('exagain').onclick=()=>renderEgzamin(sc);
  toast(pct>=pass?'zdane! ocena '+grade+' 🎉':'niezaliczone 💀');
}

/* ---------- INFO ---------- */
function renderInfo(sc){
  const s=current;const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="hero" style="padding-bottom:8px"><h1>${s.emoji} ${s.name}</h1><p>${s.tagline||''}</p></div>${s.info||'<div class="zbox"><p>Brak dodatkowych informacji.</p></div>'}`;
  sc.innerHTML='';sc.appendChild(wrap);
}

/* ================= ĆWICZENIA (wpisywanie, klocki, pary, speed) ================= */
let cw=null, cwInt=null;
function exNorm(str){return (str||'').toLowerCase().replace(/ł/g,'l').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\b(the|a|an|to|el|la|los|las|un|una|unos|unas)\b/g,' ').replace(/\s+/g,' ').trim();}
function exClean(str){return (str||'').replace(/\([^)]*\)/g,'').replace(/…|\.\.\./g,'').replace(/\s+/g,' ').trim();}
function typePool(s){return allCards(s).map(c=>({prompt:exClean(c.d),ans:exClean(c.t),lvl:c.lvl})).filter(c=>c.prompt&&c.ans&&c.ans.length<=30&&!/\//.test(c.ans));}
function tilePool(s){return typePool(s).filter(c=>c.ans.replace(/\s/g,'').length<=18);}
function matchPool(s){return allCards(s).map(c=>({a:exClean(c.t),b:exClean(c.d)})).filter(c=>c.a&&c.b);}

function renderCwicz(sc){
  clearInterval(cwInt);cw=null;
  const s=current;const wrap=el('div','scroll');
  const hub=el('div','exhub');
  const items = s.lang
   ? [['typing','✍️','Wpisywanie','Po polsku → '+(s.short||'język')+'. Wpisz słowo z klawiatury.'],
      ['tiles','🧩','Klocki — ułóż słowo','Poukładaj literki/wyrazy w poprawne słowo.'],
      ['match','🔗','Połącz w pary','Dopasuj słowo do tłumaczenia.']]
   : [['match','🔗','Połącz w pary','Dopasuj pojęcie do definicji.'],
      ['speed','⚡','Szybki quiz na czas','60 sekund — ile zdążysz trafić?'],
      ['typing','✍️','Wpisz pojęcie','Z definicji wpisz właściwy termin.']];
  hub.appendChild(el('div','exprompt','Wybierz ćwiczenie 👇'));
  items.forEach(([k,em,t,p])=>{
    const c=el('div','excard',`<div class="eemoji">${em}</div><div class="emeta"><h3>${t}</h3><p>${p}</p></div>`);
    c.onclick=()=>{ if(k==='typing')cwStartTyping(sc); else if(k==='tiles')cwStartTiles(sc); else if(k==='match')cwStartMatch(sc); else cwStartSpeed(sc); };
    hub.appendChild(c);
  });
  wrap.appendChild(hub);sc.innerHTML='';sc.appendChild(wrap);
}
function cwBackBtn(sc){const b=el('button','pill ghost','← ćwiczenia');b.style.marginTop='12px';b.onclick=()=>renderCwicz(sc);return b;}
function cwResult(sc,emoji,score,total,retry){
  clearInterval(cwInt);
  const wrap=el('div','scroll');const pct=total?Math.round(score/total*100):0;
  wrap.innerHTML=`<div class="result"><div class="big">${emoji}</div><h2>Wynik</h2>
    <div class="score">Dobrze: <b>${score}/${total}</b> (${pct}%)</div>
    <p>${pct>=80?'Świetnie! Masz to w małym palcu.':pct>=50?'Niezłe, jeszcze runda i będzie czysto.':'Spoko, powtórz — od tego jest ćwiczenie.'}</p></div>`;
  const f=el('div');f.style.cssText='display:flex;gap:10px;padding:0 0 8px';
  const r=el('button','pill','jeszcze raz 🔁');r.onclick=retry;
  f.appendChild(r);f.appendChild(cwBackBtn(sc));wrap.appendChild(f);
  sc.innerHTML='';sc.appendChild(wrap);
}
/* --- TYPING --- */
function cwStartTyping(sc){const pool=shuffle(typePool(current)).slice(0,12);
  if(!pool.length){toast('Brak danych do wpisywania');return renderCwicz(sc);}
  cw={type:'typing',list:pool,idx:0,score:0};cwRenderTyping(sc);}
function cwRenderTyping(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'👑':'✍️',cw.score,cw.list.length,()=>cwStartTyping(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">przetłumacz / wpisz</div><div class="exq">${it.prompt}</div>
    <input class="winput" id="win" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="wpisz odpowiedź…">
    <div class="exfb" id="wfb"></div>
    <button class="pill qnext" id="wnext" style="margin-top:14px">sprawdź ✅</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const inp=document.getElementById('win'),btn=document.getElementById('wnext'),fb=document.getElementById('wfb');
  setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  let checked=false;
  const check=()=>{
    if(checked){cw.idx++;cwRenderTyping(sc);return;}
    checked=true;
    const ok=inp.value.trim()!=='' && exNorm(inp.value)===exNorm(it.ans);
    inp.classList.add(ok?'ok':'bad');inp.disabled=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp 🟢');fb.className='exfb ok show';fb.innerHTML='✅ Dobrze: <b>'+it.ans+'</b>';}
    else{toast('prawie!');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.textContent=(cw.idx+1>=cw.list.length)?'wynik 🏁':'dalej →';
  };
  btn.onclick=check;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
}
/* --- TILES --- */
function cwStartTiles(sc){const pool=shuffle(tilePool(current)).slice(0,10);
  if(!pool.length){toast('Brak danych');return renderCwicz(sc);}
  cw={type:'tiles',list:pool,idx:0,score:0,_n:-1};cwRenderTiles(sc);}
function cwRenderTiles(sc){
  const it=cw.list[cw.idx];
  if(!it)return cwResult(sc,(cw.score/cw.list.length>=0.8)?'👑':'🧩',cw.score,cw.list.length,()=>cwStartTiles(sc));
  const phrase=/\s/.test(it.ans.trim());
  const sep=phrase?' ':'';
  if(cw._n!==cw.idx){cw._n=cw.idx;const units=phrase?it.ans.trim().split(/\s+/):it.ans.replace(/\s/g,'').split('');cw.tiles=shuffle(units.map(ch=>({ch,used:false})));cw.build=[];cw.checked=false;}
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','progressrow',`<div class="bar"><i style="width:${cw.idx/cw.list.length*100}%"></i></div><div class="counter">${cw.idx+1}/${cw.list.length}</div>`));
  const card=el('div','qcard');
  card.innerHTML=`<span class="tag">${it.lvl||''}</span><div class="exprompt">ułóż: ${it.prompt}</div>
    <div class="build" id="build"></div><div class="tiles" id="bank"></div>
    <div class="exfb" id="tfb"></div>
    <button class="pill qnext" id="tnext" style="margin-top:8px">sprawdź ✅</button>`;
  wrap.appendChild(card);sc.innerHTML='';sc.appendChild(wrap);
  const bankEl=document.getElementById('bank'),buildEl=document.getElementById('build'),fb=document.getElementById('tfb'),btn=document.getElementById('tnext');
  cw.build.forEach((ti,pos)=>{const b=el('button','tile',cw.tiles[ti].ch);b.onclick=()=>{if(cw.checked)return;cw.tiles[ti].used=false;cw.build.splice(pos,1);cwRenderTiles(sc);};buildEl.appendChild(b);});
  cw.tiles.forEach((tl,ti)=>{const b=el('button','tile'+(tl.used?' used':''),tl.ch);b.onclick=()=>{if(cw.checked||tl.used)return;tl.used=true;cw.build.push(ti);cwRenderTiles(sc);};bankEl.appendChild(b);});
  btn.onclick=()=>{
    if(cw.checked){cw.idx++;cwRenderTiles(sc);return;}
    const got=cw.build.map(i=>cw.tiles[i].ch).join(sep);
    const ok=exNorm(got)===exNorm(it.ans);cw.checked=true;
    if(ok){cw.score++;addXP(current.id,4);toast('GIT +4xp 🟢');fb.className='exfb ok show';fb.innerHTML='✅ <b>'+it.ans+'</b>';}
    else{toast('nie tak');fb.className='exfb bad show';fb.innerHTML='Poprawnie: <b>'+it.ans+'</b>';}
    btn.textContent=(cw.idx+1>=cw.list.length)?'wynik 🏁':'dalej →';
  };
}
/* --- MATCH --- */
function cwStartMatch(sc){const pool=shuffle(matchPool(current)).slice(0,5);
  if(pool.length<2){toast('Za mało danych');return renderCwicz(sc);}
  cw={type:'match',pairs:pool,left:shuffle(pool.map((p,i)=>({i,t:p.a}))),right:shuffle(pool.map((p,i)=>({i,t:p.b}))),selL:null,selR:null,done:0,matched:new Set()};
  cwRenderMatch(sc);}
function cwRenderMatch(sc){
  if(cw.done>=cw.pairs.length)return cwResult(sc,'🔗',cw.pairs.length,cw.pairs.length,()=>cwStartMatch(sc));
  const wrap=el('div','scroll');
  wrap.appendChild(el('div','exprompt','Połącz w pary (tapnij z lewej, potem z prawej)'));
  const mw=el('div','matchwrap');const lc=el('div','mcol'),rc=el('div','mcol');
  const trunc=t=>t.length>64?t.slice(0,62)+'…':t;
  cw.left.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('L'+o.i)?' done':'')+(cw.selL===o.i?' sel':''),o.t);it.onclick=()=>{if(cw.matched.has('L'+o.i))return;cw.selL=o.i;tryMatch(sc);};lc.appendChild(it);});
  cw.right.forEach(o=>{const it=el('div','mitem'+(cw.matched.has('R'+o.i)?' done':'')+(cw.selR===o.i?' sel':''),trunc(o.t));it.onclick=()=>{if(cw.matched.has('R'+o.i))return;cw.selR=o.i;tryMatch(sc);};rc.appendChild(it);});
  mw.appendChild(lc);mw.appendChild(rc);wrap.appendChild(mw);
  const f=el('div');f.style.cssText='margin-top:14px';f.appendChild(cwBackBtn(sc));wrap.appendChild(f);
  sc.innerHTML='';sc.appendChild(wrap);
}
function tryMatch(sc){
  if(cw.selL==null||cw.selR==null){cwRenderMatch(sc);return;}
  if(cw.selL===cw.selR){cw.matched.add('L'+cw.selL);cw.matched.add('R'+cw.selR);cw.done++;cw.selL=null;cw.selR=null;addXP(current.id,3);toast('para! +3xp 🟢');cwRenderMatch(sc);}
  else{toast('nie pasuje 🔴');cw.selL=null;cw.selR=null;cwRenderMatch(sc);}
}
/* --- SPEED --- */
function cwStartSpeed(sc){cw={type:'speed',list:shuffle(allQuiz(current)),idx:0,score:0,left:60};
  clearInterval(cwInt);cwInt=setInterval(()=>{cw.left--;const t=document.getElementById('spdt');if(t){t.textContent='⏱ '+cw.left+'s';t.classList.toggle('warn',cw.left<=10);}if(cw.left<=0){clearInterval(cwInt);cwResult(sc,(cw.score>=10)?'🔥':'⚡',cw.score,cw.idx,()=>cwStartSpeed(sc));}},1000);
  cwRenderSpeed(sc);}
function cwRenderSpeed(sc){
  if(cw.idx>=cw.list.length){clearInterval(cwInt);return cwResult(sc,'🔥',cw.score,cw.idx,()=>cwStartSpeed(sc));}
  const q=cw.list[cw.idx];const wrap=el('div','scroll');
  wrap.innerHTML=`<div class="examhead"><div class="counter">Trafione: ${cw.score}</div><div class="timer" id="spdt">⏱ ${cw.left}s</div></div>
    <div class="qcard"><span class="tag">${q.lvl||''}</span><div class="qq">${q.q}</div>
    <div class="opts">${q.a.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${keys[i]}</span><span>${o}</span></button>`).join('')}</div></div>`;
  sc.innerHTML='';sc.appendChild(wrap);
  let locked=false;
  wrap.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
    if(locked)return;locked=true;const i=+o.dataset.i;
    wrap.querySelectorAll('.opt').forEach(x=>{const xi=+x.dataset.i;if(xi===q.c)x.classList.add('correct');else if(xi===i)x.classList.add('wrong');});
    if(i===q.c){cw.score++;addXP(current.id,2);}
    setTimeout(()=>{cw.idx++;cwRenderSpeed(sc);},450);
  });
}

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  app=document.getElementById('app');
  if(!SUBJECTS.length){app.innerHTML='<div class="topbar"><div class="logo">📚 NAUKA</div></div><div class="scroll"><div class="zbox"><p>Brak załadowanych przedmiotów. Dodaj plik danych w <b>data/</b> (np. data/makro.js).</p></div></div>';return;}
  renderHome();
});
})();

</script>
