.thopt{cursor:pointer;font-family:var(--font-body);text-align:left;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);border-radius:18px;padding:14px;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.thopt .n{font-size:14.5px;font-weight:800;color:var(--txt);line-height:1.2}
.thopt .s{font-size:11.5px;font-weight:700;color:var(--muted)}
.thopt:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.thopt.sel{background:var(--tint-pink);border-color:var(--violet);box-shadow:0 4px 0 var(--violet)}
.thopt.sel .s{color:var(--violet-soft)}
.thopt.correct{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid)}
.thopt.correct .s{color:var(--acid-soft)}
.thopt.wrong{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark)}
.thopt.wrong .s{color:var(--red-soft)}
.thopt.dim{opacity:.55;box-shadow:none}
.thopt[disabled]{cursor:default}
.thopt[disabled]:active{transform:none}

/* scenariusz (Scenario.html): karta „Sytuacja” */
.scenetext{font-size:15px;font-weight:700;line-height:1.5;color:var(--txt-2);margin-top:8px}

/* znajdź błąd (FindError.html): zdania w karcie; wybrane = czerwień; po sprawdzeniu fałszywe przekreślone + poprawka; chybienie = bursztyn */
.errcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;gap:9px}
.errsent{width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface-2);border:2px solid var(--line-2);color:var(--txt-2);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:700;line-height:1.45;transition:background .15s,border-color .15s}
.errsent.sel{background:var(--tint-red);border-color:var(--red);box-shadow:0 4px 0 var(--red-dark);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.errsent.correct{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt));text-decoration:line-through}
.errsent.wrong{border-color:var(--amber);color:var(--amber-soft)}
.errsent.dim{opacity:.55}
.errsent[disabled]{cursor:default}
.errfix{display:none;padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:1.45;border:2px solid var(--line)}
.errfix.show{display:block;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.errfix.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.errfix.bad{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.errfix .lbl{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.notebox{display:flex;align-items:center;gap:10px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);border-radius:16px;padding:12px 14px;font-size:12.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.notebox .ic{color:var(--gold);flex:none}

/* oś czasu (Timeline.html): rok, kropka na osi, slot / przypięte wydarzenie; strefa pod palcem = .over */
.tl{position:relative;display:flex;flex-direction:column;gap:14px}
.tlaxis{position:absolute;left:73px;top:20px;bottom:20px;width:4px;border-radius:2px;background:var(--line-2)}
.tlrow{display:flex;align-items:center;gap:12px;position:relative}
.tlyear{width:54px;flex:none;text-align:right;font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--txt)}
.tldot{width:16px;height:16px;border-radius:50%;background:var(--line-2);border:3px solid var(--bg);flex:none;z-index:1}
.tldot.on{background:var(--acid)}
.tldot.cur{background:var(--violet)}
.tlslot,.chslot{min-height:48px;border-radius:16px;border:2px dashed var(--line-dash);background:var(--surface-2);display:flex;align-items:center;padding:0 14px;font-size:12.5px;font-weight:800;color:var(--violet-soft);transition:background .15s,border-color .15s}
.tlslot{flex:1;min-width:0}
.tlslot.cur,.chslot.cur{border-color:var(--violet);background:var(--tint-pink)}
.tlslot.hot,.chslot.hot{border-color:var(--violet);background:var(--tint-pink);animation:dcBlink 1.2s ease-in-out infinite}
.tlslot.over,.chslot.over{background:color-mix(in srgb,var(--violet) 45%,var(--surface));border-color:var(--txt);color:var(--txt);animation:none}
.tlev,.chstep.filled{min-height:48px;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;color:color-mix(in srgb,var(--acid) 25%,var(--txt));line-height:1.3;transition:background .15s,border-color .15s}
.tlev{flex:1;min-width:0}
.tlev .ic,.chstep.filled .ic{color:var(--acid);flex:none}
.tlev.bad,.chstep.bad{background:var(--tint-red);border-color:var(--red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.tlev.bad .ic,.chstep.bad .ic{color:var(--red)}
.tlev[disabled],.chstep[disabled]{cursor:default}

/* łańcuch przyczyn (CauseChain.html): kolumna kroków ze strzałkami; given = zwykła karta, wstawione = limonka, slot „co dalej?” */
.chain{display:flex;flex-direction:column;gap:4px}
.chstep.given{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-size:14px;font-weight:800;color:var(--txt);box-shadow:0 4px 0 var(--shadow);line-height:1.3}
.chstep.filled{width:100%;font-size:14px}
.charrow{display:flex;justify-content:center;color:var(--muted-3);height:26px;align-items:center}
.chslot{min-height:50px}

/* wykres (ChartRead.html): karta z podpisem, SVG z jedną serią — słupki fiolet, linia cyjan, tekst w tokenach tekstu */
.chartcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 12px 10px;box-shadow:0 6px 0 var(--shadow)}
.chartlbl{font-size:12px;font-weight:800;color:var(--muted);padding:0 6px 6px}
svg.chart{width:100%;height:auto;display:block;font-family:var(--font-body)}
.cgrid{stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:4 5}
.caxis{stroke:var(--line);stroke-width:2}
.cbar{fill:var(--violet)}
.cval{fill:var(--txt-2);font-size:12px;font-weight:800}
.clab{fill:var(--muted-2);font-size:11px;font-weight:700}
.cline{fill:none;stroke:var(--cyan);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.cdot{fill:var(--cyan);stroke:var(--bg);stroke-width:2}

/* krok po kroku (MathSteps.html): karta z wierszami wyrażeń, ramka wyjaśnienia, siatka opcji w Bricolage */
.mathcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface-2);min-height:56px}
.mexpr{flex:1;min-width:0;font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--txt);letter-spacing:.5px;line-height:1.15;overflow-wrap:anywhere}
.mnote{font-size:11.5px;font-weight:700;color:var(--muted-2);text-align:right;max-width:44%;line-height:1.3}
.mrow .ic{flex:none}
.mrow.ok{background:var(--tint-acid);border:2px solid var(--tint-acid-line)}
.mrow.ok .mexpr{color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.mrow.ok .mnote{color:var(--acid-soft)}
.mrow.ok .ic{color:var(--acid)}
.mrow.bad{background:var(--tint-red);border:2px solid var(--tint-red-line)}
.mrow.bad .mexpr{color:color-mix(in srgb,var(--red) 20%,var(--txt));text-decoration:line-through}
.mrow.bad .mnote{color:var(--red-soft)}
.mrow.bad .ic{color:var(--red)}
.mexp{display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:14px;background:var(--tint-gold);border:2px solid var(--tint-gold-line);font-size:13px;font-weight:700;color:color-mix(in srgb,var(--gold) 55%,var(--txt));line-height:1.4}
.mexp .ic{color:var(--gold);flex:none}
.mrow.next{border:2px dashed var(--violet);background:var(--tint-pink);color:var(--violet-soft);font-size:13px;font-weight:800}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mopt{cursor:pointer;font-family:var(--font-display);min-height:62px;padding:8px 10px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--shadow);color:var(--txt);font-size:20px;font-weight:800;line-height:1.15;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.mopt:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.mopt.sel{background:var(--tint-acid);border-color:var(--acid);box-shadow:0 4px 0 var(--acid);color:color-mix(in srgb,var(--acid) 25%,var(--txt))}
.mopt.dim{opacity:.45;box-shadow:none;cursor:default}
.mopt[disabled]:active{transform:none}

/* wskaż na schemacie (Hotspot.html): karta z obrazem, warstwa dotyku, pierścienie (pin = pozycja, ring = animacja), etykiety, chipy kolejnych celów */
.hotcard{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--shadow)}
.hotimg{position:relative;border-radius:16px;overflow:hidden;cursor:crosshair}
.hotimg svg,.hotimg img{width:100%;height:auto;display:block}
.hotlayer{position:absolute;inset:0}
.hotpin{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.hotring{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:4px solid var(--acid);box-sizing:border-box}
.hotring.miss{border-color:var(--red);border-width:5px}
.hotring.reveal{border-color:var(--amber)}
.hottag{position:absolute;left:50%;top:100%;transform:translate(-50%,6px);padding:5px 10px;border-radius:10px;background:var(--acid);color:var(--on-acid);font-size:12px;font-weight:800;white-space:nowrap;animation:dcPop .45s cubic-bezier(.2,1.5,.4,1) both}
.hottag.reveal{background:var(--amber);color:var(--on-amber)}
.hotchips{display:flex;gap:8px;flex-wrap:wrap}
.hotchip{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-2);font-size:12px;font-weight:700;color:var(--muted)}
.hotchip.cur{background:var(--tint-acid);border-color:var(--tint-acid-line);color:var(--acid)}
.hotchip.done{color:var(--acid-soft);text-decoration:line-through}
/* w lekcji .pill jest limonkowy (krok 4) — przycisk „pokaż, gdzie to jest” w hotspot zostaje ghost; etykieta podpowiedzi typeterm w jednej linii */
.lesson .pill.ghost:not([disabled]){background:var(--surface);color:var(--txt-2);box-shadow:0 var(--drop-btn) 0 var(--shadow)}
.lesson .pill.ghost:not([disabled]):active{box-shadow:0 0 0 var(--shadow)}
.hintbtn{white-space:nowrap;font-size:12px;padding:0 8px}
/* przeciąganie kafelków/kart nie zaznacza tekstu; pole odpowiedzi w typeterm nadal edytowalne */
.task{-webkit-user-select:none;user-select:none}
.terminput{-webkit-user-select:text;user-select:text}
.hottag{white-space:normal;max-width:170px;width:max-content;text-align:center;line-height:1.3}

/* ============================================================
   KROK 6 — HANDOFF 2.0 + POWTÓRKA SRS: plus w nawigacji (Main.html), arkusze „Dodaj materiał” (QuickAdd/AddSubject.html)
   i „Wyjaśnijmy inaczej” (Explain.html), Review.html, FlashcardsDone.html, Profil (aktywność, odznaki), hub Fiszki.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* dolna nawigacja: Dziś · Powtórka · [+] · Fiszki · Profil; plus 62 px uniesiony o 34 px nad pasek */
.nav{overflow:visible}
.nav button.navplus{flex:0 0 62px;width:62px;height:62px;min-height:62px;margin-top:-34px;padding:0;gap:0;justify-content:center;border-radius:22px;background:var(--acid);color:var(--on-acid);box-shadow:0 5px 0 var(--acid-dark);transition:box-shadow .08s}
.nav button.navplus:active{box-shadow:0 0 0 var(--acid-dark)}
.nav button.navplus .ic{transition:none}
.nav button.navplus:active .ic{transform:none}

/* arkusze pełnej treści: uchwyt, nagłówek z tytułem i zamknięciem */
.shandle{width:44px;height:5px;border-radius:3px;background:var(--line-dash);margin:-6px auto 0;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead .st2,.exhead .st2{font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.1}
.shead .sclose{width:40px;height:40px;box-shadow:none;color:var(--muted)}
.sheet.quickadd,.sheet.addinfo{border-radius:32px 32px 0 0;border-top-color:var(--acid);padding:14px 18px calc(26px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet.quickadd>*,.sheet.addinfo>*{flex:none}
/* „Dodaj materiał”: duża limonkowa karta zdjęcia, siatka plik / tekst, link do katalogu */
.qabig{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--acid);color:var(--on-acid);border:none;border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--acid-dark);transition:transform .08s,box-shadow .08s}
.qabig:active{transform:translateY(6px);box-shadow:0 0 0 var(--acid-dark)}
.qabig .ico{width:62px;height:62px;border-radius:20px;background:var(--on-acid);color:var(--acid);display:flex;align-items:center;justify-content:center;flex:none}
.qabig .grow{flex:1;min-width:0}
.qabig .t{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px}
.qabig .s{font-size:13px;font-weight:700;color:color-mix(in srgb,var(--on-acid) 75%,var(--acid));margin-top:3px}
.qagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.qatile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;cursor:pointer;font-family:var(--font-body);border-radius:22px;padding:15px 14px;min-height:44px;box-shadow:0 4px 0 var(--shadow);color:var(--txt);background:var(--surface);border:2px solid var(--line);transition:transform .08s,box-shadow .08s}
.qatile:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.qatile.pink{background:var(--tint-pink);border-color:var(--tint-pink-line)}.qatile.pink .ic{color:color-mix(in srgb,var(--pink) 60%,var(--txt))}
.qatile.cyan{background:var(--tint-cyan);border-color:var(--tint-cyan-line)}.qatile.cyan .ic{color:var(--cyan)}
.qatile .t{font-size:14px;font-weight:800}
.qatile .s{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.qalink{background:none;border:none;cursor:pointer;font-family:var(--font-body);text-align:center;font-size:13px;font-weight:800;color:var(--muted);padding:6px;min-height:44px}
/* „Skąd wziąć materiał?” jako arkusz informacyjny: opis, ramka offline, 3 kroki z README */
.sp{font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.45}
.infobox{display:flex;align-items:flex-start;gap:10px;background:var(--tint-acid);border:2px solid var(--tint-acid-line);border-radius:18px;padding:13px 15px;font-size:13.5px;font-weight:700;line-height:1.4;color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.infobox .ic{color:var(--acid);flex:none;margin-top:2px}
.sheet .steps{gap:10px}
.sheet .step .num{width:34px;height:34px;border-radius:11px;font-size:15px}
.sheet .step .t{font-size:13.5px;line-height:1.3}
.sheet .step .s{font-size:12px}
.sheet code{font-family:inherit;font-weight:800;color:var(--acid)}
.sbtns .pill.ghost{color:var(--txt-2)}

/* „Wyjaśnijmy inaczej” (Explain.html): cyjanowa górna krawędź, ikona, plakietki źródeł, ramka z wyjaśnieniami, notka o AI */
.sheet.explain{border-top-color:var(--cyan);border-radius:32px 32px 0 0;max-height:86dvh}
.exhead{display:flex;align-items:center;gap:10px}
.exhead .ico{width:44px;height:44px;border-radius:14px;background:var(--cyan);color:var(--on-cyan);display:flex;align-items:center;justify-content:center;flex:none}
.exhead .grow{flex:1;min-width:0}
.exhead .st2{font-size:22px;letter-spacing:-.6px}
.exchips{display:flex;gap:7px;flex-wrap:wrap}
.exchip{padding:8px 14px;border-radius:var(--r-chip);background:var(--surface);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800}
.exchip.on{background:var(--cyan);border-color:var(--cyan);color:var(--on-cyan)}
.exbox{background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:22px;padding:17px;font-size:15px;font-weight:700;line-height:1.55;color:color-mix(in srgb,var(--cyan) 20%,var(--txt));overflow-y:auto;min-height:0;flex:0 1 auto}
.exbox b{color:var(--txt)}
.exbox .lbl{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.exsep{height:2px;background:var(--tint-cyan-line);margin:14px 0}
.exnote{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted-2);line-height:1.35}
.exnote .ic{flex:none}
.pill.cyan,.lesson .pill.cyan:not([disabled]){background:var(--cyan);color:var(--on-cyan);box-shadow:0 var(--drop-btn) 0 var(--cyan-dark)}
.pill.cyan:active,.lesson .pill.cyan:not([disabled]):active{box-shadow:0 0 0 var(--cyan-dark)}
.sheet.explain .sbtns .pill.ghost{flex:0 0 140px}

/* Powtórka (Review.html): karta licznika w cyjanie, wiersze przedmiotów, stan pamięci */
.review,.cards{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.review>*,.cards>*{flex:none}
.rvhero{display:flex;align-items:center;gap:18px;background:var(--tint-cyan);border:2px solid var(--tint-cyan-line);border-radius:26px;padding:20px;box-shadow:0 6px 0 color-mix(in srgb,var(--tint-cyan) 60%,var(--bg));color:var(--cyan)}
.rvhero .grow{flex:1;min-width:0}
.rvn{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1;color:var(--cyan)}
.rvt{font-size:14px;font-weight:800;color:color-mix(in srgb,var(--cyan) 25%,var(--txt));margin-top:6px}
.rvs{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:4px;line-height:1.4}
.rvrows{display:flex;flex-direction:column;gap:10px}
.rvrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:13px 15px;min-height:44px;box-shadow:0 4px 0 var(--shadow);color:var(--txt);transition:transform .08s,box-shadow .08s}
.rvrow:active{transform:translateY(4px);box-shadow:0 0 0 var(--shadow)}
.rvrow .mono{width:40px;height:40px;border-radius:14px;font-size:19px}
.rvrow .grow{flex:1;min-width:0}
.rvrow .t{font-size:14px;font-weight:800}
.rvrow .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvrow .n{font-size:16px;font-weight:800;color:color-mix(in srgb,var(--accent) 60%,var(--txt));flex:none}
.memcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:12px}
.memrow{display:flex;align-items:center;gap:12px}
.memrow .lb{flex:none;width:78px;font-size:12.5px;font-weight:700}
.memrow .bar{flex:1;height:12px}
.memrow .n{flex:none;width:26px;text-align:right;font-size:12px;font-weight:800;color:var(--muted)}
.memrow.red .lb{color:var(--red-soft)}.memrow.red .bar i{background:var(--red)}
.memrow.gold .lb{color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.memrow.gold .bar i{background:var(--gold)}
.memrow.acid .lb{color:var(--acid-soft)}.memrow.acid .bar i{background:var(--acid)}
.memnote{font-size:12.5px;font-weight:600;color:var(--muted-2);line-height:1.4}
.rvfoot{padding-top:2px;display:flex;flex-direction:column;gap:10px}
.rvfoot .pill{min-height:60px;border-radius:20px}
/* sesja powtórki: nagłówek jak w lekcji, licznik zamiast serc; fiszka wypełnia ekran, przyciski 62 px */
.rvcount{flex:none;font-size:12.5px;font-weight:800;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:var(--r-chip);padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}
.rvrun .flip{position:relative;z-index:1;margin:0 0 4px}
.rvrun .fbtns{width:100%}
.rvrun .fbtn{min-height:62px;border-radius:20px}
/* koniec powtórki (FlashcardsDone.html): pierścień celności jako SVG (kolor przez klasę), kafle w tintach, lista „wracają dziś” */
.rvring{position:relative;width:124px;height:124px}
.rvring svg{width:124px;height:124px;transform:rotate(-90deg);display:block}
.ring-bg{fill:none;stroke:var(--line-2);stroke-width:11}
.ring-fg{fill:none;stroke:var(--cyan);stroke-width:11;stroke-linecap:round}
.rvpct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rvpct b{font-family:var(--font-display);font-size:34px;font-weight:800;color:var(--cyan);line-height:1}
.rvpct span{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:color-mix(in srgb,var(--cyan) 45%,var(--muted));margin-top:3px}
.lcstat .k.under{margin-top:3px;text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:700}
.lcstat.acid{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}.lcstat.acid .v{color:var(--acid)}.lcstat.acid .k{color:var(--acid-soft)}
.lcstat.red{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}.lcstat.red .v{color:var(--red-soft)}.lcstat.red .k{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.lcstat.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-gold) 60%,var(--bg))}.lcstat.gold .v{color:var(--gold)}.lcstat.gold .k{color:color-mix(in srgb,var(--gold) 55%,var(--muted))}
.rvlist{width:100%;text-align:left;box-shadow:0 5px 0 var(--shadow)}
.rvlist .eyebrow{padding:10px 0 2px}
.rvlist .setrow{min-height:44px;padding:9px 0}
.rvlist .setrow .t{font-size:13.5px}
.rdot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none;display:block}
.rdot.red{background:var(--red)}.rdot.gold{background:var(--gold)}
/* Profil: aktywność 8 tygodni (kolumna = tydzień, kostka = dzień), odznaki (zdobyte w tintach, zablokowane kreskowane) */
.heat{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--shadow);display:flex;gap:6px;justify-content:space-between}
.heat .col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.heat i{display:block;height:12px;border-radius:4px;background:var(--line-2)}
.heat i.on{background:var(--acid)}
.heat i.future{background:color-mix(in srgb,var(--line-2) 55%,var(--surface))}
.heat i.today{box-shadow:inset 0 0 0 2px var(--muted)}
.heat i.today.on{box-shadow:inset 0 0 0 2px var(--on-acid)}
.badges{display:flex;gap:11px}
.badge{flex:1;min-width:0;border-radius:20px;padding:12px 8px;text-align:center;background:var(--surface);border:2px solid var(--line);font-size:11px;font-weight:800;color:var(--muted);line-height:1.2}
.badge .ic{display:block;margin:0 auto 6px}
.badge.gold{background:var(--tint-gold);border-color:var(--tint-gold-line);color:color-mix(in srgb,var(--gold) 55%,var(--txt))}.badge.gold .ic{color:var(--gold)}
.badge.amber{background:var(--tint-amber);border-color:var(--tint-amber-line);color:color-mix(in srgb,var(--amber) 55%,var(--txt))}.badge.amber .ic{color:var(--flame)}
.badge.lock{background:var(--surface-2);border:2px dashed var(--line-dash);color:var(--muted-3)}.badge.lock .ic{color:var(--muted-3)}
.profile .sechdr{min-height:40px}
.rvrun .blob{background:color-mix(in srgb,var(--cyan) 12%,var(--bg))}
.rvrun .flip{touch-action:pan-y}
.swipehint3{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:14px 6px 0;font-size:12px;font-weight:800}
.swipehint3 span{display:inline-flex;align-items:center;gap:6px}
.swipehint3 .l{color:var(--red-soft)}.swipehint3 .r{color:var(--acid)}

/* ============================================================
   KROK 7 — EGZAMIN I PLAN DO SPRAWDZIANU (DESIGN.md §4.3, §6 pkt 7): ExamStart.html, ExamRun.html, Exam.html, TestPlan.html,
   wiersz „Mam sprawdzian” w QuickAdd.html, chip „Sprawdzian za N dni” w pasie przedmiotu, wiersz „Do sprawdzianu” na Dziś.
   Tylko dopisane reguły; kolory przez tokeny i color-mix, ruch przez .a-* z tokens.css.
   ============================================================ */
/* ExamStart: trzy kafle liczb, karty zakresu / ustawień / siatki ocen, ramka warunków, ostatnie podejście, start */
.exstart{display:flex;flex-direction:column;gap:13px;padding:14px 18px 150px}
.exstart>*{flex:none}
.egspecs{display:flex;gap:11px}
.egspec{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:15px 8px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.egspec b{display:block;font-family:var(--font-display);font-size:27px;font-weight:800;line-height:1.05;color:var(--txt)}
.egspec b.acid{color:var(--acid)}
.egspec span{display:block;font-size:11px;font-weight:700;color:var(--muted-2);margin-top:3px}
.egcard{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:4px 15px 10px;box-shadow:0 5px 0 var(--shadow)}
.eglbl{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted-2);padding:10px 0 6px}
.egrow{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 0;background:none;border:none;text-align:left;cursor:pointer;font-family:var(--font-body);color:var(--muted)}
.egrow+.egrow{border-top:2px solid var(--line-2)}
.egrow .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-dash);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--on-acid)}
.egrow.on{color:var(--txt)}
.egrow.on .box{background:var(--acid);border-color:var(--acid)}
.egrow .t{flex:1;min-width:0;font-size:13.5px;font-weight:700}
.egrow.all .t{font-weight:800}
.egrow .n{font-size:12px;font-weight:800;color:var(--muted-3)}
.egrow.on .n{color:var(--muted-2)}
.egchips{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.egchip{min-height:40px;padding:0 14px;border-radius:var(--r-chip);background:var(--surface-2);border:2px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;font-family:var(--font-body)}
.egchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.egscale{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px}
.egscale span{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:10px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted)}
.egscale span b{color:var(--gold);font-weight:800}
.egscale span b.fail{color:var(--red-soft)}
.egwarn{background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:24px;padding:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.egwarn .eglbl{color:var(--red-soft);padding:0}
.egwarn .r{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:color-mix(in srgb,var(--red) 20%,var(--txt));margin-top:10px}
.egwarn .r .ic{color:var(--red-soft);flex:none}
.egwarn .r .ic.ok{color:var(--acid)}
.eglast{display:flex;align-items:center;gap:13px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 var(--shadow)}
.eglast .ico{width:44px;height:44px;border-radius:14px;background:var(--line-2);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.eglast .ico.gold{background:var(--tint-gold);color:var(--gold)}
.eglast .grow{flex:1;min-width:0}
.eglast .t{font-size:13.5px;font-weight:800}
.eglast .s{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.35}
.egfoot{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:12px 18px calc(16px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line-2)}
.egfoot .pill{min-height:60px;border-radius:20px}
.eglast.d6{cursor:pointer;transition:transform .08s}
.eglast.d6:active{transform:translateY(2px)}
.eglast .chev{color:var(--muted-3)}

/* ExamRun (#lesson.egrun): nagłówek w --surface-2 z zamknięciem, „Pytanie N z M” + pasek (fiolet), timer (bursztyn, pod 2 min czerwień + .a-blink),
   przycisk siatki, pasek opadającego czasu; pytanie z flagą; kafle jak w quizie, wybór = fiolet; stopka wstecz / DALEJ (fiolet) */
.egrun .eghead{padding:14px 18px 12px;background:var(--surface-2);border-bottom:2px solid var(--line)}
.egtop{display:flex;align-items:center;gap:10px}
.egtop .x{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--txt);cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center}
.egtop .grow{flex:1;min-width:0}
.egn{font-size:13px;font-weight:800}
.egtop .bar{height:8px;margin-top:5px}
.egtop .bar i{background:var(--violet);transition:width .35s}
.egtimer{display:inline-flex;align-items:center;gap:6px;background:var(--tint-amber);border:2px solid var(--tint-amber-line);border-radius:var(--r-chip);padding:0 12px;min-height:40px;color:var(--amber-soft);font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;font-family:var(--font-body);flex:none}
.egtimer .ic{color:var(--amber)}
.egtimer.warn{background:var(--tint-red);border-color:var(--red);color:var(--red-soft)}
.egtimer.warn .ic{color:var(--red)}
.eggridbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .08s}
.eggridbtn:active{transform:translateY(2px)}
.egdrain{height:5px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:12px}
.egdrain i{display:block;height:100%;border-radius:999px;background:var(--amber);transition:width 1s linear}
.egdrain.warn i{background:var(--red)}
.egqrow{display:flex;align-items:flex-start;gap:12px}
.egqrow .qq{flex:1;min-width:0;font-size:23px;letter-spacing:-.7px;line-height:1.2;margin:0}
.egflag{flex:none;width:44px;height:44px;border-radius:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .08s}
.egflag:active{transform:translateY(2px)}
.egflag.on{background:var(--tint-gold);border-color:var(--tint-gold-line);color:var(--gold)}
.egrun .qopt.sel{background:var(--tint-pink);border-color:var(--violet);box-shadow:0 4px 0 var(--violet);color:var(--txt)}
.egrun .qopt.sel .k{background:var(--violet);color:var(--on-violet)}
.egnav{display:flex;gap:11px}
.egnav .pill{flex:1;min-height:56px}
.egnav .egprev{flex:0 0 64px;padding:0}
.egnav .pill.ghost[disabled]{opacity:.4}
.pill.violet,.lesson .pill.violet:not([disabled]){background:var(--violet);color:var(--on-violet);box-shadow:0 var(--drop-btn) 0 var(--violet-dark)}
.pill.violet:active,.lesson .pill.violet:not([disabled]):active{box-shadow:0 0 0 var(--violet-dark)}
/* arkusze egzaminu: siatka pytań (7 kolumn ≥ 44 px), legenda, podsumowanie przed zakończeniem */
.sheet.eggrid,.sheet.egconfirm,.sheet.testplan{border-radius:32px 32px 0 0;border-top-color:var(--violet);padding:14px 18px calc(26px + env(safe-area-inset-bottom));overflow-y:auto;max-height:86dvh}
.sheet.eggrid>*,.sheet.egconfirm>*,.sheet.testplan>*{flex:none}
.egsquares{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.egsq{aspect-ratio:1;min-height:40px;border-radius:10px;background:var(--line-2);border:none;color:var(--muted-2);font-size:13px;font-weight:800;cursor:pointer;font-family:var(--font-body);transition:transform .08s}
.egsq:active{transform:translateY(2px)}
.egsq.ans{background:var(--tint-acid-line);color:var(--txt)}
.egsq.flag{background:var(--tint-gold-line);color:var(--txt)}
.egsq.cur{background:var(--violet);color:var(--on-violet)}
.eglegend{display:flex;gap:12px;flex-wrap:wrap}
.eglegend span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted-2)}
.eglegend i{width:9px;height:9px;border-radius:3px;background:var(--line-2);display:block}
.eglegend i.ans{background:var(--tint-acid-line)}
.eglegend i.flag{background:var(--tint-gold-line)}
.eglegend i.cur{background:var(--violet)}
.egsum{display:flex;gap:10px}
.egsumtile{flex:1;min-width:0;border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface);border:2px solid var(--line)}
.egsumtile b{display:block;font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1.05}
.egsumtile span{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.egsumtile.red{background:var(--tint-red);border-color:var(--tint-red-line)}
.egsumtile.red b{color:var(--red-soft)}
.egsumtile.gold{background:var(--tint-gold);border-color:var(--tint-gold-line)}
.egsumtile.gold b{color:var(--gold)}
.egsumtile.acid{background:var(--tint-acid);border-color:var(--tint-acid-line)}
.egsumtile.acid b{color:var(--acid)}

/* Wynik (Exam.html, #lesson.egres): karta z pierścieniem i oceną (limonka = zdane, czerwień = nie), kafle, siatka ocen z podświetlonym wierszem,
   karta talii błędów, przegląd pytań (złe najpierw, źródło src) */
.egres .lessonbody.done{padding:0 18px}
.egl{padding:14px 0 12px;gap:14px;align-items:stretch}
.eghero{display:flex;align-items:center;gap:18px;border-radius:28px;padding:20px;border:2px solid var(--line)}
.eghero.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 6px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg))}
.eghero.bad{background:var(--tint-red);border-color:var(--tint-red-line);box-shadow:0 6px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg))}
.eghero .rvring{width:108px;height:108px;flex:none}
.eghero .rvring svg{width:108px;height:108px}
.eghero .rvpct b{font-size:28px}
.eghero.ok .ring-fg{stroke:var(--acid)}
.eghero.ok .rvpct b{color:var(--acid)}
.eghero.ok .rvpct span{color:var(--acid-soft)}
.eghero.bad .ring-fg{stroke:var(--red)}
.eghero.bad .rvpct b{color:var(--red-soft)}
.eghero.bad .rvpct span{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.eghero .grow{flex:1;min-width:0}
.eghero .eglbl{padding:0;color:var(--acid-soft)}
.eghero.bad .eglbl{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.eggrade{font-family:var(--font-display);font-size:54px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:4px;color:color-mix(in srgb,var(--acid) 30%,var(--txt))}
.eghero.bad .eggrade{color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.eggrade small{font-size:18px;letter-spacing:-.4px;margin-left:6px;color:var(--acid-soft)}
.eghero.bad .eggrade small{color:var(--red-soft)}
.egnote{font-size:12.5px;font-weight:700;margin-top:6px;color:var(--acid-soft);line-height:1.4}
.eghero.bad .egnote{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.egstats{display:flex;gap:10px}
.egstat{flex:1;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;box-shadow:0 4px 0 var(--shadow)}
.egstat b{display:block;font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.egstat span{display:block;font-size:10.5px;font-weight:700;color:var(--muted-2);margin-top:3px}
.egstat.acid b{color:var(--acid)}
.egstat.red b{color:var(--red-soft)}
.egstat.gold b{color:var(--gold)}
.egstat.cyan b{color:var(--cyan)}
.eglv{display:flex;flex-direction:column;gap:11px;padding:4px 0 8px}
.eglvrow{display:flex;align-items:center;gap:12px}
.eglvrow .lb{flex:none;width:118px;font-size:12px;font-weight:700;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eglvrow .bar{flex:1;height:12px}
.eglvrow .p{flex:none;width:36px;text-align:right;font-size:12px;font-weight:800}
.eglvrow.red .bar i{background:var(--red)}
.eglvrow.red .p{color:var(--red-soft)}
.eglvrow.gold .bar i{background:var(--gold)}
.eglvrow.gold .p{color:color-mix(in srgb,var(--gold) 55%,var(--txt))}
.eglvrow.acid .bar i{background:var(--acid)}
.eglvrow.acid .p{color:var(--acid-soft)}
.egscalelist{display:flex;flex-direction:column;padding-bottom:2px}
.egsrow{display:flex;align-items:center;gap:12px;padding:9px 8px;margin:0 -8px;border-radius:14px;font-size:13px;font-weight:700;color:var(--muted)}
.egsrow+.egsrow{margin-top:2px}
.egsrow .g{flex:none;width:50px;font-family:var(--font-display);font-size:17px;font-weight:800;color:var(--txt-2)}
.egsrow .bar{flex:1;height:8px}
.egsrow .bar i{background:var(--line-dash)}
.egsrow .p{flex:none;width:66px;text-align:right;font-weight:800;white-space:nowrap}
.egsrow.on{background:var(--tint-acid);color:color-mix(in srgb,var(--acid) 30%,var(--txt));animation:dcPop .6s cubic-bezier(.2,1.5,.4,1) both}
.egsrow.on .g{color:var(--acid)}
.egsrow.on .bar i{background:var(--acid)}
.egsrow.fail .g{color:var(--red-soft)}
.egsrow.fail.on{background:var(--tint-red);color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.egsrow.fail.on .bar i{background:var(--red)}
.egdeck{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);background:var(--tint-red);border:2px solid var(--tint-red-line);border-radius:22px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--tint-red) 60%,var(--bg));color:var(--txt);transition:transform .08s,box-shadow .08s}
.egdeck:active{transform:translateY(4px);box-shadow:0 0 0 var(--bg)}
.egdeck .ico{width:44px;height:44px;border-radius:14px;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;flex:none}
.egdeck .grow{flex:1;min-width:0}
.egdeck .t{font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--red) 20%,var(--txt))}
.egdeck .s{font-size:12.5px;font-weight:600;color:color-mix(in srgb,var(--red) 40%,var(--muted));margin-top:2px}
.egdeck>svg:last-child{color:color-mix(in srgb,var(--red) 40%,var(--muted))}
.egdeck.ok{background:var(--tint-acid);border-color:var(--tint-acid-line);box-shadow:0 4px 0 color-mix(in srgb,var(--tint-acid) 60%,var(--bg));cursor:default}
.egdeck.ok .ico{background:var(--acid);color:var(--on-acid)}

  levels:[

    {id:"a1",title:"Zero conditional",emoji:"0️⃣",

      {title:"Globalizacja vs internacjonalizacja vs regionalizacja",body:"<b>Globalizacja</b> = integracja w skali świata.<br><b>Internacjonalizacja</b> = współpraca między odrębnymi państwami (bez zlewania się w jeden system).<br><b>Regionalizacja</b> = zacieśnianie więzi wewnątrz jednego regionu (np. UE, ASEAN).",real:"Regionalizacja to globalizacja 'na dzielni' — bliżej, bezpieczniej, w gronie sąsiadów/sojuszników."}
     ],
     flashcards:[
      {t:"Globalizacja",d:"Proces rosnącej współzależności między państwami, gospodarkami i społeczeństwami; obejmuje przepływy towarów, kapitału, ludzi, technologii i idei."},
      {t:"5 wymiarów globalizacji",d:"Gospodarczy, technologiczny, społeczny, kulturowy, polityczny."},
      {t:"Globalizacja to nie McDonaldyzacja",d:"Wymiana kulturowa jest wielokierunkowa; lokalne kultury adaptują globalne wzorce, powstają hybrydy — to przenikanie kultur, nie tylko ich ujednolicanie."},
      {t:"Internacjonalizacja",d:"Współpraca i wymiana między odrębnymi państwami — bez zlewania się gospodarek w jeden zintegrowany system (to odróżnia ją od globalizacji)."},
      {t:"Regionalizacja",d:"Zacieśnianie integracji gospodarczej/handlowej między państwami jednego regionu lub bliskiego sąsiedztwa (UE, ASEAN, USMCA)."},
      {t:"Globalna wioska",d:"Marshall McLuhan — dzięki elektronicznej łączności świat staje się jedną wioską: natychmiastowa komunikacja, wspólna przestrzeń medialna. Nie musi oznaczać harmonii."}

      {q:"Które NIE jest jednym z 5 wymiarów globalizacji?",a:["gospodarczy","technologiczny","militarny","kulturowy"],c:2,e:"5 wymiarów: gospodarczy, technologiczny, społeczny, kulturowy, polityczny."},
      {q:"Dlaczego globalizacja to NIE to samo co McDonaldyzacja?",a:["bo McDonald's zbankrutował","bo wymiana kultur jest wielokierunkowa i powstają hybrydy, a nie samo ujednolicenie","bo kultura się nie zmienia","bo globalizacja dotyczy tylko gospodarki"],c:1,e:"Kultury się przenikają i adaptują wzorce — to hybrydyzacja, nie prosta homogenizacja."},

    /* ---------------- L2 ---------------- */
    {id:"l2",title:"Fale globalizacji",emoji:"🌊",
     feed:[
      {title:"Falowy charakter — I FALA (1870–1914)",body:"Napęd: <b>rewolucja przemysłowa</b>, wynalazki (<b>kolej i telegraf</b>), <b>standard złota</b>, masowe migracje. Udział eksportu w światowym PKB skoczył z ~5% (1870) do ~14% (1913).",real:"Pierwsza globalizacja to nie internet — to para, tory i telegraf. Londyn = centrum finansów świata.",mnemo:"I fala = <b>Kolej + Telegraf + Złoto + Migracje</b>."},
      {title:"Wielki reset: wojny i protekcjonizm",body:"Wojny światowe, <b>Wielki Kryzys</b>, nacjonalizm gospodarczy i protekcjonizm cofnęły integrację. Poziom handlu z 1913 r. odzyskano dopiero w latach <b>70.–80. XX w.</b>",real:"Globalizacja NIE jest liniowa. Raz się cofnęła na ~60 lat. Może znów."},
      {title:"II FALA (1945–2008)",body:"Fundamenty ładu: <b>Bretton Woods</b> (1944, MFW + Bank Światowy), <b>GATT → WTO</b>. Potem globalne łańcuchy wartości, <b>offshoring</b>, <b>China shock</b>, <b>just-in-time</b>.",real:"Po wojnie zbudowano 'reguły gry' i produkcja rozlała się po świecie w poszukiwaniu taniości."},
      {title:"Hiperglobalizacja (1990–2008)",body:"Turbo-faza: <b>upadek ZSRR</b>, <b>liberalizacja kapitału</b>, <b>cyfryzacja</b>, ekspansja WTO. Świat jednobiegunowy, kapitał płynie swobodnie.",real:"Lata 90.–2000. — 'im więcej globalizacji, tym lepiej'. Szczyt wiary w wolny rynek bez granic."},
      {title:"2008 — ROK PRZEŁOMU",body:"<b>Kryzys finansowy</b> + wzrost <b>populizmu</b> + <b>wojny handlowe</b> + <b>kryzys zaufania do instytucji</b>. Od tego momentu mówimy o <b>deglobalizacji / slowbalisation</b>.",real:"2008 to zakręt. Później: friend-shoring, nearshoring, decoupling — dobił to COVID i wojna w Ukrainie.",mnemo:"Po 2008: <b>Slow-Friend-Near-De</b> (slowbalisation, friend-shoring, nearshoring, decoupling)."}
     ],
     flashcards:[
      {t:"I fala globalizacji (1870–1914)",d:"Napęd: rewolucja przemysłowa, kolej i telegraf, standard złota, masowe migracje. Eksport w PKB świata: z ~5% (1870) do ~14% (1913). Londyn = centrum finansów."},
      {t:"Przerwa 1914–lata 70./80.",d:"Wojny światowe, Wielki Kryzys, nacjonalizm gospodarczy i protekcjonizm cofnęły globalizację; poziom handlu z 1913 r. odzyskano dopiero w latach 70.–80. XX w."},
      {t:"II fala globalizacji (1945–2008)",d:"Bretton Woods (MFW, Bank Światowy), GATT → WTO. Globalne łańcuchy wartości, offshoring, China shock, just-in-time."},
      {t:"Hiperglobalizacja (1990–2008)",d:"Upadek ZSRR, liberalizacja przepływów kapitału, cyfryzacja, ekspansja WTO. Szczyt integracji świata."},
      {t:"Rok przełomu 2008",d:"Kryzys finansowy, wzrost populizmu, wojny handlowe, kryzys zaufania do instytucji. Początek deglobalizacji / slowbalisation."},
      {t:"China shock",d:"Gwałtowny wpływ wejścia Chin do WTO (2001) i ich taniej produkcji na przemysł krajów rozwiniętych — utrata miejsc pracy w produkcji na Zachodzie."},
      {t:"Just-in-time vs just-in-case",d:"JIT = minimalne zapasy, dostawa 'na czas' (maks. efektywność). JIC = bufory i zapasy na wypadek szoków (maks. odporność). Świat przechodzi z JIT na JIC."}

     quiz:[
      {q:"Co napędzało I falę globalizacji (1870–1914)?",a:["internet i social media","kolej, telegraf, standard złota i masowe migracje","WTO i Bretton Woods","upadek ZSRR"],c:1,e:"I fala = rewolucja przemysłowa, kolej/telegraf, złoto, migracje."},

      {q:"Instytucje Bretton Woods (1944) to m.in.:",a:["WTO i NATO","MFW i Bank Światowy","ASEAN i Mercosur","G20 i BRICS"],c:1,e:"Bretton Woods powołało MFW i Bank Światowy; handlem zajął się GATT → WTO."},

      {q:"Just-in-time oznacza:",a:["duże zapasy na wypadek kryzysu","produkcję z minimalnymi zapasami, dostawą 'na czas' — maks. efektywność","zakaz importu","powrót produkcji do kraju"],c:1,e:"JIT = efektywność; przeciwieństwo to just-in-case (odporność)."}

    /* ---------------- L3 ---------------- */
    {id:"l3",title:"Teorie globalizacji",emoji:"🎓",
     feed:[
      {title:"Liberalizm — 'rynek sam integruje świat'",body:"Globalizacja to <b>pozytywny, naturalny</b> efekt technologii i rynku. Napędza ją: <b>technologia, rynek (efektywność), kapitał</b>. Prowadzi do <b>konwergencji</b> (biedniejsi nadrabiają), a państwa wolą <b>współpracować niż walczyć</b> (kompleksowa współzależność).",real:"'Im więcej globalizacji, tym lepiej.' Kapitał nie ma narodowości — kraje muszą się dostosować.",mnemo:"Liberalizm: napędza <b>RYNEK</b>, priorytet = <b>EFEKTYWNOŚĆ</b>, państwo = rola <b>ograniczona</b>."},
      {title:"Realizm — 'liczą się państwa i siła'",body:"Najważniejsi aktorzy to <b>państwa</b>, a ich cel to <b>bezpieczeństwo i siła</b>. Globalizacja jest <b>narzędziem</b> zwiększania potęgi. Świat = system <b>rywalizujących państw</b>, nie współpracujących rynków. Trwa tylko, gdy zgadza się z interesem najsilniejszych.",real:"Wojny handlowe, sankcje, kontrola eksportu chipów, USA vs Chiny, friend-shoring. Bezpieczeństwo > tania cena.",mnemo:"Realizm: napędza <b>PAŃSTWO</b>, priorytet = <b>BEZPIECZEŃSTWO</b>, państwo = rola <b>kluczowa</b>."},
      {title:"Instytucjonalizm (neoliberalizm)",body:"Globalizacja generuje chaos — <b>instytucje</b> (ONZ, WTO, MFW, NATO) tworzą zasady i normy, dostarczają wiarygodnych informacji, zmniejszają ryzyko oszustwa. Państwa współpracują nie dlatego, że 'są dobre', ale bo <b>im się to opłaca</b>.",real:"Reguły > dobra wola. Instytucje to 'sędzia i tablica wyników', dzięki którym opłaca się grać fair."},
      {title:"Podejście krytyczne",body:"Globalizacja = rozszerzenie <b>kapitalizmu/neoliberalizmu</b> → pogłębia <b>nierówności</b>. Świat dzieli się na <b>centrum</b> (Zachód) i <b>peryferie</b>. Napędza ją kapitał (korporacje, rynki finansowe) i interesy elit; osłabia suwerenność biedniejszych.",real:"Outsourcing do tańszych krajów, niskie płace globalnego Południa, zyski w centrum, dominacja Big Tech."},
      {title:"Konstruktywizm — 'globalizacja jest tym, co o niej myślimy'",body:"Globalizacja <b>nie jest 'dana'</b> — jest tworzona przez <b>idee</b> (wolny handel), <b>normy</b> (prawa człowieka, klimat) i <b>przekonania</b> (świat bez granic). Interesy państw <b>nie są stałe</b>.",real:"Dlaczego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'? Bo zmieniło się to, jak o niej myślimy."}
     ],
     flashcards:[
      {t:"Liberalizm (teoria globalizacji)",d:"Globalizacja = naturalny, pozytywny efekt rynku i technologii. Napęd: technologia, rynek, kapitał. Prowadzi do konwergencji; współzależność skłania państwa do współpracy. Napędza rynek, priorytet efektywność, rola państwa ograniczona."},
      {t:"Realizm (teoria globalizacji)",d:"Państwa to główni aktorzy; cel = bezpieczeństwo i siła. Globalizacja to narzędzie potęgi. Napędza państwo, priorytet bezpieczeństwo, rola państwa kluczowa. Tłumaczy wojny handlowe, sankcje, friend-shoring."},
      {t:"Instytucjonalizm / neoliberalizm",d:"Instytucje (ONZ, WTO, MFW, NATO) porządkują chaos globalizacji, dostarczają informacji i zmniejszają ryzyko oszustwa. Państwa współpracują, bo to się opłaca (zyski + bezpieczeństwo)."},
      {t:"Podejście krytyczne",d:"Globalizacja = rozszerzenie kapitalizmu/neoliberalizmu, pogłębia nierówności. Podział świata na centrum i peryferie; napędza ją kapitał i interesy elit. Tłumaczy nierówności, ale ignoruje wzrost gospodarczy."},
      {t:"Konstruktywizm",d:"Globalizacja jest społecznie konstruowana przez idee, normy i przekonania; interesy państw nie są stałe. Świat konstruktywistów to świat idei."},
      {t:"Liberalizm vs realizm (tabela)",d:"Co napędza? rynek vs państwo. Co ma priorytet? efektywność vs bezpieczeństwo. Rola państwa? ograniczona vs kluczowa."},
      {t:"Krytyka liberalizmu",d:"Tłumaczy wzrost handlu po 1945, sukces globalnych firm i tygrysów azjatyckich, ALE: ignoruje politykę, zakłada, że wszyscy korzystają, nie przewidział kryzysu 2008 ani wojen handlowych."}
     ],
     quiz:[
      {q:"Według liberalizmu globalizację napędza przede wszystkim:",a:["państwo i jego siła","rynek, technologia i kapitał","instytucje międzynarodowe","interesy elit i kapitał (nierówności)"],c:1,e:"Liberalizm: rynek + technologia + kapitał; priorytet efektywność, rola państwa ograniczona."},
      {q:"Realizm najlepiej tłumaczy:",a:["konwergencję biednych krajów","wojny handlowe, sankcje, kontrolę eksportu technologii, friend-shoring","zanik roli państw","świat idei i norm"],c:1,e:"Realizm: liczą się państwa, siła i bezpieczeństwo — stąd sankcje i wojny handlowe."},
      {q:"Podejście krytyczne opisuje globalizację jako:",a:["naturalny, korzystny proces dla wszystkich","dominację centrum (Zachodu) nad peryferiami, pogłębiającą nierówności","chaos porządkowany przez instytucje","zbiór idei i przekonań"],c:1,e:"Krytycyzm: kapitalizm + podział centrum–peryferie + nierówności."},
      {q:"Kluczowa teza konstruktywizmu:",a:["globalizacja jest 'dana' i niezmienna","globalizacja jest konstruowana przez idee, normy i przekonania; interesy państw nie są stałe","liczy się tylko rynek","liczy się tylko siła militarna"],c:1,e:"Dlatego w latach 90. globalizacja była 'dobra', a dziś 'problematyczna'."},
      {q:"Wg instytucjonalizmu państwa współpracują, ponieważ:",a:["są z natury dobre","współpraca instytucjonalna po prostu im się opłaca (zyski i bezpieczeństwo)","zmusza je do tego jedno mocarstwo","nie mają wojska"],c:1,e:"Instytucje zmniejszają ryzyko oszustwa i dostarczają informacji — kooperacja się opłaca."}
     ]},
    /* ---------------- L4 ---------------- */
    {id:"l4",title:"Polityka i global governance",emoji:"🏛️",
     feed:[
      {title:"Państwa wracają do gry",body:"Po dekadach 'rynek załatwi wszystko' państwo znów sięga po narzędzia: <b>regulacje, polityka handlowa, sankcje, subsydia, bariery handlowe, kontrole eksportu</b>.",real:"Widmo neoliberalizmu odchodzi. Rząd znów ustawia stół, a nie tylko sprząta po rynku."},
      {title:"Global governance — co to jest",body:"<b>Globalne zarządzanie</b> = sposób koordynowania zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy <b>przekraczające granice</b> (klimat, handel, zdrowie, prawa człowieka).",real:"Nie ma rządu światowego, ale są 'reguły gry'. Zarządzanie bez jednego szefa.",mnemo:"Global governance = <b>rządzenie bez rządu</b> — sieć, nie hierarchia."},
      {title:"Usieciowienie zamiast hierarchii",body:"Cecha global governance: <b>rezygnacja z hierarchii</b>. Więzi wertykalne ustępują <b>horyzontalnym</b> — współpracują autonomiczne podmioty. Rośnie rola prywatnych ciał (ISO, ICANN, IASB, FSC) i korporacji ponadnarodowych.",real:"Świat rządzony jak sieć znajomości, nie jak wojsko. Nikt nie wydaje rozkazów — wszyscy się dogadują (albo nie)."},
      {title:"Rola instytucji — 4 funkcje",body:"🛡️ <b>Stabilność</b>: MFW (pożyczki), Bank Światowy, Komitet Bazylejski (normy dla banków).<br>🔮 <b>Przewidywalność</b>: WTO (zasady handlu), OECD (podatki), IFRS/IASB (rachunkowość).<br>🤝 <b>Koordynacja</b>: WHO (pandemie), UNFCCC (klimat), G20 (polityka makro).<br>⚖️ <b>Rozwiązywanie sporów</b>: WTO DSU, ICSID (arbitraż inwestycyjny), MTS w Hadze.",mnemo:"4 funkcje: <b>Stabilność · Przewidywalność · Koordynacja · Spory</b>."},
      {title:"Kryzys instytucji — paraliż WTO",body:"<b>USA</b>: WTO nie radzi sobie z krajem o gospodarce nie w pełni rynkowej (subsydia Chin). <b>Chiny</b>: USA łamią zasady, nakładając jednostronne cła. <b>Fakt</b>: USA <b>zablokowały obsadzanie sędziów odwoławczych (2019–2023)</b> → WTO działa, ale nie egzekwuje odwołań.",real:"Sędzia jest, ale bez asystentów VAR — wyroki zapadają, tylko nikt ich nie wdroży. Instytucja słabnie.",mnemo:"Kryzys: <b>paraliż WTO + unilateralizm państw + spadek zaufania</b>."},
      {title:"Plurilateralizm i nowe bloki",body:"Obok WTO rosną kluby: <b>BRICS</b> (Brazylia, Rosja, Indie, Chiny, RPA), <b>QUAD</b> (USA, Japonia, Indie, Australia), <b>SCO</b> (Szanghajska Org. Współpracy), <b>G20</b> jako 'rząd globalizacji'. Bloki handlowe: RCEP, USMCA, IPEF, UE–Mercosur.",real:"Zamiast jednej wielkiej ligi (WTO) — coraz więcej mniejszych klubów 'dla swoich'."}
     ],
     flashcards:[
      {t:"Global governance (globalne zarządzanie)",d:"Koordynacja zasad, norm i działań między państwami, organizacjami, firmami i innymi aktorami, by rozwiązywać problemy przekraczające granice (klimat, handel, zdrowie). Nie ma rządu światowego, ale są globalne reguły."},
      {t:"Usieciowienie global governance",d:"Rezygnacja z hierarchii — więzi wertykalne ustępują horyzontalnym; współpracują autonomiczne podmioty, rośnie rola ciał prywatnych (ISO, ICANN, IASB, FSC) i korporacji."},
      {t:"4 funkcje instytucji globalnych",d:"Stabilność (MFW, Bank Światowy, Bazylea), przewidywalność (WTO, OECD, IFRS), koordynacja (WHO, UNFCCC, G20), rozwiązywanie sporów (WTO DSU, ICSID, MTS w Hadze)."},
      {t:"MFW vs Bank Światowy",d:"MFW = pożyczki stabilizacyjne i nadzór makroekonomiczny (bezpiecznik walutowy/finansowy). Bank Światowy = finansowanie rozwoju."},
      {t:"Paraliż WTO (2019–2023)",d:"USA zablokowały obsadzanie sędziów Organu Apelacyjnego → WTO działa, ale nie może egzekwować odwołań w sporach handlowych. Efekt: osłabienie instytucji."},
      {t:"Plurilateralizm",d:"Wielostronność w węższym gronie — kluby zamiast globalnej organizacji: BRICS, QUAD, RIC, SCO. Także bloki handlowe: RCEP, USMCA, IPEF."},
      {t:"Kryzys instytucji",d:"Trzy objawy: paraliż WTO, unilateralizm państw (działanie w pojedynkę), spadek zaufania do instytucji."}
     ],
     quiz:[
      {q:"Global governance najlepiej opisać jako:",a:["światowy rząd z armią","rządzenie bez rządu — sieć reguł i norm koordynujących państwa, firmy i organizacje","wyłącznie działania ONZ","synonim WTO"],c:1,e:"Nie ma rządu światowego, ale są globalne reguły — koordynacja bez hierarchii."},
      {q:"Na czym polega paraliż WTO (2019–2023)?",a:["WTO została rozwiązana","USA zablokowały obsadzanie sędziów odwoławczych → brak egzekucji odwołań","Chiny wystąpiły z WTO","zniesiono wszystkie cła"],c:1,e:"Organ Apelacyjny bez sędziów — spory się toczą, ale odwołań nie da się rozstrzygnąć."},
      {q:"Która instytucja pełni funkcję STABILNOŚCI (bezpiecznik finansowy)?",a:["WHO","MFW (pożyczki stabilizacyjne, nadzór makro)","UNFCCC","WTO DSU"],c:1,e:"Stabilność: MFW, Bank Światowy, Komitet Bazylejski. WHO = koordynacja zdrowia."},

    {id:"l5",title:"Mocarstwa i konkurencyjność",emoji:"⚔️",
     feed:[
      {title:"Walka o to, czyje będą reguły",body:"Nie ma rządu światowego, ale są reglobalne reguły — i trwa walka, <b>kto je ustala</b>. 🇪🇺 <b>UE</b> — wpływ <b>regulacyjny</b>. 🇺🇸 <b>USA</b> — technologiczno-finansowy. 🇨🇳 <b>Chiny</b> — infrastrukturalno-przemysłowy. 🇷🇺 <b>Rosja</b> — surowcowo-geopolityczny.",real:"Zwycięzca standardów (AI, ESG, technologie, handel) zgarnia przewagę konkurencyjną. Kto pisze reguły, ten wygrywa mecz.",mnemo:"UE=regulacje · USA=tech+finanse · Chiny=przemysł · Rosja=surowce."},
      {title:"Efekt brukselski",body:"Zjawisko, w którym <b>regulacje i standardy UE stają się globalnymi normami</b>. Dzięki ogromnemu jednolitemu rynkowi firmy spoza Europy dostosowują produkty do wymogów UE, by móc tu sprzedawać. Przykłady: <b>RODO/GDPR, AI Act, CBAM, ESG</b>.",real:"UE nie narzuca prawa siłą, tylko atrakcyjnością rynku (soft power). Chcesz sprzedawać 450 mln ludziom? Grasz wg zasad Brukseli.",mnemo:"Efekt brukselski = <b>eksport regulacji przez wielkość rynku</b>."},
      {title:"USA — dolar, Big Tech, sankcje",body:"Siła USA: <b>dominacja dolara</b> (efekt dolara — mocny USD czyni świat biedniejszym i droższy import), <b>Big Tech</b> (Google, Apple, Microsoft, Amazon), <b>kontrola technologii</b> (eksport chipów do Chin), <b>sankcje finansowe</b> (SWIFT), chmura.",real:"Dolar to broń. Wyłączenie ze SWIFT boli bardziej niż niejedna sankcja celna."},
      {title:"Chiny i Rosja",body:"🇨🇳 <b>Chiny</b>: Inicjatywa <b>Pasa i Szlaku</b> (2013), dominacja przemysłowa, kontrola <b>surowców krytycznych</b>, skala rynku wewnętrznego.<br>🇷🇺 <b>Rosja</b>: eksport <b>surowców energetycznych</b>, geopolityka, destabilizacja rynków.",real:"Chiny budują świat betonem i fabrykami; Rosja gra gazem i chaosem."},
      {title:"Konkurencyjność państwa",body:"<b>Zdolność gospodarki do tworzenia trwałego wzrostu dobrobytu i przewag międzynarodowych</b> — konkurowania na rynkach przy utrzymaniu wysokiego poziomu życia. Buduje ją: <b>technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność państwa i prawa</b>.",real:"Konkurencyjność to NIE samo PKB. Coraz bardziej zależy od odporności, technologii i bezpieczeństwa (np. półprzewodniki)."},
      {title:"Polska: hub produkcyjny i pułapka średniego dochodu",body:"Polska (OECD TiVA) = silnie wpięta w globalne łańcuchy jako <b>producent/montażysta</b>, głównie w niemieckim hubie. Dużo <b>zagranicznej</b> wartości dodanej w eksporcie, mało własnej. <b>Pułapka średniego dochodu</b>: po szybkim wzroście na taniej pracy kraj traci impet i nie awansuje do grona bogatych. Nadzieja: <b>konwergencja</b> i innowacyjność.",real:"Jesteśmy montownią Europy. Wyzwanie to AWANS w łańcuchu wartości (własne technologie/marki), nie ucieczka z niego.",mnemo:"Pułapka średniego dochodu = <b>tania praca się wypaliła, a innowacji brak</b>."}
     ],
     flashcards:[

      {t:"Konkurencyjność państwa",d:"Zdolność gospodarki do trwałego wzrostu dobrobytu i przewag międzynarodowych przy wysokim poziomie życia. Buduje ją: technologia, kapitał ludzki, instytucje, infrastruktura, innowacje, stabilność."},

      {q:"Konkurencyjność państwa w XXI w. zależy CORAZ BARDZIEJ od:",a:["wyłącznie wielkości PKB","odporności, technologii i bezpieczeństwa (np. półprzewodniki), nie tylko kosztów","liczby ludności","powierzchni kraju"],c:1,e:"Przejście od 'najtaniej' do 'bezpiecznie i odpornie'."}

    {id:"l6",title:"Wymiar społeczno-kulturowy",emoji:"🎭",
     feed:[
      {title:"Wymiar społeczny i 'problem szczęścia'",body:"Globalizacja tworzy <b>społeczeństwo informacyjne</b>, w którym rządzi <b>klasa kreatywna</b>, wiedza i kapitał intelektualny. Paradoks Easterlina: wyższy dochód zwiększa satysfakcję, ale <b>po ok. 10 000 USD</b> dodatkowy dochód niewiele już zmienia.",real:"Kasa daje szczęście — do pewnego progu. Potem wykres się wypłaszcza. Wzorce konsumpcji z bogatych krajów rodzą alienację i frustrację."},
      {title:"Jakość życia i wskaźniki",body:"<b>Jakość życia</b> = stopień zaspokojenia potrzeb materialnych i niematerialnych. Mierniki: <b>HDI</b> (ONZ: dochód + długość życia + lata nauki), <b>World Happiness Index</b>, Quality of Life Index (Numbeo). Z HDI narodziła się <b>ekonomia szczęścia</b>.",real:"HDI to 'PKB z duszą' — dorzuca zdrowie i edukację do samych pieniędzy."},
      {title:"Nie ufaj rankingom bezkrytycznie",body:"Problemy wskaźników: 📏 <b>trudność pomiaru</b> (HDI używa średnich lat nauki jako proxy jakości edukacji), 🎯 <b>uprzedzenia i wagi</b> autorów (im złożniejszy indeks, tym więcej arbitralnych decyzji), 🎭 <b>działania 'pod ranking'</b> (reformy poprawiające wynik, ale nie życie ludzi).",real:"Ranking to model, nie prawda objawiona. Rządy potrafią 'grać pod tabelkę' zamiast realnie poprawiać życie."},
      {title:"Migracje i drenaż mózgów",body:"Migracje zarobkowe, studenci, globalny rynek pracy. <b>Drenaż mózgów</b>: najlepiej wykształceni i przedsiębiorczy emigrują do <b>centrów globalizacji</b> — oni zyskują, ale kraj pochodzenia <b>traci kapitał intelektualny</b>. Ryzyka: napięcia społeczne, kryzys tożsamości.",real:"Twój najzdolniejszy znajomy z roku wyjeżdża do Londynu. On wygrywa, Polska traci mózg."},
      {title:"Globalna wioska i kultura",body:"<b>Marshall McLuhan</b>: elektroniczna współzależność czyni świat <b>globalną wioską</b> (natychmiastowa komunikacja, wspólne trendy — niekoniecznie harmonia). Kultura: <b>HOMOGENIZACJA</b> (McDonald's, Netflix) vs <b>HYBRYDYZACJA</b> (K-pop, anime, lokalne wersje globalnych produktów).",real:"Świat = jedna wioska z wi-fi. Ale lokalne tożsamości nie znikają — mieszają się (hybrydyzacja)."},
      {title:"Soft power i antyglobalizm",body:"<b>Soft power</b> — zdolność zdobywania wpływów <b>atrakcyjnością</b> (film, muzyka, kuchnia, moda), nie przymusem. Nowi eksporterzy kultury: USA, <b>Korea Płd.</b>, Japonia, Indie. <b>Antyglobalizm</b> — ruch przeciw dominacji korporacji, nierównościom i narzucaniu reform przez MFW/BŚ/WTO.",real:"K-pop i Hollywood to broń miękka. A social media rozkręciły globalizację kultury szybciej niż handel — kosztem baniek i polaryzacji."}
     ],
     flashcards:[
      {t:"Społeczeństwo informacyjne",d:"Społeczeństwo skutecznie komunikujące się z otoczeniem, w którym wiodącą rolę odgrywa klasa kreatywna, kapitał intelektualny, wiedza i twórczość jako źródło bogactwa."},
      {t:"Problem szczęścia (paradoks Easterlina)",d:"Wyższy dochód zwiększa satysfakcję życiową, ale po przekroczeniu ok. 10 000 USD dodatkowy wzrost dochodu w niewielkim stopniu podnosi satysfakcję społeczeństwa."},
      {t:"HDI (Human Development Index)",d:"Wskaźnik ONZ łączący dochód, długość życia i liczbę lat nauki. Zapoczątkował porównywanie rozwoju społecznego i ekonomię szczęścia; efekt: World Happiness Index."},
      {t:"Ograniczenia rankingów/wskaźników",d:"Trudność pomiaru (miary zastępcze, np. lata nauki jako proxy jakości edukacji), uprzedzenia i arbitralne wagi autorów, działania krajów 'pod ranking' zamiast realnej poprawy życia."},
      {t:"Drenaż mózgów (brain drain)",d:"Emigracja najlepiej wykształconych, zdolnych i przedsiębiorczych do centrów globalizacji. Emigranci zyskują, ale kraj pochodzenia traci kapitał intelektualny."},
      {t:"Globalna wioska (McLuhan)",d:"Elektroniczna współzależność kształtuje świat na podobieństwo jednej wioski: natychmiastowa komunikacja, wspólna przestrzeń medialna, globalne trendy — niekoniecznie harmonia."},
      {t:"Homogenizacja vs hybrydyzacja",d:"Homogenizacja = ujednolicanie kultury (McDonald's, Netflix, TikTok). Hybrydyzacja = mieszanie i lokalne adaptacje globalnych wzorców (K-pop, anime, lokalne wersje produktów)."},
      {t:"Soft power",d:"Zdolność państwa do zdobywania wpływów i sojuszników przez atrakcyjność kulturową, polityczną i ideową (film, muzyka, kuchnia, moda), a nie przymus. Eksporterzy: USA, Korea Płd., Japonia, Indie."},
      {t:"Antyglobalizm",d:"Ruch społeczno-polityczny przeciw globalizacji (zwł. ekonomicznej i korporacyjnej): krytyka dominacji korporacji, nierówności, wyzysku słabszych i reform narzucanych przez MFW, Bank Światowy i WTO."}
     ],
     quiz:[
      {q:"Paradoks Easterlina ('problem szczęścia') mówi, że:",a:["dochód nigdy nie wpływa na szczęście","po ok. 10 000 USD dodatkowy dochód niewiele już podnosi satysfakcję życiową","bogatsi są zawsze nieszczęśliwi","szczęście zależy tylko od PKB"],c:1,e:"Dochód podnosi satysfakcję do progu ~10 000 USD, potem wykres się wypłaszcza."},
      {q:"HDI (ONZ) łączy:",a:["tylko PKB per capita","dochód, długość życia i liczbę lat nauki","emisje CO₂ i inflację","liczbę turystów i eksport"],c:1,e:"HDI = 'PKB z duszą' — dorzuca zdrowie i edukację."},
      {q:"Drenaż mózgów oznacza, że:",a:["kraj zyskuje specjalistów z zagranicy","najzdolniejsi emigrują do centrów globalizacji, a kraj pochodzenia traci kapitał intelektualny","spada liczba studentów","rośnie bezrobocie wśród niewykształconych"],c:1,e:"Emigrant zyskuje, kraj wysyłający traci mózgi."},
      {q:"Homogenizacja i hybrydyzacja kultury to:",a:["dwa słowa na to samo","ujednolicanie (McDonald's/Netflix) vs mieszanie i lokalne adaptacje (K-pop/anime)","nazwy instytucji ONZ","rodzaje ceł"],c:1,e:"Kultura i się ujednolica, i tworzy hybrydy — jednocześnie."},
      {q:"Soft power to:",a:["siła militarna","zdolność zdobywania wpływów atrakcyjnością kultury i idei, nie przymusem","miękka waluta","program pomocy żywnościowej"],c:1,e:"Hollywood, K-pop, kuchnia, moda — wpływ bez przymusu. Eksporterzy: USA, Korea, Japonia, Indie."}
     ]},
    /* ---------------- L7 ---------------- */
    {id:"l7",title:"Ekonomia i regionalizacja",emoji:"🔗",
     feed:[
      {title:"Wymiar ekonomiczny i GVC",body:"<b>Wymiar ekonomiczny</b> = rosnąca integracja gospodarek przez handel, inwestycje zagraniczne, przepływy finansowe i <b>globalne łańcuchy wartości (GVC)</b> — produkcja jednego wyrobu rozproszona po wielu krajach.",real:"Twój telefon to ONZ w kieszeni: projekt w USA, chip z Tajwanu, montaż w Chinach, minerały z Afryki."},
      {title:"Od efektywności do odporności",body:"Globalizacja przechodzi <b>od logiki efektywności do logiki bezpieczeństwa</b>. Nowe priorytety: <b>od just-in-time do just-in-case</b>, od 'najtańszy dostawca' do 'najbardziej niezawodny', od globalnych łańcuchów do <b>regionalnych ekosystemów</b>.",real:"COVID i Ever Given nauczyły firmy: taniej ≠ pewniej. Lepiej mieć bufor niż stać z pustą fabryką.",mnemo:"Nowy paradygmat: <b>Just-in-CASE</b>, nie just-in-time."},
      {title:"Dywersyfikacja — 5 wymiarów",body:"Budowanie odporności = zmniejszanie uzależnienia od jednego kraju/dostawcy. Dywersyfikuj: 🌍 <b>geograficznie</b>, 🏭 <b>dostawców</b> (multi/dual sourcing), 🚢 <b>transport/logistyka</b>, ⚙️ <b>technologie/komponenty</b>, 🛒 <b>klientów i rynki zbytu</b>.",real:"Nie trzymaj wszystkich jajek w jednym chińskim koszyku. Rozłóż ryzyko na kilka."},
      {title:"Cztery '-shoringi'",body:"<b>Offshoring</b> — produkcja do krajów niskokosztowych (stara logika).<br><b>Nearshoring</b> — skracanie dystansu geograficznego.<br><b>Reshoring</b> — powrót produkcji do kraju.<br><b>Friend-shoring</b> — do państw sojuszniczych / stabilnych politycznie.<br>Przykłady: półprzewodniki, farmacja, motoryzacja.",real:"Off = daleko i tanio. Near = bliżej. Re = do domu. Friend = do kumpli. Trend idzie od 'off' ku reszcie.",mnemo:"<b>OFF → NEAR → RE → FRIEND</b>: coraz bliżej i coraz bezpieczniej."},
      {title:"Regionalizacja i bloki handlowe",body:"Gospodarka staje się bardziej <b>regionalna</b>. Kluczowe bloki: <b>UE</b>, <b>ASEAN</b> (Azja Płd.-Wsch.), <b>USMCA</b> (USA-Meksyk-Kanada, zastąpiło NAFTA), <b>Mercosur</b> (Ameryka Płd.), <b>RCEP</b> (Azja-Pacyfik — <b>największa strefa wolnego handlu świata</b>).",real:"Zamiast jednego globalnego rynku — kilka wielkich 'dzielnic'. RCEP to nowy rekordzista.",mnemo:"UE · ASEAN · USMCA · Mercosur · RCEP (największy)."},
      {title:"Deglobalizacja — dlaczego regiony rosną",body:"Napęd deglobalizacji: kryzys 2008, Brexit, pandemia, <b>trumpizm</b> ('amerykanizm, nie globalizm'), wojna w Ukrainie, napięcia USA–Chiny, <b>splinternet</b> (podzielony internet). Regionalizacja rośnie przez: <b>bezpieczeństwo, krótsze łańcuchy, geopolitykę i odporność</b>.",real:"Świat nie tyle się rozłącza, co przełącza na tryb 'regionalny i bezpieczny'. Multipolarność: USA, Chiny, UE, Indie, Global South."}
     ],
     flashcards:[
      {t:"Globalne łańcuchy wartości (GVC)",d:"Rozproszenie produkcji jednego wyrobu po wielu krajach (projekt, komponenty, montaż w różnych miejscach). Rdzeń ekonomicznego wymiaru globalizacji."},
      {t:"Od efektywności do bezpieczeństwa",d:"Motyw przewodni: od just-in-time do just-in-case, od 'najtańszy dostawca' do 'najbardziej niezawodny', od globalnych łańcuchów do regionalnych ekosystemów technologicznych."},
      {t:"Dywersyfikacja łańcuchów — 5 wymiarów",d:"Geograficzna, dostawców (multi/dual sourcing), transportu i logistyki, technologii i komponentów, klientów i rynków zbytu. Cel: mniejsze uzależnienie i odporność na szoki."},
      {t:"Offshoring / Nearshoring / Reshoring / Friend-shoring",d:"Offshoring = produkcja w krajach niskokosztowych; nearshoring = skracanie dystansu; reshoring = powrót do kraju; friend-shoring = do państw sojuszniczych/stabilnych."},
      {t:"RCEP",d:"Regionalne Kompleksowe Partnerstwo Gospodarcze — Azja i Pacyfik (ASEAN + Chiny, Japonia, Korea Płd., Australia, Nowa Zelandia). Największa strefa wolnego handlu na świecie."},
      {t:"USMCA i Mercosur",d:"USMCA = porozumienie USA–Meksyk–Kanada (zastąpiło NAFTA). Mercosur = Wspólny Rynek Południa (Brazylia, Argentyna, Urugwaj, Paragwaj)."},
      {t:"Slowbalisation / deglobalizacja",d:"Spowolnienie i cofanie integracji po 2008: kryzys finansowy, Brexit, pandemia, trumpizm, wojna w Ukrainie, napięcia USA–Chiny, splinternet."},
      {t:"Splinternet",d:"Podzielony, rozfragmentowany internet — efekt regionalizacji i geopolityki (różne regulacje, ekosystemy i ograniczenia w różnych blokach)."}
     ],
     quiz:[

    <div class="zbox"><h3>⚠️ Zakres testu</h3>
      <p>Prowadzący (dr hab. K. Piech) napisał wprost: <b>test końcowy obejmuje tylko materiał OMÓWIONY na zajęciach</b> — nie te prezentacje, które zostały udostępnione, ale nieomówione.<br><br>Ta apka pokrywa wszystkie 8 udostępnionych prezek. Skup się na poziomach, które realnie były omawiane — resztę traktuj jako bonus.</p></div>
    <div class="zbox"><h3>Kluczowy kontekst (cz.1)</h3>
      <p>Pytanie przewodnie kursu: <b>„Czy blockchain rozwiązuje realny problem, czy tworzy nowy?”</b><br>Logika: jak działa → jak jest wykorzystywany → jakie generuje ryzyka → co to oznacza dla banku.</p></div>
    <div class="zbox"><h3>Regulacje, które padają najczęściej</h3>
      <p><b>MiCA</b> (ART + EMT), TFR, DAC8, DORA. MiCA dla stablecoinów obowiązuje od <b>30.06.2024</b>, pełna stosowalność od <b>30.12.2024</b>.</p></div>`,

      {title:"Linia czasu (must-know daty)",body:"<b>2008</b> — biała księga Bitcoina (Satoshi Nakamoto)<br><b>2009</b> — start sieci, Genesis Block<br><b>2013/2015</b> — Ethereum (Buterin), dApps<br><b>2017</b> — ICO<br><b>2020</b> — boom DeFi<br><b>2021</b> — NFT mainstream.",real:"Bitcoin 2008/2009, Ethereum 2015 — te dwie daty musisz znać."},
      {title:"Po co w ogóle Bitcoin? Problem zaufania",body:"Tradycyjny system finansowy opiera się na <b>pośrednikach</b> (banki, izby rozliczeniowe) — koszty i konieczność zaufania instytucjom. <b>Kryzys 2008</b> (upadek Lehman Brothers, bailouty, moral hazard) podkopał to zaufanie → biała księga Bitcoina jako odpowiedź.",real:"Bitcoin = 'nie ufaj bankom, ufaj matematyce'. Powstał wprost z gruzów kryzysu 2008."},
      {title:"Problem podwójnego wydatkowania",body:"Cyfrowy plik łatwo skopiować → jak zapobiec wydaniu tej samej monety dwa razy (<b>double spending</b>)? Tradycyjnie: centralny rejestr (bank). Bitcoin: <b>rozproszony publiczny rejestr</b> + konsensus, bez centralnego organu.",real:"Maila możesz wysłać 1000 razy. Pieniądza nie możesz wydać dwa razy — to rozwiązuje blockchain."}

    /* ---------------- L2 ---------------- */
    {id:"k2",title:"Konsensus: PoW i PoS",emoji:"⚙️",
     feed:[
      {title:"Po co konsensus?",body:"W sieci rozproszonej wiele kopii danych, brak centralnego administratora. <b>Mechanizm konsensusu</b> = zbiór reguł, dzięki którym węzły uzgadniają <b>wspólny stan</b>: które transakcje są ważne i która wersja łańcucha obowiązuje.",real:"Bez konsensusu = chaos i sprzeczne wersje historii. To 'sędzia' bez sędziego."},
      {title:"Proof of Work (PoW)",body:"Górnicy <b>rywalizują w rozwiązywaniu zadań obliczeniowych</b> (hashowanie). Kosztowne do wykonania, tanie do weryfikacji. Bezpieczeństwo = wysoki koszt fizyczny ataku (energia, sprzęt). Bitcoin.",real:"Kto włożył najwięcej prądu i sprzętu, dostaje prawo dopisać blok. Atak = spalić fortunę.",mnemo:"<b>PoW = Praca/prąd</b> (Work)."},
      {title:"Proof of Stake (PoS)",body:"Zamiast energii — <b>kapitał (stake)</b>. Walidator blokuje krypto; im większy stake, tym większa szansa walidacji. Nieuczciwość = <b>slashing</b> (utrata części stake). Ethereum 2.0.",real:"Wpłacasz kaucję. Oszukasz — tracisz kaucję. Dużo taniej energetycznie niż PoW.",mnemo:"<b>PoS = Stake/kasa</b> (Stake)."},
      {title:"PoW vs PoS — jeden trade-off",body:"PoW: zasób = energia/sprzęt, koszt ataku = fizyczny, finalność probabilistyczna, ryzyko = mining pools. PoS: zasób = kapitał, koszt ataku = kapitał + slashing, finalność szybsza, ryzyko = koncentracja stake.",real:"To nie 'lepsze–gorsze', tylko dwa różne modele bezpieczeństwa: bezpieczeństwo vs energia vs koncentracja kapitału."}
     ],
     flashcards:[
      {t:"Mechanizm konsensusu",d:"Zbiór reguł pozwalający węzłom zdecentralizowanej sieci uzgodnić wspólny stan: które transakcje są ważne i która wersja łańcucha obowiązuje."},
      {t:"Proof of Work (PoW)",d:"Górnicy rywalizują w hashowaniu (kosztowne obliczenia). Bezpieczeństwo = wysoki koszt fizyczny ataku (energia, sprzęt). Bitcoin. Wada: zużycie energii."},
      {t:"Proof of Stake (PoS)",d:"Walidatorzy blokują kapitał (stake); szansa walidacji rośnie ze stake. Slashing karze nieuczciwych. Ethereum. Zaleta: niskie zużycie energii."},
      {t:"Slashing",d:"Mechanizm kary w PoS — odebranie części stake walidatorowi, który oszukuje lub łamie reguły. Atak = ryzyko utraty własnego kapitału."},
      {t:"Inne mechanizmy konsensusu",d:"DPoS (delegowanie głosów reprezentantom), PoA (walidacja przez autoryzowane węzły o zweryfikowanej tożsamości), BFT (odporność na złośliwych uczestników)."},
      {t:"Mining (kopanie)",d:"Konkurowanie o prawo dodania bloku przez hashowanie nagłówka, aż wynik spełni warunek trudności. Nagroda: nowe monety + opłaty transakcyjne. Łączy emisję, zabezpieczenie i konkurencję o przychód."}
     ],
     quiz:[
      {q:"Na czym opiera się bezpieczeństwo w Proof of Work?",a:["na kapitale zablokowanym w sieci","na wysokim koszcie fizycznym (energia, sprzęt) potrzebnym do ataku","na zaufaniu do banku centralnego","na anonimowości górników"],c:1,e:"PoW: atak wymaga ogromnych zasobów obliczeniowych i energii."},
      {q:"Czym jest slashing w Proof of Stake?",a:["nagrodą za wydobycie bloku","karą — utratą części stake przez nieuczciwego walidatora","opłatą transakcyjną","procesem kopania"],c:1,e:"Slashing zniechęca do oszustwa: oszukasz → tracisz kapitał."},
      {q:"Główna różnica zasobu konkurencji PoW vs PoS:",a:["PoW = kapitał, PoS = energia","PoW = energia/sprzęt, PoS = kapitał/stake","oba używają energii","oba używają kapitału"],c:1,e:"PoW konkuruje energią/sprzętem, PoS kapitałem (stake)."},
      {q:"Który mechanizm zużywa znacznie mniej energii?",a:["Proof of Work","Proof of Stake","oba tyle samo","Proof of Work z ASIC"],c:1,e:"PoS nie wymaga energochłonnego hashowania — stąd Ethereum 2.0 przeszło na PoS."}
     ],
     tasks:[
      {type:"sort",title:"PoW czy PoS?",buckets:[{name:"Proof of Work",items:["górnicy i hashowanie","koszt = energia i sprzęt","Bitcoin"]},{name:"Proof of Stake",items:["walidator blokuje stake","slashing za oszustwo","Ethereum 2.0"]}],e:"PoW = praca i prąd, PoS = zablokowany kapitał (stake)."},
      {type:"fill",text:"W PoW bezpieczeństwo bierze się z wysokiego kosztu {0}, a w PoS nieuczciwy walidator traci część stake przez {1}.",blanks:["energii","slashing"],bank:["kapitału","halving","mining pool","forka"],hint:"PoW = Work (prąd), PoS = Stake (kaucja)",e:"PoW: atak oznacza spalenie fortuny na prąd. PoS: kto oszuka, traci kaucję (slashing)."},
      {type:"order",title:"Jak powstaje blok w PoW",items:["Użytkownik podpisuje transakcję kluczem prywatnym","Transakcja trafia do puli oczekujących","Górnik pakuje transakcje do bloku","Górnik znajduje hash spełniający warunek trudności","Sieć weryfikuje blok i dołącza go do łańcucha"],e:"Podpis → pula → blok → hash (praca) → weryfikacja i dołączenie do łańcucha."},
      /* krok 5b */
      {type:"chain",title:"Jak powstaje blok w PoS?",steps:["Walidator blokuje kapitał (stake)","Sieć losuje walidatora do zaproponowania bloku","Walidator proponuje nowy blok","Inni walidatorzy potwierdzają blok","Walidator dostaje nagrodę albo traci stake (slashing)"],given:[0,4],bank:["Górnik rozwiązuje zadanie obliczeniowe","Bank centralny zatwierdza blok"],e:"W PoS nie ma wyścigu obliczeniowego: stake → losowanie → propozycja → potwierdzenie → nagroda (albo slashing za oszustwo)."},
      {type:"chart",chart:{kind:"line",label:"Nagroda za wydobycie bloku Bitcoina (BTC)",x:["2009","2012","2016","2020","2024"],y:[50,25,12.5,6.25,3.125]},q:"Co dzieje się z nagrodą za blok przy każdym halvingu?",a:["Spada o połowę","Spada o 25%","Rośnie dwukrotnie","Nie zmienia się — zmienia się tylko trudność"],c:0,e:"Halving co ok. 4 lata (210 000 bloków) dzieli nagrodę na pół: 50 → 25 → 12,5 → 6,25 → 3,125 BTC. Stąd ograniczona podaż 21 mln BTC."}
     ]},
    /* ---------------- L3 ---------------- */
    {id:"k3",title:"Kryptografia i klucze",emoji:"🔐",
     feed:[
      {title:"Hash i SHA-256",body:"Funkcja hashująca zamienia dane dowolnej długości w skrót stałej długości (SHA-256 = 256 bitów = 64 znaki hex). Cechy: <b>deterministyczna</b>, <b>nieodwracalna</b>, <b>efekt lawiny</b> (mała zmiana → zupełnie inny hash), odporna na kolizje. Nie szyfruje!",real:"Cyfrowy odcisk palca danych. Zmień jedną literę → hash zupełnie inny. MD5/SHA-1 = przestarzałe.",mnemo:"Hash ≠ szyfrowanie. Hash sprawdza integralność, nie da się go 'odszyfrować'."},
      {title:"Klucz prywatny vs publiczny",body:"Kryptografia <b>asymetryczna</b>: klucz <b>prywatny</b> podpisuje (tajny!), klucz <b>publiczny</b> weryfikuje. Publiczny wyprowadza się z prywatnego, ale <b>NIE odwrotnie</b> (problem logarytmu dyskretnego, krzywe eliptyczne secp256k1).",real:"Prywatny = Twój podpis i kontrola środków. Ujawnisz = ktoś wyda Twoje krypto.",mnemo:"Prywatny PODPISUJE, publiczny WERYFIKUJE."},
      {title:"Seed phrase (BIP-39)",body:"Czytelna dla człowieka kopia zapasowa kluczy: <b>12–24 słów</b> (BIP-39). Koduje losową entropię (12 słów = 128 bitów + suma kontrolna, 24 = 256 bitów). Z seeda portfel deterministyczny (BIP-32) wyprowadza całą hierarchię kluczy.",real:"Utrata seed = utrata WSZYSTKICH środków. Przejęcie seed = ktoś przejmuje cały portfel, nie jeden adres."},
      {title:"Portfel NIE przechowuje krypto",body:"Środki są w blockchainie, nie 'w portfelu'. Portfel <b>zarządza kluczami i tworzy podpisy</b>. <b>Hot wallet</b> = online (wygodny, ryzyko ataku), <b>cold wallet</b> = offline (bezpieczniejszy, mniej wygodny).",real:"Portfel to pęk kluczy, nie sejf z monetami. 'Portfel kryptowalut' to językowy skrót myślowy."}
     ],
     flashcards:[
      {t:"Funkcja hashująca",d:"Zamienia dane dowolnej długości w skrót stałej długości. Deterministyczna, nieodwracalna, efekt lawiny, odporna na kolizje. NIE szyfruje — służy do kontroli integralności."},
      {t:"SHA-256",d:"Kryptograficzna funkcja skrótu: 256 bitów = 64 znaki hex. Stosowana w Bitcoinie (nagłówki bloków, adresy). MD5/SHA-1 są przestarzałe — używać SHA-2/SHA-3."},
      {t:"Kryptografia asymetryczna",d:"Para kluczy: prywatny (podpisuje, tajny) i publiczny (weryfikuje). Publiczny wyprowadza się z prywatnego, ale nie odwrotnie (krzywe eliptyczne secp256k1)."},
      {t:"Podpis cyfrowy",d:"Potwierdza, że posiadacz klucza prywatnego autoryzował transakcję. Węzły weryfikują kluczem publicznym. Ujawnienie podpisu nie ujawnia klucza prywatnego. ECDSA / Schnorr."},
      {t:"Seed phrase (BIP-39)",d:"Czytelna kopia zapasowa kluczy: 12–24 słów kodujących losową entropię. Z seeda portfel deterministyczny (BIP-32) wyprowadza całą hierarchię kluczy. Utrata = utrata wszystkiego."},
      {t:"Klucz publiczny vs adres",d:"Klucz publiczny = warstwa kryptograficzna (weryfikacja podpisu). Adres = uproszczona, zakodowana reprezentacja do odbioru środków (w Bitcoinie z hasha klucza publicznego: SHA-256 + RIPEMD-160)."},
      {t:"Hot wallet vs cold wallet",d:"Hot = połączony z internetem (wygodny, większe ryzyko phishingu/malware). Cold = offline (bezpieczniejszy, mniej wygodny). W instytucji liczy się zarządzanie kluczami, nie samo 'cold'."}
     ],
     quiz:[
